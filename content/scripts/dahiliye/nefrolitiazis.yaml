id: nefrolitiazis
version: 1
status: draft
author: ai-drafts/dahiliye-4
sources:
- EAU üreter ve böbrek taşı yönetimi rehberi — referans adı olarak listelendi, metin projesi özgün yazımdır
ad: Nefrolitiazis
taksonomi:
- - ktbt
  - dahiliye
  - dah_nefroloji
  - dah_nef_nefrolitiazis
tipik_hasta: 'Otuz-beş yaş dolayında **erkek**; yaz sıcağında yetersiz sıvı alan, ailede **taşlılık** veya
  önceki taş öyküsü olan. Ağrı belden başlayıp karın ön duvarı ve **kasık-genital bölge**ye yayılır. Tekrarlayan
  taşta metabolik yatkınlıklar: **hiperkalsiüri**, **düşük sitrat**, **hiperoksalüri**, **ürik asit** yükü,
  **sistinüri**'
patofizyoloji: 'İdrarın doyma noktasını aşan solütün **kristallenmesi**yle taş oluşur; **kalsiyum oksalat**
  en sık (hiperkalsiüri, hiperoksalüri, düşük sitrat). **Kalsiyum fosfat** alkali idrarda ve distal renal
  tübüler asidozda; **strüvit** üreaz üreten **Proteus** gibi bakterilerin alkali idrarında, **geyik boynuzu**
  görünümü. **Ürik asit** taşı asit idrarda oluşur; kontrastsız BTde görünürken düz grafide saptanamaz;
  **sistin** taşı kalıtsal **sistinüri**. Ağrının dalgalı akışı **üreter peristaltizmi**nin taş karşısındaki
  kasılmalarından ve kapsül-pelvis gerilmesinden kaynaklanır'
anahtar_bulgular:
- '**Lumbokolik** atak: belden kasık ve genital bölgeye yayılan, dalga dalga artıp azalan ağrı; bulantı-kusma;
  hastanın huzursuzluğu ve sürekli duruş değiştirmesi'
- 'Mikroskobik veya makroskopik **hematüri**; taş tipine imza atan **idrar pH**ı (asit idrar: **ürik asit**;
  alkali idrar: **strüvit** ve kalsiyum fosfat)'
- 'İlk görüntüleme: gebelikte **USG**, diğerlerinde **kontrastsız spiral BT** (altın standart); kalsiyum
  taşları düz grafide **opak**, ürik asit taşı **radyolüsen**'
- 'Strüvit taşın **geyik boynuzu** görünümü; ürik asit taşının idrar **alkalinizasyonuyla eriyebilmesi**'
- 'Tekrarlayan taşta **24 saatlik idrar** metabolik çalışması (kalsiyum, oksalat, sitrat, ürik asit, hacim)
  ve çıkarılan **taşın analizi**'
- '**Ateş ile obstrüktif kolik** birleşmesi: **enfekte-hidronefrotik böbrek**, acil drenaj (**perkütan
  nefrostomi** veya **stent**) gerektirir'
patognomonik: null
ilk_tetkik: '**İdrar analizi** (hematüri, kristal, pH, lökosit), serum **kreatinin**, elektrolitler, **kalsiyum**
  ve **ürik asit**; **USG** veya kontrastsız BT ile taşın yerleşimi, boyutu ve **hidronefroz** derecesi'
kesin_tani: 'Görüntülemede **taşın gösterilmesi**; çıkarılan taşın **kristal analizi** kesin tanının altın
  standardıdır. **Ürik asit** taşı düz grafide görünmez ama **kontrastsız BT**de saptanır'
ilk_tedavi: 'Atakta **NSAİD** ilk analjezik seçeneği, gerektiğinde opioid; **beş milimetrin** altındaki taşların
  çoğu kendiliğinden düşer, **alfa bloker (tamsülosin)** medikal ekspulsiyonu kolaylaştırır. Üreter taşında
  **üreteroskopi** veya **ekstrakorporeal şok dalga litotripsi**; geyik boynuzu böbrek taşında **perkütan
  nefrolitotomi**, enfeksiyon-obstrüksiyon birleşince önce **drenaj** sonra taş tedavisi. Koruma: günlük
  **iki buçuk litre üstü** idrar, kısıtlı **sodyum**, gerektiğinde **sitrat**, hiperkalsiüride **tiyazid**'
klasik_komplikasyon: '**Hidronefroz** ve **akut böbrek hasarı**; taş üstünde **pyelonefrit** ve **ürosepsis**
  (obstrüksiyonla birleşince acil drenaj); kronik obstrüksiyonda geri dönüşsüz **parankim incelmesi**;
  tek böbrekli hastada **anüri**'
