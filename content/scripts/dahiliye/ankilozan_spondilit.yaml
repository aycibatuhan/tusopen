id: ankilozan_spondilit
version: 1
status: draft
author: ai-drafts/dahiliye-3
sources:
- 'Klinik rehberler: ASAS/EULAR aksiyel spondiloartrit tanı ve yönetim önerileri — referans olarak listelendi,
  metin projesi özgün yazımdır'
ad: Ankilozan Spondilit
taksonomi:
- - ktbt
  - dahiliye
  - dah_romatoloji
  - dah_rom_ankilozan_spondilit
tipik_hasta: 'Yirmili yaşlardaki erkek; aylardır süren **inflamatuvar bel ağrısı**. Ağrı gece uykudan
  uyandırır; sabah sertliği **yarım saatten** uzun; hareket iyileştirir, dinlenme kötüleştirir. Ağrı
  kesicilerle **şaşırtıcı biçimde rahatlama**'
patofizyoloji: '**HLA-B27** ile güçlü bağlantılı spondiloartrit ailesinin öncüsü; sakroiliak eklemler
  ve omurga **entezis**lerinde kronik inflamasyon. Süregelen iltihap kemik oluşturan onarımı tetikler:
  eklemler arasında **sindesmofit** gelişir, omurga blokları birleşir, hareket kısıtlılığı kalıcılaşır.
  Dış eklemler ve göz (**ön üveit**) de tutulabilir'
anahtar_bulgular:
- '**İnflamatuvar bel ağrısı**: sabah sertliği **30 dakikadan** uzun, hareketle azalır, dinlenmeyle artar'
- 'Radyografide **sakroiliit** (sakroiliak eklemlerde erozyon ve skleroz)'
- 'Göğüs kafesinin **genişleme kapasitesinde azalma**; belde öne eğilmenin kısıtlanması'
- '**Akut ön üveit** atakları (genellikle tek göz, tekrarlayıcı)'
- '**Entezit**: topuk ağrısı (Aşil, plantar fasiya); asimetrik periferik artrit'
- '**HLA-B27** pozitifliği'
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — ileri evrede radyografide **bambu omurga**
  görünümü (**sindesmofitlerle** omurga füzyonu; ileri psoriyatik artrit ve DISH taklit edebilir)
ilk_tetkik: 'Pelvis grafisinde **sakroiliak eklem** değerlendirmesi; erken dönemde MRG ile sakroiliak
  kemik ödeminin aranması; CRP ve sedimantasyon; **HLA-B27** doku grubu'
kesin_tani: 'Radyografik **sakroiliit** ile birlikte inflamatuvar bel ağrısı klasik tanıyı kurar. Grafi
  temiz ama MRG''de aktif inflamasyon varsa **ASAS** sınıflandırma mantığı (klinik bulgular ve HLA-B27
  ile birlikte) erken tanıyı verir'
ilk_tedavi: 'Birinci basamak **NSAİİ** (ağrıyı bastırmanın ötesinde tabloyu döndürmede de etkili); düzenli
  egzersiz ve fizik tedaviyle birlikte. Yetersiz yanıtta **TNF alfa inhibitörü** veya **İL-17 inhibitörü**
  gibi biyolojik ajanlara geçilir'
klasik_komplikasyon: 'Füzyonlu, katılaşmış omurgada küçük travmayla **spinal kırık** riski (özellikle
  boyun bölgesinde); ilerleyici postüral bozukluk ve göğüs ekspansiyon kısıtlılığı'
