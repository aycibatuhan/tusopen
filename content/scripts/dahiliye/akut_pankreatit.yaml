id: akut_pankreatit
version: 1
status: draft
author: ai-drafts/dahiliye
sources:
- 'Klinik rehberler: American College of Gastroenterology akut pankreatit rehberi — referans olarak listelendi,
  metin projesi özgün yazımdır'
- Sleisenger ve Fordtran Gastrointestinal ve Karaciğer Hastalıkları
ad: Akut Pankreatit
taksonomi:
- - ktbt
  - dahiliye
  - dah_gastroenteroloji
  - dah_gis_akut_pankreatit
tipik_hasta: '**safra taşı** öyküsü ya da **alkol** kullanımı olan hasta; epigastriyumda yerleşen, sırta
  vuran, sürekli ve şiddetli ağrı. Öne eğilince hafifler; bulantı-kusma eşlik eder'
patofizyoloji: Pankreas proenzimlerinin (**tripsinojen**) erken ve kontrolsüz aktivasyonu organın kendi
  sindirimiyle nekroza gider. Nekroz ve üçüncü boşluğa sıvı kaçışı SIRS ile volüm kaybı yaratır. Yağ
  nekrozunda kalsiyum sabunlaşması **hipokalsemi** yapar
anahtar_bulgular:
- 'Serum **lipaz** normalin **3 katı** ve üzeri (amilazdan daha spesifik)'
- 'Şiddetin erken işaretleri: **hipokalsemi**, **hiperglisemi** ve lökositoz'
- 'Flankte **Grey-Turner**, periumbikal bölgede **Cullen** ekimozu (nadir, hemorajik pankreatit imzası)'
- '**BISAP** bileşenleri: **BUN** yüksekliği, bilinç bozukluğu, **SIRS**, **60 yaş üzeri**, plevral
  effüzyon; erken morbidite-mortaliteyi öngörür'
patognomonik: Patognomonik değildir; şiddetli hemorajik pankreatitin klasik imzası — flankte **Grey-Turner**,
  periumbikal bölgede **Cullen** ekimozu; çoğu olguda yoktur
ilk_tetkik: 'Serum **lipaz**; abdominal **ultrason** safra kaynağını ve taşı araştırmak için ilk görüntüleme
  yöntemidir'
kesin_tani: 'Üç kriterden ikisi: karakteristik ağrı, **lipaz veya amilazın** normalin **3 katı** üzeri
  olması, görüntülemede pankreatit bulgusu. Kontrastlı BT ilk **72 saatte** rutin istenmez; nekroz veya
  apse şüphesinde çekilir'
ilk_tedavi: 'Agresif **intravenöz sıvı** (**Ringer laktat** tercih edilir), analjezi ve erken enteral
  beslenme; bulantı-ağrı azalır azalmaz oral beslemeye geçilir. Safra kökenli tabloya kolanjit eşlik
  ediyorsa erken **ERCP**'
klasik_komplikasyon: '**4 haftadan uzun** süren pankreas **pseudokisti**; ilk **1-2 haftadan** sonra
  ateş ve sepsisle **infekte nekroz**; **ARDS** ve hipokalsemiye bağlı **tetani**'
