  yazımdır'
- 'ADA Standards of Care 2025, Bölüm 2: Tanı eşikleri (A1C 6.5, açlık 126, OGTT 200,
  semptomlu rastgele 200 mg/dL)'
- 'FLOW çalışması: semaglutid renal sonuç denemesi, Tip 2 diyabet ve kronik böbrek
  hastalığında böbrek yetmezliği-böbrek kaynaklı ölüm-kardiyovasküler ölüm birleşik
  son noktasında yüzde 24 azalma (Perkovic ve ark., NEJM 2024)'
- 'SELECT çalışması: semaglutidin diyabetsiz obezitede majör kardiyovasküler olayları
  yaklaşık yüzde 20 azaltması (Lincoff ve ark., NEJM 2023)'
- 'SURPASS-2: haftada bir tirzepatidin semaglutid 1 mg dozundan daha güçlü A1C ve kilo düşüşü
  (Frias ve ark., NEJM 2021)'
- Harrison İç Hastalığı İlkeleri (diyabet bölümü)
ad: Diabetes Mellitus
