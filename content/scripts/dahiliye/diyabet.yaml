tipik_hasta: '**Tip 1**: çocuk ve genç erişkin; kilo kaybı, **polidipsi**, **poliüri** ile akut başvurur,
  sık **DKA** ile karşımıza çıkar. **Tip 2**: 40 yaş üstü kilolu hasta; yıllarca sessiz kalıp **retinopati**,
  nöropati, mantar enfeksiyonu veya iyileşmeyen yara ile ortaya çıkabilir'
patofizyoloji: 'Tip 1''de otoimmün **beta hücre yıkımı** sonucu mutlak **insülin eksikliği**; Tip 2''de
  **insülin direnci** üzerine ilerleyici beta hücre rezerv kaybı. Kronik hiperglisemi proteinlerin **glikasyonu
  (AGE)** ve **sorbitol** birikimiyle mikrovasküler (retina, glomerül, periferik sinir) ve makrovasküler
  hasar üretir'
anahtar_bulgular:
- 'Tanı eşikleri: **HbA1c yüzde 6.5**, açlık glukozu **126 mg/dL**, OGTT 2. saat **200**; belirtisiz hastada
  farklı günde tekrar gerekir'
- 'Klasik belirtiler (**poliüri**, **polidipsi**, açıklanamayan kilo kaybı) eşliğinde rastgele plazma glukozu
  **200 mg/dL** üstü tek başına tanı koydurur'
- 'Tip 1: hızlı kilo kaybı, **ketoza** eğilim, **GAD65-IA-2-ZnT8** otoantikor pozitifliği ve düşük **C-peptid**'
- 'Tip 2: obezite, **akantozis nigrikans**, hipertansiyon ve dislipidemi; tanı anında komplikasyon bulunabilir'
- 'Glisemik hedefler: çoğu erişkinde **HbA1c yüzde 7** altı; açlık-preprandial **80-130**, postprandial
  tepe **180 mg/dL** altı'
- 'İlaç seçimi komorbiditeye göre: kardiyovasküler hastalıkta kanıt kardiyovasküler yararı olan **GLP-1
  agonisti** ve/veya **SGLT2 inhibitörü**; kalp yetmezliğinde **SGLT2 inhibitörü**'
- 'Kronik böbrek hastalığında (**eGFR 20-60** veya albuminüri) **SGLT2 inhibitörü** ya da **GLP-1 agonisti**'
- 'İnsülin eşiği: **A1C yüzde 10** üstü, kan glukozu **300 mg/dL** üstü veya **katabolik** belirtilerde
  insülinle başlanır'
- 'Tanıyla birlikte komplikasyon taramaları: **fundus** (retinopati), idrar **albumin-kreatinin oranı**
  (nefropati), **monofilaman-çekiç tendonu** (nöropati), **ayak muayenesi**'
patognomonik: Patognomonik bulgu yok; tanıya yardımcı tipik bulgu — **akantozis nigrikans** (ense-koltuk
  altı katlarında kadife dokulu koyu kalınlaşma, **insülin direnci** işareti)
ilk_tetkik: '**HbA1c** ve açlık plazma glukozu; genç veya atipik hastada Tip 1-Tip 2 ayrımı için **C-peptid**
  ve **otoantikorlar**; komorbidite haritası (kreatinin, idrar albumin-kreatinin oranı, lipit, karaciğer
  enzimleri)'
kesin_tani: '**ADA** eşiklerinden herhangi biri doğrular: **HbA1c yüzde 6.5**, açlık glukozu **126 mg/dL**,
  OGTT 2. saat **200**. Klasik hiperglisemi belirtileri veya hiperglisemik kriz olan hastada rastgele plazma
  glukozu **200 mg/dL** üstü tek başına yeterli. Belirtisiz hastada aynı testin farklı günde tekrarı gerekir'
ilk_tedavi: 'Yaşam tarzı düzenlemesi tüm hastaların temeli; **Tip 1**de ilk günden **bazal-bolus insülin**.
  **Tip 2**de **metformin** hâlâ en sık başlanan oral ajan (eGFR 30 üstünde güvenli); ilaç seçimi komorbiditeye
  göre. Kardiyovasküler hastalıkta kanıt kardiyovasküler yararı olan **GLP-1 agonisti** ve/veya **SGLT2
  inhibitörü**; kalp yetmezliğinde **SGLT2 inhibitörü**. Kronik böbrek hastalığında **SGLT2 inhibitörü**
  (ileri evrede glisemik amaçla **GLP-1**); kilo hedefi öndeyse **GLP-1** veya **tirzepatid**'
klasik_komplikasyon: '**Akut**: Tip 1''de **diyabetik ketoasidoz**, Tip 2''de **hiperosmolar hiperglisemik**
  tablo. **Kronik mikrovasküler**: proliferatif **retinopati**, **diabetik nefropati** (albuminüriden böbrek
  yetmezliğine), **distal simetrik polinöropati** ve otonom nöropati. **Makrovasküler**: **koroner arter
  hastalığı**, **inme**, **periferik arter hastalığı**; **diyabetik ayak** ülseri ve ampütasyon'
ayirici:
- hastalik: diyabetik_ketoasidoz
  ayirt_edici: Polüri-polidipsi ile gelen hastada ketonemi, aniyon açığı ve pH 7.30 altı asidoz saptanırsa
    tablo acil olarak DKA yönetimi gerektirir; DKA yalnızca Tip 1 hastalarının sunumu değildir, Tip 2 hastalarında
    da enfeksiyon veya ilaç kesilmesiyle tetiklenebilir
- hastalik: gestasyonel_diyabet
  ayirt_edici: Gebelikte tanı, 75 g veya 100 g OGTT eşiklerinin gebeliğe özel değerleriyle konur ve genel
    popülasyon eşikleri geçerli değildir; önceden bilinen diyabetli gebeye pregestasyonel diyabet denir
- hastalik: hipertiroidi
  ayirt_edici: Kilo kaybı, yorgunluk ve çarpıntı ile gelen orta yaş hastada tiroid fonksiyon testleri ayırımı
    netleştirir; hipertiroidide poliüri-polidipsi ve hiperglisemi beklenmez, TSH baskılıdır
