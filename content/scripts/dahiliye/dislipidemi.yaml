id: dislipidemi
version: 1
status: draft
author: ai-drafts/dahiliye-5
sources:
- 'ESC/EAS kılavuzu: Kardiyovasküler hastalıklarda dislipidemi yönetimi'
- Türkiye Endokrinoloji ve Metabolizma Dernekleri lipit bozuklukları kılavuzu
ad: Dislipidemi
taksonomi:
- - ktbt
  - dahiliye
  - dah_endokrinoloji
  - dah_end_dislipidemi
tipik_hasta: Rutin tetkikte lipit bozukluğu saptanan, sedanter ve fazla kilolu orta yaş hasta; ailesinde
  erken koroner arter hastalığı ya da ani ölüm olan kişi; göz kapağında ksantelazma ya da Aşil tendonunda
  ksantom saptanan hasta; diyabet, hipotiroidi, nefrotik sendrom gibi sekonder neden taraması gereken
  olgu
patofizyoloji: 'Aterosklerozun ana itici gücü LDL partiküllerinin arter duvarına geçip oksitlenmesi ve
  makrofajların köpük hücresine dönüşmesidir; HDL düşüklüğü ters kolesterol taşınımını azaltarak, trigliserid
  fazlalığı VLDL artışıyla riski büyütür. Primer nedenler genetiktir: ailesel hiperkolesterolemi (LDL
  reseptörü, ApoB ya da PCSK9 genetik bozukluğu) ve ailesel hipertrigliseridemi. Sekonder nedenler: diyabet,
  hipotiroidi, kronik böbrek hastalığı, nefrotik sendrom, alkol; tiazid diüretikler, beta blokerler, kortikosteroidler,
  atipik antipsikotikler ve oral östrojen'
anahtar_bulgular:
- LDL kolesterol yüksekliği; hedef değer toplam kardiyovasküler riske göre saptanır (çok yüksek riskte
  55, yüksek riskte 70, orta riskte 100 mg/dL altı)
- Trigliserid yüksekliği; 500 mg/dL üzerine çıktığında pankreatit riski öne çıkar
- HDL kolesterol düşüklüğü (erkekte 40, kadında 50 mg/dL altı)
- Ksantelazma, tendon ksantomu, erken yaşta korneal arkus; belirgin hipertrigliseridemide eruptif ksantom
- Aile öyküsünde erken kalp-damar hastalığı
patognomonik: null
ilk_tetkik: Açlık lipit paneli; eş zamanlı TSH, açlık glukozu/HbA1c, karaciğer ve böbrek fonksiyon testleriyle
  sekonder neden taraması; ailesel hiperkolesterolemi şüphesinde kriter skoru (Dutch Lipid Clinic Network)
kesin_tani: Lipit panelindeki bozukluğun iki ayrı ölçümle doğrulanması; LDL değeri Friedewald formülüyle
  hesaplanır (total kolesterolden HDL ve trigliseridin beşte biri çıkarılır) ve trigliserid 400 mg/dL
  üzerine çıktığında güvenilirliği bozulur
ilk_tedavi: 'Yaşam tarzı değişikliği her hastada temel adımdır: doymuş ve trans yağ kısıtlaması, Akdeniz
  tipi beslenme, kilo kaybı, düzenli egzersiz, sigaranın bırakılması. İlaç gerektiğinde yüksek yoğunluklu statin ilk seçimdir (hedef LDL 55 veya 70 değerlerinin altı için); miyalji, karaciğer enzim yükselmesi, nadir rabdomiyoliz ve hafif glukoz artışı
  izlenir. Hedefe ulaşılamazsa ezetimib, gerekirse PCSK9 inhibitörü eklenir; belirgin hipertrigliseridemide
  fibrat'
klasik_komplikasyon: Erken ateroskleroz (koroner arter hastalığı, inme, periferik arter hastalığı); 500
  mg/dL üstü trigliseridde akut pankreatit
