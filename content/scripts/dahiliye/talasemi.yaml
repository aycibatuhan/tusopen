tipik_hasta: '**Akdeniz kökenli**, çocuklukta başlayan **sarılık** ve **dalak büyümesi**yle gelen hasta;
  rutin tetkikte hafif **mikrositik anemi**li gençte demir eksikliği düşünülür ama düzelmeyen anemi ve
  normal demir düzeyleri **taşıyıcılığı** düşündürür. Ağır tip düzenli **transfüzyona bağımlı** kronik hastadır'
patofizyoloji: '**Globin zincir** üretimindeki kalıtsal bozukluk. **Beta-talasemi**de nokta mutasyonları beta
  zincir üretimini azaltır; birikmeye devam eden **alfa zincirleri** eritrosit içinde çöker, **etkili eritropoez**
  bozulur, **hemoliz** gelişir. **Alfa-talasemi**de alfa genleri silinir; üç gen silindiğinde beta dörtlüleri
  (**HbH**), dört gen silindiğinde gama dörtlüsü (**Bart hemoglobini**) **hidrops fetalis** yapar'
anahtar_bulgular:
- '**Mikrositik hipokrom anemi**; **Mentzer indeksi** (MCVnin eritrosit sayısına bölümü) **13ün altında**,
  **RDW** az ya da hafif artmış, demir düzeyleri normal'
- 'Beta-talasemi taşıyıcılığında elektroforezde **HbA2 yüzde 3,5** ve üzerinde; **HbF** hafif artışı'
- 'Periferik yaymada **hedef hücreler**, **bazofilik beneklenme**, boyut-şekil çeşitliliği'
- '**Cooley anemisinde** çocuklukta ciddi anemi, **hepatosplenomegali**, kafa ve yüz kemiklerinde genişleme,
  **büyüme geriliği**'
- 'Düzenli transfüzyon alan hastada **ferritin** yüksekliği, ciltte **bronz pigmentasyon**, **endokrin
  yetmezlik** bulguları'
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — beta-talasemi taşıyıcılığında **HbA2**nin
  belirgin artması; ileri hastada kafatası grafinde **fırça uçları** görünümü
ilk_tetkik: 'Tam kan sayımı ve **periferik yayma**, **demir düzeyleri** (eksikliği dışlamak için), **hemoglobin
  elektroforezi** ya da **HPLC**'
kesin_tani: 'Elektroforezde **HbA2** ve **HbF** oranlarının ölçümü; gerektiğinde **globin gen analizi** (alfa
  silinme sayısı, beta mutasyonları)'
ilk_tedavi: 'Major tip: düzenli **eritrosit transfüzyonu** (hedef hemoglobin **9-10**) ve **demir kelasyonu**
  (**deferasiroks**, **deferoksin**, **deferipron**). Aşırı dalak çalışmasında **splenektomi**; kür sağlayan
  seçenek **hematopojetik kök hücre nakli**. Minor tip: yalnızca bilgilendirme ve **genetik danışmanlık**,
  demir tedavisi verilmez'
klasik_komplikasyon: 'Transfüzyona bağlı **ikincil hemokromatoz**: **dilate kardiyomiyopati**, **diyabet**,
  **hipofiz yetmezliği**, **karaciğer fibrozu**; **ekstramedüller hematopoez**'
