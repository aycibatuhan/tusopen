version: 1
status: draft
author: ai-drafts/dahiliye-2
sources:
- Türk Hematoloji Derneği Talasemi Tanı ve Tedavi Rehberi — referans olarak listelendi, metin projesi
  özgün yazımdır
ad: Talasemiler
taksonomi:
