id: obezite
version: 1
status: draft
author: ai-drafts/dahiliye-5
sources:
- Türkiye Endokrinoloji ve Metabolizma Derneği obezite tanı ve tedavi kılavuzu
- ADA/ASMBS metabolik ve bariyerik cerrahi önerileri
ad: Obezite ve Metabolik Sendrom
taksonomi:
- - ktbt
  - dahiliye
  - dah_endokrinoloji
  - dah_end_obezite
tipik_hasta: 'Kilo artışıyla birlikte **hipertansiyon**, **insülin direnci**, **dislipidemi** ya da **obstrüktif
  uyku apnesi** gelişen, vücut kıvrımlarında **akantozis nigrikans** saptanan orta yaş hasta. Atipik antipsikotik,
  **kortikosteroid** ya da **insülin** kullanan hastada kilo alımı'
patofizyoloji: 'Enerji alımı-harcaması dengesizliği; genetik yatkınlık, hareketsizlik, uyku yetersizliği
  üzerine biner. **Visseral yağ** endokrin organ gibi davranır: **adiponektin** azalır, **TNF-alfa** ve
  **IL-6** artar; kronik düşük şiddetli inflamasyon **insülin direnci**ne yol açar. **Metabolik sendrom**
  bu tablonun klinik yansıması: abdominal obeziteye trigliserid yüksekliği, **HDL düşüklüğü**, kan basıncı
  ve açlık glukozu artışından ikisinin eklenmesi'
anahtar_bulgular:
- '**BKİ 30 kg/m2** ve üzeri **obezite**; **25-29,9** fazla kilo; **35-39,9** orta, **40 ve üzeri** ciddi
  (morbid)'
- '**Bel çevresi** (Türkiye ölçütleri): erkekte **94 cm**, kadında **80 cm** üzeri abdominal obezite'
- 'Metabolik sendrom: açlık glukozu **100 mg/dL** üzeri, trigliserid **150 mg/dL** üzeri, **HDL** düşüklüğü,
  kan basıncı **130/85 mmHg** üzeri'
- '**Akantozis nigrikans** (ense, koltuk altı; **insülin direnci**nin cilt bulgusu)'
- '**Obstrüktif uyku apnesi** belirtileri: horlama, gündüz aşırı uyku hâli'
patognomonik: null
ilk_tetkik: '**BKİ** ve **bel çevresi** ölçümü; kan basıncı; açlık glukozu/**HbA1c**, lipit paneli, karaciğer
  enzimleri; ikincil obezite dışlaması için **TSH** ve gerektiğinde **kortizol** (Cushing)'
kesin_tani: '**BKİ 30 kg/m2** ve üzeri (obezite) ve **bel çevresi** ölçütüne göre abdominal obezite. **Metabolik
  sendrom** tanısı abdominal obeziteyle birlikte **dört bileşenden ikisinin** varlığıyla konur'
ilk_tedavi: 'Yoğun yaşam tarzı değişikliği temel: kalori kısıtlaması, davranışsal destek, egzersiz; hedef
  ilk **6 ayda** vücut ağırlığının **yüzde 5-10**u. **BKİ 27** ve üzerinde komorbidite varsa ilaç: **GLP-1
  reseptör agonistleri** (**liraglutid**, **semaglutid**) ve **tirzepatid** en etkilileri; **orlistat**,
  **naltrekson-bupropion**. **BKİ 40** ve üzeri ya da **BKİ 35-39,9** ile kontrolsüz ciddi komorbiditede
  **metabolik cerrahi** (**sleeve gastrektomi** veya **gastrik bypass**). Seçilmiş tip 2 diyabetlide **BKİ
  30** üzeri de cerrahi kabul edilir'
klasik_komplikasyon: '**Tip 2 diyabet**, **obstrüktif uyku apnesi**, **steatohepatit**, **hipertansiyon**
  ve artmış kardiyovasküler risk'
