id: itp
version: 1
status: draft
author: ai-drafts/dahiliye-5
sources:
- ASH İmmün Trombositopeni kılavuzu
- Uluslararası ITP Çalışma Grubu raporları
ad: İmmün Trombositopeni
taksonomi:
- - ktbt
  - dahiliye
  - dah_hematoloji
  - dah_hem_trombositopeni
tipik_hasta: 'Önceden sağlıklı genç erişkin (klasik olarak **kadın**); **peteşi**, **purpura**, **ekimoz**
  ya da burun-diş eti kanaması, adet kanaması artışıyla başvurur; muayenede **dalak ve lenf nodu palpe
  edilmez**. Çocuklarda **virüs üst solunum yolu enfeksiyonu** sonrası çıkar, çoğunlukla kendiliğinden düzelir'
patofizyoloji: 'Trombosit yüzey glikoproteinlerine (en sık **GP IIb/IIIa**) karşı **IgG** otoantikorlar
  trombositleri kaplar; antikorlu trombositler dalağın makrofajlarında **Fc reseptör**leri üzerinden yıkılır.
  **Megakaryosit**ler genellikle korunur ya da artar; antikor baskısıyla trombosit üretimi kısmen bozulabilir.
  Sekonder: **HIV**, **HCV**, **H. pylori**, sistemik lupus, lenfoma, bazı ilaçlar'
anahtar_bulgular:
- '**İzole trombositopeni**: trombosit sayısı düşük; **hemoglobin ve lökosit** normal'
- 'Periferik yaymada trombositopeni dışında anormalite yok; **dev trombositler** görülebilir'
- '**Peteşi, purpura, ekimoz**; mukoza kanamaları (burun, diş eti, **menoraji**)'
- 'Dalak ve lenf nodu palpabl büyümesi **yok** (varsa ITP tanısı sorgulanır)'
- 'Kemik iliğinde **megakaryosit** sayısı normal ya da artmış; tanı için rutin biyopsi **gerekmez**'
patognomonik: null
ilk_tetkik: '**Tam kan sayımı** ve **periferik yayma**; sekonder neden araştırması: **HIV**, **HCV**, **H.
  pylori** serolojisi, **antinükleer antikorlar**, gerektiğinde gebelik testi; **ilaç öyküsü**'
kesin_tani: '**İzole trombositopeni** + uyumlu klinik + yaymada başka bozukluk olmaması + **sekonder neden**
  saptanmaması. Atipik bulgu ya da tedavi öncesinde (özellikle **60 yaş üstü**) **kemik iliği aspirasyonu**
  düşünülür'
ilk_tedavi: 'Trombosit **30 binin** üzerinde ve kanama yoksa **gözlem** yeterlidir. Tedavi gerektiğinde
  **kortikosteroid (prednizon)** ilk seçim; hızlı yanıt gerekiyorsa **IVIG** (dalağın Fc reseptörlerini
  kaplar, etkisi saatler içinde başlar, geçicidir). Kronik ve dirençli olgularda **trombopoietin reseptör
  agonistleri** (**romiplostim**, **eltrombopag**), **ritüksimab**; dirençte **splenektomi**'
klasik_komplikasyon: 'Trombosit **10 bin** altına düştüğünde **spontan kanama**; en korkulanı **intrakraniyel
  kanama**'
