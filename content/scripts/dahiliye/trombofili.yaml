id: trombofili
version: 1
status: draft
author: ai-drafts/dahiliye-4
sources:
- Amerikan Hematoloji Derneği (ASH) venöz tromboemboli tanı ve tedavi rehberi — referans adı olarak listelendi,
  metin projesi özgün yazımdır
- Antifosfolipid sendrom sınıflandırma kriterleri (ISTH)
ad: Trombofili
taksonomi:
- - ktbt
  - dahiliye
  - dah_hematoloji
  - dah_hem_trombofili
tipik_hasta: 'Genç hastada beklentinin dışında ve açıklanamayan **venöz tromboemboli**; **tekrarlayan tromboz**;
  trombozun alışılmadık yerde saptanması (**mezenterik**, **hepatik**, **portal**, **serebral venöz**).
  **Genç yaşta tromboz** geçiren akrabalar; kadında tekrarlayan **gebelik kaybı**, **preeklampsi** veya
  ölü doğum **antifosfolipid sendrom**u işaret eder'
patofizyoloji: 'Pıhtılaşmayı frenleyen doğal mekanizmaların zaafı ya da trombozu artıran kalıtsal/edinsel
  etkenler. Kalıtsal: **Faktör V Leiden** (aktive protein C direnci, en sık), **protrombin G20210A**, **protein
  C/S eksikliği**, **antitrombin eksikliği** (tekrar riski en yüksek). Edinsel: **antifosfolipid antikorlar**,
  **hiperhomosisteinemi**, **paroksismal gece hemoglobinürisi**. Taşıyıcılığın tek başına riski düşüktür;
  **cerrahi**, **immobilizasyon**, **gebelik**, **östrojen** ve obeziteyle katlanır'
anahtar_bulgular:
- 'Genç yaşta (**altmışın altında**) açıklanamayan ilk **venöz tromboemboli** veya **tekrarlayan tromboz**'
- 'Trombozun atipik yerleşimi: **mezenterik**, **hepatik**, **portal**, **serebral venöz sinüs** trombozu'
- 'Ailede tromboz öyküsü ve **genç yaşta tromboz** geçiren akrabalar'
- 'Protein C ve S eksikliğinde **varfarin** başlangıcında **deri nekrozu**; homozigot protein C eksikliği
  olan yenidoğanda **purpura fulminans**'
- 'Antitrombin eksikliğinde **heparinle** beklenen laboratuvar uzamasının yetersiz kalması (**heparin direnci**
  görünümü)'
- '**Antifosfolipid sendrom**: venöz ve arteriyel tromboz, **trombositopeni**, **gebelik kayıpları**'
- '**Lupus antikoagülan**, **antikardiolipin**, **anti-beta2 glikoprotein I** pozitifliğinin **12 hafta**
  arayla en az iki kez doğrulanması'
patognomonik: null
ilk_tetkik: 'Akut trombozda veya **antikoagülan etkisi altında panel çalışılmaz** (doğal inhibitörler yanıltıcı
  düşer); önce standart tedavi, sonra arınmış dönemde panel. **Aktive protein C direnci** ve **F5 Leiden**
  (her zaman geçerli), **protrombin mutasyonu**, **protein C/S**, **antitrombin**, **antifosfolipid antikorlar**,
  **homosistein**'
kesin_tani: '**Genetik testler** (**F5 Leiden**, **protrombin G20210A**) yaşam boyu geçerlidir; doğal inhibitör
  eksiklikleri (**protein C**, **protein S**, **antitrombin**) arınmış dönemde ve arayla **en az iki ölçümle**
  doğrulanır. **Varfarin** protein C ve Syi, **heparin** antitrombini, akut tromboz ve gebelik hepsini
  düşürür. **Antifosfolipid sendrom**da klinik ve laboratuvar kriterleri birlikte aranır'
ilk_tedavi: 'Tromboz alışılmış yönetimi izler: **düşük molekül ağırlıklı heparin** (veya **fondaparinux**)
  köprüsüyle **DOAC** veya **varfarin**; taşıyıcılık tek başına antikoagülasyon gerektirmez. Tekrar riski
  yüksek tablolarda (atipik yerleşim, **antifosfolipid sendrom**, ikinci atak) uzun süreli veya süresiz
  ikincil profilaksi. **Antifosfolipid sendromlu gebelikte** profilaktik **düşük molekül ağırlıklı heparin**
  artı düşük doz **aspirin**; geçici risk faktörüyle tromboz geçiren taşıyıcıda süre kısa tutulur'
klasik_komplikasyon: 'Tekrarlayan **derin ven trombozu** ve **post-trombotik sendrom**; **kronik tromboembolik
  pulmoner hipertansiyon**; **katastrofik antifosfolipid sendrom** (çok organlı mikrotromboz, yüksek ölüm
  riski); gebelikte **rekürren kayıp**, **preeklampsi**, **fetal büyüme geriliği**'
