id: porfiri
version: 1
status: draft
author: ai-drafts/dahiliye-3
sources:
- 'Klinik rehberler: Avrupa Porfiri Ağı (EPA) akut porfiri yönetim kılavuzu — referans olarak listelendi,
  metin projesi özgün yazımdır'
ad: Akut İntermittan Porfiri
taksonomi:
- - ktbt
  - dahiliye
  - dah_metabolik_beslenme
  - dah_met_porfiri
tipik_hasta: 'Yirmi-otuz yaşlarındaki **kadın**; birleşen üçlü: şiddetli **karın ağrısı**, psikiyatrik
  bozulma (anksiyete, halüsinasyon, psikoz) ve ilerleyici **kas zayıflığı** (periferik polinöropati). Tetikleyiciler:
  yeni **ilaç** (barbitürat, sulfonamid, doğum kontrol hapı), **açlık-diyet**, **alkol**, enfeksiyon, **adet
  döngüsü**'
patofizyoloji: 'Heme sentezinin üçüncü enzimi **porfobilinojen deaminaz**ın (hidroksimetilbilan sentaz) eksikliği;
  **otozomal dominant**. Enzim bloğunda yolakta **ALA** ve **porfobilinojen (PBG)** öne birikir; **nörotoksik**
  etkisi periferik ve otonom sinir sistemini bozar. Sitokrom enzimlerini indükleyen ilaçlar, açlık ve hormonal
  dalgalanmalar **heme talebini** artırıp enzim yetersizliğini ifşa eder; ataklar bu tetikleyicilerle alevlenir'
anahtar_bulgular:
- 'Şiddetli, yaygın **karın ağrısı**; fizik muayenede **peritoneal irritasyon yok** — cerrahi karın taklidi'
- 'Psikiyatrik bulgular: **anksiyete**, uykusuzluk, **halüsinasyon**, deliryum, **psikoz**'
- 'Proksimal ekstremitelerden başlayan **motor polinöropati**: kollardan başlayıp ilerleyen zayıflık; ileri
  vakada **solunum kasları** tutulumu'
- 'Otonom bulgular: **taşikardi**, **hipertansiyon**, terleme, **kabızlık**'
- '**İdrarın dururken koyulaşması** (PBG oksidasyonu; koyu kahverengi-şarap rengi)'
- 'Uygunsuz **ADH** salınımına bağlı **sodyum düşüklüğü**'
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — bekletilen idrarda **koyulaşma** (**porfobilinojen**in
  oksidasyonu)
ilk_tetkik: 'Spot idrarda **porfobilinojen (PBG)** düzeyi (**PBG/kreatinin** oranı); serum **sodyum** ve elektrolitler;
  hastanın **ilaç listesinin** tetikleyici yönünden taranması'
kesin_tani: 'İdrar **PBG** düzeyinin belirgin yüksekliği akut atağı doğrular; **PBG deaminaz** aktivitesinin
  düşüklüğü ve **HMBS** genetik incelemesi kesinleştirir. Karın ağrısı sırasında idrar PBG **normal** ise
  akut porfiri **dışlanır**'
ilk_tedavi: 'Tetikleyici **ilaçların kesilmesi** ve bol **karbonhidrat** (glukoz infüzyonu, hafif atakta
  yeterli) ilk basamaktır. Ağır atakta (nöropati, psikoz, sodyum düşüklüğü) **hemin (hem arginat) 3-4 mg/kg/gün**,
  dört gün intravenöz. Ağrı için **opioidler** güvenlidir; taşikardi-hipertansiyonda **beta bloker**; **solunum
  kaslarının** izlenmesi gerekir'
klasik_komplikasyon: '**Solunum kasları** tutulumuyla **solunum yetmezliği** (mekanik ventilasyon gerekebilir);
  rekürren ataklarda kalıcı **nöropatik sekeller**'
