id: feokromositoma
version: 1
status: draft
author: ai-drafts/dahiliye-4
sources:
- Endocrine Society feokromositoma ve paraganglioma tanı ve tedavi rehberi — referans adı olarak listelendi,
  metin projesi özgün yazımdır
ad: Feokromositoma
taksonomi:
- - ktbt
  - dahiliye
  - dah_endokrinoloji
  - dah_end_feokromositoma
tipik_hasta: 'Kırk yaş dolayında hipertansif hasta; dakikalar-saatler süren **paroksismal ataklar**: baş
  ağrısı, bedeni saran bol **terleme**, **çarpıntı**, solukluk, titreme, ölüm korkusu. Ataklar arası hasta
  kendini iyi hissedebilir; hipertansiyon sürekli de olabilir. Ailesel sendromlar: **MEN 2A ve 2B**, **von
  Hippel-Lindau**, **nörofibromatozis tip 1**, **SDH** mutasyonları'
patofizyoloji: 'Adrenal medullanın **kromafin hücre**lerinden kaynaklanan **katekolamin** üreten tümör;
  adrenal dışı yerleşimler **paragangliom**. Salgı başta **noradrenalin** ve adrenalin olmak üzere paroksismal
  veya sürekli. Katekolamin fazlalığı damar direncini, kalp hızını ve metabolizmayı artırır; uzun sürede
  kalp kasına toksiktir'
anahtar_bulgular:
- '**Paroksismal hipertansiyon** atakları; bir bölüm hastada **sürekli hipertansiyon**'
- '**Atak üçlüsü: baş ağrısı, terleme, çarpıntı**; ek bulgular solukluk, titreme, panik hissi, göğüs ağrısı'
- 'Hipermetabolik görünüm: kilo kaybı, kan şekeri yüksekliği; ayakta durunca tansiyon düşmesi (**ortostatik
  hipotansiyon**)'
- 'Plazma serbest **metanefrin** veya 24 saatlik idrar fraksiyone **metanefrin** artışı (tanıyı taşıyan
  tarama testi)'
- 'Ailesel germline mutasyonlar hastaların **yüzde 30-40**ında; **iki taraflılık**, adrenal dışı yerleşim,
  malign biyoloji ve çocukluk çağı olguları her biri **yüzde 10-20**'
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — **baş ağrısı, terleme ve çarpıntı**nın
  **paroksismal hipertansiyon**la birlikte görülmesi (klasik üçlü)
ilk_tetkik: 'Plazma serbest **metanefrin** veya 24 saatlik idrar **fraksiyone metanefrin**; test öncesinde
  **kafein**, **dekonjestan**, **trisiklik antidepresan** ve benzeri ilaçların etkisinin hesaba katılması'
kesin_tani: 'Biyokimyasal doğrulamayı abdominal **BT veya MR** ile tümörün gösterilmesi izler. Adrenal
  dışı, iki taraflı veya metastatik şüphede **I-123 MIBG** sintigrafisi veya **PET**. Tümörden **biyopsi
  alınmaz**; hipertansif kriz tetikleyebilir'
ilk_tedavi: 'Cerrahi öncesi **medikal hazırlık** zorunludur: önce **alfa bloker** (**fenoksibenzamin**
  veya **doksozosin**) başlanır, volüm genişlemesi sağlanır. Alfa blokaj sağlandıktan sonra refleks kalp
  hızlanmasında **beta bloker** eklenir, beta önce başlanırsa **hipertansif kriz** riski taşır. Kesin tedavi
  **laparoskopik adrenalektomi**; cerrahiye uygun olmayan hastada sürekli **alfa blokaj**, gerektiğinde
  **kalsiyum kanal blokeri** veya **metirozin**'
klasik_komplikasyon: '**Hipertansif kriz** ve **akut kalp yetmezliği**; **katekolamin kalp kası hastalığı**
  ve ritim bozuklukları; anestezi, cerrahi veya doğum gibi tetikleyicilerde **katekolamin fırtınası**
  (tanınmamış olguda ölümcül)'
