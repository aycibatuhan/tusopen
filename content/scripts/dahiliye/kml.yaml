id: kml
version: 1
status: draft
author: ai-drafts/dahiliye-3
sources:
- 'Klinik rehberler: Avrupa Lösemi Ağı (ELN) kronik miyeloid lösemi önerileri — referans olarak listelendi,
  metin projesi özgün yazımdır'
ad: Kronik Miyeloid Lösemi
taksonomi:
- - ktbt
  - dahiliye
  - dah_hematoloji
  - dah_hem_kml
tipik_hasta: 'Orta yaşlı hasta; rutin kan sayımında **rastlantısal lökositoz**la yakalanır ya da yorgunluk,
  gece terlemesi, kilo kaybı ve sol üst kadranda dolgunluk hissi (**splenomegali**) ile başvurur'
patofizyoloji: 'Dokuz ve yirmi iki numaralı kromozomlar arası karşılıklı yeniden düzenlenme **Filadelfiya
  kromozom**unu yaratır. **BCR-ABL** füzyon geni sürekli açık kalan **tirozin kinaz** sinyali verir; granülosit
  hattındaki kök hücreler kontrolsüz çoğalır. Hastalık üç fazlıdır: uzun **kronik faz**, **hızlanma fazı**
  ve **blast krizi**'
anahtar_bulgular:
- 'Kanda belirgin **lökositoz**: olgun ve olgunlaşmamış **miyeloid hücrelerin** bir arada görülmesi (yayma)'
- '**Bazofil** sayısında artış (KML''nin işaretçisi)'
- 'Belirgin **splenomegali**'
- '**Filadelfiya kromozomu** veya **BCR-ABL** füzyon geni pozitifliği'
- '**Trombositoz**; ilerlemiş fazda **anemi** ve blastların artması'
- 'Kanda **LDH** ve **ürik asit** yüksekliği (hücre devinimi hızlanmıştır)'
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — **Filadelfiya kromozomu** (**BCR-ABL**
  füzyon geni)
ilk_tetkik: 'Tam kan sayımı ve **periferik yayma**; **BCR-ABL** için **PCR** (ve **FISH**), kemik iliği
  incelemesi ve **karyotip**'
kesin_tani: 'Periferik kan veya kemik iliğinde **BCR-ABL** saptanması (**PCR** veya **FISH**) ve karyotipte
  **Filadelfiya kromozomu**; **lökositoz-splenomegali-bazofili** ile birleşince tanı kesinleşir'
ilk_tedavi: '**Tirozin kinaz inhibitörü**: **imatinib** birinci basamak (**dasatinib**, **nilotinib** gibi
  daha güçlü seçenekler de vardır). Yanıt **BCR-ABL transkript** düzeylerinin takibiyle (**majör moleküler
  yanıt** hedefi) izlenir. Direnç veya blast krizde ileri TKI ve **allojeneik kemik iliği nakli** değerlendirilir'
klasik_komplikasyon: 'Tedavisiz ilerleme: kronik fandan **hızlanma fazı**na ve **blast krizi**ne geçiş (blast
  krizi çoğunlukla ölümcüldür)'
