id: peptik_ulser
version: 1
status: draft
author: ai-drafts/dahiliye-5
sources:
- ACG kılavuzu — Treatment of Helicobacter pylori Infection (Am J Gastroenterol 2024, Chey ve ark.)
- ACG/CAG dispepsi kılavuzu ile AAFP 2023 peptik ülser derlemesi
- Maastricht VI (Fortaza) H. pylori uzlaşısı 2022
ad: Peptik Ülser Hastalığı
taksonomi:
- - ktbt
  - dahiliye
  - dah_gastroenteroloji
  - dah_gis_peptik_ulser
tipik_hasta: 'Orta yaşta haftalardır süren, tekrarlayan **epigastrik ağrı**yla gelen erişkin. **Açlıkta
  ve gecede artıp yemek ya da antasidle yatışan** düzen **duodenal ülser**i düşündürür; **yemekle artan**
  ağrı ve kilo kaybı **gastrik ülser**e işaret eder. **Sigara**, aile ülser öyküsü ve özellikle **aspirin
  ya da NSAID** kullanımı riski belirgin yükseltir; **melena**, **hematemez** veya ani yaygın karın ağrısıyla
  komplikasyon tablosunda da başvurabilir'
patofizyoloji: 'Mukoza bütünlüğü **saldırı (asit ve pepsin)** ile **savunma (mukus-bikarbonat bariyeri,
  mukozal kan akımı, prostaglandinler)** dengesiyle korunur. **Helicobacter pylori** antrumda kolonize olur;
  **ürez** aktivitesiyle ürettiği amonyakla asitten kaçar, kronik aktif **gastrit** yapar. Antral gastrit
  **D hücrelerini** baskılayınca **gastrin** yükselir, asit artar; korpus tutulumu **atrofik gastrit** ve
  **mide kanseri** riskine götürür. **NSAID** COX-1 inhibisyonuyla **prostaglandin** sentezini azaltır,
  savunma çöker; iki etkenin bir arada bulunması kanama riskini **altı kattan fazla** artırır'
anahtar_bulgular:
- 'Epigastriyumda kazıyıcı ya da yakan nitelikte tekrarlayan ağrı; duodenal ülsere özgü **açlıkta ve gecede
  artar, yemek ya da antasidle yatışır**'
- 'Gastrik ülserde ağrı **yemekle artar**; iştahsızlık, erken doyma ve kilo kaybı eşlik edebilir'
- '**Aspirin ya da NSAID** kullanımı, **sigara** ve birinci derece akrabada ülser öyküsü başlıca risk etmenleri'
- 'Noninvaziv **H. pylori** testlerinde pozitiflik: **üre nefes testi** ve **dışkı antijen** tanıda ve iyileşme
  değerlendirmesinde; **seroloji** eski-aktif enfeksiyonu ayırt edemez'
- 'Üst endoskopide derinliği olan, **keskin kenarlı**, düz tabanlı yuvarlak mukoza defekti; gastrik ülserde
  malignite dışlamak için **kenar ve tabandan biyopsi**'
- 'Kronik kanama izleri: **demir eksikliği anemisi** ve **pozitif gaita gizli kanı**'
- 'Komplikasyonlar: **melena/hematemez** ile kanama; **tahta gibi sert karın** ve **serbest hava** ile
  perforasyon; **bol kusma** ile gastrik çıkış obstrüksiyonu'
patognomonik: Peptik ülsere özgü bir laboratuvar bulgusu yoktur; hastalığı tanımlayan bulgu üst endoskopide
  **derinliği olan, keskin kenarlı ülser defektinin** doğrudan görülmesidir
ilk_tetkik: '**60 yaş altı** ve alarm bulgusuz dispepside önce **H. pylori testi** (**üre nefes** ya da **dışkı
  antijeni**) ile **test ve tedavi**. **Alarm bulguları**nda (kilo kaybı, gastrointestinal kanama, disfagi,
  tekrarlayan kusma, demir eksikliği anemisi, palpe kitle) veya **NSAID** kullanımında doğrudan **üst endoskopi**'
kesin_tani: 'Üst endoskopide **ülserin görülmesi**; **H. pylori** varlığının **üre nefes testi**, **dışkı
  antijen** ya da **biyopsi hızlı ürez** yöntemiyle gösterilmesi. Gastrik ülserde malignite dışlamak için
  **biyopsi zorunludur**. İşlevsel dispepsi ve **gastroözofageal reflü** benzer sunum yapar; alarm bulgusu
  yokluğu ve endoskopik ülserin gösterilmesi ayırımı sağlar'
ilk_tedavi: '**H. pylori pozitif**: **14 gün** eradikasyon, ilk seçenek **optimize bizmut dörtlü tedavi**
  (**PPI** + **bizmut** + **tetrasiklin** + **metronidazol**); penisilin allerjisinde de yeğlenir. **Klaritromisin
  direnci yüzde 20-30** düzeyinde olduğundan PPI-klaritromisinli üçlü ampirik ilk basamakta önerilmez;
  ampirik alternatif **rifabutin üçlü** ya da **potasyum kompetitif asit blokerli çift** tedavi. **H. pylori
  negatif** ülserde NSAID kesilir ve **PPI** başlanır (duodenal ülsere **4-8 hafta**, gastrik ülsere **8
  hafta**); NSAID bırakılamıyorsa **COX-2 seçici** + PPI. İyileşme doğrulaması: tedavi bitiminden **en az
  4 hafta** sonra **üre nefes** ya da **dışkı antijen** testi; gastrik ülserde **8-12 hafta** sonra **kontrol
  endoskopisi**'
klasik_komplikasyon: 'En sık **üst gastrointestinal kanama** (melena, hematemez); duodenal ülser ön duvardan
  **perforasyon** (ani yaygın peritonit, diafragma altında **serbest hava**); piylorik bölge ödemi ya da
  skarı ile **gastrik çıkış obstrüksiyonu** (bol kusma, dalga dalga peristaltizm); **pankreas penetrasyonu**'
ayirici:
- hastalik: gord
  ayirt_edici: Önde göğüste yükselen yanma, ekşite gelen regürjitasyon ve özofagus kaynaklı
    şikayetler vardır; açlıkta artıp yemekle yatışan epigastrik ağrı düzeni peptik ülserin
    aksine beklenmez, endoskopide ülser defekti yerine distal özofagusta erosif özofajit
    ya da normal görünüm saptanır
- hastalik: mide_kanseri
  ayirt_edici: Alarm bulguları önde gider — kilo kaybı, yutma güçlüğü, erken doyma,
    tekrarlayan kusma, demir eksikliği anemisi ve ileri yaş; endoskopide ülser kenarları
    kalın, düzensiz ve çökük tabanlıdır, biyopsi adenokarsinomu gösterir; benign peptik
    ülser keskin kenarlı ve düz tabanlıdır
