tipik_hasta: 'Bilinç bozukluğu, inatçı hipotansiyon, nadir ritim bozukluğu ya da açıklanamayan **anijon boşluklu**
  metabolik asidozla acile gelen; alım öyküsü belirsiz hasta. Her ciddi zehirlenmede **parasetamol** düzeyi
  rutin bakılır; antidot başlama gecikmesi organ yetmezliğinin ana belirleyicisi'
patofizyoloji: 'Antidotlar dört mantıkla çalışır: **reseptör antagonizması**, **molekül nötralizasyonu**,
  **substrat desteği**, **enzim inhibisyonu**. Reseptör antagonizması opioidde **nalokson**, benzodiyazepinde
  (nadiren) **flumazenil**le; molekül nötralizasyonu şelatlayıcılarla ve digoksinda **Fab antikor fragmentleri**yle.
  Substrat desteği **NAPQI**yi glutatyonla bağışız kılan **N-asetilsistein**in mantığı; enzim inhibisyonu
  metanol ve etilen glikolü alkole çeviren **alkol dehidrojenaz**ı **fomepizol**le durdurur. Bikarbonat
  trisiklik antidepresanda **sodyum kanal** blokunu kaldırarak **QRS**yi daraltır; dokusal zarar, asidozun
  derinliği ve **osmolal boşluk** birbirine paraleldir'
anahtar_bulgular:
- 'Opioid triyadı: **miyozis**, solunum baskılanması, bilinç bulanıklığı; kesin antidot **nalokson** (damar
  yolu yoksa burun içine verilir)'
- 'Parasetamol: ilk 24 saat sessiz seyreder; sağ üst kadran ağrısı, **AST** ve **INR** yükselmesi 24-72
  saatte belirir; tedavi çizgisi aşılmışsa **N-asetilsistein**'
- 'Karbon monoksit: baş ağrısı, konfüzyon, bilinç kaybı; **oksijen saturasyonu** yanıltıcı biçimde normaldir;
  tedavi **yüzde yüz oksijen**, seçili olguda **hiperbarik oksijen**'
- 'Organofosfat ve karbamat: miyozis, salya artışı, bronkore, karın krampları, kas fasikülasyonları; antidot
  **atropin** artı **pralidoksim**'
- 'Metanol: görme bulanıklığı; etilen glikol: idrarda **kalsiyum oksalat** kristalleri; ikisinde de yüksek
  **anijon boşluğu** ve **osmolal boşluk**; antidot **fomepizol**'
- 'Digoksin: nadir aritmiler (AV blok, ventriküler taşikardi), **hiperkalemi**, sarı görme; ağır olguda
  **digoksin Fab fragmentleri**'
- 'Trisiklik antidepresan: antikolinerjik taşikardi, kuru deri, midriyazis, EKGde **aVRede terminal R**
  ve **QRS** genişlemesi; antidot **sodyum bikarbonat**'
- 'Metemoglobinemi: oksijen tedavisine yanıt vermeyen **siyanoz**, çikolata rengi kan, kan gazında normal
  **pO2**; antidot **metilen mavisi**'
patognomonik: null
ilk_tetkik: 'Kardiyak monitör ve parmak ucu glukoz; **parasetamol** ve **salisilat** düzeyleri; arteryel
  kan gazı, elektrolitler, laktat, böbrek-karaciğer fonksiyonları. **Anijon boşluğu** sodyumdan klor ve
  bikarbonat çıkarılarak hesaplanır; **osmolal boşluk** ölçülen plazma ozmolalitesinin hesaplanandan farkıdır.
  **EKG** trisiklik, kalsiyum kanal blokeri, beta bloker ve digoksin yönünden ilk taramadır'
kesin_tani: 'Tanı toksidromun laboratuvalla eşleşmesidir. Yüksek anijon boşluklu asidozda normal glukoz
  ve görme bozukluğu **metanolü**, oksalat kristalleri **etilen glikolü** işaret eder. Çikolata rengi
  kan ve normal pO2li siyanoz **metemoglobinemiyi**; **QRS** genişlemesi **trisiklik antidepresanı**;
  **karboksihemoglobin** düzeyi **karbon monoksiti** işaret eder. Madde saptanamazsa tedavi toksidroma
  göre verilir; en ölümcül adaylar (**parasetamol** dahil) kapsanır'
ilk_tedavi: 'Önce havayolu, solunum, dolaşım ve **glukoz**; koma kokteyli **glukoz** ve **nalokson**dur.
  Opioidde **nalokson**, parasetamolda **N-asetilsistein**, karbon monoksitte **oksijen** (seçili olguda
  **hiperbarik**), organofosfatta **atropin artı pralidoksim**, metanol-etilen glikolde **fomepizol**,
  digoksinde **Fab fragmentleri**. Demirde **defiroksamin**, trisiklikte **sodyum bikarbonat**, metemoglobinemide
  **metilen mavisi**, beta blokerde **glukagon**, sempatomimetikte **benzodiyazepin**. Kalsiyum kanal
  blokerinde **kalsiyum glukonat** artı yüksek doz **insülin-glukoz**; kurşunda **süksimer**, izoniazidde
  **piridoksin**; benzodiyazepin antidotu **flumazenil** kullanılmaz (nöbet, trisiklikle aritmi riski)'
klasik_komplikasyon: 'Parasetamolda gecikmeli **fulminan karaciğer yetmezliği**. Metanolde **körlük**
  ve bazal ganglion nekrozu; etilen glikolde **akut böbrek yetmezliği**. Trisiklikte inatçı nöbet ve ölümcül
  **aritmi**; karbon monoksitte geç dönem **nöropsikiyatrik tablo**. Digoksinde dirençli hiperkalemi ve
  kalp bloğu; demirde gecikmiş şok, salisilatta beyin ödemi, kurşunda **ensefalopati**'
ayirici:
- hastalik: iskemik_inme
  ayirt_edici: Vasküler komada fokal defisit, anizokori ve odyolojik odak bulguları öne çıkar, bilgisayarlı
    beyin tomografisinde damar bölgesine uyan lezyon vardır; toksik komada pupil ve nörolojik bulgular
    genellikle simetriktir ve osmolal ya da anijon boşluğu, ilaç düzeyleri toksini işaret eder
- hastalik: diyabetik_ketoasidoz
  ayirt_edici: Ketoasidozda kan glukozu belirgin yüksek, ketonlar pozitif, osmolal boşluk genellikle normaldir;
    toksik (alkol) asidozda glukoz normal ya da düşük, anijon ve osmolal boşluk birlikte büyüktür ve glukoz
    düşüşü benzodiyazepin dışı koma nedenidir
- hastalik: sepsis
  ayirt_edici: Sepsiste enfeksiyon odaklı ateş, hipotansiyon ve yüksek laktatla laktik asidoz vardır, osmolal
    boşluk normaldir; toksik asidozda osmolal boşluk büyüktür, oksalat kristalleri ya da ilaç öyküsü eşlik
    eder ve antibiyotik tedavisine yanıt beklenmez
