tipik_hasta: 'Üç başlıkta karşılaşılır: **tromboz profilaksisi** kararı gereken hasta (atriyal fibrilasyon, venöz tromboemboli,
  **mekanik kapak**, tekrarlayan gebelik kaybı); antikoagülan kullanırken **kanayan** ya da girişim öncesi
  yönetim sorulan hasta; heparin sonrası trombosit düşen **hastane hastası**'
patofizyoloji: '**Warfarin** **vitamin K epoksit redüktaz**ını bloke eder; II-VII-IX-X ve **protein C-S** fonksiyonel
  eksikliği yaratır, **protein C** hızlı düşüşü geçici prokoagülan dönem yapar. **DOAC** tek hedefli iş görür:
  **dabigatran** trombini, **apiksaban**, **rivaroksaban**, **edoksaban** faktör Xayı inhibe eder; hızlı etkinlik,
  rutin izlem gerekmez. **Heparinler** antitrombin üzerinden etki eder: **UFH** IIa ve Xayı, **LMKH** ağırlıklı
  Xayı frenler; **fondaparinux** seçici Xa inhibitörüdür. **Dabigatran**ın yaklaşık **yüzde 80**i böbrekten
  atılır; DOAC eliminasyonu renal klerense bağlıdır'
anahtar_bulgular:
- 'İlaç seçimi: nonvalvüler **atriyal fibrilasyon** ve **venöz tromboembolide** ilk sıra **DOAC** (apiksaban,
  rivaroksaban, dabigatran, edoksaban); **warfarin** yalnızca **mekanik kapak**, orta-ileri romatizmal **mitral
  stenoz** ve **antifosfolipid sendrom**da zorunludur'
- 'Endikasyon eşiği: **CHA2DS2-VASc** erkekte **2**, kadında **3** ve üzeri antikoagülasyon gerektirir; sıfır
  puanda gerekmez, **aspirin** tek başına alternatif değildir'
- '**İzlem**: warfarin **INR** ile, hedef **2-3**; mekanik mitral kapakta hedef **2,5-3,5** ve düşük doz **aspirin**
  eklenir; **DOAC** grubunda rutin pıhtılaşma izlemi gerekmez'
- '**Renal klerens** doz belirleyicidir: **dabigatran** ve **edoksaban** ileri böbrek yetmezliğinde kullanılmaz,
  **apiksaban** ve **rivaroksaban** doz ayarıyla geniş kullanılır'
- '**Kanama** en sık zarardır: **DOAC** grubunda **intrakraniyal kanama** warfarine göre belirgin azdır; **dabigatran
  150 mg**, **rivaroksaban** ve **edoksaban** yüksek dozda **gastrointestinal kanama** artarır, **apiksaban**da
  artmaz'
- '**HIT**: heparin başlangıcından **5-10 gün** sonra trombositte **yüzde elli** ve üzeri düşüş, yeni tromboz
  veya enjeksiyon yerinde **deri nekrozu**; **4Ts** düşükse laboratuvar testi ve ampirik tedavi önerilmez'
- '**Reversiyel**: **warfarin**de **4 faktörlü protrombin kompleks konsantresi** artı **K vitamini**; **dabigatran**da
  **idarucizumab**; **Xa inhibitörlerinde** **andeksanet alfa**; ulaşılamazsa protrombin kompleks konsantresi'
- '**Periprocedural**: **warfarin** girişimden **5 gün** önce kesilir; **DOAC** düşük kanama riskli girişimde
  **1 gün**, yüksek risklide **2 gün** kesilir; **BRIDGE** çalışması çoğu hastada köprülemeyi gereksiz bulur;
  **pili ve ICD** girişiminde warfarin kesilmez'
patognomonik: '**İlaç-izlem-antidot eşleşmesi**: **warfarin** **INR** izlemlidir ve **K vitamini**yle geri alınır;
  **DOAC** izlemsizdir ve özgül antidotludur (**dabigatran-idarucizumab**, **Xa inhibitörü-andeksanet alfa**);
  **HIT**te trombosit düşüşünün heparin başlangıcından **5-10 gün** sonra görülmesi'
ilk_tetkik: '**Endikasyon** önce sınıflanır: atriyal fibrilasyonda **CHA2DS2-VASc**, trombozda atak öyküsü
  ve geçicilik durumu. Başlamadan önce kan sayımı, **kreatinin** ve **Cockcroft-Gault kreatinin klerensi**,
  karaciğer testleri; **warfarin**de **INR** izlem şarttır. **DOAC** etkinliği gerekirse **dabigatran** için
  **seyreltik trombin zamanı**, Xa inhibitörleri için **kalibre edilmiş anti-Xa**; rutin pıhtılaşma testleri
  doz rehberi değildir'
kesin_tani: '**AF**de antikoagülasyon kararı **CHA2DS2-VASc** ile: erkekte **2**, kadında **3** ve üzeri güçlü
  endikasyon, **1** puanda ek risk faktörleriyle tartışılır; **VTE**de en az **3 ay** tedavi her hastada,
  provoke edilmemiş atakta süresiz uzatma ayrı karardır. **Mekanik kapak** ve orta-ileri **mitral stenoza**
  **warfarin** zorunludur; **RE-ALIGN**den sonra **dabigatran** mekanik kapakta kullanılmaz. **HIT** şüphesinde
  **4Ts**: düşük skor tanıyı dışlar, orta-yüksek skorla heparin kesilir, **PF4-ELISA** ve gerektiğinde **serotonin
  salım testi** doğrular. **HAS-BLED** kanama riskini uyarır ama tek başına antikoagülasyon engelleyicisi değildir'
ilk_tedavi: '**Nonvalvüler AF** ve **VTE**de ilk sıra **DOAC**; **mekanik kapak**, orta-ileri **mitral stenoz**,
  **antifosfolipid sendrom**da **warfarin**, hedef **INR** AF-VTEde **2-3** (mekanik mitral kapakta **2,5-3,5**
  + düşük doz **aspirin**). **HIT**te tüm heparin formları kesilir; **argatroban** (böbrek yetmezliğinde tercih),
  **bivalirudin** veya **fondaparinux** başlanır, trombosit toparlanmadan **warfarin** başlanmaz (**venöz gangren**
  riski). Elektif girişim öncesi **warfarin 5 gün** önce kesilir, **DOAC** kesme aralığı **1-2 gündür**; köprüleme
  gereksizdir. Gebelikte **LMKH** tek seçenektir; doğum yaklaşırsa **UFH**ye geçilir'
klasik_komplikasyon: '**Kanama** (en ölümcül biçimi **intrakraniyal kanama**); **HIT**te yaşamı tehdit eden
  arteriyel-venöz trombozlar; warfarin başlangıcında **protein C** eksikliğine bağlı **deri nekrozu** ve **venöz
  ekstremite gangreni**; gebelikte warfarin maruziyetine **fetal warfarin sendromu** (nazal hipoplazi, nokta
  kemikli epifizler)'
ayirici:
- hastalik: atriyal_fibrilasyon
  ayirt_edici: AF scripti ritim ve hız yönetimini anlatır; antikoagülan seçimi, INR hedefleri, reversiyel ve periprocedural kararlar bu scriptin konusudur
- hastalik: trombofili
  ayirt_edici: Trombofilide trombozun nedeni araştırılır ve panel zamanlaması öne çıkar; burada tedavinin hangi ilaçla, ne kadar süreyle ve nasıl izleneceği ele alınır
- hastalik: pulmoner_emboli
  ayirt_edici: Akut pulmoner emboli tanısal yaklaşımla (risk sınıflaması, tromboliz) ilgilidir; antikoagülan seçimi ve tedavi süresi kararı bu scripte taşınır
