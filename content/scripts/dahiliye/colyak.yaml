sources:
- ACG/AGA çölyak hastalığı tanı ve yönetim kılavuzu
- ESPGHAN çölyak hastalığı çalışma grubu önerileri
ad: Çölyak Hastalığı
taksonomi:
- - ktbt
  - dahiliye
  - dah_gastroenteroloji
  - dah_gis_colyak
tipik_hasta: 'Glutenli beslenme (**buğday, arpa, çavdar**) sırasında ishal, karın şişkinliği, kilo kaybıyla
  gelen erişkin. Atipik sunumda **demir eksikliği anemisi**, osteoporoz, kısa boy ya da **infertilite**
  araştırması. Risk artışı: **tip 1 diyabet**, otoimmün tiroidit, **Down sendromu**, birinci derece akrabada
  çölyak öyküsü'
patofizyoloji: '**HLA-DQ2** (en sık) ya da **HLA-DQ8** taşıyanda gluten peptitleri **doku transglutaminaz**la
  deamide edilip T hücrelerine sunulur; mukozada immün yanıt tetiklenir. **Villöz atrofi**, kript hiperplazisi
  ve intraepitelyal lenfosit artışı; absorptif yüzey daralır, **malabsorpsiyon** başlar'
anahtar_bulgular:
- '**Anti-tTG IgA** yüksekliği (toplam IgA ile birlikte bakılır; IgA eksikliğinde **anti-tTG IgG** kullanılır)'
- 'Distal duodenal mukozada **villöz atrofi**, kript hiperplazisi, intraepitelyal lenfosit artışı (**Marsh**
  sınıflaması)'
- 'Klasik tablo: kronik ishal, karın şişkinliği, kilo kaybı; çocuklarda **büyüme geriliği**'
- 'Malabsorpsiyon izleri: **demir eksikliği anemisi**, folat ve **D vitamini** eksikliği, hipokalsemi,
  hipoalbuminemi'
- '**Dermatitis herpetiformis**: dirsek-diz gibi ekstansör yüzeylerde kaşıntılı vezikülobüllöz döküntü'
- '**HLA-DQ2/DQ8** pozitifliği; ikisinin de yokluğu çölyakı pratikte dışlar'
patognomonik: '**Dermatitis herpetiformis** biyopsisinde dermal papillerde **granüler IgA** birikimi'
ilk_tetkik: '**Anti-tTG IgA** serolojisi (toplam IgA ile birlikte); tam kan sayımı, demir, folat, **D
  vitamini** ve kalsiyum düzeyleriyle eksiklik taraması'
kesin_tani: 'Pozitif seroloji eşliğinde distal duodenal biyopsilerde **villöz atrofi** gösterilmesi.
  **tTG IgA** titresi çok yüksek ve **anti-endomisyum** pozitifse biyopsisiz tanı olanaklıdır (özellikle
  çocuklarda). Biyopsi öncesi **glutensiz diyet** başlanmaz; iyileşen mukoza tanıyı gizler'
ilk_tedavi: 'Hayat boyu **glutensiz diyet**: **buğday, arpa ve çavdar** dışlanır; pirinç, mısır ve patates
  serbesttir. Demir, folat ve D vitamini eksiklikleri tamamlanır; dermatitis herpetiformiste **dapson**
  eklenir. Diyet uyumuna rağmen hastalık sürüyorsa **refrakter çölyak** araştırılır'
klasik_komplikasyon: '**Refrakter çölyak hastalığı** ve intestinal **T hücreli lenfoma**; tedavisiz **osteoporoz**
  ve malabsorpsiyon'
