tipik_hasta: "**65 yaş üstü**, uzun süre sigara içmiş, hipertansif ve ailesinde anevrizma öyküsü olan erkek; çoğunlukla hiçbir belirti vermez, tesadüfi ultrasonda saptanır. Belirtilirse karın ortasının solunda **nabız atan kitle** ve künt karın-sırt ağrısı; rüptüre kadar sessiz kalır"
patofizyoloji: "Aort duvarında **medya dejenerasyonu**: elastin yıkımı ve düz kas kaybı duvarı balonlaştırır; aterosklerozla ilişkilidir, en sık yerleşim **böbrek altı (infrarenal)** segment. Eşik mantığı yönetir: çap **3 cm** üstü anevrizma sayılır, **5 cm** üstünde yıllık rüptür riski hızla artar, **5.5 cm** (erkek) elektif tamir eşiğidir; yıllık büyümenin **0.5 cm** üstü hızlı büyümedir ve müdahaleyi öne çeker"
anahtar_bulgular:
- "Karın ortasında **nabız atan (pulsatil) kitle**; çoğu hasta asemptomatiktir"
- "Derin, sabit **karın-sırt ağrısı** — genişlemenin ya da başlayan rüptürün habercisi"
- "**Rüptür triadı**: ani karın-sırt ağrısı, **hipotansiyon**, nabız atan karın kitlesi"
- "Ultrasonda aort çapının **3 cm üstü** (tarama ve izlemde ilk adım); BT anjiyoda çap, boy, trombus durumu ve dallara uzaklık"
- "Tarama önerisi: **65 yaş üstü**, hayatında sigara içmiş erkeğe bir kez **ultrason**; aile öyküsünde daha erken"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **rüptür triadı**: ani karın-sırt ağrısı, hipotansiyon ve nabız atan karın kitlesi"
ilk_tetkik: "Stabil hastada batın **ultrasonu** ile çap ölçümü; rüptür şüphesinde hemodinamik dengede olan hastada acil **BT anjiyografi**. Dengede olmayan hastada tanı için oyalanmadan ameliyathaneye gidilir"
kesin_tani: "**BT anjiyografi**: anevrizmanın **çapı**, boyu, trombus-kalsifikasyon durumu ve böbrek arterlerine uzaklığı (endovasküler tamir planı için ölçüler). Klasik rüptür kliniğinde görüntüleme beklenmeden cerrahi karar verilir"
ilk_tedavi: "Rüptüre anevrizma acil tamir: anatomik uygun hastada **endovasküler tamir (EVAR)** önceliklidir, uygun olmayan hastada açık cerrahi. Elektif tamir eşiği: erkekte **5.5 cm**, kadında **5.0 cm** üstü ya da yıllık büyümenin **0.5 cm** üstü. Küçük anevrizmada sigara bırakma, kan basıncı kontrolü ve ultrasonla izlem (**5 cm altında yıllık**)"
klasik_komplikasyon: "Retroperitoneal **rüptür** ve şok; **aortoenterik fistül** (duodenumun 3. kısmına eriyen önce küçük haberci kanama, ardından masif kanama); distal embolizasyonla **trash foot**"
