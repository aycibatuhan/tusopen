tipik_hasta: "**Elli yaş üstü**, düşük lifli ve işlenmiş et ağırlıklı beslenen, obez, sigara içen hasta; **birinci derece akrabada** kolorektal kanser veya adenomatöz polip öyküsü, **ailesel polipozis** sendromları ve **inflamatuar bağırsak hastalığı** riski belirgin artırır. Açıklanamayan **demir eksikliği anemisi**yle gelen erişkin ve postmenopozal kadında kolonik tümör ilk sıralarda aranır"
patofizyoloji: "Kanserleşmenin ana yolu **adenom-karsinom dizisi**dir: adenomatöz polipte **APC**, ardından **KRAS** ve **p53** mutasyonlarının yıllar içinde birikmesi invaziv kansere götürür; bu uzun süreç taramanın değerini açıklar, poliplerin kolonoskopide çıkarılması kanseri önler; **Sağ kolonda** lümen geniş ve içerik sıvı olduğundan tümör sinsi büyür, eksik kanamayla **demir eksikliği anemisi** yapar, tanısı geç konur; **sol kolonda** lümen dar ve gaita katı olduğundan erken dönemde daralma ve **obstrüksiyon** belirtileri, alışkanlık değişikliği ve görünür kanama olur"
anahtar_bulgular:
- "**Sağ kolon kanseri**: halsizlik, solukluk ve **demir eksikliği anemisi**, sağ karında palpabl kitle; bulgular geç dönemde"
- "**Sol kolon kanseri**: gaita çapının incelmesi ve alışkanlık değişikliği, **kanlı-mukuslu gaita**, erken dönemde obstrüksiyon belirtileri; baryumlu incelemede **elma kabuğu daralması**"
- "**Gaitada gizli kan** pozitifliği"
- "Kolonoskopide ekzofitik veya sirküler daraltıcı tümör; biyopside **adenokarsinom** (en sık histolojik tip)"
- "İleri evrede **karaciğer metastazları** ve karaciğer enzim yüksekliği"
patognomonik: null
ilk_tetkik: "Semptomu olan hastada **tam kan sayımı**, **gaitada gizli kan** ve **kolonoskopi**. Taramanın mantığı adenom-karsinom dizisine dayanır: ortalama riskli kişide **45 yaşından itibaren** yılda bir gaitada gizli kan veya **10 yılda bir kolonoskopi**; birinci derece akrabada kanser varsa tarama **40 yaşından** ya da akrabanın tanı yaşından **10 yıl önce** başlar; **CEA** tanıda değil, tedavi sonrası nüks izleminde değerlidir"
kesin_tani: "Kolonoskopi sırasında tümörden alınan **biyopsi**nin **adenokarsinom** göstermesi; aynı seansta eşzamanlı lezyonlar aranır, tümör yerleşimi işaretlenir. Evreleme **batın BT** ve **akciğer görüntülemesi**yle yapılır"
ilk_tedavi: "Lokalize hastada cerrahi: tümörü ve drenaj lenf nodlarını içeren **hemikolektomi**, en az **12 lenf nodu** örneklemesiyle; lenf nodu pozitif hastaya **adjuvan oksaliplatinli kemoterapi**. Sınırlı sayıda **karaciğer metastazı** varsa rezeksiyon seçeneği korunur; obstrüksiyon yapan tümörde **stent** veya acil rezeksiyon düşünülür"
klasik_komplikasyon: "İleri yaşta kalın bağırsak **obstrüksiyonu**nun en sık nedeni olması; tümör çevresinde **perforasyon** ve peritonit, kronik eksik kanamaya bağlı ileri **demir eksikliği anemisi**"
