tipik_hasta: "Kırk ile altmış yaş arasındaki kadında kendisinin ya da hekimin fark ettiği **ağrısız, sert, çevreye yapışan meme kitlesi** tipik hastadır. Riski artıranlar: erken menarş, geç menopoz, doğum yapmama, emzirmeme, postmenopozal obezite, menopoz sonrası **hormon tedavisi**, alkol ve **yoğun meme dokusu**. Birinci derece akrabada erken ya da çift taraflı meme, yumurtalık veya pankreas kanseri öyküsü ile göğüs bölgesine **radyoterapi** almış olmak riski artırır; **BRCA1 veya BRCA2** mutasyon taşıyıcılığı (kalıtsal olguların en sık nedeni) belirgin risk artırır, kalıtsal formlar tüm olguların yaklaşık **yüzde 5-10**'u"
patofizyoloji: "Süt kanallarının epitelden çıkan **invaziv duktal karsinom** en sık tip, lobüler ikinci sıradadır; kanal tabanını aşmayan hücre birikimi (**duktal karsinoma in situ, DCIS**) invazyon öncesi evredir. Biyolojik davranış reseptör durumuna göre belirlenir: **ER ve PR pozitif (lüminal)** tümörler yavaş ilerler ve **endokrin tedaviye duyarlıdır**; **HER2 amplifikasyonu** agresif seyir gösterir ama **anti-HER2 tedavilerle** kontrol edilebilir; **ER, PR ve HER2 hepsi negatif (üçlü negatif)** tipte hedefli tedavi seçeneği yoktur, **kemoterapi** ön plandadır. Yayılım önce koltuk altı **lenf düğümlerine**, sonra kan yoluyla kemik, akciğer, karaciğer ve beyne olur"
anahtar_bulgular:
- "En sık başvuru bulgusu: sert, sınırları düzensiz, ağrısız, cilde ve göğüs duvarına yapışan **hareketsiz kitle**; en sık yer **üst dış kadran**"
- "Ciltte **çekinti**, meme başında içe çökme, **kanlı meme başı akıntısı**; dermal lenfatik yayılımla ciltte ödem ve **portakal kabuğu** görünümü"
- "**Paget hastalığı**: meme başı-areolada egzamayı andıran kabuklanma, kızarıklık ve kaşıntıyla başlar; altında **DCIS** ya da invaziv tümör yatar"
- "**İnflamatuvar meme kanseri**: haftalar içinde memenin en az **üçte birini** kaplayan kızarıklık, ısınma ve ödem; belirgin kitle çoğunlukla yok, **antibiyotiğe yanıt vermez** (mastitle karışır)"
- "Mamografide **spikülasyonlu kitle** veya gruplu **pleomorfik mikrokalsifikasyon**lar; USG'de düzensiz sınırlı, **dikey gidişli**, hipoekoik lezyon"
- "Palpabe **aksiller** ya da supraklaviküler lenf düğümü; görüntülemede şüpheli aksilla"
- "İleri evre bulguları: cilt **ülserasyonu**, kanama, göğüs duvarına sabitlenme ve üst ekstremite ödemi"
- "Metastatik tablo: **kemik ağrısı** ve patolojik kırık, **hiperkalsemi**, karaciğer metastazı, pleural efüzyon veya nörolojik bulgularla kendini gösterir"
patognomonik: "Patognomonik bulgu yok; tanı **biyopsiyle** kesinleşir. En tipik eşleşme: mamografide **spiküle kitle** ile birlikte gruplu **pleomorfik mikrokalsifikasyonlar** ve aynı tarafta şüpheli aksiller lenf düğümü"
ilk_tetkik: "**Üçlü değerlendirme** mantığı: klinik muayene, görüntüleme ve patoloji her biri ayrı ayrı yorumlanır. Kitle görüntülenirken **mamografi** ile **meme USG** birlikte kullanılır; kırk yaş üstünde mamografi önceliklidir, genç yaşta ve yoğun meme dokusunda USG öne çıkar, **aksilla** ayrıca USG ile değerlendirilir. Görüntüleme iyi huylu yönde uyumlu olsa bile muayenede şüpheli kitle varsa **biyopsiye** geçilir"
kesin_tani: "**Kalın iğne (core) biyopsisi** tanıyı kesinleştirir; aynı örnekten **ER, PR, HER2 ve Ki-67** çalışılır; **İnce iğne aspirasyonu** yalnız sitoloji sağlar, reseptör-HER2 incelemesi için yeterli değildir. Şüpheli aksiller lenf düğümü **ince iğne aspirasyonu**yla doğrulanır; metastatik şüphede **kemik sintigrafisi**, toraks-karın **BT** veya **PET-BT** ile evreleme yapılır"
ilk_tedavi: "Erken evrede cerrahi: memede **koruyucu cerrahi** artı **radyoterapi** ya da **mastektomi**, klinik olarak aksilla negatif hastada **sentinel lenf düğümü biyopsisi** yapılır. Evre **II-III üçlü negatif** ve **HER2 pozitif** hastada **neoadjuvan kemoterapi** standarttır; **HER2 pozitifte** kemoterapi **trastuzumab** ve **pertuzumab** ikilisiyle verilir, kalıntı invaziv tümörde adjuvan **T-DM1** ile tamamlanır, anti-HER2 tedavinin toplam süresi **bir yıldır**; **ER-PR pozitif** hastada **beş-on yıl endokrin tedavi** (premenopozda **tamoksifen**, postmenopozda **aromataz inhibitörü**), yüksek riskli **BRCA1-2** mutasyonlu hastaya adjuvan **PARP inhibitörü (olaparib)** eklenir. Metastatik **ER-PR pozitif HER2 negatif** hastada ilk basamak endokrin tedaviye eklenen **CDK4-6 inhibitörü** (palbosiklib), **üçlü negatif** metastatik hastada **kemoterapi** temeldir"
klasik_komplikasyon: "**Aksiller lenf düğümü metastazı** ve **kemik metastazı**na bağlı patolojik kırık-**hiperkalsemi**; cerrahi ve radyoterapi sonrası **üst ekstremite lenfödemi** ve omuz hareket kısıtlılığı; ileri evrede cilt ülserasyonu ve kanama"
ayirici:
- hastalik: meme_benign
  ayirt_edici: İyi huylu lezyonlarda kitle çoğunlukla yuvarlak, düzgün sınırlı ve serbest hareketlidir.
    Fibroadenom genç kadında kolay kayan, ağrısız kitledir; kist USG incelemesinde anekoik içerikli olup
    aspirasyonla tamamen kaybolur; filloides haftalar-aylar içinde hızla büyür; mastitte ateş, batıcı
    ağrı ve emzirme öyküsü ön plandadır. Kanserde kitle sert, düzensiz ve sabittir; cilt çekintisi,
    portakal kabuğu görünümü, kanlı akıntı ya da palpabe aksiller düğüm eşlik edebilir ve biyopsi
    olmadan kesin ayrım yapılamaz
