tipik_hasta: "Genç-orta yaşlı (**30-40 yaş**) hasta; kabızlık ve sert dışkılama öyküsüyle gelir. Dışkılama sırasında başlayıp sonrasında saatlerce süren batıcı ağrı ve tuvalet kâğıdında az miktarda **parlak kırmızı kan**; ağrı korkusuyla dışkıyı bekletmeye başlar, kısır döngü kurar"
patofizyoloji: "Sert dışkı anodermi (anal kan derisi) yırtar, yırtık iç sfinkterde **refleks spazm** ve kronik hipertansiyon yapar. Yüksek sfinkter basıncı, fissürün en sık yerleştiği **arka orta çizgiyi** (saat 6 yönü) iskemik yapar ve iyileşmeyi engeller; ağrıyla dışkı bekletilir, dışkı sertleşir, döngü kapanır. Yan yerleşimli, çoklu veya iyileşmeyen fissürde **Crohn**, HIV, sifiliz, tüberküloz veya lösemi düşünülmelidir"
anahtar_bulgular:
- "Dışkılamayla başlayıp sonrasında saatlerce süren keskin, **batıcı ağrı**"
- "Tuvalet kâğıdında ve dışkı yüzeyinde az miktarda **parlak kırmızı kan**"
- "Arka orta çizgide (**saat 6 yönü**) uzunlamasına yırtık"
- "Muayenede ağrı nedeniyle anal kanın kasılması (**iç sfinkter hipertonusu**)"
- "Kronikte **sentinel pile** (deri etiketi), **hipertrofik papilla** ve görünür iç sfinkter lifleri"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **dışkılamayla tetiklenen keskin ağrı** artı az miktarda **parlak kırmızı kanama** ikilisi"
ilk_tetkik: "İlk adım **klinik muayene** (kalça nazikçe açılır; posterior midline fissür çoğunlukla görünür); ağrı çok şiddetliyse **dijital muayene** ve **anoskopi** ağrı dindikten sonraya bırakılır"
kesin_tani: "Görünümle konur: **posterior midline** kronik fissür — yırtık, **sentinel pile** ve görünür sfinkter lifleri; atipik yerleşim ya da **6-8 haftada iyileşmeyen** olguda proktoskopi ve alt gastrointestinal değerlendirme (Crohn, HIV, sifiliz, tüberküloz, lösemi ayrımı)"
ilk_tedavi: "Lif ve bol sıvıyla dışkıyı yumuşatma (gerekirse dışkı yumuşatıcı), **ılık oturma banyosu**. Topikal **0.2% nitrogliserin** merhem (iç sfinkteri gevşetir, baş ağrısı sık yan etki) veya topikal **diltiazem**; **6-8 haftada** iyileşmeyen olguda **botulinum toksin** enjeksiyonu. Kronik dirençli olguda **lateral iç sfinkterotomi** (gaz ve kaka tutamama riskiyle dikkatle)"
klasik_komplikasyon: "Kronik fissür — **sentinel pile** ve sfinkter fibrozisi; **perianal apse** ve **fistül** gelişimi; iç sfinkterotomi sonrası **gaz ve kaka tutamama**"
