id: akut_kolanjit
version: 1
status: draft
author: ai-drafts/genel_cerrahi-2
last_reviewed: '2026-09-09'
sources:
- Kiriyama S ve ark. Tokyo Guidelines 2018 — akut kolanjitte tanı kriterleri ve şiddet derecelendirme (J Hepatobiliary Pancreat Sci, 2018); Grade I-III eşikleri ve drenaj zamanlaması bu kaynaktan doğrulandı
- Gomi H ve ark. Tokyo Guidelines 2018 — akut kolanjit ve kolesistitte antibiyotik tedavisi (J Hepatobiliary Pancreat Sci, 2018)
- Miura F ve ark. Tokyo Guidelines 2018 — akut kolanjit ve kolesistit yönetim akış şemaları (J Hepatobiliary Pancreat Sci, 2018)
- Sabiston Textbook of Surgery, safra yolları bölümü
ad: Akut Kolanjit (Yükselen Bakteriyel Kolanjit)
taksonomi:
- - ktbt
  - genel_cerrahi
  - gc_safra_yollari
  - gc_sy_koledokolitiazis_kolanjit
tipik_hasta: "İleri yaş (**altmış ve üstü**) hasta klasiktir; en sık neden koledokolitiyazis olduğundan kolelitiazis öyküsü, önceki ERCP, biliyer stent veya biliyer-bağırsak anastomozu girişimi sorgulanır. Sağ üst kadran ağrısı, ateş ve sarılık üçlüsüyle acile gelen yaşlı hastadır; diyabetik ve yaşlı hastada ağrı ve ateş silik kalıp sarılık ve sepsis öne geçebilir"
patofizyoloji: "Safra akışının obstrüksiyonu, intralüminal basınç artışı ve bakteriyel çoğalmanın birleşimi tabloyu yaratır; basınçla bakteri ve endotoksin sistemik dolaşıma geçip tablo biliyer sepsise ilerler. En sık etken **kolledok taşı**dır; papilla çevresi tümör, striktür, stent tıkanıklığı ve kolesistitteki kompresyon diğer nedenlerdir"
anahtar_bulgular:
- "**Charcot üçlüsü** — ateş ve ürperti, sarılık, sağ üst kadran ağrısı; tam üçlü tüm hastalarda görülmez, sarılık olguların **yüzde 60-70**'inde saptanır"
- "**Reynolds beşlisi** — Charcot üçlüsüne **şok** (hipotansiyon) ve **bilinç değişikliği** eklenmesi; ağır sepsis ve organ disfonksiyonu habercisidir"
- "Laboratuvar: **lökositoz**, CRP artışı, **bilirubin ve direkt fraksiyon artışı**, **ALP ve GGT yüksekliği**; amilaz hafif yükselebilir"
- "**USG** ve **MRKP** — dilate safra yolları ve nedeni (taş, striktür, stent); taş varlığında yukarıda genişleyen intrahepatik kanallar"
- "Kan kültürü pozitifliği sık; en sık etkenler **E. coli** ve **Klebsiella** gibi bağırsak kökenli **Gram negatif basiller**"
- "**TG18 Grade II** göstergeleri: **lökosit 12.000 üstü veya 4.000 altı**, **ateş 39 üstü**; **yaş 75 üstü**, **bilirubin 5 mg/dL üstü** veya **albümin 3 g/dL altı** kriterlerinden **ikisi**"
- "**TG18 Grade III** (ağır): organ disfonksiyonlarından **en az biri** — **noradrenalin veya dopamin gerektiren hipotansiyon**, **bilinç bozukluğu**, **PaO2/FiO2 300 altı**; **kreatinin 2 mg/dL üstü**, **PT-INR 1.5 üstü**, **trombosit 100.000 altı**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Charcot üçlüsü** (duyarlılığı sınırlıdır, tek başına dışlamaya yetmez)"
ilk_tetkik: "Kan kültürü, hemogram, CRP ve karaciğer fonksiyon testleriyle birlikte batın **USG**; dilate safra yolu ve nedeni gösterilir. USG yetersiz kalırsa **MRKP**; tanı netleşmeden acil **ERCP** planlanmamalıdır"
kesin_tani: "**TG18** kriterleri üç bileşen ister — **sistemik inflamasyon** (ateş, lökosit veya CRP), **kolestaz** (**bilirubin 2 mg/dL üstü**, ALP-GGT yüksekliği), **görüntüleme** (dilatasyon ya da etiyoloji); kesin tanı üç bileşenden de birer bulgu ister. Şüpheli tanı, inflamasyonla birlikte kolestaz ya da görüntüleme bulgusunun biriyle konur"
ilk_tedavi: "Ampirik antibiyotik: hafif-orta topluluk kökenli olguda **seftriakson** ile **metronidazol**, ağır (Grade III) ya da sağlık kuruluşu kökenli olguda **piperacillin-tazobactam** veya **karbapenem**. Temel tedavi biliyer drenaj: **Grade III**'te organ desteğiyle acil, **Grade II**'de **24-48 saat** içinde erken, **Grade I**'de antibiyotiğe yanıtsızsa. Drenajın ilk yöntemi **ERCP**, başarısız ya da uygulanamazsa perkütan transhepatik drenaj **PTBD**; kaynak kontrolünden sonra kolesistektomi planlanır"
klasik_komplikasyon: "**Biliyer sepsis** ve sepitik şok; çoğunlukla çoklu **karaciğer absesi**; portal venin septik trombozu yani **pilyeflebit**; tedavi edilmeyende **çoklu organ yetmezliği**"
ayirici:
- hastalik: kolelitiazis
  ayirt_edici: Kolesistit kistik kanalın tıkanmasıyla gelişir; Murphy belirtisi ve USG kolesistit
    bulguları öndedir, sarılık beklenmez. Kolanjitte ise sarılık ve ateş baş plandadır, safra
    yolları dilatedir ve acil drenaj (ERCP) gerekebilir
- hastalik: akut_pankreatit
  ayirt_edici: Biliyer pankreatitte ağrı epigastriktir ve sırta yayılır, amilaz-lipaz üst sınırın üç
    katını aşar; sarılık ve yüksek ateş kolanjitte olduğu kadar belirgin değildir. Kolanjitte
    drenaj öncelikli iken pankreatitte tedavi destekleyicidir, ERCP yalnızca kolanjit birlikteliğinde
    gerekir
- hastalik: mide_kanseri
  ayirt_edici: İleri yaşta ağrısız, ilerleyici sarılık ve kilo kaybı tablosunda obstrüksiyonun nedeni
    papilla çevresi veya pankreas başı tümörü olabilir; bu durumda ateş ve enfeksiyon bulguları
    yoktur, bilirubin yavaş yükselir. Kolanjitte ateş, ürperti ve akut ağrı ön plandadır
