id: akut_otitis_media
version: 1
status: draft
author: ai-drafts/kbb
sources:
- AAP/AAFP Akut Otitis Media tanı ve yönetim kılavuzu — referans olarak listelendi, metin projesi özgün
  yazımdır
ad: Akut Otitis Media
