  - kbb_of_peritonsiller_abse
tipik_hasta: "**Genç yetişkin**de birkaç gündür süren **boğaz ağrısı**nın **tek tarafa** yerleşip şiddetlenmesiyle başvuran hasta. Yutkunmayla katlanılmaz ağrı, **ağız açamama (trismus)**, kapalı kalın ses (**sıcak patates sesi**) ve tükürüğü yutamama ile gelir. **Ateş** ve **halsizlik** ilerleyen saatlerde belirginleşir"
patofizyoloji: "**Bademcik iltihabının** bademcik kapsülü ile farenksin üst konstriktör kası arasındaki **peritonsiller boşluk**a geçip **pü** kolleksiyonu oluşturması; flora genellikle **karmaştır**: **grup A streptokok**lar ile **Fusobacterium** ve **Prevotella** gibi **anaerob**lar birlikte bulunur. Boşluk **pterygoid** kaslara ve **parafaringeal** alana komşudur, bu yüzden **trismus** ve **yayılım riski** tabloyu belirler"
anahtar_bulgular:
- "**Tek taraflı**, yutkunmayla şiddetlenen ağır **boğaz ağrısı**; ağrının **bir tarafa yoğunlaşması** tanının anahtarıdır"
- "**Trismus**: **pterygoid** kasların abseyle tahrişi sonucu **ağız açıklığının** belirgin kısıtlanması"
- "**Küçük dil (uvula)** sağlam tarafa **itilmiş** görünümde; bademcik **üst pol**ünde belirgin **şişlik**"
- "Kapalı, kalın ve boğuk ses (**sıcak patates sesi**); **tükürüğün yutulamaması** ve ağızda **salya birikimi**"
- "**Ateş**, **titreme**, ağrılı **servikal lenfadenopati** ve başı abse tarafına eğme (**tortikollis**) refleksi"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **küçük dilin karşı tarafa itilmiş** görünümü ve **tek taraflı üst polde yoğun şişlik**"
ilk_tetkik: "**Ağız içi muayene**; abse derinliği veya **parafaringeal yayılım** belirsizse **kontrastlı boyun BT**"
kesin_tani: "**İğne aspirasyonu**: çekilen **pü** ile kesin tanı konur; aynı işlem **tedavinin ilk hamlesi** olduğundan **tanı ve tedavi aynı anda** başlar"
ilk_tedavi: "**İnsizyon ve drenaj** (veya **iğne aspirasyonu**) eşliğinde **antibiyotik**: **penisilin** grubu artı **metronidazol** veya **ampisilin-sulbaktam**; tek doz **deksametazon** ağrıyı ve ateşi hafifletir. **Tekrarlayan atak**ta elektif **tonsillektomi**"
klasik_komplikasyon: "Absenin kopmasıyla **aspirasyon pnömonisi**; **parafaringeal** alana yayılım, **mediastinit** ve juguler ven septik trombozu (**Lemierre sendromu**); **hava yolu baskılanması** riski"
