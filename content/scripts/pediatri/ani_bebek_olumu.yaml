id: ani_bebek_olumu
version: 1
status: draft
author: ai-drafts/pediatri-4
sources:
- Amerikan Pediatri Akademisi (AAP) bebek uyku güvenliği ve BRUE kılavuzları — referans olarak listelendi,
  metin özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Ani Bebek Ölümü Sendromu ve BRUE
taksonomi:
- - ktbt
  - pediatri
  - ped_acil_yogun_bakim
  - ped_acil_ani_bebek_olumu
tipik_hasta: "SIDS: **iki-dört aylık**, önceden iyi görünen bebeğin uykusunda açıklanamayan ölümü; riski **yüzüstü yatış**, yumuşak yatak, **pasif sigara**, prematürelük ve kış artırır; BRUE: benzer yaşta kısa süreli **solunum durması, renk ve ton değişikliği** tanımlayıp bebek kendiliğinden döndüğü için gelen başvuru"
patofizyoloji: "Üçlü risk modeli: **savunmasız bebek** — uyku-arousal düzenlenmesinden sorumlu **serotoninerjik ağın** olgunlaşmamışlığı, prematürelük ve ailede benzer öykü; **kritik gelişim dönemi** (iki-dört ay) ve dış stresörler: **yüzüstü yatış**, yumuşak yatak, yatak paylaşımı, aşırı ısıtma, pasif sigara. SIDS **dışlama tanısıdır**: ritim bozuklukları (**uzun QT**), metabolik hastalıklar, asfiksya ve istismar otopsiyle dışlanır"
anahtar_bulgular:
- "SIDS: önceden iyi görünen bebeğin uykusunda ölü bulunması; **otopside ölümü açıklayan bulgu yok**"
- "BRUE: birkaç saniye-1 dakika arası **solunum durması**, **renk** (syanoz/solukluk) ve **ton değişikliği** (gevşeme); bebek kendiliğinden veya müdahaleyle döner"
- "**Yüzüstü (prone) yatış**, yumuşak yatak-yastık ve **yatak paylaşımı** riski belirgin artırır; aynı odada **ayrı yatak** koruyucudur"
- "Düşük-riskli BRUE ölçütleri: **60 günden büyük**, doğum **32 haftadan uzun**, **tek**, **1 dakikadan kısa** ve müdahalesiz atak, tam dönen atak, normal muayene"
- "Yüksek-riskli BRUE: **60 günden küçük**, **birden fazla** veya uzun atak, **resüsitasyon gerektirmiş** olması, sağlık personeli görmüş olması veya anormal muayene-anamnez"
patognomonik: null
ilk_tetkik: "SIDS: **otopsi** ve standart **ölüm yeri incelemesi**; düşük-riskli BRUE: ayrıntılı anamnez ve tam fizik muayene yeterli, **rutin laboratuvar, EKG ve monitor önerilmez**; yüksek-riskli BRUE: bulguya yönelik **elektrolitler**, **kan gazı**, **EKG**, enfeksiyon ve metabolik tarama"
kesin_tani: "SIDS: kesin tanı **otopsi** ve olay yeri incelemesiyle hiçbir ölüm nedeni saptanamamasıdır; BRUE **klinik tanıdır**: renk, solunum veya ton değişikliği tanımlayan atak artı atak sonrası **normal muayene**"
ilk_tedavi: "Bebek her uykuda **sırtüstü** yatırılır, **sert yatak** kullanılır, **dört ay altında yatak paylaşımı** ve koltukta uyutma önerilmez; **aynı odada ayrı yatak** (ilk **6-12 ay**) önerilir, **aşırı ısıtma** engellenir, pasif sigara uzaklaştırılır, uyku başında **emzik** koruyucudur; **ev tipi apne monitörleri** rutin önerilmez, ailede ani ölüm veya **ritim bozukluğu** öyküsünde **EKG** değerlendirmesi düşünülür. Düşük-riskli BRUE: aileye **olay iyi huyludur** bilgisi ve resüsitasyon eğitimi, yüksek-riskli BRUE: altta yatan neden araştırılıp tedavi edilir"
