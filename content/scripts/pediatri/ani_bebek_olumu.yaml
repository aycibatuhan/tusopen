id: ani_bebek_olumu
version: 1
status: draft
author: ai-drafts/pediatri-4
sources:
- Amerikan Pediatri Akademisi (AAP) bebek uyku güvenliği ve BRUE kılavuzları — referans olarak listelendi,
  metin özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Ani Bebek Ölümü Sendromu ve BRUE
taksonomi:
- - ktbt
  - pediatri
  - ped_acil_yogun_bakim
  - ped_acil_ani_bebek_olumu
tipik_hasta: 'SIDS: iki-dört aylık (en sık yaş), öncesinde iyi görünen bebeğin uykusunda açıklanamayan
  ölümü; risk yüzüstü yatan, yumuşak yatakta uyuyan, pasif sigara dumanına maruz kalan, prematüre veya
  düşük doğum ağırlıklı bebekte ve kış aylarında yükselir. BRUE: benzer yaş grubunda ailenin kısa süreli
  solunum durması, renk ve ton değişikliği tanımlayıp bebek kendiliğinden döndüğü için getirdiği başvurudur'
patofizyoloji: 'Klasik açıklama üçlü risk modelidir: (1) savunmasız bebek — beyinde uyku-arousal düzenlenmesinden
  sorumlu serotoninerjik ağın olgunlaşmamışlığı, prematüritelik, ailede benzer öykü; (2) kritik gelişim
  dönemi — iki-dört aylar, uyku-uyanıklık geçişlerinin kırılgan olduğu dönem; (3) dış stresörler — yüzüstü
  yatış, yumuşak yatak, yatak paylaşımı, aşırı ısıtma, enfeksiyon, pasif sigara. SIDS bir dışlama tanısıdır:
  otopsi, ölüm yeri incelemesi ve anamnez ile uzun QT sendromu gibi ritim bozuklukları, metabolik hastalıklar,
  asfiksya ve çocuk istismarı dışlandıktan sonra konur. BRUE ayrı bir olgudur: tanımlayıcı bir olayın
  atak sonrası normale dönmesiyle karakterizedir ve düşük-riskli/yüksek-riskli olarak sınıflanır'
anahtar_bulgular:
- 'SIDS: öncesinde normal görünen bebeğin uykusunda (çoğu kez sabah) ölü bulunması; otopside ölümü açıklayan
  bulgu yok'
- 'BRUE: birkaç saniye ile 1 dakika arası solunum durması, renk değişikliği (syanoz veya solukluk) ve
  ton değişikliği (gevşeme); bebek kendiliğinde veya müdahaleyle döner'
- Yüzüstü (prone) yatış, yumuşak yatak ve yastık, aileyle aynı yatağı paylaşma riski belirgin artırır;
  aynı odada ayrı yatağa yatırma koruyucudur
- 'Düşük-riskli BRUE: 60 günden büyük ve 32 haftadan uzun doğan bebek, tek atak, 1 dakikadan kısa, sağlık personeli müdahalesi olmamış,
  tam dönen atak ve normal muayene'
- 'Yüksek-riskli BRUE: 60 günden küçük bebek, birden fazla veya uzun atak, resüsitasyon gerektirmiş olması,
  sağlık personeli görmüş olması veya muayene-anamnezde anormal bulgu'
patognomonik: null
ilk_tetkik: 'SIDS: otopsi ve standart ölüm yeri incelemesi. Düşük-riskli BRUE: ayrıntılı anamnez ve tam
  fizik muayene yeterlidir; rutin laboratuvar, EKG ve monitor önerilmez. Yüksek-riskli BRUE: bulguya yönelik
  hedefli çalışma (elektrolitler, kan gazı, EKG, enfeksiyon ve metabolik tarama)'
kesin_tani: 'SIDS: otopsi ve olay yeri incelemesiyle hiçbir ölüm nedeni saptanamaması — kesin tanı ancak
  otopsiden sonra konabilir. BRUE: klinik tanıdır; renk, solunum veya ton değişikliği tanımlayan atak
  ile atak sonrası normal muayene birleşir ve düşük-riskli/yüksek-riskli sınıflaması yaklaşımı belirler'
ilk_tedavi: 'Önleme esastır ve yatış pozisyonu mantığının merkezidir: bebek her uykuda (gündüz ve gece)
  sırtüstü yatırılır, sert yatak ve düz çarşaf kullanılır; yastık, pelüş, yorgan ve şapka yatağa konmaz;
  dört ay altında aile yatağı paylaşımı ve koltuk-kanepede uyutma önerilmez; aynı odada ayrı yatak (oda
  paylaşımı) ilk 6-12 ay önerilir; aşırı ısıtma engellenir, pasif sigara uzaklaştırılır, uyku başlangıcında
  emzik kullanımı koruyucudur. Ev tipi apne monitörleri SIDS''i önlemediği için rutin önerilmez; ailede
  ani ölüm veya ritim bozukluğu öyküsü varsa EKG değerlendirmesi düşünülür. Düşük-riskli BRUE: aileye
  olay iyi huyludur bilgisi güvenle verilir, resüsitasyon eğitimi sunulur ve yakın izlem; yüksek-riskli
  BRUE: altta yatan neden araştırılır ve belirli tedavi edilir'
