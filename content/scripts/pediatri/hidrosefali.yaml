  yazımdır
- 'Çocuk nöroşirurji dernek kılavuzları: ventriküloperitoneal şant yönetimi'
ad: Hidrosefali (Çocuk)
taksonomi:
- - ktbt
  - pediatri
  - ped_noroloji
  - ped_nor_hidrosefali_ntd
tipik_hasta: "**Baş çevresi hızla büyüyen**, ön fontaneli geniş-gergin, aşağı bakışta gözleri aşağı kaymış (**güneş batması**) bebek; **myelomeningosel** onarılmış ve prematüre **intraventriküler kanama** geçiren bebek yüksek riskli; büyük çocukta sabahları ağırlaşan baş ağrısı, kusma ve görme bozukluğu"
patofizyoloji: "**BOS üretimi ile emilimi arasındaki dengenin bozulması** ve ventriküllerin genişlemesi; genişleyen ventriküller korteksi inceltir, beyin dokusu hasar görür; **obstrüktif (iletişimsiz)** tip: **akvedükt stenoz**, posterior fossa tümörü gibi akış yolu tıkanıklıkları; **iletişimsel** tip: **araknoid villuslarda** emilim bozukluğu (menenjit sonrası, prematüre IVK sonrası); myelomeningosele **Chiari tip II** eşlik eder"
anahtar_bulgular:
- "**Makrosefali**: baş çevresinin yaş dilimi persentillerinin üstünde olması ya da persentil çizgisini hızla tırmanması; suturların ayrılması"
- "**Güneş batması bulgusu**: aşağı bakışta gözlerin aşağı kayması, üst kapak ile iris arasındaki skleranın beyaz görünmesi"
- "Geniş-gergin **ön fontanel**; kafa derisinde damar belirginleşmesi; perküsyonda **çatlak saksı sesi (Macewen bulgusu)**"
- "Gelişimsel-motor gecikme; büyük çocukta sabah ağırlaşan baş ağrısı, kusma, **papilödem**, **6. sinir felci**ne bağlı içe bakış ve çift görme"
- "Prematüre olguda **intraventriküler kanama** sonrası hızla artan baş çevresi ve artan kafa içi basınç bulguları"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **güneş batması** — bebekte kronik artmış kafa içi basıncının klasik göz görünümü"
ilk_tetkik: "**Kranial ultrasonografi** (ön fontanel açıkken ilk seçim). Hızlı bozulma (bilinç bulanıklığı, papilödem, vital bozulma) varsa acil **beyin MR**"
kesin_tani: "**Görüntüleme**: ventriküllerin orantısız büyümesi, **periventriküler transüdasyon** (BOS sızması) ve etiyolojiyi gösteren bulgular"
ilk_tedavi: "**BOS sapması**: **ventriküloperitoneal şant** (en sık yöntem); **Akvedükt stenoz** gibi bazı obstrüktif olgularda **endoskopik üçüncü ventrikülostomi**; akut dekompansasyonda **eksternal drenaj**"
klasik_komplikasyon: "Tedavisizde ilerleyici **beyin hasarı**, gelişimsel gerilik ve görme kaybı. Şantlu hastada **şant enfeksiyonu**, **şant tıkanması** ve tekrar revizyon gereksinimi"
