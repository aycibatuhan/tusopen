tipik_hasta: "Okul çağı-ergenlikteki çocuğun birkaç haftadır artan su içme ve idrar yapma şikâyetiyle, **kilo kaybıyla** başvurması. Tuvalet eğitimi tamamlanmış çocukta **gece alt ıslatmasının geri dönmesi** tipik ipucudur. Bir bölümü **kusma, karın ağrısı ve hızlı derin solunum**la **diyabetik ketoasidoz** tablosunda acile gelir; ailede **tip 1 diyabet** veya **otoimmün hastalık** öyküsü riski artırır"
patofizyoloji: "Genetik yatkınlıklı (**HLA-DR3/DR4**, **DQ2/DQ8**) kişide tetikleyici olay (çoğu kez **viral enfeksiyon**) sonrası **T hücre aracılı otoimmün** süreç **beta hücrelerini** yıkar, **mutlak insülin yetersizliği**. İnsülin yokluğunda **glukagon** baskılanamayınca karaciğer **glukoz çıkışı** ve **lipoliz** hızlanır; serbest yağ asitleri **keton cisimciklerine** dönüşür. Glukoz hücrelere giremediği ve idrarla **ozmotik diyürez** yaptığı için **kilo kaybı + poliüri-polidipsi**; **keton üretimi**yle **ketoasidoz** gelişir"
anahtar_bulgular:
- "**Klasik üçlü**: **poliüri** (gece alt ıslatmasının geri dönmesi dahil), **polidipsi** ve açıklanamayan **kilo kaybı**"
- "İdrarda **glükoz ve keton** pozitifliği; kan şekerinin **belirgin yüksekliği**"
- "**Ketoasidoz tablosu**: kusma, karın ağrısı, **Kussmaul tipi hızlı derin solunum**, **aseton kokulu nefes**, bilinç bulanıklığı"
- "**İsletel otoantikorların pozitifliği**: **GAD65**, **IA-2**, **insülin**, **ZnT8**"
- "**Serum C-peptid düşüklüğü** (endojen insülin üretiminin azaldığını gösterir)"
- "**HbA1c**'nin belirgin yüksekliği; rastgele kan şekeri çoğu kez **300 mg/dL üzeri**"
patognomonik: null
ilk_tetkik: "**Kan şekeri** ile kanda veya idrarda **keton** ölçümü; **Ketoasidoz** şüphesinde **kan gazı**, elektrolitler, böbrek fonksiyonları ve **serum ozmolalitesi**; **HbA1c**; **Potasyum** düzeyine **insülin** başlamadan bakılır"
kesin_tani: "**Klasik semptomlar**la birlikte **rastgele plazma glukozunun 200 mg/dL üzerinde** olması tipik olarak tanıyı kurar. Semptomsuz bulguda **açlık glukozunun 126 mg/dL üzerinde** olması veya **OGTT** ile desteklenir; **Tip 1** lehine: **genç yaş**, **kilo kaybı**, **otoantikor pozitifliği**, **düşük C-peptid**; **tip 2** lehine: **obezite**, **akantozis nigrikans**, ailede tip 2 öyküsü"
ilk_tedavi: "**Ketoasidoz**la gelen hastada önce **damar yolundan izotonik sıvı bolusu**; **potasyum** kontrol edildikten sonra **düşük doz IV insülin infüzyonu (0.05-0.1 ünite/kg/saat)**. Kan şekerini saatte **50-75 mg/dL** gibi **kademeli** hızla düşürmek hedeflenir; **bikarbonat** yalnızca hayati tehdit eden çok ağır asidozda; **Serebral ödem** riskine karşı **hızlı sıvı yüklemesinden ve ani osmolalite değişiminden kaçınılır**; ilk **24 saat** kritik pencere, nörolojik izlem sık. Uzun dönemde **bazal-bolus insülin** rejimi veya **insülin pompası**, **karbonhidrat sayımı**, **sürekli glukoz izleme** ve **aile eğitimi**"
klasik_komplikasyon: "Tanı anında **diyabetik ketoasidoz**, en korkulanı **serebral ödem**; takipte **hipoglisemi** atakları. Uzun dönemde **retinopati**, **nefropati** (**mikroalbuminüriyle** başlar), **periferik nöropati** ve **kardiyovasküler hastalık** riski"
