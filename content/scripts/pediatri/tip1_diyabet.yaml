id: tip1_diyabet
version: 1
status: draft
author: ai-drafts/pediatri-4
sources:
- ISPAD (Uluslararası Çocuk ve Ergen Diyabet Derneği) klinik uygulama kılavuzları — referans olarak listelendi,
  metin özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Tip 1 Diabetes Mellitus (Çocuk)
taksonomi:
- - ktbt
  - pediatri
