tipik_hasta: "Aşısı eksik ya da hiç olmamış çocuk; **kuluçka süresi 10-21 gün** (en sık **14-16**). Prodromal hafif ateş ve halsizlikten sonra **gövde ve yüzde** başlayan **kaşıntılı döküntü**yle gelir; **yetişkin**, **gebe** ve **bağışıklık yetersizliğinde** tablo çok daha ağır"
patofizyoloji: "**Herpesvirüs** ailesinden **varisella zoster virüsü**; solunum damlacıkları ve **vezikül sıvısı**yla doğrudan temasla bulaşır. Mukozadan lenfoid dokuya, **viremiyle** deriye yayılır; **döküntü**, virüsün deri damarları ve epitelindeki lezyonlarıdır. Enfeksiyon sonrası virüs **arka kök ganglionlarında ömür boyu latent** kalır; bağışıklık zayıflayınca **zona** olarak yeniden çıkar"
anahtar_bulgular:
- "**Döküntü damla damla (crop) çıkar**: aynı bölgede aynı anda **başlı papül**, **berrak sıvılı vezikül**, **püstül** ve **kabuk** evrelerinin bir arada görülmesi"
- "**Gül yaprağı üzerinde çiy damlası** görünümünde, tepecikli, berrak sıvılı **veziküller**; **kaşıntı** belirgin"
- "**Yüz ve gövdeden** başlayıp **saçlı deriye** ve uzuvlara yayılır; ağız mukozasında **ülserli lezyonlar**, **saçlı deride sık tutulum**"
- "Çocukta **prodrom kısa ve hafif**; döküntü ilk **24-48 saat**te çok sayıda lezyonla hızla ilerler"
- "Yetişkin, gebe ve bağışıklık yetersizliğinde **ağır tablo**: **varisella pnömonisi**, **hemorajik** (birleşen-kanayan) lezyonlar, **viseral yayılım**"
- "Aşılanmış olguda **hafif geçiş**: **aşılı kırılma formlarında 50 sayısının altında** lezyon, kabuklanmamış ve kızarıklığı az tablo"
patognomonik: "**Aynı bölgede aynı anda farklı evrelerde** (papül, vezikül, püstül, kabuk) lezyonların bir arada bulunması"
ilk_tetkik: "**Klinik görünümle** tanı konur. Kesinleştirme: vezikül tabanından alınan sıvıda ya da tükürükte **VZV PCR**; **IgM** serolojisi alternatif onay"
kesin_tani: "**Tipik klinik tablo**: aynı bölgede aynı anda farklı evrelerin görüldüğü **damla damla döküntü**. Gerekirse laboratuvar onayı: **vezikül sıvısında PCR** ya da **IgM** pozitifliği"
ilk_tedavi: "**Destekleyici bakım**: kaşıntıya **antihistaminik**, tırnakların kısaltılması, cilt temizliği; ateşte **parasetamol** (**aspirin verilmez**); **Riskli hastada** döküntünün ilk **24-48 saatinde** **oral asiklovir**; ağır viseral tablo, **yenidoğan** ve bağışıklık yetersizliğinde **IV asiklovir**; **Riskli temasta** **varisella zoster immünglobulin (VZIG)**"
klasik_komplikasyon: "**İkincil bakteriyel cilt enfeksiyonu** (stafilokok, streptokok) en sık; **serebellar ataksi** ve **ensefalit**. Yetişkin ve gebelerde **varisella pnömonisi**; **aspirin** kullanımıyla **Reye sendromu**; bağışıklık yetersizliğinde **yaygın viseral hastalık**. Gebeliğin **ilk üç ayında** **konjenital varisella sendromu** (**uzuv hipoplazisi**, **cilt skarları**); doğum yakınında anne enfeksiyonunda **ağır neonatal tablo**; yıllar sonra **zona**"
