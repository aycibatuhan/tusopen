id: nekrotizan_enterokolit
version: 1
status: draft
author: ai-drafts/pediatri-4
sources:
- Amerikan Pediatri Akademisi (AAP) ve neonatoloji topluluklarının NEK yönetim ilkeleri — referans olarak
  listelendi, metin özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Nekrotizan Enterokolit
taksonomi:
- - ktbt
  - pediatri
  - ped_neonatoloji
  - ped_neo_nek
tipik_hasta: "**32 haftanın altındaki prematüre** bebek (en sık **29-32 hafta**) veya **düşük doğum ağırlıklı** yenidoğan; **Enteral besleme** başladıktan sonraki ilk **2-3 hafta** içinde aniden **beslenme toleransının bozulması**, karnın şişmesi ve **gaitada kan**la başvurur; **Prematüritelik** en önemli risk faktörü; **formülle beslenen** bebekte risk, anne sütü alanlara göre belirgin yüksek"
patofizyoloji: "**Olgunlaşmamış bağırsak bariyeri** + formülle gelen **patojen bakteriyel kolonizasyon** + dolaşım dalgalanmalarına bağlı **mukozal iskemi**; **Toll-benzeri reseptör-4** aracılı **aşırı inflamasyon mukozal nekroza** yol açar. Bakteriler duvarda gaz üretince grafide **pnömatosis intestinalis** görünür; süreç **transmural nekroza** ve **perforasyona** ilerleyebilir"
anahtar_bulgular:
- "**Beslenme toleransının bozulması**: mide kalıntısının artması, kusma, **abdominal distansiyon**"
- "**Gaitada görünür kan** veya **gizli kan**"
- "Sistemik bulgular: **apne atakları**, **bradikardi**, **letarji**, **sıcaklık instabilitesi**, solukluk, **kan şekeri dengesizliği**"
- "Radyolojide **pnömatosis intestinalis** (bağırsak duvarı içinde gaz); ayrıca **portal venöz gaz**; perforasyonda **serbest hava**"
- "Karın duvarında **kızarıklık-morarma** (ileri evre, **nekroza** işaret)"
- "Laboratuvar: **trombositopeni**, **CRP artışı**, **metabolik asidoz**, elektrolit bozuklukları"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **abdominal grafide pnömatosis intestinalis** (bağırsak duvarı içinde gaz) — **Bell evre 2**'yi kesinleştirir"
ilk_tetkik: "**Abdominal grafisi** (yatar ve ayakta/yandan): **pnömatosis intestinalis**, **portal ven gazı** ve **serbest hava** araştırılır; **Tam kan sayımı**, **CRP**, **kan gazı**, elektrolitler ve **kan kültürü**"
kesin_tani: "**Klinik bulgular** + abdominal grafideki **pnömatosis intestinalis** ile konur; **Bell evreleme** kullanılır; **Evre 1** (şüpheli) nonspesifik bulgular; **evre 2** (kesin) klinik bulgulara eklenmiş **pnömatosis intestinalis**; **Evre 3** (ileri): şok, asidoz, **yaygın damar içi pıhtılaşma bozukluğu**; **IIIA** perforasyonsuz, **IIIB** perforasyonlu"
ilk_tedavi: "**Enteral besleme hemen durdurulur**, **nazogastrik dekompresyon**; damar yolu sıvıları ve **parenteral besleme**; **Geniş spektrumlu IV antibiyotik** (**ampisilin + gentamisin** veya üçüncü kuşak **sefalosporin**, anaerob örtü **metronidazol**) **7-14 gün**; **Şokta** sıvı resüsitasyonu, gerekirse **inotrop**; **Cerrahi endikasyonlar**: karın boşluğunda **serbest hava** (perforasyon), **evre 3**, antibiyotiğe rağmen **klinik kötüleşme**; **rezeksiyon** ile stoma veya primer anastomoz"
klasik_komplikasyon: "**Bağırsak perforasyonu** ve **peritonit**; geniş rezeksiyon sonrası **kısa bağırsak sendromu**. İyileşenlerde geç dönem **intestinal darlık (stenoz)**; **ölüm riski** (yenidoğan döneminin en ağır cerrahi tablolarından)"
