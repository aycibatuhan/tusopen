tipik_hasta: "Yenidoğan döneminde **oksijene dirençli siyanoz**, solunum sıkıntısı ya da **duktus kapanmasıyla gelen şok** tablosu. İlk haftalarda **beslenirken terleme**, emememe ve kilo alamayan, solunumu hızlanan süt çocuğu; rutin muayenede **üfürüm** saptanan çocuk; **Down sendromu** tanılı bebek ve gebeliğinde **kızamıkçık** geçiren annenin çocuğu yüksek riskli"
patofizyoloji: "Temel fizyoloji **şunt ve obstrüksiyondur**; fetal kestirmeler **foramen ovale** ve **duktus arteriosus**tur, doğumla **pulmoner direnç düşer** ve duktus term bebekte **24-48 saatte** kapanır; **Sol-sağ şunt** (VSD, ASD, PDA): oksijenlenmiş kan akciğerlere döner, **pulmoner akım artar** — kalp yetmezliği ve büyüme geriliği, **siyanoz yok**; **Sağ-sol şunt** (Fallot tetralojisi, d-transpozisyon, TAPVR): oksijensiz kan sistemik dolaşıma karışır, **siyanoz** belirleyicidir; **Sol kalp obstrüksiyonları** (koarktasyon, kritik aort darlığı): **duktus kapanınca** sistemik akım bozulur, bebek **şokla** başvurur; transpozisyonda yaşam **kan karışmasına** bağlıdır"
anahtar_bulgular:
- "**VSD en sık konjenital kalp hastalığı**: sol alt sternal bordürde **holosistolik üfürüm**; küçük defektler ilk yıl **kendiliğinden kapanır**, büyükler **kalp yetmezliği** yapar"
- "**ASD ostium secundum** en sık tip: **sabit bölünen ikinci ses**, sol ikinci aralıkta pulmoner akım üfürümü; bulgular erişkinlikte **aritmi** ve **pulmoner hipertansiyon**la çıkar"
- "**PDA**: sol üst sternal bordür ve klavikula altında **sürekli makine sesi**, **geniş nabız basıncı** ve **bounding nabızlar**; term bebekte erken kapanır, **preterm**de kapanmaz"
- "**Koarktasyon**: üst ekstremitede **hipertansiyon**, **femoral nabızlarda gecikme-zayıflık**, üst-alt ekstremite **sistolik basınç farkı**; büyük çocukta **rib notching** ve **figure 3** görünümü"
- "**Fallot tetralojisi** en sık **siyanotik** lezyon: **büyük VSD**, **sağ ventrikül çıkış darlığı**, **overriding aorta**, **sağ ventrikül hipertrofisi**; **hipersiyanozik atak** ve **çömelme davranışı**"
- "**d-transpozisyon**: doğumdan **saatler içinde şiddetli siyanoz**; grafide dar üst mediastenle **egg on a string** görünümü; kan karışması **duktus ve atriyal iletişime** bağımlı"
- "**TAPVR**: pulmoner venlerin **sol atriyuma bağlanmaması**; obstrükte tipte **küçük kalp gölgesi**, şiddetli **pulmoner ödem** ve oksijene dirençli siyanoz; suprakardiyak tipte **kar adamı** görünümü"
- "**Down sendromunda** en sık lezyon **AV kanal (endokardiyal yastık) defekti**; **konjenital kızamıkçık** sendromunda klasik bulgular **PDA** ve **dal pulmoner arter darlığı**"
patognomonik: "Tam patognomonik değil; kategorik klasikler: **PDA** sürekli **makine sesi**, Fallot'ta **hipersiyanozik atak** ve **çömelme**, d-transpozisyonda **egg on a string**, koarktasyonda **üst-alt basınç farkı**"
ilk_tetkik: "Şüpheli her olguda **ekokardiyografi**; doğum sonrası **pulse oksimetre taraması** siyanotik lezyonları erken yakalar; **Şok** ya da şiddetli siyanozda **duktus bağımlılık** düşünülerek **prostaglandin** bekletilmeden başlanır"
kesin_tani: "**Ekokardiyografiyle anatomik tanı**: defektin yeri, şunt yönü, basınçlar ve **duktus durumu**; tanı **siyanotik-asiyanotik**, **şunt-obstrüksiyon** kategorileriyle konur. Nadir karmaşık olgularda **kalp kateterizasyonu** ve **BT anjiyografi** gerekebilir"
ilk_tedavi: "**Duktus bağımlı** lezyonlarda (d-transpozisyon, kritik koarktasyon, pulmoner atrezi, kesilmiş aort arku) **IV prostaglandin E1** ile duktus açık tutulur. Küçük **VSD** ve **ASD** çoğunlukla **kendiliğinden kapanır**, izlem yeterli; kalp yetmezliği yapan büyük **VSD**'de önce **kalp yetmezliği tedavisi**, sonra **cerrahi ya da kateterle kapatma**; **Ostium secundum ASD** **perkütan** kapatmaya uygundur; semptomatik **preterm PDA**'da **indometazin** ya da **ibuprofen**; **Koarktasyonda prostaglandinle** stabilizasyon sonrası **cerrahi**; **transpozisyonda septostomi** gerekebilir, kesin tedavi **arteriyel switch**"
klasik_komplikasyon: "Uzun sürmüş geniş **sol-sağ şunt**ta **pulmoner vasküler hastalık** ve **Eisenmenger sendromu**: şunt sağ-sola dönünce **siyanoz, polisitemi ve clubbing**; bu evrede **defekt kapatmak kontrendikedir**; **Enfektif endokardit**, **kalp yetmezliği**, büyüme-gelişme geriliği; siyanotik olgularda **eritrositoz**, **beyin absesi** ve **inme** riski"
ayirici:
- hastalik: down_sendromu
  ayirt_edici: Down sendromunda en sık lezyon AV kanal defektidir ve dismorfik bulgularla birlikte
    erken şiddetli kalp yetmezliği yapar; tüm Down bebeklerinde ilk haftalarda ekokardiyografi
    taraması yapılır
- hastalik: aort_stenozu
  ayirt_edici: Aort darlığı da sol kalp obstrüksiyonudur ama üst-alt ekstremite basınç farkı
    koarktasyondaki kadar belirgin değildir; biküspid aort, senkop ve efor göğüs ağrısı öne çıkar
- hastalik: pulmoner_hipertansiyon
  ayirt_edici: Geniş sol-sağ şuntların geç dönem sonucudur; Eisenmenger evresinde ikinci ses
    kuvvetlenir, siyanoz eklenir ve şunt kapatma artık yapılmaz
