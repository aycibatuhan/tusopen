ad: Wilms Tümörü
taksonomi:
- - ktbt
  - pediatri
  - ped_onkoloji
  - ped_onk_wilms
tipik_hasta: "**Üç-dört yaş** civarındaki, başka yönlerden sağlıklı görünen çocuk; banyo ya da rutin muayenede fark edilen **karın kitlesi**; **Tansiyon yüksekliği** ya da **idrarda kan** da tanıyı düşündürür; **Aniri**, **ürogenital anomaliler**, **makroglosi-omfalosel** ya da **hemihipertrofi** (vücut yarım asimetrisi) gibi **sendrom** özellikleri taşıyanlar öncelikle izlenir"
patofizyoloji: "Embriyonik böbrek dokusundan (**metanefrik blastema**) kaynaklanan **nefroblastom**; **WT1** tümör baskılayıcı gen kayıpları **sendromlu** olguların temelini oluşturur. Böbreği yerinden iten, **kapsülle çevrili**, hızla büyüyen kitle; **kapsül bütünlüğü bozulursa evre yükselir** — bu yüzden **cerrahi öncesi biyopsi yapılmaz**. Tümörün **renin** üretimi ve parankim basısı **hipertansiyon** yapar; **renal ven ve alt toplardamar**a uzanan **tümör pıhtısı** görülebilir"
anahtar_bulgular:
- "**Ağrısız, sert, düzgün yüzeyli karın kitlesi**; böbreğin yerinde kalması nedeniyle **orta hattı genellikle geçmez**"
- "**Hipertansiyon** (**renin aracılı**) — çocuklarda rutin **tansiyon ölçümü** tanıyı düşündürür"
- "**Mikro ya da makroskopik hematüri**; **karın ağrısı** ve **ateş**"
- "**Sendromlu olgular**: **aniri** (irisin yokluğu), **ürogenital anomaliler** ve gelişme geriliği (**Denys-Drash**, **WAGR**), **makroglosi-omfalosel-viseromegali** (**Beckwith-Wiedemann**)"
- "**Metastaz** (en sık **akciğer**): öksürük, nefes darlığı; **alt toplardamara** uzanan pıhtıda damar tıkanıklığı bulguları"
patognomonik: "Tipik bulgu (tam patognomonik değildir): **ağrısız, sert, düzgün yüzeyli ve orta hattı geçmeyen karın kitlesi**"
ilk_tetkik: "**Karın ultrasonografisi** (kitlenin **böbrekten kaynaklandığını** ve **renal ven-alt toplardamar** ilişkisini gösterir). Ardından **kontrastlı BT** ya da **MRG**; akciğer metastazı için **akciğer grafisi**"
kesin_tani: "**Radikal nefrektomi** materyalinin **histopatolojik incelemesi**; **cerrahi öncesi biyopsi yapılmaz** (**kapsül ihlali evreyi kötüleştirir**). Örneklemede **anaplazinin varlığı prognozu** belirler"
ilk_tedavi: "**Radikal nefrektomi** ve **lenf düğümü örneklemesi**. Evreye göre **adjuvan kemoterapi** (**aktinomisin D** ve **vinkristin** temelli rejimler); yüksek evrelerde **radyoterapi**; **İki taraflı tümörde** **böbrek koruyucu cerrahi** önceliklidir"
klasik_komplikasyon: "**Kapsül ya da tümör rüptürü**yle **evre atlaması** (preoperatif biyopsi ve **aşırı palpasyon** sakıncalı); **Akciğer** ve **karaciğer** metastazı; **renal ven-alt toplardamar** tümör pıhtısı; **İki taraflı** ya da **sendromlu** olgularda **kronik böbrek yetmezliği** riski"
