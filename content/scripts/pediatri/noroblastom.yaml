tipik_hasta: "**İki yaşından küçük** (tepe **bir-iki yaş**) bebek ve çocuk; annenin banyo/giydirme sırasında fark ettiği **karın kitlesi**, iştahsızlık ve kilo kaybı; **Göz çevresinde morluklar**, tek taraflı **göz küresi çıkması** veya göz kapağı düşüklüğü, **istemsiz göz-uzuv hareketleri**, açıklanamayan **ishal** (hormon salgısı) başka başvuru biçimleri"
patofizyoloji: "**Sempatik sinir sisteminin nöroblastlarından** (nöral krest kaynaklı) gelişen **embriyonel tümör**; en sık **böbreküstü bezinde**, sonra **paravertebral sempatik zincir** boyunca. Tümör **katekolamin** üretir; metabolitleri (**vanililmandelik asit**, **homovanilik asit**) **idrara** çıkar; **Kemik, kemik iliği, karaciğer, lenf düğümü ve cilt**e geniş çaplı **metastaz** eğilimi; **MYCN amplifikasyonu** ve **kromozom 1p kaybı** yüksek risk işareti; bebeklerde uzak metastazla bile **kendiliğinden gerileyen özel örüntü (evre 4S)**"
anahtar_bulgular:
- "Karnın ortasında ya da yanında **sert, düzensiz, orta hattı aşabilen kitle**; sıklıkla **karaciğer büyümesi** eşlik eder"
- "İdrarda **katekolamin metabolitleri** (**vanililmandelik asit**, **homovanilik asit**) artışı; kanda **laktat dehidrojenaz** ve **nöron özgül enolaz** yüksekliği"
- "**Orbita metastazı**: iki göz çevresinde morluklar (**rakun göz**) ve **göz küresinin öne çıkması**"
- "Boyun-üst göğüs tutulumunda **Horner sendromu**: göz kapağı düşüklüğü, göz bebeği küçüklüğü, yüzde **terlemesizlik**"
- "**Paraneoplastik opsoklonus-miyoklonus-ataksi**: gözlerin ve uzuvların istemsiz, hızlı, ritimsiz hareketleri; çocuk **dengesini yitirir**"
- "Bebeklerde ciltte **mavi-mor nodüller** (metastaz); bazı tümörlerde **vazoaktif bağırsak peptidi** salgısına bağlı uzun süren **ishal**"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **idrarda katekolamin metabolitlerinin** (**vanililmandelik asit**, **homovanilik asit**) artışı"
ilk_tetkik: "İdrarda **vanililmandelik asit** ve **homovanilik asit** ölçümü; **Karın ultrasonografisi** ve **bilgisayarlı tomografi**: dokulu, içinde **kalsifikasyon** görülen tümör. Metastaz araştırmasında **MIBG sintigrafi** ve **kemik iliği aspirasyonu**"
kesin_tani: "**Tümör dokusunun biyopsisi** (histopatoloji, **MYCN amplifikasyonu**, kromozom incelemeleri). İdrar **katekolamin metabolitlerinin** yüksekliği tümörün **sempatik nöral kaynaklı** olduğunu gösterir"
ilk_tedavi: "**Risk grubuna göre**: düşük riskli ve **evre 4S** bebeklerde **gözlem ve bekleyiş** (**kendiliğinden gerileme** beklentisi); **Yüksek riskte** önce **kemoterapi**, sonra **cerrahi rezeksiyon**, ardından **yüksek doz kemoterapi ve kök hücre desteği**, **radyoterapi** ve **diferansiasyon tedavisi (retinoik asit)**"
klasik_komplikasyon: "Uzak **metastaz**larla ilerleyen tablo: **kemik iliği yetmezliği**, karaciğerin hızla büyümesi, **kemik ağrıları**; **Paraneoplastik sendromlar** (opsoklonus-miyoklonus, kronik ishal); yüksek risk olgularda **relaps**; yoğun tedavinin **uzun dönem toksisitesi**"
