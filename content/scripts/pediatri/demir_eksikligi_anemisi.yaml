tipik_hasta: "**6-24 aylık** hızlı büyüme dönemindeki bebek; **günde 500-700 mililitreyi aşan inek sütü** ve ek besinlere geç başlama öyküsü. Adölesan kızda yoğun mens kanaması; **erken doğum** ve düşük doğum ağırlığı depoların azlığıyla riski artırır"
patofizyoloji: "Doğumda geçen demir **4-6 aya** dek yeterlidir; dışarıdan demir alımı yetersiz kalınca depolar tükenir; **İnek sütü** hem az demir içerir hem bağırsakta **mikrokanamaya** yol açar; depolar boşalınca önce **ferritin**, ardından **hemoglobin** düşer. Demir **hemoglobin**, miyoglobin ve mitokondriyal enzimler için zorunludur; eksikliği oksijen taşınmasını ve **beyin gelişimini** bozar"
anahtar_bulgular:
- "**Mikrositik hipokromik anemi**: Hb düşük, **MCV** yaşa göre düşük, **RDW** artmış; solukluk, hızlı yorulma, efor intoleransı"
- "**Serum ferritin düşük** (depoların en spesifik aynası); **transferrin satürasyonu düşük**, **TIBC yüksek**; yaymada anizositoz ve hipokromi"
- "**İnek sütü yükü**: günde **500-700 mililitrenin üzerinde** inek sütü ya da **6 aydan önce** inek sütüne geçme öyküsü"
- "**Pika**: toprak, kağıt gibi yabancı maddelere yönelme; huzursuzluk, uyku düzensizliği, dikkat dağınıklığı"
- "Erken çocuklukta **bilişsel-motor gelişim yavaşlığı**; ağır olgularda **koilonyakiya** (kaşık tırnak)"
patognomonik: null
ilk_tetkik: "Tam kan sayımı ve retikülosit; **serum ferritin**, **TIBC** ve **transferrin satürasyonu**, periferik yayma; **diyet öyküsü** ve adölesan kızda mens öyküsü"
kesin_tani: "**Mikrositik hipokromik anemi** artı **düşük ferritin** artı uyumlu diyet-klinik öykü; **oral demir denemesinde** **1-2 hafta** içinde retikülosit artışı ve Hb yükselmesi tanıyı kesinleştirir"
ilk_tedavi: "**Oral elemental demir 3-6 mg/kg/gün**; aç karnına ve **C vitaminli** içecekle emilim artırılır. İnek sütü günlük **500 mililitrenin altına** indirilir, demirden zengin ek besinler verilir. Yanıt: retikülosit **7-10 günde**, Hb **yaklaşık 1 ayda** normalleşir; depolar için normalleşmeden sonra **2-3 ay** daha devam (toplam yaklaşık 3 ay)"
klasik_komplikasyon: "Erken başlayan uzun süren eksiklikte **bilişsel-motor gelişim yavaşlığının kalıcı kalması**; **pikaya bağlı kurşun zehirlenmesi** riski, ağır anemide **kalp yetersizliği**"
