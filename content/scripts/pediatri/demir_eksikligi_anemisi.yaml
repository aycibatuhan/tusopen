id: demir_eksikligi_anemisi
version: 1
status: draft
author: ai-drafts/pediatri-3
sources:
- 'AAP klinik raporu: bebeklerde ve çocuklarda demir eksikliği ve demir desteği — referans olarak listelendi,
  metin projesi özgün yazımdır'
- Nelson Textbook of Pediatrics (demir eksikliği anemisi bölümü)
ad: Demir Eksikliği Anemisi
