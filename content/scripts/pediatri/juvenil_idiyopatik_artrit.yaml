tipik_hasta: "**16 yaşın altında**, en az **6 haftadır** süren artrit: eklemde şişlik, ağrılı hareket kısıtlılığı ya da sabah tutukluğu. Kızlarda **oligoartiküler tip** (**ANA** pozitif, kronik üveit riski), erkeklerde **entezitle ilişkili tip** öne çıkar; **sistemik tip** kuyruklu ateş ve döküntüyle acile başvurur"
patofizyoloji: "Genetik yatkınlık ve çevresel tetikleyicilerin (enfeksiyon, bağırsak mikrobiyotası) birlikte çalıştığı **inflamatuvar eklem hastalığı**. Sinovyada **makrofaj ve T hücre** ağırlıklı infiltrasyon, **IL-6** ve **TNF alfa** bolluğu kıkırdak-kemik hasarı yapar; **sistemik tipte** (eski adı **Still**) **IL-1 ve IL-6** ağırlıklı **otoinflamatuvar** tablo ön plandadır"
anahtar_bulgular:
- "Tanı çekirdeği: **16 yaş altında** artritin **6 haftadan uzun** sürmesi ve artriti açıklayan başka hastalığın bulunamaması"
- "**Oligoartiküler tip**: **4 eklemi geçmeyen** tutulum, büyük eklemleri (diz, ayak bileği) tutar; **ANA** pozitif, **RF** negatif. En önemli sakat bırakan risk **kronik anteriyor üveit** — sessildir, yalnızca aralıklı oftalmoloji muayenesinde yakalanır"
- "**Sistemik tip**: günlük dalga biçimli **2 haftadan uzun kuyruklu ateş**; ateş dalgalarıyla gelen **soluk somon renkli, geçici döküntü**. Lenfadenopati, hepatosplenomegali, serozit eşlik eder; **ANA ve RF negatif**"
- "**Poliartiküler tip**: **5 eklem ve üzeri**; **RF negatif** alt tip okul çağı kızlarında diz ve el bileklerini tutar; **RF pozitif** alt tip **erişkin romatoid artritini** andırır (erozif seyir)"
- "**Entezite ilişkili tip**: alt ekstremitede **asimetrik artrit**, topuk ve **entezis ağrısı**, **HLA-B27** pozitifliği; erkek çocuklarda öne çıkar, ergenlikte **sakroiliit** gelişebilir"
- "**Sabah sertliği**, eklem kontraktürü, uzuv kullanımından kaçınma; kıkırdak büyüme bölgesi tutulumuyla uzuvlarda **uzunluk farkı**"
patognomonik: null
ilk_tetkik: "**ESR** ve **CRP**, tam kan sayımı (sistemik tipin **anemi** ve **lökositoz**unu değerlendirmek için), **RF** ve **anti-CCP**, **ANA**, **HLA-B27**. Eklem **ultrasonografisi** ya da **MR** ile sinovit kanıtı; yeni tanılı her hastaya **slit-lamp** ile üveit taraması"
kesin_tani: "**ILAR kriterleri**: **16 yaş altında** etiyoloji belirsiz artritin **6 haftadan uzun** sürmesi; enfeksiyon, malignite, başka romatolojik hastalıklar dışlanır. Alt tip, ilk **6 ay**daki eklem sayısına ve eşlik eden bulgulara göre adlandırılır"
ilk_tedavi: "**NSAID** (**ibuprofen**, **naproksen**) semptom kontrolünde ilk adım; dirençli tek eklemde **eklem içi glukokortikoid**. Hastalık değiştirici olarak **methotrexat** (poliartiküler ve genişleyen oligoartiküler); dirençli olgularda **biyolojik ajanlar** (**TNF alfa blokajı**); **Sistemik tipte IL-1 ve IL-6 hedefli tedavi**; kronik üveit için düzenli **oftalmoloji kontrolü**"
klasik_komplikasyon: "**Kronik anteriyor üveit** (oligoartiküler tipin sessil görme kaybı nedeni); **sistemik tipte makrofaj aktivasyon sendromu**. Uzun süren inflamasyonda eklem **kontraktürü**, **büyüme bozukluğu** ve erken kıkırdak yıpranması"
