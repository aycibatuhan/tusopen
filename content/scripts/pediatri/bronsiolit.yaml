sources:
- Amerikan Pediatri Akademisi (AAP) bronşiolit tanı ve tedavi kılavuzu — referans olarak listelendi, metin
  özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Bronşiolit
taksonomi:
- - ktbt
  - pediatri
  - ped_gogus
  - ped_gog_bronsiolit
tipik_hasta: "**2 yaşından küçük**, çoğunlukla **2-6 aylık** bebek; kışın büyük kardeşten/kreşten kapılan nezleyi izleyen **öksürük, hırıltı** ve beslenme güçlüğü; ağır gidiş için risk faktörleri **prematüritelik**, **bronkopulmoner displazi**, hemodinamik anlamlı kalp hastalığı ve immün yetmezlik; evde sigara dumanı ve kalabalık hane de riski artırır"
patofizyoloji: "En sık etken **RSV**'dir; **rinovirüs**, **insan metapnömovirüsü** ve **parainfluenza** benzer tablo yapar. Virüs bronşiyol epitelinde **nekroz ve ödem**, peribronşiyal lenfositer infiltrasyon ve **mukus tıkaçları** yapar, daralan havayollarla **hava tutulumu** ve atelektazi gelişir. Önemli nokta: temel mekanizma **bronkospazm değil, ödem ve sekresyondur** — klasik bronkodilatörler fayda vermez"
anahtar_bulgular:
- "Önce nezle; ardından **3-5 gün** içinde artan öksürük, hırıltı ve solunum sayısının yükselmesi"
- "Muayenede iki hemitoraksta difüz **ekspiratuar hırıltı** ve ince raller; **subkostal-interkostal çekilmeler**, burun kanadı solunumu"
- "**Ateş düşük düzeyde veya yok**, genel durum çoğu kez iyi; emzirirken yorulma"
- "**2 aylıktan küçük** bebekte açıklanamayan **apne atakları** — hastane takibi gerektiren alarm"
patognomonik: null
ilk_tetkik: "Tanı **klinik** konur; rutin graf, kan tetkiki veya viral PCR önerilmez; **Pulse oksimetri** esastır; ağır görünüm, atipik gidiş veya komplikasyon şüphesinde **göğüs grafisi**"
kesin_tani: "**Klinik tanı**: **2 yaş altında** üst solunum yolu semptomlarını izleyen **ilk hırıltı atağı**, muayenede difüz hırıltı ve ince raller. Yüksek ateş, toksik görünüm veya lokalize bulgular **bakteriyel pnömoni** olasılığını araştırır; ailede astım öyküsü ve tekrarlayan ataklar astımı düşündürür"
ilk_tedavi: "Destek tedavi esastır: hipoksemide **oksijen** (**SpO2 hedefi yüzde 90'ın üzeri**), beslenemeyen bebekte **nazogastrik** veya damar yoluyla hidrasyon, nazal sekresyonların aspirasyonu; **rutin bronkodilatör, sistemik steroid ve antibiyotik kanıtlanmamıştır**, ağır solunum güçlüğünde **yüksek akımlı oksijen** veya **CPAP**. Yatış kararı oksijen ihtiyacına ve beslenmeye göre, yüksek riskli bebeklerde RSV sezonu öncesi **palivizumab** proflaksisi"
klasik_komplikasyon: "Küçük bebeklerde **apne**; sekonder **bakteriyel pnömoni** (nadir). İyileşen bebeklerde virüsle ilişkili **tekrarlayan hırıltı** dönemi"
