- - ktbt
  - pediatri
  - ped_gogus
  - ped_gog_pnomoni
tipik_hasta: "**Ateş, öksürük ve artmış solunum sayısı**yla gelen çocuk; etken büyük ölçüde **yaşa** göre belirlenir; **Yenidoğan ve ilk aylarda** **grup B streptokok** ve **E. coli**; **1-3 ay** arası bebekte **Chlamydia trachomatis**; **Okul öncesi**nde virüsler ve **Streptococcus pneumoniae**; **okul çağı**nda **Mycoplasma pneumoniae** öne çıkar; **Prematüritelik**, **malnütrisyon**, **pasif sigara**, **aşı eksikliği** (**pnömokok**, **influenza**, **Hib**) riski artırır"
patofizyoloji: "Üst solunum yolu savunmalarının aşılmasıyla etken alt solunum yoluna iner, **parankimin yangısal yanıtını** başlatır; **Bakteriyel** etkenler (özellikle **S. pneumoniae**) **lobar veya segmenter konsolidasyon**; **viral** etkenler **perihilar interstisyel infiltrasyon** ve **hiperinflasyon**; **M. pneumoniae** diffüz interstisyel-lobüler patern; **İnfluenza**dan sonra üst solunum yolu florasından gelen **S. aureus** pnömonisi hızla yıkıcı gidişe (**nekroz**, **apse**, **plöral efüzyon**) yol açar"
anahtar_bulgular:
- "Üçlü: **ateş**, **takipne** ve solunumda **çekilmeler** (interkostal, subkostal retraksiyonlar)"
- "**Takipne eşiği (DSÖ)**: **2-12 ay**da solunum sayısı **50/dk üzeri**, **1-5 yaş**ta **40/dk üzeri**; solunum sayısı **ateş dindikten sonra** sayılmalı"
- "Grafide **lobar veya segmenter konsolidasyon** **bakteriyel**; **perihilar interstisyel infiltrasyon** ve **hiperinflasyon** **viral** etkeni düşündürür"
- "**Lokalize raller** veya bir hemitoraksta **azalmış solunum sesi**; **plöral efüzyon**da söndürme"
- "Okul çağında yavaş gelişen **inatçı öksürük**, düşük düzeyli ateş, **evde benzer öksürüklü kişiler** — **M. pneumoniae**"
- "**1-3 aylık** bebekte **stakkato öksürük**, **konjonktivit** öyküsü, ateşin azlığı — **Chlamydia trachomatis**"
patognomonik: null
ilk_tetkik: "**Klinik değerlendirme** ve **göğüs grafisi** (postero-anterior ve yan); **pulse oksimetri**. Yatan veya ağır hastada **beyaz küre**, **CRP** ve **antibiyotik öncesi kan kültürü**"
kesin_tani: "**Klinik bulgular**la grafide **konsolidasyon** veya **plöral efüzyon** saptanması tanıyı kesinleştirir; etken çoğu olguda **ampirik** kalır. Ağır olguda **kan kültürü**; **ampiyem** şüphesinde **plöral sıvı analizi**; nazal sürüntüyle **viral PCR**; **M. pneumoniae** şüphesinde **seroloji veya PCR**"
ilk_tedavi: "Ampirik antibiyotik yaşa ve şiddete göre: ayaktan okul öncesi çocukta **oral amoksisilin** ilk seçenek (**S. pneumoniae** hedeflenir); **Okul çağı**nda veya atipik görünümlü tabloda **azitromisin** gibi **makrolidler**; yatan hastada IV **ampisilin** veya **ikinci-üçüncü kuşak sefalosporin**. Hipoksemide **oksijen**, yeterli **hidrasyon**, ağrı-ateş kontrolü; **Parapnömonik efüzyon** veya **ampiyem**de **torasentez** ve **göğüs tüpü drenajı**; influenzayı izleyen yıkıcı tabloda **antistafilokokal tedavi** eklenir"
klasik_komplikasyon: "**Parapnömonik efüzyon** ve **ampiyem** (**S. pneumoniae**'nin klasik komplikasyonu); **nekrotizan pnömoni** ve **akciğer apsesi** (**S. aureus**); **Sepsis**; tekrarlayan veya ağır pnömonilerde **bronşiektazi** gelişimi"
