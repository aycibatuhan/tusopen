tipik_hasta: "Bebeklikten başlayıp çocuklukta süren **tekrarlayan akciğer enfeksiyonları** ve geçmeyen öksürüğe **yetersiz kilo alımı**, yağlı-kokulu bol dışkı (**steatore**) eşlik eder. Yenidoğanda **mekonyum ileusu** veya uzun süren sarılık ilk ipucu; kardeşte benzer tablo, erkek hastada **infertilite** anımsatmalı. Kuzey Avrupalı kökenli toplumlarda en sık **otozomal resesif** hastalık"
patofizyoloji: "**CFTR** genindeki mutasyon (en sık **delta-F508**) **klor kanalını** bozar; **otozomal resesif** geçer. Ter bezi kanalında klor-sodyum geri emilemez — **ter tuzludur**, tanısal testin temeli. Havayolu yüzey sıvısı dehidrate olur, **silyar klirens** bozulur; önce **Staphylococcus aureus**, sonra **Pseudomonas aeruginosa** kronik kolonizasyon. Pankreas kanalları **mukus tıkaçlarıyla** tıkanınca **ekzokrin yetmezlik**: steatore, malnutrisyon ve **yağda eriyen vitamin** eksikliği"
anahtar_bulgular:
- "Tekrarlayan pnömoni atakları ve geçmeyen **produktif öksürük**; **Pseudomonas** kolonizasyonu"
- "Yetersiz kilo alımı, boy kısalığına rağmen iştahın iyi olması; **steatore** (pankreas yetersizliği)"
- "**Mekonyum ileusu** veya uzun süren **yenidoğan sarılığı** öyküsü"
- "**Ter testinde 60 mmol/L ve üzerinde klorür**"
- "Parmak uçlarında **saat camı / digital hipokratik parmak**, kronik hava akımı obstrüksiyonu"
- "Erkek hastada **obstrüktif azoospermi**ye bağlı infertilite"
patognomonik: null
ilk_tetkik: "**Ter klorür testi** (pilokarpin iyonoforezi); **Yenidoğan taramasında immünoreaktif tripsinojen (IRT)** yüksekliği ilk işarettir, ter testini yönlendirir"
kesin_tani: "**İki ayrı örnekte ter klorürünün 60 mmol/L üzerinde** çıkması, klinik bulgular ve/veya aile öyküsüyle birleşince tanıdır. Alternatif: **iki bilinen CFTR mutasyonunun** genetik testle gösterilmesi; **Ekzokrin pankreas yetmezliği** dışkıdaki **elastaz** düşüklüğüyle belgelenir"
ilk_tedavi: "Havayolu klirensi: **göğüs fizyoterapisi**, mukolitik **dornaz alfa**, **hipertonik tuzlu sulu solüsyon** inhalasyonu; **Hedefli antibiyotikler** (Pseudomonas'a **inhaler tobramisin** gibi); **pankreas enzim replasmanı**, yüksek kalorili diyet ve **yağda eriyen vitamin (A-D-E-K)** desteği; **CFTR mutasyonuna uygun** hastalarda **modülatörler** (**ivacaftor**, **tezacaftor/ivacaftor**, **elexacaftor/tezacaftor/ivacaftor**) gidişi değiştirir"
klasik_komplikasyon: "**Bronşiektazi**, **hemoptizi** ve **pnömotoraks**; malnutrisyon; **CF ile ilişkili diyabet**; **Fokal biliyer siroz**; **distal intestinal obstrüksiyon sendromu**; erkeklerde **infertilite**"
