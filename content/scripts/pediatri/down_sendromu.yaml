id: down_sendromu
version: 1
status: draft
author: ai-drafts/pediatri-3
sources:
- 'AAP sağlık bakım raporu: Down sendromlu çocuklar için sağlık gözetimi (Health Supervision for Children
  With Down Syndrome) — referans olarak listelendi, metin projesi özgün yazımdır'
- Nelson Textbook of Pediatrics (Down sendromu bölümü)
ad: Down Sendromu
taksonomi:
- - ktbt
  - pediatri
  - ped_genetik
  - ped_gen_down
tipik_hasta: "Doğumda **hipotonik**, **kupuzon kafalı**, **makroglosili** ve yassı yüz profilli bebek; **ileri maternal yaş** (**35 ve üzeri**) riski artırır. Prenatal taramada artmış **ense saydamlığı** ve anormal üçlü tarama (düşük **AFP** ve **estriol**, yüksek **hCG**) ile önceden bilinebilir"
patofizyoloji: "**21. kromozomun** tam ya da kısmi fazlalığı: en sık mayoz sırasında **nondisjunksiyon**; **Robertsonian translokasyonu** (**14;21** ya da **21;21**) ailesel olabilir ve **tekrar riski** taşır, **mozaik form** daha hafif seyreder. Fazla gen dozları organ gelişimini etkiler: **kalp (AV kanal defekti)**, **GİS (duodenal obstrüksiyon)**, beyin gelişimi ve hematopoez (**geçici miyeloproliferatif bozukluk**)"
anahtar_bulgular:
- "Yüz: kupuzon kafatası-brakisefali, **epikantik kıvrım**, palpebral çatlağın dışa-yukarı eğimi, yassı yüz profili, **makroglosi**, düşük yerleşimli küçük kulak; iriste **Brusfield lekeleri**"
- "Ekstremite: **hipotoni** ve gevşek ligamentler, **tek palmar krease**, 5. parmakta **klinoaktililik**, **sandal gap** (sandal biçimli ayak açıklığı), kısa boyun"
- "Doğuştan kalp hastalığı: **AV kanal defekti** (endokardiyal yastık) en sık, sonra **VSD**; yeni tanılı her bebeğe **ekokardiyografi**"
- "**Duodenal atrezi** (grafide **çift kabarcık** görüntüsü), **Hirschsprung** hastalığı; kronik kabızlık sıklığı"
- "Yenidoğanda **geçici miyeloproliferatif bozukluk** (trombositopeni ve blastlar, kendiliğinden geriler); çocuklukta **akut megakaryoblastik lösemi (AML M7)** ve **ALL** riski"
- "Doğuştan ya da edinsel **hipotiroidi**; **atlantoaksiyel instabilite** (spor öncesi değerlendirme); **otitis media** ile iletken tip işitme kaybı; hafif-orta **zeka geriliği**"
patognomonik: "Kromozom analizinde **trizomi 21**: **47 kromozomlu karyotip** (+21); translokasyon ve mozaik formlar da **karyotiple** kesinleştirilir"
ilk_tetkik: "**Kromozom analizi** (karyotip, translokasyon şüphesinde **ebeveyne de** karyotip); doğumda **ekokardiyografi**, **tiroid fonksiyon testleri**, **işitme taraması** ve göz değerlendirmesi"
kesin_tani: "Kromozom analizinde **trizomi 21**, **Robertsonian translokasyonu** ya da **mozaik formunun** gösterilmesi; kesin tanı **karyotiptir**, klinik bulgular yalnızca şüphe oluşturur"
ilk_tedavi: "Hastalığın kendisine **tedavi yok**; yönetim: kalp defektinin **cerrahi onarımı**, hipotiroidide **levotiroksin**, işitme-görme takipleri; **erken gelişimsel uyaran programı**, atlantoaksiyel instabilite için **spor öncesi görüntüleme**, aileye **genetik danışmanlık**"
klasik_komplikasyon: "**AV kanal defekti** ve majör doğumsal kalp hastalığı; **akut megakaryoblastik lösemi**; **atlantoaksiyel instabilite**, erken başlayan **Alzheimer demansı**, tekrarlayan **otitis media** ile işitme kaybı"
