id: ocuk_zehirlenmeleri
version: 1
status: draft
author: ai-drafts/pediatri-4
sources:
- Amerikan Zehir Kontrol Merkezleri (AAPCC) ve klinik toksikoloji topluluklarının yönetim ilkeleri — referans
  olarak listelendi, metin özgün yazımdır
- Nelson Pediatri Ders Kitabı
ad: Çocukluk Çağı Zehirlenmeleri
taksonomi:
- - ktbt
  - pediatri
  - ped_acil_yogun_bakim
  - ped_acil_zehirlenmeler
tipik_hasta: "**Bir-dört yaş arasındaki** (ağızla keşif dönemi) çocuğun evdeki ilaç, temizlik maddesi veya bitkiyi farkında olmadan yutması; çoğu **tek madde**, izlenerek iyi gider; **Ergenlerde bilinçli alım** (intihar girişimi) öne çıkar, **parasetamol** en sık ciddi etkendir. Bilinç bozukluğuyla açıklanamayan biçimde gelen her çocukta **zehirlenme hipotezidir**; **anamnezdeki miktar çoğu kez güvenilmezdir**"
patofizyoloji: "Büyük bölüm **ağız yoluyladır**; bilinmeyen maddede **toksidrom yaklaşımı** tanıyı yönlendirir; **Parasetamol** karaciğerde **NAPQI**'ye dönüşür; **glutatyon** tükenince **merkezi lobüler hepatik nekroz**; ilk **24 saatte** iyi görünür, toksisite **gecikmeli** çıkar ve **antidot penceresini** kritik yapar; **Salisilat** solunum merkezini doğrudan uyararak **hiperpne ve solunumsal alkaloz** yapar, ardından **metabolik asidoz** eklenir; **Korozifler** yutuldukları düzeyde **özofagusta yanık** yapar; **hidrokarbon**un asıl tehlikesi **akciğere kaçmasıdır**"
anahtar_bulgular:
- "**Antikolinerjik toksidrom**: **kuru cilt-mukozalar**, **midriyazis**, **taşikardi**, **hipertermi**; **kolinerjik** (organofosfat): **miyozis**, **salya**, **bronkore**, karın krampları; **Sempatomimetik**: **midriyazis**, taşikardi, **terleme**; **opioid**: **miyozis**, **solunum baskılanması**, sedasyon; **sedatif-hipnotik**: sedasyon, **refleksler korunur**"
- "**Parasetamol**: ilk **24 saatte** belirti yok denecek kadar az; **24. saatte karaciğer enzimleri ve PT/INR** yükselmesi, sağ üst kadran ağrısı, bulantı-kusma"
- "**Salisilat**: derin hızlı solunum (**hiperpne**), **çınlama (tinnitus)**, kusma; **solunumsal alkaloz ve metabolik asidoz**un bir arada görüldüğü karışık asit-baz bozukluğu"
- "**Anamnez güvenilmezdir**: boş ambalaj, çocuk ağzında madde, kusmuş içerik araştırılır; miktar **'bilinmiyor'** kabul edilir"
- "Hikâyeyle uyuşmayan **bilinç bozukluğu** veya **nöbet**; **trisiklik antidepresan**da **EKG**'de **QRS genişlemesi** ve **aVR**'de **terminal R** yüksekliği"
patognomonik: null
ilk_tetkik: "**ABC** değerlendirmesi ve **kan şekeri**; **Parasetamol düzeyi alımdan 4 saat sonra** ölçülür, **Rumack-Matthew nomogramı**yla yorumlanır; **salisilat düzeyi**; **Asit-baz** ve elektrolitler; **kardiyak toksik etken** şüphesinde **EKG**; ciddi olguda **parasetamol düzeyi rutin** istenir"
kesin_tani: "**Parasetamol**de nomogramın **tedavi çizgisini aşan düzey**, **salisilat**ta semptomatik düzeyler (ağır olguda **50 mg/dL üstü**) tedavi kararı verir. Bilinmeyen maddede **toksidrom** ve **geniş toksikolojik tarama** yönlendirir; etken tanısı belirsizse tedavi **toksidroma ve antidotlarla** verilir"
ilk_tedavi: "Önce **ABC** ve **glukoz**; **aktif kömür** alımdan sonraki **ilk 1 saat** içinde en etkilidir, uzun emilimli veya **enterik kaplı** ilaçlarda geç de yararlı; **Aktif kömür kontrendikasyonları**: **korozif maddeler**, **hidrokarbonlar**, **havayolunun korunamadığı bilinç bozuklukları**; **gastrik lavaj** çok sınırlı; ergen **bilinçli alım**da **psikiyatrik değerlendirme**; **Spesifik antidotlar**: parasetamol **N-asetilsistein** (ideali **ilk 8 saatte** başlamak), opioid **nalokson**, demir **defiroksamin**; **Organofosfat** **atropin + pralidoksim**; **trisiklik antidepresan** **sodyum bikarbonat** (**QRS**'yi daraltır); **metanol-etilen glikol** **fomepizol**; **izoniazid** **piridoksin**"
klasik_komplikasyon: "Parasetamolda **gecikmeli fulminan karaciğer yetmezliği**; salisilatta şiddetli **metabolik asidoz**, **konvülsiyon** ve **beyin ödemi**; **Korozif**lerde **özofageal darlık** (geç dönem); **hidrokarbon**da **kimyasal pnömoni**; bilinçli alımlarda **tekrar riski**"
