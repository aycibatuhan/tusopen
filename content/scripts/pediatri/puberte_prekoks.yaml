tipik_hasta: "**Kızda 8 yaşından önce**, **erkekte 9 yaşından önce** ikincil cinsiyet karakterleri başlayan çocuk. Kızlarda en sık ilk bulgu **meme tomurcuğu**dur, olguların çoğu iyi huylu **merkezî-idiyopatik** pubertedir; erkekte patolojik neden oranı belirgin yüksek, ilk bulgu **testis büyümesi**. Hızlı artan **boy**, **kemik yaşının** takvim yaşından ilerlemiş olması ve kızda beklenmeyen **vajinal kanama** dikkat çeker"
patofizyoloji: "**Merkezî (GnRH bağımlı)** tip: hipotalamo-hipofizer aks normal düzeninde ama erken uyanır; **GnRH pulsatil salınımı** artar, **LH-FSH** sekresyonu ve gonadal steroid üretimi başlar. Kızlarda çoğu **idiyopatik**; erkekte ve çok küçük yaşta başlayan kızlarda **hipotalamik hamartom**, **hidrosefali**, beyin cerrahi-radyasyon öyküsü gibi **santral patoloji** aranmalıdır; **Periferik (GnRH bağımsız)** tip: hormon kaynağı gonadların, böbreküstünün veya **dışarıdan alınan hormonların** kendisidir; **McCune-Albright sendromu** (**café-au-lait** leke, **fibröz kemik displazisi**, fonksiyonel **ovarian kist** üçlüsü), **ovarian-testiküler tümörler**, **testotoksikoz** (**LH reseptör** mutasyonu), **konjenital adrenal hiperplazi** ve **ekzojen hormon**"
anahtar_bulgular:
- "Kızda **8 yaş öncesi** meme gelişimi veya pubik kıllanma; erkekte **9 yaş öncesi** **testis hacminin 4 mL**'ye ulaşması veya uzun çapının **2.5 cm**'yi aşması"
- "**Büyüme hızının** akranlardan belirgin fazla olması ve **kemik yaşının ilerlemiş** olması"
- "Kızda meme gelişiminden bağımsız veya erken **vajinal kanama** — **periferik kaynak** şüphesi uyarır"
- "**Erkekte dış görünüş pubertik** ama **testisler küçük** kalıyorsa kaynak testis dışıdır (**böbreküstü** veya **ekzojen androjen**)"
- "**Café-au-lait** leke, **kemik ağrısı** veya **ekstremite asimetrisi** — **McCune-Albright sendromu**"
- "Erkekte hızlı **boy uzaması** ve **kas kütlesi artışı**, pubik kıllanmanın erken başlaması"
patognomonik: null
ilk_tetkik: "**Sol el bilek grafisiyle kemik yaşı** (ilk ve en basit adım; ilerlemiş kemik yaşı **aktif puberte** lehinedir). Kan **LH**, **FSH**, kızda **östradiol**, erkekte **testosteron** ve **TSH**; boy ve **büyüme hızının** persantil ölçümü"
kesin_tani: "**GnRH stimülasyon testi** ayrımın anahtarıdır: **LH yanıtının belirgin yükselmesi (LH baskın yanıt)** **merkezî** puberteyi gösterir; baskın değilse **periferik** tip; **Merkezî** tanı konursa erkekte mutlaka, kızlarda **6 yaş altında** veya hızlı ilerleyen tablolarda **beyin MRG**; **Periferik** tipte kaynak araştırılır: **pelvik USG** (ovarian kist/tümör), **testis ultrasonu**, **böbreküstü görüntülemesi**; **konjenital adrenal hiperplazi** için **17-hidroksiprogesteron**; **testotoksikoz**da **LH-FSH baskılanmış**, **testosteron yüksek**"
ilk_tedavi: "**Merkezî (GnRH bağımlı)** pubertede **uzun etkili GnRH analogu** (**leuprorelin asetat**, üç aylık depo dahil) standart tedavidir. Hedef: puberte bulgularının gerilemesi, **büyüme hızı ve kemik yaşı**nın yavaşlaması — **büyüme potansiyelinin korunması**; **Periferik** tipte **nedene yönelik**: tümörlerin **cerrahi çıkarılması**; **testotoksikoz**da **aromataz inhibitörleri**; **konjenital adrenal hiperplazi**de **glukokortikoid**. Kemik yaşı büyük ölçüde kapandıysa **boyda kazanç sınırlıdır**; karar **büyüme potansiyeli**yle birlikte verilir"
klasik_komplikasyon: "Erken kapanan kemik yaşıyla **erişkin boy kaybı** (tedavisiz merkezî pubertede en önemli sonuç); **psikososyal zorlanma**; **McCune-Albright**ta ek **endokrin hiperfonksiyonlar** (**hipertiroidizm**, **Cushing** sendromu) ve **patolojik kemik kırıkları**"
