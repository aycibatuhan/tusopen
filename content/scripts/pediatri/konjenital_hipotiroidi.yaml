tipik_hasta: "Yenidoğan; klinik bulgular **sessiz ve nonspesifik** olduğu için tanı çoğu kez **yenidoğan taramasında** yakalanır; **Guatrsız** formlarda (**disjenezi/agenazi**) aile öyküsü yoktur; **guatrlı** formlarda (hormon sentez hataları) ailede tiroid hastalığı, **maternal anti-tiroid antikorları** veya ilaç kullanımı ipucu verir"
patofizyoloji: "**Tiroid hormonu** doğum sonrası **beyin miyelinizasyonu** ve nöronal gelişim için kritiktir; ilk aylardaki eksikliği **geri dönüşsüz zihinsel engel** bırakır. Olguların çoğunda bezin **gelişim kusuru** (agenazi veya **dil kökü çevresi gibi ektopik yerleşim**). Bir kısmı guatr yapan **hormon sentez hataları**, bir kısmı **maternal antikor veya ilaca bağlı geçici** formlar. Tiroid yetersizdir, **T4 düşer**, negatif geri bildirim kalktığı için **TSH yükselir** (primer tip)"
anahtar_bulgular:
- "Fizyolojik dönemi aşan, uzayan **yenidoğan sarılığı** (indirekt bilirubin)"
- "**Konstipasyon**, uykululuk, zayıf ve huzursuz emme"
- "**Yarım santimi aşan posterior fontanel**, **umbilikal herni**, **makroglosi**"
- "**Hipotoni**, kaba yüz görünümü, **boğuk (kalın) ağlama**, hipotermi ve **benekli (mottled) deri**"
- "**Guatr** (hormon sentez hatalarında)"
- "**Gecikmiş kemik yaşı** — diz grafisinde epifizlerin görülmemesi gebelik haftasının geride olduğunu gösterir"
patognomonik: null
ilk_tetkik: "**Yenidoğan taramasındaki topuk kanı testi** (kuru kan damlasında **TSH bazlı** tarama). Pozitif taramada serum **TSH** ve **serbest T4** ölçümü"
kesin_tani: "**Yüksek TSH** ile birlikte **düşük serbest T4** (primer hipotiroidi); etiyoloji için **tiroid ultrasonu** veya **sintigrafisi** (**ektopik doku** veya **agenazi**); **Merkezi (hipofizer/hipotalamik) hipotiroidide TSH düşük-normal** kalabileceğinden **TSH bazlı tarama bu formu kaçırabilir**; **Uzayan sarılık**, **hipoglisemi** veya **mikropenis**le gelen bebekte **düşük T4** ayrıca araştırılmalı"
ilk_tedavi: "Tanıdan hemen sonra — ideali **yaşamın ilk 2 haftası** içinde — **levotiroksin sodyum** başlanır. Term yenidoğanda **10-15 mikrogram/kg/gün** gibi yüksek başlangıç dozu; amaç **TSH**'yi normal aralığa indirip **serum T4**'ü üst yarıda tutmak. Tedavi **ömür boyudur**; **geçici form** şüphesinde **3 yaş sonrası** kesme denemesi"
klasik_komplikasyon: "**Tedavinin gecikmesi**: geri dönüşsüz **zihinsel engel** (kretenizm), **kısa boy** ve **spastisite**. Tedavi **ilk haftalarda** başlanırsa gelişim normal kalır"
