sources:
- T.C. Sağlık Bakanlığı Yenidoğan Tarama Programı yönergesi — referans olarak listelendi, metin özgün
  yazımdır
- Nelson Pediatri Ders Kitabı
ad: Konjenital Hipotiroidi
