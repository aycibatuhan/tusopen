tipik_hasta: "**5-15 yaş** arasında; **2-3 hafta önce** tedavi edilmemiş ya da fark edilmemiş **boğaz ağrısı** geçirmiş okul çağı çocuğu. Şimdi **göçebeci eklem ağrıları**, ateş, halsizlik ya da eforla nefes darlığı ve çarpıntıyla başvurur; kalabalık-yoksul yaşam koşullarında daha sık"
patofizyoloji: "**Grup A beta-hemolitik streptokok** (**Streptococcus pyogenes**) farenjitini izleyen **1-3 hafta** içinde antikorların **kalp dokusu, eklemler ve bazal ganglion** yapılarıyla **ortak epitop** paylaşması (**moleküler mimikri**). Histolojik karşılığı **Aschoff cisimciği** ve vaskülit; klinik karşılığı başlıca **mitral kapak**ta kapakçık inflamasyonu; **Deri enfeksiyonları (piyodermi) ARA'ya yol açmaz** — piyodermi sonrası **akut glomerülonefrit** gelişir; ARA yalnızca **GAS farenjiti** sonrası"
anahtar_bulgular:
- "**Göçebeci büyük eklem artriti**: diz, ayak bileği gibi büyük eklemleri sırayla, her eklemi **1-2 gün**de bırakan ağrılı şişlik; **NSAID**'lere (**aspirin**) hızlı yanıt, iz bırakmaz"
- "**Kardit**: yeni **mitral yetersizlik üfürümü**, **uzamış PR**, **perikardit**; çocukta egzersiz kapasitesinin düşmesi, ateşle açıklanamayacak **yüksek taşikardi**"
- "**Sydenham koresi**: istemsiz, amaçsız, hızlı hareketler ve **el yazısının bozulması**; boğaz enfeksiyonundan **haftalar-aylar** sonra, **duygusal labilite** eşlik eder"
- "**Erythema marginatum**: gövdede **ortası temiz, kenarı serpantin** biçimli, saatler içinde yer değiştiren **halka biçimli eritem**; ateşle birlikte"
- "**Subkütan nodüller**: **ekstansör yüzey**lerdeki kemik çıkıntıları üzerinde sağlam, ağrısız, deri altı kitleler; genellikle **ağır kardit**le birlikte"
- "**Streptokok kanıtı**: **ASO** ve **anti-DNaz B** titresinde artış ya da **boğaz kültürü**nde **Streptococcus pyogenes**; **ESR** ve **CRP** belirgin yüksek"
patognomonik: "Histolojide **Aschoff cisimciği**; klinikte tanı **Jones kriterleri** mantığıyla: **2 major** ya da **1 major + 2 minor** bulgunun **yakın streptokok enfeksiyonu kanıtı**yla aranması"
ilk_tetkik: "**ASO** ve **anti-DNaz B** titresi (**10-14 gün arayla çift örnek** titre artışı); **ESR**, **CRP**, **boğaz kültürü**; **EKG** ile **PR aralığı** ölçümü ve **ekokardiyografi** (kapak yetersizliği, perikard efüzyonu)"
kesin_tani: "**Jones 2015 kriterleri**: **2 major** ya da **1 major + 2 minor** bulgu artı **yakın streptokok enfeksiyonu kanıtı**. Daha önce **romatizmal ateş** geçirmiş hastada nüks için **daha esnek eşik** — **kore** ya da **indolent kardit** tek başına yeterli sayılabilir"
ilk_tedavi: "Kalan streptokokları temizlemek için **tek doz IM benzatin penisilin** ya da **10 gün oral penisilin** (allerjide **eritromisin**); **Artritte yüksek doz aspirin**; **kardit**te oral **prednizon**; **kore**de **karbamazepin** ya da **valproat**; **Sekonder profilaksi** **4 haftada bir benzatin penisilin**le başlanır"
klasik_komplikasyon: "**Mitral kapak**ta kalıcı skar ve **romatizmal kalp hastalığı** (**mitral yetersizlik**, geç dönemde **stenoz**, sonra **aort kapak** tutulumu); **Tekrarlayan ataklar** kapak hasarını **kümülatif** artırır; ileri yaşta **kapak cerrahisi** gerekebilir"
