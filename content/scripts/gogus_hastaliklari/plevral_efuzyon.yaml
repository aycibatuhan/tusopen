id: plevral_efuzyon
version: 1
status: draft
author: ai-drafts/gogus-2
sources:
- BTS (İngiliz Toraks Derneği) Plevral Hastalık Rehberi — referans adı olarak listelendi, metin projesi
  özgün yazımdır
- ATS/ERS/STS Plevral Efüzyon Mutabakat Bildirisi — referans adı olarak listelendi
ad: Plevral Efüzyon
taksonomi:
- - ktbt
  - gogus_hastaliklari
  - gog_plevra
  - gog_pl_efuzyon
tipik_hasta: "İki büyük uç tanıtılmıştır: **dekompanse kalp yetmezliği** hastasında **bilateral küçük
  efüzyonlar**; **malignite** (akciğer, meme, lenfoma) veya **tüberküloz** hastasında **tek taraflı
  büyük** efüzyon. **Eforla artan dispne** ve PA grafide **kostofrenik açının silinmesi** ile başvuran
  hasta her hekimin kapısından geçer"
patofizyoloji: "Plevral boşluktaki sıvının **üretimi ve geri emilimi** arasındaki dengenin bozulmasıdır;
  iki ana mekanizma ayrılır. **Hidrostatik-onkotik basınç** dengesinin bozulması (**kalp yetmezliği**,
  **siroz**, **nefrotik sendrom**, **hipotiroidi**) **transüdâ**; **plevral yüzeyin inflamasyonu veya
  hasarı** (pnömoni, malignite, tüberküloz, pankreatit, embolide infarkt; **üremik plörit** de
  eksüdâdır) **eksüdâ**ya yol açar. **Light kriterleri** bu ayrımı sıvı ve serum örneklerinin
  karşılaştırmasıyla yapar"
anahtar_bulgular:
- "**Eforla artan dispne** ve **plevral ağrı**; muayenede **solunum seslerinin azalması**, perküsyonda
  **matlık**, sıvı üst sınırında **egofoni**"
- "PA grafide **kostofrenik açı körlüğü**; **lateral dekübit** grafi serbest sıvıyı gösterir; **USG**
  sıvı miktarını ve septasyonu izleyen **en duyarlı** yöntemdir"
- "**Bilateral küçük** efüzyonlar **kalp yetmezliği**ni düşündürür; **mediyastenin karşı tarafa
  itildiği tek taraflı dev** efüzyon **malignite** işaretçisidir"
- "**Light kriterleri** (eksüdâ için **tek şart** yeterli): **efüzyon proteininin plazma proteinine
  oranı 0,5'i aşması**; **efüzyon LDH'sinin serum LDH'sine oranı 0,6'yı aşması**"
- "**Efüzyon LDH**'sinin **serum LDH üst sınırının üçte ikisini** aşması; üç ölçüttten biri yeterli"
- "**Kalp yetmezliği** efüzyonunda **NT-proBNP** yüksekliği; tanı koymayan eksüdâda **adenosin
  deaminaz** (tüberküloz), **amilaz** (pankreatit) ve **sitoloji** istenir"
patognomonik: null
ilk_tetkik: "**PA ve lateral akciğer grafi** ile **plevral USG** (sıvı miktarı, septasyon, torasentez
  rehberliği). Bilinen **kalp yetmezliği** dışındaki yeni efüzyonlarda **tanısal torasentez** yapılır"
kesin_tani: "**Torasentez sıvı analizi**: **protein**, **LDH**, hücre sayımı ve farklısalı, **gram
  boyama**, **kültür**, **sitoloji**; gerekirse **adenosin deaminaz** ve **amilaz**. Nedeni açıklanamayan
  **eksüdâ**da **BT** veya **torakoskopik plevral biyopsi** ile ilerlenir"
ilk_tedavi: "**Neden yönelimli** yaklaşım: **kalp yetmezliği** efüzyonu **diürez**le geriler, **rutin
  drenaj gerekmez**. Semptomatik **büyük efüzyonda torasentez**; tekrarlayan **malign efüzyonda plevral
  kateter** veya **plevrodez**. **Pankreatit** efüzyonu **destek tedavi**yle geriler"
klasik_komplikasyon: "**Malign efüzyon**un hızlı tekrarı ve **sekonder ampiyeme** dönüşü. **Dev
  efüzyon**un çok hızlı boşaltılmasında **reekspansiyon pulmoner ödemi**"
