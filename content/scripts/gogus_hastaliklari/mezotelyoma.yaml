id: mezotelyoma
version: 1
status: draft
author: ai-drafts/gogus-3
sources:
- 'Klinik rehberler: ERS/ESTS malign plevral mezotelyoma yönetim kılavuzu; NCCN mezotelyoma rehberi —
  referans olarak listelendi, metin projesi özgün yazımdır'
ad: Mezotelyoma
taksonomi:
- - ktbt
  - gogus_hastaliklari
  - gog_plevra
  - gog_pl_mezotelyoma
tipik_hasta: Yıllar önce (genellikle 20-40 yıl önce) asbestle temas etmiş (tersane, gemi sökümü, izolasyon,
  çimento, tesisat işi) 60 yaş üstü hasta — en sık erkek; tek taraflı künt göğüs ağrısı ve giderek artan
  nefes darlığıyla gelir
patofizyoloji: Asbest lifleri plevral mezotel hücresinde kronik iltihap ve DNA hasarı yaratır; uzun bir
  gizli dönemden sonra plevrayı tek taraflı olarak kuşatan, diffüz ve düğümlü kalınlaşma yapan malign
  proliferasyon gelişir. Asbest aynı zamanda benign plevral plaklar da yapar — plaklar kötü huylu değildir,
  mezotelyoma ise yayılım gösteren ölümcül tümördür
anahtar_bulgular:
- Tek taraflı, yaygın ve dairesel (göğüs duvarını saran) plevral kalınlaşma; eşlik eden plevral sıvı
- Künt, sürekli, gece uyku da bozan göğüs ağrısı — tümör göğüs duvarını işgal etmeye başlamıştır
- Radyografide toraks duvarını saran yoğun plevral zar; toraks çapının daralması, mediyastenin tutulan
  tarafa kilitlenmesi
- Plevral sıvı eksüdatif ve çoğu kez kanlı; sitoloji genellikle tanı koydurmaz
- 'İmmünohistokimya: kalretinin ve WT-1 pozitif; TTF-1 ve CEA negatif (akciğer adenokarsinomundan ayırımı
  böyle yapılır)'
- Hikayede asbest teması — mesleki öykü tanıyı ilk düşündüren kilit veridir
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — Asbest teması öyküsüyle gelen hastada tek taraflı, plevrayı kuşatan yaygın kalınlaşma
ilk_tetkik: Toraks BT (radyografi ilk tetkik olarak kalınlaşmayı gösterir, BT yayılımı belirler); ardından
  torakoskopik plevra biyopsisi
kesin_tani: Torakoskopik (VATS) plevra biyopsisinde malign mezotelyomanın histolojik gösterilmesi; immünohistokimya
  ile alt tipin (epiteloid, sarkomatöz, bifazik) belirlenmesi
ilk_tedavi: 'Multimodal yaklaşım: seçilmiş erken evre hastada cerrahi (plevrektomi/dekortikasyon); sisplatin-pemetreksed
  kemoterapisi veya immünoterapi; semptom kontrolü için plevral sıvının boşaltılması ve gerektiğinde pleurodez'
klasik_komplikasyon: Göğüs duvarı invazyonu, tekrarlayan plevral sıvı, sağlam akciğerin sıkışması; sarkomatöz
  alt tipte çok kötü prognoz
tus_gecmisi:
- tus-2019-sonbahar-ktbt-101
- tus-2020-sonbahar-ktbt-101
kart_uret:
  bilgi: true
  vaka: true
  celdirici: false
  ayirici: false
