id: idiopatik_pulmoner_fibrozis
version: 1
status: draft
author: ai-drafts/gogus
sources:
- ATS/ERS/JRS/ALAT idiopatik pulmoner fibrozis rehberi — referans adı olarak listelendi; metin projenin
  özgün yazımıdır
ad: İdiopatik Pulmoner Fibrozis
taksonomi:
- - ktbt
  - gogus_hastaliklari
  - gog_interstisyel
  - gog_int_ipf
tipik_hasta: "**Altmış yaş** çevresinde ve **erkek** cinsiyette sık; aylar-yıllar içinde ilerleyen **nefes
  darlığı** ve **inatçı kuru öksürük**le gelen, çoğunlukla **eski sigara içicisi** olan hasta.
  Dinlemede her iki akciğer **bazalinde Velcro tipi inspiratuvar krakman** duyulur, **parmaklarda
  çomaklaşma** saptanır"
patofizyoloji: "Bilinmeyen bir tetikleyiciyle zarar gören **alveoler epitelin anormal yara
  iyileşmesi**yle yanıtlaması; belirgin iltihap yerine **fibroblastik odaklar**ın çoğalması, **kolajen**
  birikimi ve **parankim arşitektürü**nün kalıcı yıkımı öne geçer. İlerleyen **fibrozis** gaz alışverişi
  yüzeyini daraltır, **difüzyon kapasitesi** düşer ve akciğer ileri aşamada **bal peteği** görünümüne
  dönüşür"
anahtar_bulgular:
- "Her iki akciğer **bazalinde Velcro tipi ince inspiratuvar krakman** ve **parmaklarda çomaklaşma**"
- "Aylar içinde ilerleyen **nefes darlığı** ve **inatçı kuru öksürük**; egzersizde **satürasyon düşüşü**"
- "**Yüksek çözünürlüklü BT**'de **subplevral ve bazal ağırlıklı retikülasyon** (ağ örgüsü), **çekme
  bronkiektazileri** ve **bal peteği (honeycomb)** görünümü"
- "Spirometride **kısıtlayıcı patern**: **zorlu vital kapasite**nin azalması; **difüzyon kapasitesi
  (DLCO)**'nun belirgin düşmesi"
- "Günler içinde kötüleşen **hipoksemi**yle gelen **akut alevlenme** atakları"
patognomonik: null
ilk_tetkik: "**Yüksek çözünürlüklü toraks bilgisayarlı tomografisi**; **spirometri**, **difüzyon
  kapasitesi** ile egzersiz **satürasyon** ölçümü. **Romatoid artrit** gibi **bağ dokusu
  hastalıkları**nın dışlanması için klinik tarama"
kesin_tani: "Uygun klinik tabloda **HRCT**'de **UIP paterni**nin (**subplevral bazal ağırlıklı
  retikülasyon**, **çekme bronkiektazisi**, **bal peteği**) görülmesi **biyopsi gerektirmeden** tanıyı
  taşır. Atipik görünümlerde **multidisipliner değerlendirme**; gerekirse **kriyobiyopsi** devreye girer"
ilk_tedavi: "**Antifibrotik ilaçlar** (**pirfenidon** ya da **nintedanib**) fonksiyon kaybının hızını
  yavaşlatır. **Pulmoner rehabilitasyon**, gerektiğinde **oksijen**, **grip ve pnömokok aşıları**, reflü
  kontrolü; erken dönemde **transplantasyon** değerlendirmesi. Hastalık iltihaba değil **fibroza**
  bağlı olduğundan **rutin steroid tedavisi beklenmez**"
klasik_komplikasyon: "**Akut alevlenme** (günler içinde derinleşen hipoksemi ve grafide yeni **buzlu
  cam** görüntüleri). **Pulmoner hipertansiyon** ve **sağ kalp yetmezliği**; **akciğer kanseri** riskinde
  artış"
