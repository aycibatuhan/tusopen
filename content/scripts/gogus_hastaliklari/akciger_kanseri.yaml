tipik_hasta: "**20-40 paket yıl** üstü sigara öyküsü olan **50 yaş üstü** hasta; **inatçı öksürük**,
  **hemoptizi** ve kilo kaybıyla başvurur. **Aynı bölgede tekrarlayan pnömoni** hikâyesi tanıyı
  anımsatır. Sigara içmeyen hastalarda özellikle **periferik adenokarsinom** ön plandadır"
patofizyoloji: "**Sigara karsinojenleri**ne uzun süre maruz kalmak bronş epitelyalında **mutasyon**
  biriktirir. Büyük patolojik dallanma ikili yapılır. **Küçük hücreli**: nöroendokrin kökenli, hızlı
  büyüyen, tanıda çoğunlukla metastazlı, **kemoterapiye** duyarlı ama kötü prognozlu. **Küçük hücreli
  dışı**: **adenokarsinom** en sık (periferik, sigara içmeyenlerde de), **skuamöz hücreli** (santral,
  kavitleşen, **hiperkalsemi** eğilimli), **büyük hücreli**. **Paraneoplastik sendromlar** öncü bulgu
  olabilir: küçük hücrelide **SIADH** ve **ACTH** sekresyonu, skuamöz hücrelilerde **parathormon benzeri
  peptit** ile hiperkalsemi"
anahtar_bulgular:
- "**Kilo kaybı**, **hemoptizi**, **inatçı öksürük** ve aynı bölgede **tekrarlayan pnömoni** hikâyesi"
- "Sol tarafta **rekurrens larengeal sinir** kompresyonuna bağlı kalıcı **ses kısıklığı**"
- "PA grafide **periferik, spikülo kenarlı, lobüle kitle**; rezektabiliteyi araştırmak için **BT**"
- "**Paraneoplastik sendromlar**: küçük hücrelide **SIADH** (hiponatremi) ve **Cushing**; skuamöz
  hücrelilerde **hiperkalsemi**; küçük hücrelilerde **Lambert-Eaton miyastenik sendrom**"
- "Üst sulkus (**Pankost**) tümöründe **omuz ve üst kola vuran ağrı**, **Horner sendromu**"
- "**Supraklavikular veya servikal lenfadenopati** — **ince iğne aspirasyonu**yla en kolay tanı"
patognomonik: null
ilk_tetkik: "**PA akciğer grafi** ve **göğüs BT** ile lezyon karakterizasyonu; santral lezyonlarda
  **sputum sitolojisi** yardımcıdır. Yüksek riskli asemptomatik bireylerde (ağır sigara içiciliği ve
  ileri yaş) **düşük doz BT** ile yıllık tarama **mortaliteyi azaltır**"
kesin_tani: "**Bronkoskopik biyopsi** (santral lezyon) veya **BT eşliğinde transtorasik iğne biyopsisi**
  (periferik lezyon) ile **histopatolojik** doğrulama. **Küçük hücreli ve küçük hücreli dışı ayrımı**
  tedaviyi belirlediği için mutlaka yapılmalıdır"
ilk_tedavi: "**Küçük hücreli dışı**, rezeke edilebilir evre: **lobektomi + lenf nodu diseksiyonu**,
  gerekirse **adjuvan kemoterapi** eklenir; lokal ileri evrede **eş zamanlı kemo-radyoterapi**. **Küçük
  hücreli**: sınırlı evrede **eş zamanlı kemoterapi ve göğüs radyoterapisi**, yaygın evrede **sistemik
  kemoterapi**; yanıt alınan hastada **profilaktik kraniyal radyoterapi**"
klasik_komplikasyon: "**Üst vena kava sendromu**, **malign plevral efüzyon**, **beyin ve sürrenal
  metastazlar**; küçük hücrelili hastada tanı anında çoğunlukla **yayılmış** olma"
