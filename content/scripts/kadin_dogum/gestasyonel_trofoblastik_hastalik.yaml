ad: Gestasyonel Trofoblastik Hastalık
taksonomi:
- - ktbt
  - kadin_dogum
  - kd_jinekolojik_onkoloji
  - kd_jo_gestasyonel_trofoblastik
tipik_hasta: "Gebeliğin **ilk trimesterinde vajinal kanama** ve **gebelik yaşına göre büyük uterus** ile başvuran genç kadın; uyarılar: **aşırı bulantı-kusma (hiperemezis)**, **20 haftadan önce preeklampsi** ve şaşırtıcı derecede **yüksek βhCG**"
patofizyoloji: "**Tam mol** boş yumurtanın döllenmesidir — kromozomlar tamamen **babasal kaynaklıdır** (en sık **46,XX**); fetal doku yoktur, villuslar geniş ödemli ve trofoblast **difüz hiperplastiktir**. **Kısmi mol triplodidir** (**69,XXX/69,XXY**); fetal doku bulunabilir, değişiklikler **fokaldir**. Hiperplastik trofoblast aşırı **hCG** salgılar: **hiperemezis**, erken preeklampsi, **hCG-TSH homolojisi** nedeniyle **hipertiroidi** ve overlerde **teka-lutein kistleri** açıklanır"
anahtar_bulgular:
- "Gebelik haftasına göre **aşırı yüksek serum βhCG**"
- "Ultrasonda **kar tanesi (snowstorm) paterni**: villus kistleriyle dolu uterus; tam molde **fetal doku yok**"
- "**Gebelik yaşına göre büyük uterus** ile vajinal kanama"
- "**Aşırı bulantı-kusma** ve **20 haftadan önce preeklampsi**"
- "Adneksiyal **teka-lutein kistler** ve **hCG'ye bağlı hipertiroidi** bulguları"
- "**Kısmi molde** fetal doku görülebilir; kromozom incelemesi **triploiditeyi** gösterir"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Kar tanesi paterni** ile **gebelik haftasına göre aşırı yüksek βhCG** kombinasyonu (tam mol için klasik ikili)"
ilk_tetkik: "**Transvajinal ultrason** ve **seri βhCG ölçümü**; **TSH** ile hCG aracılı hipertiroidi değerlendirmesi. Evakuasyon materyali mutlaka **histopatolojiye** gönderilir (tam ve kısmi mol ayrımı için zorunlu)"
kesin_tani: "**Evaküe materyalin histopatolojisi**: tam molde **fetal doku yok**, villuslarda yaygın ödem ve **difüz trofoblast proliferasyonu**. Kısmi molde fetal doku vardır, villus değişiklikleri **fokal**; kromozom analizi **triploiditeyi** gösterir"
ilk_tedavi: "**Uterusun vakumla evakuasyonu** (Rh uyumsuzluğa karşı **anti-D** gerekirse); üreme yaşantısı tamamlanmış ileri yaş hastada **histerektomi** seçeneği. Takip: **βhCG her 1-2 haftada bir**, **üç kez ardışık normal**in ardından aylık ölçümlerle **6 ay** sürdürülür; bu sürede **efektif kontrasepsiyon** şart. Takip eşikleri: **plateau** (**21 gün** boyunca dört ölçümde değişmeyen değerler) veya **yükselme** — **persistan/invaşiv mole** işaret eder. **Gestasyonel trofoblastik neoplazide FIGO/WHO risk skoru** tedaviyi belirler: düşük risklide (**skor 6 ve altı**) **tek ajanlı kemoterapi** — **metotreksat** veya **daktinomisin**"
klasik_komplikasyon: "**Persistan/invaşiv mol** ve **gestasyonel trofoblastik neoplazi** gelişimi; **koriyokarsinom** ve özellikle **akciğere** uzak metastaz; **hCG'ye bağlı hipertiroidide tiroit krizi**; sonraki gebeliklerde **mol tekrarı** riski"
