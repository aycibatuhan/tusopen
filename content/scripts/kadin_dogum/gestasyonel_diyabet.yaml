ad: Gestasyonel Diyabet
taksonomi:
- - ktbt
  - kadin_dogum
  - kd_gebelik_hastaliklari
  - kd_gh_gestasyonel_diyabet
tipik_hasta: "**24-28. hafta** arasında taramaya gelen gebelik; riski artıran özellikler **obezite**, **25 yaş ve üzeri** anne yaşı, birinci derece akrabada diyabet, önceki gebelikte **makrosomik** bebek veya **gestasyonel diyabet** öyküsü; **polihidramnios** ve tekrarlayan düşükler. Çoğu hastada belirgin şikayet yoktur"
patofizyoloji: "**Plasental hormonlar** (insan plasental laktojeni, progesteron, kortizol, prolaktin) gebelik ilerledikçe **insülin direncini** artırır; **beta hücre rezervi** karşılayamazsa hiperglisemi gelişir. Anneden geçen fazla glukoz **fetal hiperinsülinizm** yapar; **makrosomi**, viseral yağlanma ve **postpartum hipoglisemi** temeli budur"
anahtar_bulgular:
- "**24-28. hafta** arasındaki **50 gram glukoz** taramasında **1 saatlik değer 140 mg/dL ve üzeri** (bazı merkezlerde **130 mg/dL** eşiği)"
- "**75 gram OGTT** ile tanı: **açlık 92**, **1. saat 180**, **2. saat 153 mg/dL** eşiklerinden tek değerin üstünde olması"
- "USG'de **makrosomi** (abdominal çevre artışı) ve **polihidramnios**"
- "Riskli gebelikte erken dönemde saptanan **açlık glukoz yükselmesi**"
patognomonik: null
ilk_tetkik: "**24-28. hafta** arasında **50 gram glukoz** yükleme sonrası **1 saatlik plazma glukoz** taraması; yüksek risk varsa ilk trimesterde **açlık glukozu** ve **HbA1c**"
kesin_tani: "Tarama pozitif hastada **75 gram OGTT** (veya **100 gram 3 saatlik OGTT**) tanı eşiklerinden birinin ya da birkaçının üstünde değer alınması"
ilk_tedavi: "İlk adım **beslenme düzenlemesi** (kontrollü karbonhidrat dağılımı) ve fiziksel aktivite. **1-2 hafta** içinde hedefe ulaşılmazsa **insülin** başlanır (**açlıkta 95 mg/dL altı**, yemek sonrası 1. saatte **140 mg/dL altı**); **metformin** alternatif. İnsülin ihtiyacı artıyorsa **fetal iyilik ve biyometri** izlemi sıklaştırılır"
klasik_komplikasyon: "Fetüste **makrosomi** ve **omuz distosisi**, doğum travması, **neonatal hipoglisemi**, **polisitemi** ve **hiperbilüribinülinemi**; annede **preeklampsi** riski artışı ve ilerleyen yıllarda **tip 2 diyabet** gelişimi"
