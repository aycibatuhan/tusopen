tipik_hasta: "**Postmenopozal, obez**, hipertansiyon ve diyabeti olan, **geç menopoza** girmiş veya **östrojen maruziyeti** olan (**tek başına östrojen tedavisi, tamoksifen**, anovulasyon-**PCOS** öyküsü) kadın; öyküsünde tek bulgu **postmenopozal vajinal kanama**dır; ailesinde **Lynch sendromu** ya da kolon kanseri olabilir"
patofizyoloji: "Progesteron antagonizması olmadan süren **östrojen** etkisi endometriyumu **hiperplaziye** ve **endometrioid** tip karsinoma (**tip 1**, en sık) götürür; **obezite** bu yolu **aromataz** aracılı yağ dokusu östrojen üretimiyle besler. Östrojenden bağımsız **p53** mutasyonlu **seröz** ve **berrak hücreli** tipler (**tip 2**) daha agresiftir. Yayılım önce **myometriyum derinliğine**, sonra serviks, adneksler ve **pelvik-lenfatik** yollara olur"
anahtar_bulgular:
- "**Postmenopozal vajinal kanama**: en sık ve en erken başvuru, çoğu hasta bu yüzden erken yakalanır"
- "**Premenopozal** dönemde **aşırı, düzensiz uterin kanama** veya perimenopozal düzensizlik"
- "Transvajinal USG'de postmenopozal hastada **kalın endometriyum** — genellikle **4 mm üzeri** şüpheli kabul edilir"
- "Pap smearde nadiren rastlantısal görülen **endometriyal hücreler** veya **atipik glandüler hücreler**"
- "İleri evrede uterus genişlemesi, pelvik ağrı ve serviksten **kanlı, kötü kokulu akıntı**"
patognomonik: null
ilk_tetkik: "Postmenopozal kanamada **transvajinal USG** ile endometriyum kalınlığının ölçülmesi ve **endometrial biyopsi**. Biyopsi non-diagnostik ya da negatifken şüphe sürüyorsa **histeroskopi yönlendirmeli biyopsi**"
kesin_tani: "**Endometrial biyopsi** ya da **dilatasyon küretaj** örneğinin histopatolojisi; derecelendirme ve **myometriyal invazyon** derinliği cerrahi patoloji ile tamamlanır"
ilk_tedavi: "Ameliyat edilebilir hastada temel tedavi: **total histerektomi + bilateral salpingo-ooferektomi**, evreye göre **pelvik-paraaortik lenf nodu** değerlendirmesi. Yüksek riskli evrelerde **adjuvan radyoterapi** veya **kemoterapi**. Ameliyata uygun olmayan ya da fertilitenin korunduğu iyi diferansiye, myometriyal invazyonsuz olgularda **progestin** tedavi; hormon reseptör pozitif tekrarlayan hastada **hormonal ajanlar**"
klasik_komplikasyon: "İleri evrede **myometriyum dışına yayılım**, serviks ve adneksial tutulum, **lenf nodu** ve uzak metastaz; tekrarlayan kanamaya bağlı **anemi**; tedavisizde lokal invazyon ve obstrüktif tablolar"
