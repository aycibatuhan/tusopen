tipik_hasta: "Doğumdan sonraki ilk **24 saatte (erken)** ya da **24 saat ile 12 hafta arasında (geç)** aşırı kanayan lohusa; riski yükselten durumlar: **uzun aktif doğum, çoğul gebelik, makrosomi, polihidramnios, çok sayıda doğum öyküsü, önceki postpartum kanama, sezaryen, genel anestezi**; kanama beklenmedik biçimde hızlanır, **nabız hızlanır, tansiyon düşer**"
patofizyoloji: "Doğum kanamasının mantığı dört başlıkta özetlenir: **Tone** — **uterus atoni**, plasental yatak damarlarının kasılmayla kapatılamaması (**en sık neden**); **Trauma** — serviks, vajina, perine yırtıkları; **Tissue** — **plasenta parçası ya da akretanın** kalması; **Thrombin** — koagülopati, **DIC**. Şiddetli kanamada **dilüsyonel koagülopati ve fibrinojen erimesi** tabloyu büyütür"
anahtar_bulgular:
- "**Vajinal doğumda 500 mL, sezaryende 1000 mL** kanamayı aşması veya hemodinamiye göre tanı: **taşikardi, hipotansiyon, oligüri**"
- "Palpasyonda **yumuşak, genişlemiş, kese gibi uterus** (atonik uterus), masajla kasılması"
- "Doğum kanalı inspeksiyonunda **aktif kanatan yırtık** ya da sezaryen insizyonu kenarından kanama"
- "**Plasentanın eksik çıkması** — incelenirken **kotiledon defekti**; **plasenta akreatanın** elle ayrılamaması"
- "Laboratuvarda **Hb düşmesi, fibrinojen düşüşü**, pıhtılaşma zamanlarının uzaması ve artan pıhtılaşamama (**DIC** bulguları)"
patognomonik: null
ilk_tetkik: "Kaynağı belirleme sıralıdır: **uterus tonusu** palpasyonu, **doğum kanalı ve serviks** inspeksiyonu, **plasentanın bütün olarak** incelenmesi. Hemen **iki geniş lümenli damar yolu** açılıp **kristaloid resüsitasyon** başlanır; **tam kan sayımı, pıhtılaşma paneli, fibrinojen**, kan grubu-antikor taraması; **idrar sondası** ile oligüri izlemi"
kesin_tani: "**Klinik tanıdır**: doğumdan sonra **vajinal doğum 500 mL, sezaryen 1000 mL** aşımı veya **hemodinamik bozulmaya** yol açan kanama. Geç dönemde **involüsyon bozukluğu ve retansiyon**; kanama kaynağı belirsizse USG ile **plasenta akreata** ve **gestasyonel trofoblastik hastalık** ekarte edilir"
ilk_tedavi: "Mekanik ve farmakolojik adımlar aynı anda başlar: **uterus masajı**, boş idrar kesesi ve **uteronik sıra** — **oksitosin infüzyonu**, ardından **metilergonovin, karbetosin, misoprostol veya prostaglandin**. **Travma** şüphesinde yırtık onarımı; **retansiyonda** manuel çıkarım ve küretaj. **Bimanüel kompresyon**, **uterin balon tamponadı**, **kompresyon sütürleri**; durduramayan hastada **uterin arter embolizasyonu veya ligasyonu**, son çare **peripartum histerektomi**. Erken **traneksamik asit**, kan ürünleri ve **masif transfüzyon protokolü**; **DIC** gelişiminde **plazma, fibrinojen ve trombosit** desteği"
klasik_komplikasyon: "**Hemorajik şok ve DIC**, **akut böbrek hasarı**; **postpartum hipopituitarizm (Sheehan sendromu)**; tedavi gecikmiş olguda uterusun çıkarılması gerekir; postpartum kanama **maternal ölümlerin önde gelen nedenlerinden biridir**"
