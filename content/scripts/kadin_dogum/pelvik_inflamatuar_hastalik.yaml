tipik_hasta: "Cinsel yaşamı aktif genç kadın; **alt karın/pelvik ağrı, pürülan vajinal akıntı, ilişkide ağrı ve ateşle** gelir; **yeni partner öyküsü**, erken yaşta cinsel başlangıç, **IUD kullanımı** veya son gebelik/düşük sonrası dönem riski artırır"
patofizyoloji: "Serviksten yukarı tırmanan enfeksiyon zinciri: **endometrit**, sonra **salpenjit**, en ileri tabloda **pelvik peritonit ve tubo-ovarian apse**. Etkenler en sık **Chlamydia trachomatis** ve **Neisseria gonorrhoeae**; **anaeroplar, Gardnerella** sıklıkla katılır. Tubaların **silia epitelinde harabiyet tubal okluzyona** yol açar"
anahtar_bulgular:
- "Pelvik/adneksiyal ağrı ile birlikte **servikal hareket, uterus veya adneksiyal hassasiyeti** — tedavi için **en düşük klinik eşik**"
- "**Mukopürülan servikal veya vajinal akıntı**"
- "**Ateş, lökositoz** veya **C-reaktif protein** yüksekliği"
- "Laboratuvar ek bulguları: servikste **Chlamydia/gonore NAAT** pozitifliği, **sedimentasyon** artışı"
- "USG'de **hidrosalpenks/piosalpenks** veya **tubo-ovarian apse**; ağır olguda **Fitz-Hugh-Curtis perihepatiti** (sağ üst kadranda sürtünme sesi/ağrı)"
patognomonik: null
ilk_tetkik: "Her hastada **gebelik testi** (dış gebelik dışlanması zorunlu); **lökositoz/CRP** ve sedimentasyon, **Chlamydia/gonore NAAT**, **transvajinal ultrason** — **TOA** ve Douglas'ta serbest sıvı araştırması"
kesin_tani: "Pratikte tanı klinik, tedavi **ampirik**: **minimum kriterlerden biri** (pelvik ağrı + **servikal hareket** veya uterus/adneksiyal hassasiyeti) varsa gecikme kabul edilmeden tedavi başlanır. Kesin doğrulama için **endometrial biyopsi** veya **laparoskopi** altın standarttır ama rutin değildir"
ilk_tedavi: "Ayaktan tedavi eşiği: hafif-orta klinik, TOA yok, gebelik yok, oral alım iyi — **IM seftriakson tek doz** ardından **14 gün doksisiklin + metronidazol**. Yatış eşikleri: **şiddetli klinik veya yüksek ateş, TOA, gebelik, oral alamama, 72 saatlik ayaktan tedaviye yanıt yok** — **IV seftriakson + doksisiklin ± metronidazol**. **Partner tedavisi** ve **cinsel perhiz** tamamlanana kadar şart"
klasik_komplikasyon: "**Tubal okluzyona** bağlı **infertilite** ve **dış gebelik** riski; **kronik pelvik ağrı**; tekrarlayan PID; **tubo-ovarian apse rüptürü** (peritonit, **septik şok**, acil cerrahi)"
