tipik_hasta: "Okul çağındaki çocuk; erkeklerde kadınlardan **2-3 kat** sık; öğretmenin '**dersine odaklanamıyor, yerinde duramıyor, başkalarını bölüyor**' şikâyetiyle gelir. Kız çocuklarında ve erişkinlerde **hiperaktivite göze batmaz, dikkat eksikliği** öndedir ve tanı çoğu zaman **gecikir**; **anne-babada benzer öykü, erken doğum-düşük doğum ağırlığı, gebelikte sigara** riski artırır. Erişkin sunumu **içsel huzursuzluk, planlama-zaman yönetimi güçlüğü ve sık iş değiştirmedir**"
patofizyoloji: "Kalıtsallığı yüksek **nörogelişimsel** bozukluktur; **kortikal olgunlaşma, özellikle prefrontal bölgede 2-3 yıl geridedir** ve yürütücü işlev ağları (dikkat sürdürme, frenleme, planlama) gecikir. Öne çıkan bulgu **prefrontal-striatal devrelerde dopamin-noradrenalin yetersizliğidir**; **stimülanların** ve **atomoksetinin** etkinliği bu modeli destekler. **DRD4 ve DAT1** gen varyantları ile **gebelikte sigara, prematürite, düşük doğum ağırlığı** çevresel katkılardır"
anahtar_bulgular:
- "İki belirti kümesi: **dikkatsizlik** (sürdürememe, eşya kaybetme, kolayca dağılma, unutkanlık) ve **hiperaktivite-dürtüsellik** (kıpırdanma, soru bitmeden cevaplama, sıra bekleme güçlüğü)"
- "**Süre eşiği**: belirtiler **6 aydan uzun** sürmeli ve gelişimsel düzeye uymamalı"
- "**Başlangıç yaşı**: DSM-5-TR'de belirtilerin **12 yaşından önce** başlamış olması gerekir (DSM-IV'teki **7 yaş eşiği** gevşetildi)"
- "**Bağlam sayısı**: belirtiler **en az iki ortamda** (ev, okul, iş) bulunmalı; tek ortamdaki belirtiler başka açıklamayı düşündürür"
- "**Ölçüt sayısı**: **17 yaş altında en az 6, 17 yaş ve üzerinde en az 5** belirti; tipler: **dikkat eksikliği öncelikli, hiperaktivite-dürtüsellik öncelikli, birleşik**"
- "**Erişkin sunum**: hiperaktivitenin yerini **içsel huzursuzluk** alır; **yürütücü işlev bozukluğu** (planlama, önceliklendirme, zaman yönetimi) ve **araç kullanımında riskli davranış** öne çıkar"
patognomonik: null
ilk_tetkik: "Tanı **klinik değerlendirmeyle** konur; laboratuvar tanıyı koymaz. **Vanderbilt ve Conners** veli-öğretmen ölçekleri ve okul raporları toplanır; taklitler dışlanır: **işitme-görme muayenesi, uyku bozuklukları, tiroid fonksiyon bozuklukları, kurşun maruziyeti**; eşlik eden **muhalif inatçı bozukluk, öğrenme bozuklukları, kaygı, tik bozuklukları** taranır. **Stimülan öncesi kardiyak öykü-muayene** yapılır; bayılma-kalp hastalığı öyküsünde **EKG** istenir"
kesin_tani: "**DSM-5-TR ölçütleri**: gelişimsel düzeye uymayan, **6 aydan uzun süren** dikkat eksikliği ve/veya hiperaktivite-dürtüsellik; **17 yaş altında en az 6, 17 yaş ve üzerinde en az 5** belirti; başlangıcın **12 yaşından önce** olması; **en az iki ortamda** bulunma; **okul-iş-sosyal işlev kaybının** kanıtlanması; tablonun duygudurum, anksiyete, kişilik bozukluğu ya da **madde etkisiyle** daha iyi açıklanamaması"
ilk_tedavi: "**6 yaş ve üzeri okul çocuğunda ilk seçenek stimülanlardır**: **metilfenidat** (dopamin-noradrenalin geri alım inhibitörü) genellikle önce denenir, **amfetamin türevleri** alternatiftir. Yan etkiler ve izlem: **iştah azalması, uyku bozukluğu, kalp hızı-tansiyon artışı, büyüme hızında geçici gerileme** (boy-ağırlık izlenir); **tik öyküsü kesin kontrendikasyon değildir**, **yapısal kalp hastalığı** öncelikli dikkat ister; kötüye kullanım riskine karşı **uzun etkili formlar** öne alınır. **Okul öncesi dönemde ilaç öncesinde davranış terapisi** ilk adımdır; okul içi düzenlemeler ve **bilişsel davranışçı** teknikler eklenir. Stimülan uygun değilse **atomoksetin** (etkisi haftalarca gecikir) ya da **alfa-2 agonistler guanfasin-klonidin** (**tik eşlik ettiğinde** önceliklenir) seçilir"
klasik_komplikasyon: "**Akademik başarısızlık** ve özgüven düşüklüğü; **muhalif inatçı bozukluk-davranış bozukluğu** eşlik riski; tedavi edilmeyen olgularda artan **madde kullanım riski** (uygun tedavi bu riski azaltır); **kaza-yaralanma ve riskli araç kullanımında** artış"
