id: sizofreni
version: 1
status: draft
author: ai-drafts/psikiyatri-2
sources:
- DSM-5-TR — Şizofreni Spektrum ve Diğer Psikotik Bozukluklar tanı ölçütleri (referans olarak listelendi,
  metin projesi özgün yazımdır)
- 'Klinik rehberler: APA Şizofreni Değerlendirme ve Tedavi Rehberi (referans olarak listelendi, metin
  projesi özgün yazımdır)'
ad: Şizofreni
taksonomi:
- - ktbt
  - psikiyatri
  - psik_psikotik
  - psik_ps_sizofreni
tipik_hasta: 'Genç erişkinde başlar: erkeklerde tipik başlama 18-25 yaş, kadınlarda 25-35 yaş; kadınlarda
  menopoz çevresinde ikinci bir zirve görülür ve erkeklerde tablo genellikle daha erken, daha ağır seyreder.
  Hastaya çoğunlukla sosyal geri çekilme, okul ya da işte düşüş, kişisel bakımda bozulma gibi prodrom
  belirtileri öncülük eder; aile ''odasına çekildi, garip şeyler söylüyor, arkadaşlarından kopuyor'' diyerek
  getirir. Başvuru genellikle ilk psikotik atakladır: kendisine zarar verileceği inancı, televizyonun
  kendisiyle konuştuğu sanısı ya da kimse yokken sesler duyma. Genç hastada yeni başlayan psikozda esrar
  ve diğer madde kullanımı ile ailede psikoz öyküsü mutlaka sorgulanır'
patofizyoloji: 'Dopamin hipotezi ana çerçevedir: mezolimbik yolda dopamin aşırı etkinliği pozitif belirtileri
  (sanrılar, halüsinasyonlar) açıklar; bu yüzden D2 reseptör blokajı bu belirtileri düzeltir. Mesokortikal
  yoldaki dopamin yetersizliği negatif belirtileri (istek ve itki kaybı, düz duygulanım) ve bilişsel belirtileri
  açıklar. NMDA glutamat hipotezi, nörogelişimsel kuram (doğum komplikasyonları, hafif ventriküler genişleme,
  kortikal gri madde kaybı) ve bağışıklık-iltihabi katkılar tabloya eklenir. Belirtiler şizofreniye özgü
  değildir: amfetamin ve kokain intoksikasyonu, steroid, temporal lob epilepsisi ve başka nörolojik-tıbbi
  hastalıklar aynı tabloyu yapabilir — bu nedenle organik dışlama zorunludur'
anahtar_bulgular:
- 'İşitsel halüsinasyonlar en sık bulgudur: kimse yokken sesler duyma, seslerin hastayla konuşması ya
  da buyruk verici sesler; içgörü değişkendir'
- 'Sanrılar: takip edilme ve zarar görme sanrıları en sık; referans sanrıları (sokaktaki insanlar, haberler
  kendisiyle ilgili), büyüklük, kıskançlık ve buyruk sanrıları; inanç sarsılmaz ve duygudurumdan bağımsızdır'
- 'Negatif belirtiler: duygulanım düzleşmesi, alogi (konuşma fakirliği), avolition (amaçlı etkinlik başlatıp
  sürdürememe), anhedoni ve asosyallik; işlev kaybının asıl belirleyicileri bunlardır ve ilaca yanıtları
  pozitif belirtilerden zayıftır'
- '6 ay süre kuralı: bozukluk toplam en az 6 ay sürmeli ve bu sürede en az 1 aylık aktif faz bulunmalı;
  aktif fazda sanrılar, halüsinasyonlar, dağınık konuşma, belirgin dağınık-katatonik davranış ve negatif
  belirtilerden en az ikisi (biri ilk üçten) olmalı; kalan süre prodromal ya da rezidüel belirtilerle
  geçebilir'
- 'İşlevsel düşüş iş, öğrenim, ilişkiler ve öz bakımda belirgindir; süre farklılıkları tanıyı değiştirir:
  toplam 1-6 ay ise şizofreniform bozukluk, 1 günden 1 aya kadar sürüyorsa kısa psikotik bozukluk tanımlanır'
- Aktif fazda ajitasyon, katatoni (mutizm, postür tutma, negatiflik), beslenmeyi bozan davranışlar ve
  intihar riski olabilir; hastane yatışı çoğu ilk atakta gereklidir
patognomonik: null
ilk_tetkik: 'Tanı klinik psikiyatrik değerlendirmeye dayanır; laboratuvar şizofreni tanısını koymaz. İlk
  psikozda organik ve madde kökenli taklitler dışlanır: tam kan sayımı, biyokimya, TSH, B12, idrar toksikolojisi;
  gerektiğinde kafa MR/BT ve otoimmün ensefalit şüphesinde NMDA reseptör antikorları düşünülür. İntihar
  ve başkasına zarar verme riski ayrıntılı değerlendirilir; tedavi planı için bazal kilo, açlık kan şekeri
  ve lipid profili kaydedilir (metabolik izlem için başlangıç çizgisi)'
kesin_tani: 'DSM-5-TR ölçütlerine göre: 1 ay boyunca (etkin tedaviyle daha kısa olabilir) sanrılar, halüsinasyonlar,
  dağınık konuşma, belirgin dağınık ya da katatonik davranış ve negatif belirtilerden en az ikisinin —
  en az biri sanrı, halüsinasyon ya da dağınık konuşma olmak koşuluyla — varlığı; bozukluk belirtilerinin
  toplam 6 ay sürmesi; iş, öğrenim ya da öz bakımda belirgin işlev kaybı; şizoaffektif bozukluk ve psikotik
  özellikli duygudurum bozukluklarının dışlanması (duygudurum epizodları aktif fazın yalnızca azınlık
  bir bölümünde bulunmalı — psikoz duygudurumdan bağımsız ve sürekliyse şizofreni tanısı öne geçer); tablonun
  bir maddenin fizyolojik etkisine ya da başka bir tıbbi duruma bağlanamaması'
ilk_tedavi: 'Antipsikotik tedavi temeldir; ilk atakta 2. kuşak ilaçlar (aripiprazol, risperidon, olanzapin)
  tercih edilir, akut ajitasyonda intramusküler olanzapin ya da haloperidole lorazepam eklenir. Seçim
  yan etki profiline göre yapılır: yüksek potentli 1. kuşak ilaçlar (haloperidol) akut distoni (genç hastada
  göz yukarı kayması, tortikollis — antikolinerjik biperiden), parkinsonizm, akatizi (yerinde duramama
  huzursuzluğu — beta bloker) ve uzun kullanımda geç diskinezi (ağız-dil-çene istemsiz hareketleri) yapar;
  düşük potentli klorpromazin antikolinerjik etkiler ve ortostatik hipotansiyonla oturur. 2. kuşak ilaçlarda
  kilo alımı ve metabolik sendrom (diyabet, dislipidemi) öndedir; risperidon yüksek dozda ekstrapiramidal
  belirti ve hiperprolaktinemi (amenore, galaktore) yapar. Tedaviye dirençli şizofreni (uygun doz ve sürede
  en az iki antipsikotiğe yanıt yokluğu) ve süregiden intihar düşüncelerinde klozapin seçenektir; agranülositoz
  riski nedeniyle düzenli nötrofil sayımı zorunludur, erken haftalarda miyokardit izlenir. Psikososyal
  tedavi (bilişsel davranışçı terapi, aile eğitimi, sosyal beceri ve iş rehabilitasyonu) ilaçla birlikte
  verilir; ilk atak sonrası idame en az 1-2 yıl, tekrarlayan tablolarda sürekli sürdürülür; tedaviyi bırakma
  nüksün en sık nedenidir'
klasik_komplikasyon: İntihar (yaşam boyu belirgin risk; klozapin bu riski azaltan tek ilaç) ve madde kötüye
  kullanımı eş tanısı; ilaç kaynaklı geç diskinezi, metabolik sendrom ve nöroleptik malign sendrom (kas
  rijiditesi, hipertermi, bilinç değişikliği, yüksek kreatin kinaz — dantrolen ve bromokriptin)
