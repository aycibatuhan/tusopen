sources:
  - "DSM-5-TR — İnsomni Bozukluğu tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: AASM ve NICE insomni kılavuzları (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: İnsomni
taksonomi:
  - [ktbt, psikiyatri, psik_yeme_uyku_cinsel, psik_yu_insomni]
tipik_hasta: "Uykuya dalmakta, uykuyu sürdürmekte ya da **planlanandan erken uyanmakta** güçlük çeken ve bedelini **gündüz işlev kaybıyla** ödeyen hasta. **Yatış saatine yaklaştıkça kaygının yükselmesi**, yatağın uyanıklıkla eşleşmesi, başkasının evinde ya da tatilde **daha rahat uyuma** öyküsü **koşullanmış bileşeni** işaret eder. **Depresyon-anksiyete, kronik ağrı, reflü, gece sık işeme, vardiyalı çalışma**, uyarıcı ilaçlar (**steroid, SSRI, dekonjestan**) ve **kafein-alkol** bu hastayı hatırlatır"
patofizyoloji: "Çekirdek mekanizma **hiperarousal**dır: yatağa girildiğinde bile **kortikal aktivasyon, sempatik ton ve HPA aksı** gece baskılanamıyor. **Davranışsal döngü** tabloyu kalıcılaştırır: yatağa erken girme, **gündüz şekerlemeleriyle açığı kapatma** ve yatakta uyanık kalma alışkanlığı, **yatağı uyanıklık-kaygı koşullanmasına** bağlar; '**Yine uyuyamayacağım**' beklentisi uykuya dalmayı gerçekten geciktirir ve döngü kendini besler"
anahtar_bulgular:
  - "Uykuya dalmada güçlük, tekrarlayan uyanmalar ya da **erken uyanma**; **haftada en az 3 gece**"
  - "Şikayetin **en az 3 aydır sürmesi** — **DSM-5-TR tanı penceresi**; kısa dönem uyku güçlüğünden ayrım burada yapılır"
  - "**Gündüz işlev kaybı**: yorgunluk, dikkat-konsantrasyon azalması, sinirlilik, iş/okul performansında düşüş"
  - "**Yatağın uyanıklık-kaygı yeri haline gelmesi**: yatakta televizyon-telefon, uyumaya zorlanma, saat bakma"
  - "Şikayetin **uyku apnesi gibi başka bir uyku bozukluğuyla, madde-ilaç etkisiyle ya da ikinci bir mental-tıbbi durumla** açıklanamaması"
patognomonik: null
ilk_tetkik: "Tanı **klinik öykü ve uyku günlüğüne** dayanır; laboratuvar tanıyı koymaz. **En az 1-2 haftalık uyku günlüğü** en değerli veridir: yatma-uyanma saatleri, uykuya dalma süresi, şekerlemeler, **kafein-alkol** tüketimi. İkincil nedenler sorgulanır: **depresyon-anksiyete**, kronik ağrı, reflü, **uyku apnesi bulguları (horlama, tanık apne)** ve uyarıcı ilaçlar-maddeler. **Rutin polisomnografi gereksizdir**; yalnız **apne ya da periodik bacak hareketi** kuşkusu varsa istenir"
kesin_tani: "**DSM-5-TR ölçütleri**: uyku doyumluğunda belirgin azalma; **haftada en az 3 gece, en az 3 aydır**; **yeterli uyku fırsatı ve koşuluna karşın**; **gündüz işlev kaybına** yol açıyor; **uyku apnesi** gibi başka bir uyku-uyanıklık bozukluğu, **madde-ilaç etkisi** ya da ikinci bir mental-tıbbi durum tabloyu açıklamıyor. Yaşla toplam uyku gereksinimi belirgin **azalmaz**; **gündüz işlev kaybı yaratmıyorsa insomni tanısı taşımaz**"
ilk_tedavi: "İlk adım ilaç değil **bilişsel davranışçı uyku terapisidir**; **uyku kısıtlaması** yatakta geçen süreyi gerçek uyku süresine yaklaştırıp doygunluk oluşunca kademeli uzatır. **Uyaran kontrolü**: yalnız uykulu gelince yatağa girme, **20 dakikada uyumayan hastanın kalkması**, yatağı yalnız uyku için kullanma. **Uyku hijyeni** tek başına çözmez ama omurgadır: **sabah düzenli saatte uyanıp ışık almak, öğleden sonra kafein kesmek**, alkol-sigarayı sınırlamak. İlaç (**düşük doz Z grubu hipnotik**) kısa süreli ve davranışsal yaklaşımla birlikte düşünülür; yaşlıda **düşme, bellek bulanıklığı, bağımlılık** nedeniyle kronik kullanımdan kaçınılır. **Altta yatan depresyon-anksiyete** varsa onun tedavisi önceliklidir"
klasik_komplikasyon: "**Kronikleşme**; gündüz uykululuğuyla **iş ve trafik kazası riski**, depresyon-anksiyete sıklığında artış, **hipnotiklere bağımlılık ve doz tırmanması**"
