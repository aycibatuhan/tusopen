sources:
  - "DSM-5-TR — İnsomni Bozukluğu tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: AASM ve NICE insomni kılavuzları (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: İnsomni
taksonomi:
  - [ktbt, psikiyatri, psik_yeme_uyku_cinsel, psik_yu_insomni]
tipik_hasta: "Uykuya dalmakta, uykuyu sürdürmekte ya da planlanandan erken uyanmakta güçlük çeken ve bedelini gündüz işlev kaybıyla ödeyen hasta; orta yaşta en sık, kadınlar ve ileri yaş grubunda sıklık artar. Yatış saatine yaklaştıkça kaygının yükselmesi, yatağın uyanıklık ve çabalamayla eşleşmesi, başkasının evinde ya da tatilde daha rahat uyuma öyküsü koşullanmış bileşeni işaret eder; depresyon-anksiyete, kronik ağrı, reflü, gece sık işeme, vardiyalı çalışma ve uyarıcı etkili ilaçlar (steroid, SSRI, dekonjestan) ya da kafein-alkol bu hastayı hatırlatır"
patofizyoloji: "Çekirdek mekanizma hiperarousal: yatağa girildiğinde bile kortikal aktivasyon, sempatik ton ve HPA aksı gece baskılanamıyor. Davranışsal döngü tabloyu kalıcılaştırır: kötü geçen bir gecenin ardından hastanın yatağa erken girip yatakta uzun süre beklemesi, gündüz şekerlemeleriyle açığı kapatma çabası ve yatakta uyanık kalma alışkanlığı, yatağı uyanıklık-kaygı koşullanmasına bağlar; 'yine uyuyamayacağım' beklentisi uykuya dalmayı gerçekten geciktirir ve döngü kendini besler. Uyku hijyen bozuklukları ve ikinci bir bozukluk ya da ilaç etkisi tetikleyici katmanı oluşturur"
anahtar_bulgular:
  - "Uykuya dalmada güçlük, gece boyunca tekrarlayan uyanmalar ya da planlanandan erken uyanma; haftada en az 3 gece"
  - "Şikayetin en az 3 aydır sürmesi — DSM-5-TR tanı penceresi; kısa dönem uyku güçlüğünden ayrım burada yapılır"
  - "Gündüz işlev kaybı: yorgunluk, dikkat-konsantrasyon azalması, sinirlilik, iş/okul performansında düşüş"
  - "Yatağın uyanıklık-kaygı yeri haline gelmesi: yatakta televizyon-telefon, uyumaya zorlanma, saat bakma"
  - "Şikayetin uyku apnesi gibi başka bir uyku bozukluğuyla, madde-ilaç etkisiyle ya da ikinci bir mental-tıbbi durumla açıklanamaması"
patognomonik: null
ilk_tetkik: "Tanı klinik öykü ve uyku günlüğüne dayanır; laboratuvar tanıyı koymaz. En az 1-2 haftalık uyku günlüğü en değerli veridir: yatma-uyanma saatleri, uykuya dalma süresi, uyanma sayısı, şekerlemeler, kafein-alkol tüketimi. İkincil nedenler sorgulanır: depresyon-anksiyete taraması, kronik ağrı, reflü, astım, prostat kaynaklı gece işemesi, uyku apnesi bulguları (horlama, tanık apne, aşırı gündüz uykululuğu) ve uyarıcı ilaçlar-maddeler. Rutin polisomnografi insomnide gereksizdir; yalnızca apne ya da periodik bacak hareketi kuşkusu varsa istenir"
kesin_tani: "DSM-5-TR ölçütleri: uykuya dalma, uyku sürdürme ya da erken uyanma üzerine kurulu uyku doyumluğunda belirgin azalma; en az haftada 3 gece, en az 3 aydır; yeterli uyku fırsatı ve koşulu olmasına karşın; gündüz işlev kaybına yol açıyor; uyku apnesi gibi başka bir uyku-uyanıklık bozukluğu, madde-ilaç etkisi ya da ikinci bir mental-tıbbi durum tabloyu açıklamıyor. Yaşla toplam uyku gereksinimi belirgin azalmaz; azalan uyku etkinliğidir; gündüz işlev kaybı yaratmıyorsa insomni tanısı taşımaz"
ilk_tedavi: "İlk adım ilaç değil bilişsel davranışçı uyku terapisidir: uykuyla ilgili yanlış inançların ('8 saat uyumazsam çalışamam') düzeltilmesi, uyku kısıtlaması (yatakta geçirilen süreyi gerçek uyku süresine yaklaştırıp doygunluk oluşunca kademeli uzatma) ve uyaran kontrolü (yalnız uykulu geldiğinde yatağa girme, 20 dakikada uyumayan hastanın kalkıp sakin bir etkinliğe geçmesi, yatağı yalnız uyku için kullanma). Uyku hijyeni tek başına tanıyı çözmez ama her hastanın omurgasıdır: sabah düzenli saatte uyanıp ışık almak, öğleden sonra kafein kesmek, alkol-sigarayı sınırlamak, uzun şekerlemeleri kesmek. İlaç (düşük doz Z grubu hipnotik gibi) kısa süreli ve davranışsal yaklaşımın yanında düşünülür; yaşlıda düşme, bellek bulanıklığı ve bağımlılık riski nedeniyle kronik kullanımdan kaçınılır; altta yatan depresyon-anksiyete varsa onun tedavisi önceliklidir"
klasik_komplikasyon: "Kronikleşme; gündüz uykululuğuyla iş ve trafik kazası riski, depresyon-anksiyete sıklığında artış, hipnotiklere bağımlılık ve doz tırmanması"
