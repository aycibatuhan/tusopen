id: konversiyon
version: 1
status: draft
author: "ai-drafts/psikiyatri-3"
sources:
  - "DSM-5-TR — Somatik Belirtiler ve İlişkili Bozukluklar (Fonksiyonel Nörolojik Semptom Bozukluğu) tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: fonksiyonel nörolojik semptom bozukluğu tanı ve tedavi önerileri (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: Konversiyon Bozukluğu
taksonomi:
  - [ktbt, psikiyatri, psik_somatik_dissosiyatif, psik_sd_konversiyon]
tipik_hasta: "Genç-orta yaşta (en sık **20-40**), kadınlarda öne çıkan; **güçsüzlük, felç, konuşma bozukluğu, kasılma-tremor, yürüme bozukluğu, his kaybı ya da 'nöbet'** ile acile ya da nöroloji polikliniğine başvurur. Başlamasından hemen önce **psikolojik açıdan yükleyici bir olay** (kavga, kayıp, ihanet) sıklıkla vardır, ancak hasta olay ile yakınma arasında **bağ kurmaz**. **Tetkiklerin tekrar tekrar normal çıkıp yakınmanın sürmesi** ve önceki benzer atak öyküsü bu hastayı hatırlatır"
patofizyoloji: "**Yapısal lezyon yok, işlev bozukluğu vardır**: korku-sıkıntı devreleri ile istemli motor düzenleme ağları arasındaki bağın bozulması, dikkatin hareket kontrolünden **belirtiye kilitlenmesi**. **Bilinçli taklit değildir** — bilinçli hasta rolü oynamak (sahte bozukluk) ve dış kazanç için uydurma ile ayrılır; hasta belirtiyi **gerçekten yaşar**. **Depresyon-kaygı** eşlik eder, **travma öyküsü** sıktır"
anahtar_bulgular:
  - "**İstemli motor ya da duyu işlevinde bozulma**: güçsüzlük-felç, **tremor, distoni, yürüyüş bozukluğu**, konuşma bozukluğu, his kaybı, **fonksiyonel nöbet**"
  - "**Nörolojik anatomiyle uyuşmayan dağılım**: dermatom ve adale düzenine uymayan his kaybı, vücudu tam ortadan ikiye bölen **hemianestezi**"
  - "**Tutarsız bulgular**: muayene tekniğine göre değişen güç kaybı; dikkat dağıtılarak geçici düzelme — **Hoover belirtisi**"
  - "**Fonksiyonel (psikojen) nöbet ayrımı**: şiddetin salınımlı değişimi, **gözlerin kapalı olması ve açmaya direnç**, sonrasında **yönelimin korunması**; **video-EEG'de ictal paternin yokluğu**"
  - "Laboratuvar ve görüntüleme normal; ancak **'her şeyin normal çıkması' tek başına tanı koymaz** — tanı **pozitif fonksiyonel bulgularla** desteklenmelidir"
patognomonik: "**Hoover belirtisi**: fonksiyonel hemiparezi — **kontralateral kalçaya karşı fleksiyon gücü** istendiğinde 'güçsüz' kalçada **ekstansör gücün geri gelmesi**"
ilk_tetkik: "**Pozitif fonksiyonel bulguların** (**Hoover**, tutarsız motor-sensör bulgular) araştırıldığı ayrıntılı nörolojik muayene; **fonksiyonel nöbet şüphesinde video-EEG ile atak yakalanması (altın standart)**. Yapısal lezyonu dışlamak için gerektiğinde **MR ve elektrofizyoloji**; amaç gereksiz tetkik döngüsünü **kesmektir**"
kesin_tani: "**DSM-5-TR ölçütleri**: en az bir **istemli motor ya da duyu işlevinde değişiklik**; klinik bulguların, belirti ile **bilinen nörolojik ya da tıbbi durum arasındaki uyumsuzluğun kanıtını** sağlaması. Başka bir ruhsal ya da tıbbi bozuklukla açıklanamaz; **sıkıntı ya da işlev kaybına** yol açar. **Psikolojik stresör artık zorunlu ölçüt değildir**; DSM-5-TR adı **fonksiyonel nörolojik semptom bozukluğudur**"
ilk_tedavi: "İlk adım **iyileştirici iletişim ve psikoeğitimdir**: belirtinin gerçek olduğu, **yapısal hasar bulunmadığı ve iyileşmenin mümkün olduğu** net biçimde anlatılır. Belirte uygun **fizyoterapi ve motor yeniden öğrenme** merkeze alınır. Eşlik eden **depresyon-kaygı için SSRI**, dirençli olgularda **bilişsel davranışçı terapi** düşünülür. **Fonksiyonel nöbette antiepileptik ilaçlar yarar sağlamaz ve kesilir**; gereksiz yatış-invasiv işlemden kaçınılır"
klasik_komplikasyon: "**Kronikleşme ve kalıcı işlev kaybı**; gereksiz tetkik-invasiv işlem ve ilaçlarla (sık MR, gereksiz antiepileptik) **iatrojenik zarar**; ağrı-depresyon eşlik tablolarıyla **tekrarlayan yatışlar** ve işe gidememe döngüsü"
tus_gecmisi: []
