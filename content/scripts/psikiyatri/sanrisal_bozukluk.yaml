id: sanrisal_bozukluk
version: 1
status: draft
author: "ai-drafts/psikiyatri-4"
sources:
  - "DSM-5-TR — Sanrısal Bozukluk tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: WFSBP Psikotik Bozukluklar Tedavi Kılavuzu (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: Sanrısal Bozukluk
taksonomi:
  - [ktbt, psikiyatri, psik_psikotik, psik_ps_sanrisal]
tipik_hasta: "Orta yaştan sonra başvuran, dar bir aile ya da mahalle çevresi içinde yaşayan; **duyma-görme bozukluğu** ya da ileri yaşa bağlı **duyusal kayıp** eklenmiş, **sosyal ağı zayıf** hasta; '**Komşular beni dinliyor**', '**eşim beni zehirliyor**', '**bir kişi bana aşkını söylüyor**' gibi **tek bir temada ısrarla** konuşur; sanrı dışında **mantıklı, düzenli ve işlevsel** bir yaşam sürer. **Göçmenler ve yalnız yaşayan yaşlılar** risk grubundadır"
patofizyoloji: "**Dopamin** sistemini hedefleyen antipsikotiklerin sanrıyı zayıflatması **dopaminerjik işlev bozukluğunu** düşündürür; ancak tablo şizofreniden temelde farklıdır: **bilişsel işlev, duygulanım düzeni ve sosyal davranış görece korunur**. **Duyusal girdi kaybı — özellikle işitme kaybı —** beyinde **yanlış doldurma** ve bilişsel çarpıtma zeminini hazırlar; **sosyal izolasyon** düzeltici geri bildirimi ortadan kaldırır, sanrı **sistemleşip sağlamlaşır**"
anahtar_bulgular:
  - "**En az 1 aydır süren, sistemli, tuhaf olmayan sanrı** (olay gerçek hayatta olabilecek biçimde anlatılır)"
  - "Sanrı dışında düşünme, konuşma ve davranış **görece korunmuştur**; işlevsellik **belirgin bozulmamıştır**"
  - "**Halüsinasyonlar ya hiç yoktur ya da sanrının temasını destekleyen düzeyde** kalır"
  - "Türler: **somatik** (hastalık ya da sızma sanrısı), **persekütor, kıskançlık, erotomanik, megalomanik**; en sık **persekütor ve somatik**"
  - "Yaşlıda **duyusal yetersizlik ve sosyal yalıtım** sık eşlik eder; **demans başlangıcındaki sanrılardan** ayrım gerekir"
patognomonik: null
ilk_tetkik: "Ayrıntılı psikiyatrik görüşme ve **aile bağımsız öykü**; madde (**kokain, amfetamin, steroid**) ve tıbbi nedenlerin dışlanması için **toksikoloji taraması**, temel laboratuvar ve gerekiyorsa **beyin görüntülemesi**. Yaşlıda **bilişsel test** ile **işitme-görme** değerlendirmesi; **kıskançlık tipinde şiddet ve intihar riski** hesaplanır"
kesin_tani: "**DSM-5-TR ölçütlerine göre en az 1 aydan beri süren, tuhaf olmayan sanrının** varlığı; **şizofreni ölçütlerinin karşılanmaması**, işlevselliğin **belirgin bozulmamış** olması, davranışın **gözle görülür biçimde tuhaf olmaması**. **Manik ya da majör depresif dönemlerin** ya hiç olmaması ya da **kısa sürmesi**; sanrının **bir maddeye ya da tıbbi bir duruma bağlanamaması**"
ilk_tedavi: "**İkinci kuşak antipsikotikler (risperidon, olanzapin) düşük dozdan** başlanır; **somatik tipte pimozid** geleneksel seçenek olsa da **QT uzaması ve ekstrapiramidal** yan etkiler nedeniyle dikkatli seçilir, somatik tipte **SSRI** yanıtına ilişkin deneyim de vardır. Asıl zorluk **tedavi kabulüdür** — hasta sanrısının gerçekliğine ikna olmuştur; **çatışmacı ikna yerine güven ilişkisi kurma**, sıkıntı ve uyku bozukluğunu hedefleme işe yarar. **Aileyle işbirliği ve düzenli izlem** tedaviden kopmayı önler"
klasik_komplikasyon: "**Kıskançlık tipinde eşe yönelik şiddet**; **somatik tipte gereksiz cerrahi ve medikal girişimler**; sosyal yalıtımın derinleşmesi; bir bölüm hastada tablonun **şizofreniye evrilmesi**"
