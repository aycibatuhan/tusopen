tipik_hasta: "Hastanede yatan, özellikle **yoğun bakım ve ameliyat sonrası** dönemde izlenen yaşlı hasta; **altta yatan demans, duyusal kusur, polifarmasi, kontrolsüz ağrı, dehidratasyon** ve kateter-kanül bu hastayı hatırlatır. Toplumdan da başvurabilir: ani konfüzyonlu hastada **enfeksiyon, metabolik bozukluk, ilaç-madde etkisi ya da kesilmesi** öncelikle aranır. **Akşam kötüleşme (günbatımı)** ve **görsel halüsinasyonlar** tanıyı yaklaştırır"
patofizyoloji: "Akut ve çoğunlukla geri dönen **genel tıbbi nedenin** beyin işlevlerini doğrudan bozmasıdır; **asetilkolin azalması ve dopaminin görece artışı**, **sirkadiyen ritmin bozulması**, inflamatuvar sitokinler, hipoksi, elektrolit-glukoz bozuklukları bilinç-dikkat ağlarını kapatır. **Kan-beyin bariyerinin yaşla geçirgenleşmesi** ve **azalmış nöronal yedek** yaşlıyı-demanslıyı savunmasız kılar; **antikolinerjikler, opioidler ve benzodiazepinler** başlıca ilaç suçlularıdır"
anahtar_bulgular:
- "**Akut başlangıç ve gün içinde dalgalanan seyir**: saatler-günler içinde gelişir, saat saat açılıp kapanır, **akşam saatlerinde kötüleşir**"
- "**Dikkat bozukluğu tanının omurgasıdır**: dikkati toplama, soruları izleme, basit dikkat testleri güçleşir"
- "**Çevre bilincinde azalma**: yer-yön-zaman-kişi **oryantasyon bozulması**, **görsel halüsinasyonlar** ve geçici sanrılar; **uyku-uyanıklık ritmi** bozulur"
- "İki psikomotor yüz: **ajite-hiperaktif** tip çabuk fark edilir; **durgun-hipoaktif tip en tehlikeli ve en sık gözden kaçandır**"
- "Duygusal labilite, korku-ajitasyon; altta yatan nedenin işaretleri (**ateş, enfeksiyon odağı, ilaç değişikliği**) aranır"
patognomonik: null
ilk_tetkik: "İlk iş **nedeni bulmaktır**; deliryum bir tanı değil, **bir kriz halidir**. Yatak başında: yaşamsal bulgular, **oksijen satürasyonu, kan şekeri, ağrı, idrar retansiyonu** kontrolü; **ilaç listesinin baştan gözden geçirilmesi** (**antikolinerjikler, opioidler, benzodiazepinler**). Tetkik paketi: **tam kan sayımı, elektrolitler (sodyum, kalsiyum), glukoz, böbrek-karaciğer, TSH, B12, idrar analizi-kültürü, EKG**; kuşkuda **toksikolojik tarama ve beyin görüntülemesi**. Demans üzerine binen deliryum **akut-dalgalı niteliği ve dikkat bozukluğuyla** demansın kronik gidişinden ayrışır"
kesin_tani: "**DSM-5-TR ölçütleri**: **dikkati yönlendirme-odaklama-sürdürmede bozulma + çevre bilincinde azalma**; tablonun **saatler-günler içinde** gelişip **gün içinde dalgalanması**. **Bellek, oryantasyon, dil, algı ya da görsel-mekânsal bilişte ek bozulma**; önceden var olan demansın kendi gidişi ya da **koma** ile açıklanamaz. Bir **genel tıbbi durumun, maddenin** ya da ikisinin birleşiminin doğrudan fizyolojik sonucu. **Alkol kesilmesi kaynaklı deliryum tremens** ayrı bir acil tablodur: **otonomik hiperaktivite + halüsinasyon**; tedavisi **benzodiazepinle** yapılır"
ilk_tedavi: "Önce **neden tedavi edilir**: enfeksiyon, metabolik bozukluk, ilaç etkisi, retansiyon, ağrı ve hipoksi hızla düzeltilir. **Çevre yönetimi ilaçtan önce gelir**: ışığın gündüz-gece ritmi, **saat-takvim-yön bilgileri**, **gözlük-işitme cihazı**, aile yakını, gereksiz kateter-monitörlerin çıkarılması; **bağlama son çaredir ve tabloyu ağırlaştırır**. Ajitasyon tehlikeye dönüşünce **düşük doz antipsikotik** kısa süre düşünülür — **haloperidol** klasik seçenek, **kuetiapin** alternatif; **QT uzaması** ve **Parkinson-Lewy cisimcikli** hastada antipsikotikten kaçınılır. **Alkol kesilmesi kaynaklı** tabloda ilk seçenek antipsikotik değil **benzodiazepindir**"
klasik_komplikasyon: "Tedavisiz uzayan deliryumda **düşme, aspirasyon, dekübit ve beslenme bozukluğu**; **yoğun bakımda mortalite ve mekanik ventilasyon süresinde artış**; **deliryum sonrası demans** ve kalıcı bilişsel kayıp"
