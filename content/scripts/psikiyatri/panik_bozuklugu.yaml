id: panik_bozuklugu
version: 1
status: draft
author: "ai-drafts/psikiyatri-2"
sources:
  - "DSM-5-TR — Anksiyete Bozuklukları tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: NICE panik bozukluğu tedavi kılavuzu (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: Panik Bozukluğu
taksonomi:
  - [ktbt, psikiyatri, psik_anksiyete, psik_an_panik]
tipik_hasta: "Başlangıç tipik olarak 20-30'lu yaşlarda; kadınlarda sıklık erkeklere oranla yaklaşık iki kat. Hasta çoğunlukla acil servise ya da kardiyolojiye 'kalbim duracak, boğazım kapanıyor' şikâyetiyle gelir: genç, sağlıklı görünümlü birine ani başlayan çarpıntı, nefes darlığı, göğüs sıkışması ve ölüm korkusu. Kardiyolojik ve laboratuvar değerlendirmeler normal çıkar; hasta tekrar tekrar acile başvurur, 'bende gizli bir kalp hastalığını bulamadılar' der. Ataklar arasında 'yine gelecek' beklentisi ve güvenli hissettiği yerden çıkmama gelişir; bu ikili bozukluğun imzasıdır"
patofizyoloji: "Korku devresinin (amigdala ve onu frenleyen prefrontal kontrolün) aşırı duyarlılığı merkeze koyulur: normal iç sinyaller (kalp atışının artması, baş dönmesi) felaket biçiminde yorumlanır ve alarm yanıtına dönüşür. Noradrenalin (locus coeruleus) ve serotonin sistemlerinin aşırı tepkiliği biyolojik yatkınlığı oluşturur; panik hastalarında karbondioksit solunumu ve sodyum laktat infüzyonu atak tetiklediği için solunum düzenleyicilerine aşırı duyarlılık (boğulma alarmının eşik kayması) öne çıkan kuramdır. Hiperventilasyonla kaybedilen karbondioksit parestezi, baş dönmesi ve göğüs sıkışmasını fiziksel olarak açıklar; bu belirtiler hastanın kalp krizi yorumunu besleyip döngüyü pekiştirir"
anahtar_bulgular:
  - "Panik atak: dakikalar içinde zirveye ulaşan (çoğunlukla 10 dakika içinde), 10-20 dakika süren yoğun korku dalgası; çarpıntı, terleme, titreme, nefes darlığı, göğüs ağrısı, bulantı, baş dönmesi, üşüme-ateş basması, parestezi, derealizasyon-depersonalizasyon, kontrol kaybı-çıldırma korkusu ya da ölüm korkusundan en az dördü birlikte"
  - "Ataklar beklenmedik anda, belirgin bir tetikleyici olmadan gelir; gece uykudan uyandıran ataklar (noktürnal panik) tipiktir"
  - "En az bir ataktan sonra 1 ay ve daha uzun süre: yinelenen atakları bekleme kaygısı ya da atak sonuçlarına bağlı uyumsuz davranış değişikliği (tek başına dışarı çıkmama, sürekli acile gitme) — tanının ikinci ayağı"
  - "Agorafobi eşlik edebilir: toplu taşıma, açık alanlar, kalabalık-kuyruk, evden tek başına çıkamama; kaçınma davranışı işlevi belirgin kısıtlar"
  - "Tekrarlayan acil başvuruları, normal kardiyolojik tetkik öyküsü ve hastanın kendine gizli bir bedensel hastalık araması tanıyı destekler; psikiyatrik görüşmede atak döngüsünü genellikle tanıdığını söyler"
patognomonik: null
ilk_tetkik: "İlk atak sonrası başvuruda organik dışlama yapılır: EKG, tam kan sayımı, glukoz, TSH ve temel biyokimya; hipertiroidi, aritmi ve feokromositoma gibi taklitler ile kafein fazlalığı, reçeteli ilaçlar (salbutamol, levotiroksin, steroid) ve uyarıcı madde kullanımı (kokain, amfetamin) sorgulanır. Atakların beklenmedik karakteri, tekrarlayan normal tetkikler ve atak sırasında çekilen normal EKG öyküsü klinik tanıyı destekler; şiddet izleminde panik ve agorafobi ölçekleri kullanılır"
kesin_tani: "DSM-5-TR ölçütlerine göre: yinelenen beklenmedik panik ataklar; en az bir ataktan sonra 1 ay ve daha uzun süre boyunca (a) yine atak geçirme kaygısı ya da (b) atakların sonuçlarına (kalp krizi, çıldırma gibi korkular) bağlı uyumsuz davranış değişikliği; atakların bir maddenin fizyolojik etkisiyle ya da başka bir tıbbi durumla açıklanamaması; atakların başka bir ruhsal bozuklukla daha iyi açıklanamaması (sosyal kaygı bozukluğunda yalnızca sosyal değerlendirme durumlarında, spesifik fobide yalnızca fobik nesneyle karşılaşınca, obsesif-kompulsif bozuklukta obsesyonu tetikleyen durumda, travma sonrası stres bozukluğunda travma anısına bağlı ataklar)"
ilk_tedavi: "İlk seçenek SSRI artı bilişsel davranışçı terapidir: SSRI düşük dozla başlanır çünkü tedavinin ilk günlerinde anksiyete geçici olarak artabilir — hasta bu geçici aktivasyon hakkında önceden bilgilendirilir; klinik yanıt 8-12 haftada değerlendirilir (sertralin, paroksetin, eskitalopram). BDT'nin bileşenleri mantığı taşır: felaket yorumunu sınama (kalp krizi inancını gerçek verilerle karşılaştırma), interoseptif duyarlılaştırma (dönmek, hızlı nefes almak, merdiven koşmakla çarpıntıyı bilinçli üretip tekrar tekrar yaşayarak alışma) ve kaçınmanın adım adım azaltılması; nefes düzenleme egzersizleri eklenir. Benzodiyazepin hızlı rahatlatır ama tolerans ve bağımlılık riski nedeniyle rutin ilk tedavi değildir; SSRI'nın etki etmeye başladığı ilk haftalarda kısa süreli köprü olarak düşünülebilir. İdame 6-12 ay sürdürülür; ilaç ani kesilmez — yavaş azaltma yapılır, çünkü kesilme sırasında görülen sıçrama atakları hastada 'ilaç işe yaramadı' hissi yaratabilir"
klasik_komplikasyon: "Agorafobi gelişimi ve işlev kaybı; depresyon ile alkol ve sakinleştirici kullanımı eş tanıları; gereksiz kardiyolojik tetkikler ve tekrarlayan acil başvurular"
