id: panik_bozuklugu
version: 1
status: draft
author: "ai-drafts/psikiyatri-2"
sources:
  - "DSM-5-TR — Anksiyete Bozuklukları tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)"
  - "Klinik rehberler: NICE panik bozukluğu tedavi kılavuzu (referans olarak listelendi, metin projesi özgün yazımdır)"
ad: Panik Bozukluğu
taksonomi:
  - [ktbt, psikiyatri, psik_anksiyete, psik_an_panik]
tipik_hasta: "Başlangıç tipik olarak **20-30'lu yaşlarda**; kadınlarda **yaklaşık iki kat** sık. Hasta çoğunlukla acile ya da kardiyolojiye '**kalbim duracak, boğazım kapanıyor**' şikâyetiyle gelir: **ani başlayan çarpıntı, nefes darlığı, göğüs sıkışması ve ölüm korkusu**; kardiyolojik ve laboratuvar değerlendirmeler **normal** çıkar, hasta tekrar tekrar acile başvurur. Ataklar arasında '**yine gelecek**' beklentisi ve **güvenli hissettiği yerden çıkmama** bozukluğun imzasıdır"
patofizyoloji: "**Korku devresinin (amigdala-prefrontal kontrol) aşırı duyarlılığı** merkezedir: normal iç sinyaller (kalp atışının artması, baş dönmesi) **felaket biçiminde** yorumlanır ve alarm yanıtına dönüşür. **Noradrenalin (locus coeruleus) ve serotonin** sistemlerinin aşırı tepkiliği biyolojik yatkınlık; **karbondioksit solunumu ve sodyum laktat infüzyonu** atak tetiklediği için **solunum düzenleyicilerine aşırı duyarlık (boğulma alarmının eşik kayması)** öne çıkan kuramdır. **Hiperventilasyonla kaybedilen karbondioksit** parestezi ve göğüs sıkışmasını açıklar; bu **kalp krizi yorumunu** besleyip döngüyü pekiştirir"
anahtar_bulgular:
  - "**Panik atak**: dakikalar içinde zirveye ulaşan (çoğunlukla **10 dakika içinde**) yoğun korku dalgası; çarpıntı, terleme, nefes darlığı, göğüs ağrısı, parestezi, derealizasyon, ölüm korkusundan **en az dördü birlikte**"
  - "Ataklar **beklenmedik anda**, belirgin bir tetikleyici olmadan gelir; **gece uykudan uyandıran (noktürnal panik)** tipiktir"
  - "**En az bir ataktan sonra 1 ay ve daha uzun süre**: **yinelenen atakları bekleme kaygısı** ya da atak sonuçlarına bağlı **uyumsuz davranış değişikliği** — **tanının ikinci ayağı**"
  - "**Agorafobi** eşlik edebilir: toplu taşıma, açık alanlar, kalabalık-kuyruk, **evden tek başına çıkamama**; kaçınma işlevi belirgin kısıtlar"
  - "**Tekrarlayan acil başvuruları**, normal kardiyolojik tetkik öyküsü ve gizli bedensel hastalık arayışı tanıyı destekler"
patognomonik: null
ilk_tetkik: "İlk atak sonrası başvuruda **organik dışlama** yapılır: **EKG, tam kan sayımı, glukoz, TSH ve temel biyokimya**. **Hipertiroidi, aritmi ve feokromositoma** taklitleri; **kafein fazlalığı**, **salbutamol, levotiroksin, steroid** ve uyarıcı maddeler (**kokain, amfetamin**) sorgulanır. Atakların **beklenmedik karakteri** ve **atak sırasında çekilen normal EKG** öyküsü tanıyı destekler"
kesin_tani: "**DSM-5-TR ölçütlerine göre**: **yinelenen beklenmedik panik ataklar**; en az bir ataktan sonra **1 ay ve daha uzun** (a) **yine atak geçirme kaygısı** ya da (b) **sonuçlarına bağlı uyumsuz davranış değişikliği**. Ataklar **bir maddenin fizyolojik etkisiyle** ya da başka bir tıbbi durumla açıklanamaz; başka bir bozuklukla daha iyi açıklanamaz — **sosyal kaygıda yalnız sosyal değerlendirme durumlarında**, **spesifik fobide yalnız fobik nesneyle** karşılaşınca atak olur"
ilk_tedavi: "İlk seçenek **SSRI artı bilişsel davranışçı terapidir**: SSRI **düşük dozla** başlanır çünkü ilk günlerde anksiyete **geçici artabilir** — hasta önceden bilgilendirilir; yanıt **8-12 haftada** değerlendirilir (**sertralin, paroksetin, eskitalopram**). BDT bileşenleri: **felaket yorumunu sınama**, **interoseptif duyarlılaştırma** (dönmek, hızlı nefes almakla çarpıntıyı bilinçli üretme), kaçınmanın **adım adım azaltılması**. **Benzodiazepin** hızlı rahatlatır ama **tolerans ve bağımlılık** nedeniyle rutin ilk tedavi değildir; ilk haftalarda **kısa süreli köprü**. İdame **6-12 ay** sürdürülür; **ani kesilmez** — kesilme sırasındaki **sıçrama atakları** 'ilaç işe yaramadı' hissi yaratabilir"
klasik_komplikasyon: "**Agorafobi gelişimi** ve işlev kaybı; **depresyon ile alkol ve sakinleştirici kullanımı** eş tanıları; **gereksiz kardiyolojik tetkikler ve tekrarlayan acil başvuruları**"
tus_gecmisi: []
