id: tssb
version: 1
status: draft
author: ai-drafts/psikiyatri-3
sources:
- DSM-5-TR — Travma ve Stresle İlişkili Bozukluklar (TSSB) tanı ölçütleri (referans olarak listelendi,
  metin projesi özgün yazımdır)
- 'Klinik rehberler: APA TSSB Rehberi ve VA-DoD travma sonrası stres bozukluğu kılavuzu (referans olarak
  listelendi, metin projesi özgün yazımdır)'
ad: Travma Sonrası Stres Bozukluğu
taksonomi:
- - ktbt
  - psikiyatri
  - psik_okb_travma
  - psik_ot_tssb
tipik_hasta: "Gerçek ya da tehdit edilmiş **ölüm, ağır yaralanma ya da cinsel şiddet** (trafik kazası, deprem, savaş, taciz, yoğun bakım deneyimi) sonrasında başvuran hasta; sık yakınmalar '**uykuya dalamıyorum**, **kâbuslarım var**, **çarpıntı-sinirlilik**' biçimindedir ve hasta travmayı **kendiliğinden anlatmayabilir** — **öyküde travmanın ayrıntılı sorgulanması** tanıyı açar. Çocuklarda **oyunla travmayı yeniden canlandırma** ve **önceden kazanılmış becerilerin gerilemesi**; **travmaya maruz kalan meslek grupları** risk altındadır"
patofizyoloji: "**Korku devresinin kalıcı dengesizliği**: **amigdala aşırı yanıt verirken medial prefrontal korteks ve anterior singulat baskılayamamaktadır**; **hipokampal hacim küçülür**, travma anı '**şimdi ve burada**' gibi yaşanır. **HPA aksında ters örüntü**: **kortizol görece düşük, CRH yüksek** (negatif geri bildirim aşırı duyarlı); **noradrenalin hiperaktivitesi** uyarılmışlık ve **artmış başlama (startle) refleksini**, **endojen opioid düzeni bozukluğu** duygusal uyuşukluk ve **disosiyasyonu** açıklar"
anahtar_bulgular:
- "**Girinti (yeniden yaşantılama) kümesi**: istemsiz anı girişleri, **kâbuslar**, **flaşbek (disosiyatif yeniden yaşantılama)** atakları, travmayı anımsatan uyaranlarda **yoğun sıkıntı ve fizyolojik tepki**"
- "**Kaçınma kümesi**: travmayla ilgili düşünce-duygulardan ve kişiler-yerler-sohbetler gibi **dış uyaranlardan ısrarla uzak durma**"
- "**Biliş-duygudurum kümesi**: olumsuz inançlar ('hep güvensizim'), kendini ya da başkalarını **suçlama**, ilgi-zevk azalması, insanlardan **kopukluk**"
- "**Uyarılmışlık kümesi**: sinirlilik-öfke, **aşırı tetikte olma**, **artmış başlama refleksi**, konsantrasyon ve **uyku bozukluğu**"
- "**Süre penceresi**: belirtiler travmadan sonra başlayıp **1 aydan uzun** sürmeli; **1 aydan kısa akut stres bozukluğu**, **3 aydan uzun kronik**, **6 aydan sonra başlayan gecikmeli ifadeli**"
- "**Disosiyatif özellikler**: **depersonalizasyon** (kendinden kopmuş hissetme), **derealizasyon** (çevrenin gerçek dışı görünmesi)"
patognomonik: null
ilk_tetkik: "Ayrıntılı psikiyatrik görüşme; derecelendirmede **altın standart yapılandırılmış görüşme (CAPS-5)**, taramada **PC-PTSD-5**. **Madde kullanımı ve yoksunluk** tabloları dışlanır; **depresyon, diğer anksiyete bozuklukları ve intihar riski** değerlendirilir; **kafa travması** varsa nörolojik değerlendirme; travmanın türüne göre **güvenlik ve yeniden mağduriyet riski** planlanır"
kesin_tani: "**DSM-5-TR ölçütleri**: ölüm, ağır yaralanma ya da cinsel şiddete **gerçek maruziyet** — bizzat yaşama, bizzat tanık olma, yakın birine olduğunu öğrenme, **mesleki olarak yinelenen maruziyet**. Ardından **girintide en az 1, kaçınmada en az 1, biliş-duygudurumda en az 2, uyarılmışlıkta en az 2** belirtinin **1 aydan uzun** sürmesi; **sıkıntı ya da işlev kaybına** yol açması. Tablo **bir maddeye ya da başka tıbbi duruma** bağlanamamalı; **disosiyatif özellik belirtici** ayrıca işaretlenir"
ilk_tedavi: "Birinci basamak **travmaya odaklı psikoterapilerdir**: **uzun süreli maruz bırakma, bilişsel işleme terapisi ve EMDR**. **SSRI'lardan sertralin ve paroksetin** TSSB endikasyonuyla onaylıdır, **venlafaksin** de seçenek; **kâbuslarda prazosin** yardımcıdır. **Benzodiazepinler önerilmez**: bağımlılık riski taşır ve iyileşmeyi kötüleştirebilir. **Tek oturumlu travma debrifingi yarar sağlamaz, uygulanmaz**; eşlik eden **depresyon ve madde kullanım bozukluğu** birlikte tedavi edilir"
klasik_komplikasyon: "**Depresyon** (eş tanı çok sık), **madde kullanım bozukluğu**, **intihar girişimi**; **kronikleşme** ile iş-işlev kaybı ve ilişki kopmaları; tanınmadığında belirsiz **somatik yakınmalarla** tekrarlanan poliklinik başvuruları"
