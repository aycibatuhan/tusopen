id: alkol_bagimliligi
version: 1
status: draft
author: ai-drafts/psikiyatri-2
sources:
- DSM-5-TR — Madde İlişkili ve Bağımlılık Bozuklukları tanı ölçütleri (referans olarak listelendi, metin
  projesi özgün yazımdır)
- 'Klinik rehberler: NICE alkol kullanım bozukluğu kılavuzu (referans olarak listelendi, metin projesi
  özgün yazımdır)'
ad: Alkol Kullanım Bozukluğu
taksonomi:
- - ktbt
  - psikiyatri
  - psik_madde
  - psik_md_alkol
tipik_hasta: "Orta yaşta, çoğunlukla erkek (kadında hastalık **daha hızlı ilerler**, organ komplikasyonları kısa sürede çıkar — **teleskoplaşma**); **sabah içme ihtiyacı**, tolerans artışı, kesememe ve içmeyi yoksunluk çıkarmamak için erkene kaydırma öyküsü tanıyı çağrıştırır; laboratuvar imzası: **GGT yüksekliği**, **AST'nin ALT'den yüksek olması**, **yüksek MCV (makrositoz)**; **aile öyküsü** riski belirgin artırır, hasta çoğu kez karaciğer enzim yükselmesi, **pankreatit** ya da travmayla kliniklere düşer — **alkol sorgusu eksik kalmasın**"
patofizyoloji: "Alkol **GABA-A** resektörünü güçlendirip **NMDA** glutamat resektörünü baskılar (sedasyon, gevşeme, ataksi), kronik kullanımda **GABA-A resektör sayısı azalır, NMDA resektörleri çoğalır**; kesilince **GABA yetersizliği ve glutamat fazlalığı** merkezî aşırı uyarılma yapar, yoksunluk tedavisi **benzodiyazepinle GABA tonusunu** yerine koymaktır; ödül devresinde **endojen opioid ve dopamin** salınımını artırır, **naltreksonun** mantığı **μ reseptör blokajı**dır; **tiamin** piruvat dehidrogenaz ve alfa-ketoglutarat dehidrojenazın koenzimidir, eksikliğinde **mamillar cisim nekrozu Wernicke ensefalopatisini**, gecikirse kalıcı **Korsakoff sendromunu** doğurur"
anahtar_bulgular:
- "**Yoksunluk zaman çizelgesi**: **6-12 saatte** ince tremor, ajitasyon, terleme, bulantı, insomni; **12-48 saatte** canlı halüsinasyonlar (böcek ve hayvan görme, hakaret eden sesler — içgörü korunur); **24-48 saatte** jeneralize tonik-klonik konvülsiyonlar"
- "**48-72 saatte** başlayıp haftayı bulabilen **deliryum tremens**: konfüzyon, canlı halüsinasyonlar, otonom hiperaktivite (taşikardi, hipertansiyon, hipertermi, terleme) — **tedavisiz ölümcüldür**"
- "Tolerans ve kesememe, içmenin sabaha kayması; **karaciğer spektrumu**: **yağlı karaciğer**, **alkol ilişkili hepatit — AST/ALT 2'nin üstünde ama her ikisi de 500'ü geçmez**, **GGT belirgin yüksek**; siroz komplikasyonları (asit, varis kanaması, ensefalopati)"
- "**Wernicke ensefalopatisi üçlüsü**: konfüzyon, **yürüme ataksisi**, **oftalmopleji-nistagmus**; tanı klinikte konur, MR'da **mamillar cisimlerde sinyal değişimi**; gecikirse kalıcı **Korsakoff sendromu** (anterograd amnezi, konfabülasyon)"
patognomonik: null
ilk_tetkik: "Yoksunluk hastasında ilk iş **CIWA-Ar** ölçeğiyle şiddetlendirme ve vital bulguların izlenmesidir; **kan şekeri** (hipoglisemi riski), elektrolitler (**hipokalemi**, **hipomagnezemi**, **hipofosfatemi**), tam kan sayımı, karaciğer fonksiyonları, pıhtılaşma (INR), amilaz-lipaz ve EKG istenir; konfüzyon, ataksi ya da göz hareket bozukluğu olan her hastada **Wernicke** düşünülür ve tanı doğrulaması beklenmeden **tiamin** başlanır; yoksunluğun şiddetini öngörmede **geçmiş konvülsiyon ve deliryum tremens öyküsü** ile eşlik eden tıbbi hastalıklar belirleyicidir"
kesin_tani: "**DSM-5-TR**: aynı **12 ay** içinde **11 ölçütten en az ikisi** — kesme-azaltmada tekrarlayan başarısızlık, **güçlü istek (craving)**, tehlikeli durumlarda içme, **tolerans** ve **yoksunluk** dahil; **2-3 belirti hafif, 4-5 orta, 6 ve üzeri ağır** şiddet sayılır; yoksunluk ayrı tanı olarak kodlanır: **alkol yoksunluğu**, **deliryumla ya da deliryumsuz**"
ilk_tedavi: "Yoksunluğun temeli **benzodiyazepindir** (kesilen alkolün **GABA tonusunu** yerine koyar), doz **CIWA-Ar** skoruna göre ayarlanır; karaciğer fonksiyonu bozuk hastada **glukuronidasyonla metabolize olan lorazepam ya da oksazepam** güvenlidir (diazepamın uzun etkisi ve aktif metaboliti risklidir), ağır tabloda **intravenöz** gerekir; **tiamin** ve beslenme desteği özellikle **glukoz infüzyonundan ÖNCE** verilir — glukoz kalan tiamini tüketip latent **Wernicke'yi** tetikleyebilir, magnezyum da düzeltilir; idame: **naltrekson** (**μ reseptör antagonisti**, ağır karaciğer yetmezliğinde kullanılmaz), **akamprozat** (böbrek yetmezliğinde kontrendike), **disülfirm** (**asetaldehit dehidrojenaz inhibitörü**, alkolle kızarma-bulantı-taşikardi yapar); **Wernicke**de yüksek doz **intravenöz tiamin** günlerce sürdürülür"
klasik_komplikasyon: "**Deliryum tremens** (yoksunluğun ölümcül komplikasyonu); **Wernicke-Korsakoff sendromu** (kalıcı bellek kaybı); **alkolik karaciğer hastalığı** evreleri, **pankreatit** ve **dilate kardiyomiyopati**; gebelikte **fetal alkol sendromu**"
