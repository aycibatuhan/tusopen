id: somatik_belirti_bozuklugu
version: 1
status: draft
author: ai-drafts/psikiyatri-5
sources:
- DSM-5-TR — Somatik Belirti Bozukluğu tanı ölçütleri (referans olarak listelendi, metin projesi özgün
  yazımdır)
- 'Klinik rehberler: somatik belirtilerin genel tıbbi yönetimi (NICE ve APA kaynakları) — referans olarak
  listelendi, metin projesi özgün yazımdır'
ad: Somatik Belirti Bozukluğu
taksonomi:
- - ktbt
  - psikiyatri
  - psik_somatik_dissosiyatif
  - psik_sd_somatik_belirti
tipik_hasta: "**En az 6 aydır**, çoğunlukla birden fazla vücut bölgesini tutan somatik şikayetlerle (ağrı, yorgunluk, sindirim, kalp-nabız, nefes) **hekim hekim dolaşan** hasta; **şikayete yüklenen düşünce-duygu-davranış kümesi** — tekrar tekrar tetkik isteme, sürekli araştırma, işten kaçınma — şikayetin kendisinden **daha belirgin işlev kaybı** yaratır. **Kronik tıbbi hastalık (diyabet, migren) varken de tanı konabilir**: DSM-5-TR belirleyici olarak **organik açıklamanın yokluğunu değil, orantısız düşünce-duygu-davranışı** ölçüt tutmuştur"
patofizyoloji: "**Şikayet gerçektir** — tanı bir reddetme değildir. Beden duyumları (**interosepsiyon**) dikkatin sürekli merkezi olur, **tehdit sinyali olarak (katastrofik yorumlama)** okunur; **otonomik uyanıklık ve kas gerginliği** duyuyu gerçekten güçlendirir. **Kaçınma, dinlenme ve doktor doktor dolaşma** kısa dönemde rahatlama sağlar ama **işlev kaybını ve bedene odaklanmayı pekiştirir**. **Çocuklukta kronik hastalık, ailede hastalık-dikkat eşleşmesi, travma-istismar** öyküsü ve **depresyon-anksiyete** riski artırır"
anahtar_bulgular:
- "**En az 6 aydır** süren, belirgin sıkıntı ya da işlev kaybına yol açan bir ya da birkaç somatik şikayet"
- "**Orantısız düşünceler**: belirtinin **ciddi bir hastalığın işareti** olduğuna ilişkin sürekli ve saplantılı yorumlar"
- "**Sağlıkla ilgili yüksek düzeyde kaygı**; '**normal**' tetkik sonuçları hastayı **kısa süre** rahatlatır, sonra kuşku yeniden başlar"
- "**Şikayete aşırı zaman-enerji harcama**: tekrar tekrar **hekim değiştirme, tetkik isteme, sürekli araştırma**"
- "İşlev kaybı belirtinin şiddetiyle değil, **şikayete harcanan zaman ve kaçınma davranışıyla** ölçülür"
patognomonik: null
ilk_tetkik: "Yaklaşım iki ucu birleştirir: **organik hastalığı göz ardı etmek kadar her başvuruda yeni bir tarama paketi açmak da hastaya zarar verir**. İlk değerlendirme **hedefe yönelik** ve **alarm bulgularına** göre sınırlıdır — **kilo kaybı, ateş, kanama, nörolojik kayıp, ilerleyici gidiş**; alarm yoksa **tekrar tetkik açılmaz**. **Depresyon, anksiyete ve travma öyküsü** her hastada sorgulanır"
kesin_tani: "**DSM-5-TR ölçütleri**: **en az bir somatik belirti**; ciddiyetine ilişkin **orantısız ve sürekli düşünceler**; **belirgin yükseklikte sağlık kaygısı** ya da **orantısız zaman-enerji**. Durum **belirgin sıkıntıya ya da işlev kaybına** yol açar; **kalıcıdır (süre en az 6 aydır)**. **'Tıbbi açıklanamama' tanı ölçütü değildir** — organik hastalık varken de tanı kurulur; belirleyici **düşünce-duygu-davranış kümesidir**; tablo **panik, yaygın anksiyete, sanrısal bozukluk ya da madde etkisiyle** açıklanamaz"
ilk_tedavi: "Yönetimin omurgası **ilişki ve düzendir**: **tek bir sorumlu hekim**, düzenli aralıklarla kısa görüşmeler (şikayet arttığında değil), **gereksiz tetkik ve girişimin sınırlanması**; şikayet '**gerçek değil**' diye reddedilmez ama **işlev ve gerçekçi hedefler** öne alınır. **Bilişsel davranışçı terapi** merkezde: bedene odaklanmayı azaltma, **katastrofik yorumu düzeltme**, kaçınmayı bozma, **kademeli aktivasyon**. **Depresyon-anksiyete** varsa **SSRI** düşünülür"
klasik_komplikasyon: "**Gereksiz tetkik ve girişimlerin iatrojenik zararı** (radyasyon, ameliyat, ilaç yan etkileri); **kronik işlev kaybı** ve çalışma yaşamından uzaklaşma; **depresyon-anksiyete** birlikteliği ve intihar riskinde artış"
