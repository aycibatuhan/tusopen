id: okb
version: 1
status: draft
author: ai-drafts/psikiyatri-2
sources:
- DSM-5-TR — Obsesif-Kompulsif ve İlişkili Bozukluklar tanı ölçütleri (referans olarak listelendi, metin
  projesi özgün yazımdır)
- 'Klinik rehberler: NICE obsesif-kompulsif bozukluk tedavi kılavuzu (referans olarak listelendi, metin
  projesi özgün yazımdır)'
ad: Obsesif-Kompulsif Bozukluk
taksonomi:
- - ktbt
  - psikiyatri
  - psik_okb_travma
  - psik_ot_okb
tipik_hasta: "Başlangıç çoğunlukla ergenlik-geniç erişkinlik çağında; erkeklerde ortalama daha erken (**15-20 yaş**). '**Kafamdan çıkmayan, anlamsız olduğunu bildiğim ama engelleyemediğim düşüncelerim var**; **ellerimi saatlerce yıkıyorum**' demesi tipiktir; utanç ve gizleme yüzünden tanı çoğu hastada **yıllarca gecikir**. En sık içerikler: **kirlenme-bulaşma ve yıkama, kuşku ve tekrar kontrol, simetri-tamlama, sevdiklerine zarar verme, dini-cinsel imgeler**. Çocuklukta **tik bozukluğu** ve **streptokok enfeksiyonu sonrası ani başlangıç (PANDAS)** sorgulanır"
patofizyoloji: "**Kortiko-striato-talamo-kortikal devrenin** (orbitofrontal korteks, ön singulat, kaudat, talamus döngüsü) **hiperaktivitesi** ortak bulgudur: '**hata sinyali**' sürekli yanar, kompulsiyon bu hissi **geçici olarak söndürür**. **Serotonerjik** sistem **SSRI ve klomipraminin** etkinliğiyle ilaç seçimini yönlendirir; **glutamaterjik** katkı, **SSRI'ya eklenen düşük doz antipsikotiğin** mantığını açıklar. Çocukluk olgularının bir bölümünde **grup A beta-hemolitik streptokok enfeksiyonu sonrası antikor aracılı bazal ganglion tutulumu (PANDAS)** öne sürülür"
anahtar_bulgular:
- "**Obsesyonlar**: istenç dışı, yinelenen düşünce-dürtü-imge — kirlenme, zarar verme, simetri; **egodistoniktir** (kişiye yabancı ve sıkıntı verici), **içgörü korunur**"
- "**Kompulsiyonlar**: obsesyon kaygısını azaltmak için yinelenen davranış ya da **zihinsel eylem** — yıkama, kontrol, sayma, dizme, zihinsel ritüeller (dua etme, yerine koyma)"
- "**Döngü**: obsesyon kaygıyı yükseltir, kompulsiyon **kısa rahatlama** sağlar ve bu pekiştirme tabloyu büyütür; ritüeller **günde 1 saati aşar**, iş-öğrenim-öz bakım bozulur"
- "İçgörü genelde iyi ya da değişkendir; **psikotik bozuklukta inanç sanrısal katılığa** dönüşür — OKB'de **düşüncelere yabancılık korunur**"
- "**Eş tanılar**: **tik bozukluğu** (özellikle çocuklarda), **depresyon** ve diğer anksiyete bozuklukları; birinci derece akrabada OKB ve tik öyküsü sıktır"
patognomonik: null
ilk_tetkik: "Klinik görüşme temel; **Yale-Brown Obsesif Kompulsif Ölçek (Y-BOCS)** şiddeti derecelendirir ve tedavi izleminde kullanılır. Obsesyonlar utanç yüzünden açık söylenmez — **doğrudan sorulmalıdır**. **Tik, depresyon, bipolar öyküsü (SSRI'ya mani yanıtı riski)** ve madde kullanımı değerlendirilir; organik nedenler (bazal ganglion lezyonları) nadirdir, rutin laboratuvar **tanı koymaz**"
kesin_tani: "**DSM-5-TR ölçütlerine göre**: **obsesyonlar ve/veya kompulsiyonların varlığı**; bunların **zaman alıcı olması (günde 1 saatten fazla)** ya da klinik olarak belirgin **sıkıntı ya da işlev bozukluğu** yol açması. Tablo **bir maddenin fizyolojik etkisiyle** açıklanamaz ve başka bir bozukluğun içeriğiyle sınırlı olmamalı; **yalnız kilo-görünüm obsesyonu yeme bozukluğunda**, **yalnız saç koparma trikotillomanide**, **yalnız gelecek endişesi yaygın anksiyetede** sayılır"
ilk_tedavi: "İlk basamak: **ekspozisyon ve yanıt önleme (EYO)** bileşenli **bilişsel davranışçı terapi** ile **SSRI**. **SSRI'nın OKB'de dozları depresyondan yüksektir** (örneğin **sertralinin 200 mg**) ve etki daha geç gelir — **tam dozda 8-12 hafta** beklenmelidir. Yanıt yetersizse **SSRI'ya düşük doz antipsikotik ekleme** (**risperidon, aripiprazol**) ya da **klomipramine** geçiş. **Klomipramin en etkin ilaçtır** ama **antikolinerjik etkileri, ortostatik hipotansiyonu, konvülsiyon eşiğini düşürmesi ve QT uzatması** nedeniyle dikkat ister. **Benzodiyazepinler etkisizdir**; dirençli-ağır tablolarda **derin beyin stimülasyonu ya da kapsülotomi** son çaredir"
klasik_komplikasyon: "**Depresyon eş tanısı ve intihar riski**; ritüellerle **günde saatlerce kaybedilen zamanla** işlev kaybı; tedavisiz **kronik seyir**"
