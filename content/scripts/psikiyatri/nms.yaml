sources:
  - "Levenson nöroleptik malign sendrom kriterleri — referans olarak listelendi, metin projesi özgün yazımdır"
  - "Klinik rehberler: nöroleptik malign sendrom yönetimi (APA kaynakları ve toksikoloji dernekleri) — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Nöroleptik Malign Sendrom
taksonomi:
  - [ktbt, psikiyatri, psik_psikofarmakoloji, psik_pf_nms]
tipik_hasta: "**Yeni başlanmış ya da dozu hızla artırılmış antipsikotik** kullanan hasta — özellikle yüksek potenslu **tipikler (haloperidol)** ve **depo formlar**; başlangıcı izleyen **ilk 2 hafta** içinde (çoğu olguda ilk günlerde) gelişir. **Dehidrate, ajite ya da katatonik** hastalar, **hızlı doz tırmanması** ve **bir kez NMS geçirmiş** hastada yeniden maruziyet en yüksek risk. **Metoklopramid** gibi diğer **D2 blokerleri** ve **levodopa kesilmesi** aynı tabloyu açar"
patofizyoloji: "**Dopamin D2 reseptör bloğunun** ani ve ağır tablosu: **striatumda dopamin fonksiyonunun çökmesi ağır rijiditeyi**, **hipotalamik ısı düzenlemesinin kilitlenmesi hipertermiyi**, **otonomik dengesizlik instabiliteyi** üretir. Rijit kas kitlesinin ısı üretimi tabloyu büyütür; kas yıkımı **kreatin kinazı** yükseltir. **Malign hipertermiyle** tablo benzer ama mekanizma farklıdır: burada **kas zarı değil dopamin bloğu** merkezdedir"
anahtar_bulgular:
  - "Ağır **'kurşun boru' rijidite**: ekstremitelerde sürekli direnç, **katalepsi, mutizm**"
  - "**Hipertermi**: sıcaklık çoğu hastada **38-41 derece** arası"
  - "**Otonomik instabilite**: terleme, kan basıncı dalgalanması, **taşikardi-hipertansiyon**"
  - "**Mental durum değişikliği**: konfüzyon, ajitasyon, mutizm-bilinç düzeyinde düşme"
  - "Laboratuvar: **kreatin kinazın belirgin yükselmesi, lökositoz, idrarda miyoglobin** — **rabdomiyolizin** işaretleri"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Antipsikotik başlangıcını izleyen günlerde ağır rijiditeyle birlikte hızla yükselen ateş**"
ilk_tetkik: "Kuşku anında ilk iş **antipsikotiği kesmektir**; tanıyı laboratuvar taşır: **kreatin kinaz, tam kan sayımı, elektrolitler, böbrek-karaciğer, idrar miyoglobini, koagülasyon (DIC izlemi), EKG**. **Sepsi, tiroid fırtınası, malign hipertermi, katatoni ve serotonin sendromu** kültür-klinikle dışlanır; **klonus-hiperrefleksinin belirgin olmaması serotonin sendromundan ayırır**"
kesin_tani: "Klinik tablo **D2 blokeri maruziyetini ya da dopamin agonisti kesilmesini** izler: **ağır rijidite + hipertermi + otonomik instabilite + mental durum değişikliği**; **kreatin kinaz yükselmesi** ve lökositoz destekler. **72 saatlik maruziyet koşulu Levenson kriterlerindedir** (DSM-5-TR'de NMS tanı ölçütü yoktur); klasik öğreti **ilk 2 hafta** penceresini öne çıkarır — bu pencereyi kaçırmak **en sık tanı gecikmesidir**. **Rijiditenin önde, klonusun yokluğunda** olması **serotonin sendromundan** ayrışmayı sağlar"
ilk_tedavi: "**Antipsikotik hemen kesilir**; **yoğun bakım** düzeyinde destek verilir: **aktif soğutma**, damar yolu sıvısı, elektrolit düzeltme. Rijidite için **dantrolen**; dopamin açığı için **bromokriptin ya da amantadin**. **Katatonik örtüşme ve dirençli tabloda EKT** düşünülür. İyileşen hastada gereksinim varsa uzun aradan sonra **çok düşük dozda ve düşük potenslu ya da atipik** ajanla dikkatli yeniden başlanır"
klasik_komplikasyon: "**Rabdomiyolizle akut böbrek hasarı**, **yaygın damar içi pıhtılaşma**, solunum yetmezliği ve aritmi; ağır ve tedavisiz olgularda **multiorgan yetmezlik**; iyileşen hastada **yeniden maruziyet riskinin kalıcı hale gelmesi**"
