tipik_hasta: "Her yaşta görülebilen, en sık **20-40 yaşlarında** başlayan ve tanı sıklığı kadınlarda **yaklaşık iki kat** olan hasta; 'çöktüğümü hissediyorum' demek yerine **yorgunluk, yaygın ağrı, uykusuzluk** gibi somatik yakınmalarla başvurur. **Kronik hastalık (diyabet, miyokard infarktüsü sonrası, kanser), hipotiroidi**, ağır yaşam olayları ve **ailede duygudurum bozukluğu** bu hastayı hatırlatır"
patofizyoloji: "Tek bir mekanizmaya indirgenemez: **Monoamin hipotezi** — sinaptik aralıkta **serotonin, noradrenalin ve dopamin** yetersizliği; **SSRI/SNRI** etkinliği destekler ancak **klinik faydanın haftalarca gecikmesi** hipotezi tek başına yetersiz kılar. Bugünkü anlayış **nöroplastisite bozukluğunu** (**BDNF azalması**, hipokampal nörogenesiste gerileme), **HPA aksı aşırı aktivasyonunu** (**hiperkortizolemi**) ve **amigdala-prefrontal ağ** bozukluğunu birlikte ele alır"
anahtar_bulgular:
- "**En az 2 haftadır çoğu gün** süren **çökkün duygudurum veya ilgi-zevk kaybı (anhedoni)** ile birlikte iş/okul/sosyal işlevsellikte kayıp — **tanının temel eşiği**"
- "**Bilişsel küme**: değersizlik ve orantısız **suçluluk**, dikkat-konsantrasyon azalması, **ölüm ya da intihar düşünceleri**"
- "**Vejetatif küme**: uykusuzluk (özellikle **sabaha karşı erken uyanma**), iştah azalması-kilo kaybı, enerji düşüklüğü, **psikomotor yavaşlama**; yakınmalar **sabah saatlerinde en ağırdır**"
- "**Melankolik özellikler**: **sabahları kötüleşme, erken uyanma**, belirgin anhedoni, iştahsızlık-kilo kaybı — **'endojen'** kalitede tablo"
- "**Atipik özellikler**: duygudurumun **güzel olaylara tepkiyle düzelmesi**, **hipersomni**, **iştah artışı-kilo alımı**, kol-bacaklarda **kurşun ağırlığı hissi**"
- "**İntihar riskinin doğrudan sorgulanması** — pasif-aktif düşünceler, plan, geçmiş girişim — **her depresif hastada rutin** yapılır"
patognomonik: null
ilk_tetkik: "Tanı **klinik psikiyatrik görüşmeye** dayanır; laboratuvar tanıyı koymaz. **PHQ-9 veya Beck Depresyon Envanteri** ile şiddet derecelendirilir; organik taklitler dışlanır: **TSH, tam kan sayımı, B12**, temel biyokimya; **steroid** gibi ilaç etkileri ve madde kullanımı sorgulanır. **İntihar riski ayrıntılı değerlendirilir**, yüksekse **hastaneye yatış** planlanır"
kesin_tani: "**DSM-5-TR ölçütlerine göre 9 belirtiden en az 5'i** — biri **çökkün duygudurum ya da anhedoni** olmak zorunlu — **2 hafta** boyunca. Belirgin **sıkıntı ya da işlev kaybına** yol açar; tablo **bir maddeye/ilaca veya başka bir tıbbi duruma** bağlanamamalı; hastada **hiç manik/hipomanik dönem olmamalı** — öykü varsa **bipolar bozukluk** tanısı öne geçer"
ilk_tedavi: "Hafif şiddette **psikoterapi** (özellikle **bilişsel davranışçı**) tek başına ilk adım olabilir; orta-ağır tabloda **SSRI ile psikoterapi** birlikte verilir. SSRI seçiminde **sertralin ve eskitalopram** ilk seçenektir (kardiyovasküler güvenlik, az etkileşim); **paroksetin yaşlılarda kaçınılır** (antikolinerjik, kesilme sendromu); **sitalopram yüksek dozda QT uzatır**. Yanıt **4-6. haftada** değerlendirilir; ilk atakta iyileşme sonrası tedavi **en az 6-9 ay** sürdürülür. **Psikotik özellikli depresyon, katatoni, yüksek intihar riski ve dirençli tablolarda EKT** en hızlı ve en etkili seçenektir"
klasik_komplikasyon: "**İntihar** — en önemli ölümcül komplikasyon; tedavisiz bırakıldığında **atakların kronikleşmesi**, tekrarlama sıklığının artması ve **işlevsellikte kalıcı kayıp**"
