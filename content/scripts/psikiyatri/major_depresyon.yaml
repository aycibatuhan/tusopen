id: major_depresyon
version: 1
status: draft
author: ai-drafts/psikiyatri
sources:
- DSM-5-TR — Majör Depresif Bozukluk tanı ölçütleri (referans olarak listelendi, metin projesi özgün yazımdır)
- 'Klinik rehberler: APA Depresyon Rehberi ve NICE depresyon kılavuzu (referans olarak listelendi, metin
  projesi özgün yazımdır)'
ad: Majör Depresif Bozukluk
