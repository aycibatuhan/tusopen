id: opioid_bagimliligi
version: 1
status: draft
author: ai-drafts/psikiyatri-3
sources:
- DSM-5-TR — Madde Kullanım Bozuklukları (Opioid Kullanım Bozukluğu) tanı ölçütleri (referans olarak listelendi,
  metin projesi özgün yazımdır)
- 'Klinik rehberler: WHO opioid bağımlılığının farmakolojik tedavisi kılavuzu (referans olarak listelendi,
  metin projesi özgün yazımdır)'
ad: Opioid Kullanım Bozukluğu
taksonomi:
- - ktbt
  - psikiyatri
  - psik_madde
  - psik_md_opioid
tipik_hasta: "Genç erişkinlerde öne çıkan hasta; başlangıç çoğu kez **reçeteli opioid** (ameliyat, sırt-kas ağrısı, diş çekimi) ile olur, ilaca erişim zorlaşınca **heroin, sentetik fentanil**'e geçilir. Kronik ağrı hastaları, **ilaça kolay erişimi olan sağlık personeli** ve **enjeksiyon** kullananlar risk gruplarıdır; kliniğe çoğu kez **yoksunluk atağı, doz aşımı sonrası acil** ya da ailenin gözlemleriyle (**dar göz bebekleri, yatışkınlık**) taşınır"
patofizyoloji: "**Mu-opioid reseptör agonizması**: adenilat siklaz baskılanır, **cAMP azalır**, K kanalları açılarak hücre hiperpolarize olur; analjezi, **öfori (ventral tegmental alan-çekirdek accumbens dopamin yolu)**, sedasyon ve **solunum baskılanması** klinik yüzleridir. Kronik kullanım **reseptör desensitizasyonu ile tolerans** üretir; **adenilat siklaz-cAMP üst düzenlenmesi (özellikle locus coeruleus)** yoksunluk sendromunun biyolojik temelidir; **fentanil gibi güçlü sentetikler** doz aşımı riskini büyütür"
anahtar_bulgular:
- "**Tolerans** (aynı etki için artan doz) ve kesme-kontrol girişimlerinde başarısızlık; **güçlü istek (craving)**"
- "**Klasik yoksunluk sendromu: son dozdan 6-12 saat sonra başlar, 1-3. günde zirve yapar, 5-7 günde düzelir**; **midriyazis, gözyaşı-salya akışı, esneme, miyalji, ishal-kusma, piloereksiyon**; tablo **ölümle sonuçlanmaz** — **alkol-benzodiazepin yoksunluğundan temel fark**"
- "**Akut kullanım bulguları**: **miyozis, yatışkınlık**, konuşmanın yavaşlaması; doz aşımında bilinç bulanıklığı ve **solunum baskılanması (ölümcül)**"
- "**Davranışsal örüntü** ve şiddet: **11 ölçütten 2-3 hafif, 4-5 orta, 6 ve üzeri ağır**"
- "**Enjeksiyon kullanım izleri**: iğne izleri, tromboflebit, cilt apseleri; **hepatit B-C, HIV ve endokardit** riskinin taranması"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Opioid yoksunluk sendromu örüntüsü**: **midriyazis, gözyaşı-salya akması, miyalji, ishal ve piloereksiyonla** seyreden tablo"
ilk_tetkik: "Öykü ve **DSM-5-TR ölçüt** değerlendirmesi; **idrar toksikoloji** (sentetik opioid-fentanil taraması dahil). Enjeksiyon kullanımında **hepatit B-C ve HIV serolojisi**, karaciğer fonksiyonları; **endokardit** şüphesinde **ekokardiyografi**; **gebelik testi**. Önceki **doz aşımı öyküsü** ve hastanın-ailesinin **naloksona erişimi** sorgulanır"
kesin_tani: "**DSM-5-TR ölçütleri**: 12 ay içinde **11 ölçütten en az 2'si** — tolerans; karakteristik yoksunluk ya da yoksunluğu önlemek için kullanım; bırakamama; güçlü istek; rol yükümlülüklerini aksatma; zararına rağmen sürdürme; tehlikeli koşullarda kullanma. **Tıbbi gözetim altındaki uygun kullanımda tolerans-yoksunluk ölçüt sayılmaz**; şiddet **ölçüt sayısına** göredir"
ilk_tedavi: "Standart yaklaşım **opioid agonist bakım tedavisidir**; tek başına detoksifikasyonun **nüks oranı çok yüksektir**: **metadon** (yalnızca yetkilendirilmiş programlarda, günde tek doz) ya da **buprenorfin** (kısmi agonist; **doz tavanı** sayesinde görece güvenli, **nalokson kombinasyonu** kötüye kullanımı caydırır, ayaktan yazılabilir). Detoksifikasyon yapılacaksa **buprenorfin-klonidin** artı semptomatik destek. **Nalokson** bakım ilacı değil **doz aşımı acilidir**; **yarı ömrü kısa** olduğundan özellikle **fentanilde** yeniden baskılanma riskine karşı **yinelenen doz ve izlem** gerekir. Tam yoksunluğa girmiş istekli hastada **uzun etkili depo naltrekson**; **psikososyal destek ve zarar azaltım** (iğne değişim, **nalokson eğitimi**) ayrılmaz parçadır"
klasik_komplikasyon: "**Doz aşımı ölümü** (solunum depresyonu; **sentetik fentanil** çağında hızla artmaktadır); enjeksiyon yoluyla bulaş: **HIV, hepatit B-C, S. aureus endokarditi**, cilt-yumuşak doku enfeksiyonları; gebe kullanıcının bebeğinde **doğumda yoksunluk sendromu**"
