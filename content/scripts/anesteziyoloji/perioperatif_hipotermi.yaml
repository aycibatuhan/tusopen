id: perioperatif_hipotermi
version: 1
status: draft
author: "ai-drafts/anestezi-2"
sources:
  - "NICE CG65: perioperatif hipotermi önleme ve yönetim kılavuzu — referans olarak listelendi, metin projesi özgün yazımdır"
  - "AAGBI perioperatif ısı yönetimi standardları — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Perioperatif Hipotermi
taksonomi:
  - [ktbt, anesteziyoloji, anes_komplikasyonlar, anes_kp_hipotermi]
tipik_hasta: "Uzun **genel anestezi** altındaki hasta; **açık karın-göğüs kavitesi**, düşük ameliyathane ısısı, soğuk **infüzyon-kan ürünü**. **Yaşlı** ya da düşük vücut kütlesi, **yanık**, **sepsis**, **hipotiroidizm**; **spinal-epidural** anestezide termoregülasyon baskılandığından risk artar"
patofizyoloji: "**Genel anestezi** soğuk savunma eşiklerini (**vazokonstriksiyon**, **titreme**) aşağı kaydırır; ilk saatte çekirdek ısı **1-1,5 derece** düşer. Açık kavite ve hazırlanan deriden **buharlaşma**, soğuk serum-kan ürünü, düşük oda ısısı kaybı sürdürür. Eşikler baskılandığından normotermiye savunma üretemez; ısı dengesi **dışarıdan** yönetilir"
anahtar_bulgular:
  - "Özefagus veya mesane probuyla ölçülen **çekirdek vücut ısısının 36 derece**nin altına inmesi"
  - "Uyanma döneminde **titreme** (postanestezik **shivering**); titreme **oksijen tüketimini** ve **CO2** üretimini artırır"
  - "**Kanama artışı** ve transfüzyon ihtiyacı: hipotermiye bağlı **koagülopati**"
  - "Anestezi ve **kas gevşetici** etkisinin beklenmedik biçimde uzaması, **gecikmiş uyanma**"
  - "**PACU**da uzamış gözlem süresi ve konfor kaybı"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — anestezi altındaki hastada **özefageal/mesane probu**yla ölçülen **çekirdek ısının 36 derece**nin altına inmesi"
ilk_tetkik: "Anestezi başlangıcından itibaren **çekirdek ısı izlemi** (**özefagus** veya **mesane**; aksiller ve deri ölçümü yeterli değildir)"
kesin_tani: "Anestezi bağlamında **çekirdek vücut ısısının 36 derece**nin altına inmesi; derin düşüşte **kardiyak aritmi** ve bilinç değişikliği eklenir"
ilk_tedavi: "Isı dengesini **dışarıdan** düzeltme: ısı kaybını kesmek (pasif **örtüleme** tek başına yeterli değildir) ve ısı eklemek için zorunlu **hava ısıtma sistemi**. Verilen **infüzyon ve kan ürünleri** ısıtıcıdan geçirilir; mümkünse ameliyathane ısısı artırılır, **prewarming**. Kurulan titremede **küçük doz meperidin** veya **klonidin** düşünülebilir"
klasik_komplikasyon: "Hipotermiye bağlı **koagülopati** (**trombosit fonksiyon bozukluğu**, kaskadın yavaşlaması) ile **kanama-transfüzyon** artışı; **cerrahi alan enfeksiyonu**nda artış; **miyokard iskemisi** riski; **uzamış ilaç etkisi**"
tus_gecmisi: []
