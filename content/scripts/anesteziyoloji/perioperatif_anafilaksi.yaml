id: perioperatif_anafilaksi
version: 1
status: draft
author: "ai-drafts/anestezi-2"
sources:
  - "NAP6 (Birleşik Krallık 6. Ulusal Perioperatif Anafilaksi Projesi) raporu — referans olarak listelendi, metin projesi özgün yazımdır"
  - "World Allergy Organization anafilaksi rehberleri — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Perioperatif Anafilaksi
taksonomi:
  - [ktbt, anesteziyoloji, anes_komplikasyonlar, anes_kp_anafilaksi]
tipik_hasta: "Anestezi **indüksiyonundan dakikalar** sonra açıklanamayan **hipotansiyon** ve **bronkospazm** gelişen hasta. **Kadın** cinsiyet ve daha önce sorunsuz verilmiş ilaca **duyarlılaşma** riski artırır; **spina bifida** ve ürogenital anomalili hastada **lateks** riski önde"
patofizyoloji: "**IgE** aracılı ağırlıklı aşırı duyarlılıkla **mast hücresi** ve bazofil degranülasyonu; **histamin**, **triptaz**, lökotrienler ve trombosit aktivasyon faktörü. Sonuç geniş çaplı **vazodilatasyon**, kapiller sızıntı ve **bronkospazm**. Perioperatif tetikleyiciler: en sık **antibiyotikler** (NAP6da **yüzde 47**), **rokuronyum** başta **nöromusküler blokerler** (**yüzde 33**). Dörtlü amonyum ortak yapısı nedeniyle **sınıf içi çapraz reaktivite**; diğer başlıklar **beta laktam**, **lateks**, **hipnotikler**"
anahtar_bulgular:
  - "İlaç verildikten dakikalar içinde başlayan **sıvıya dirençli hipotansiyon** ve **kardiyovasküler kollaps**"
  - "**Havayolu basıncında artış**, **ekshale CO2** düşüşü ve difüz **bronkospazm**"
  - "**Ürtiker**, **floş**, **anjiyoödem** gibi deri bulguları; anestezi altında **dörtte biri aşkın** hastada görülmeyebilir"
  - "Olayın **ilk saat** içinde alınan kanda **serum triptaz** yüksekliği (**30-120 dakikada** pik yapar)"
  - "**Epinefrinle hızlı düzelme**; gecikmeli tedavide **dirençli kollaps**"
patognomonik: null
ilk_tetkik: "Şüpheyle **hemen tedaviye** geçilir; **ilaç-olay zaman çizelgesi** yazıya geçirilir. Olay sırasında (tercihen başlangıçtan sonraki **ilk saatte**) **serum triptaz** için kan alınır"
kesin_tani: "Olay sırasında yükselmiş **serum triptaz** ile desteklenen klinik tablo; kesin etkenin gösterilmesi, iyileşmenin ardından **4-6 hafta** sonra yapılan **deri prick** ve **intrakütan** testleridir"
ilk_tedavi: "Şüpheli **ilacı ve cerrahiyi durdurup** yardım çağrısı. İlk tedavi **intravenöz epinefrin** (hipotansiyonda **50-100 mikrogram** bolus, gerekirse tekrar, arrestte yüksek doz), eş zamanlı agresif **kristaloid sıvı**, dirençli tabloda **epinefrin infüzyonu**. Bronkospazmda inhaler ve derin anestezi ayarı; **antihistaminik ve steroid** ikincil sıradadır ve tabloyu kurtarmaz"
klasik_komplikasyon: "**Hipoksik ve kardiyovasküler kollaps**, **kardiyak arrest**; hayatta kalanlarda **ikinci faz (bifazik)** reaksiyon riski; etken saptanamadan **tekrar maruziyet** riski"
