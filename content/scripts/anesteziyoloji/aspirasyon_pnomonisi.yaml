id: aspirasyon_pnomonisi
version: 1
status: draft
author: "ai-drafts/anestezi"
sources:
  - "Klinik rehberler: Amerikan Anesteziyologlar Derneği (ASA) perioperatif aspirasyon önerileri — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Perioperatif Aspirasyon Pnömonisi
taksonomi:
  - [ktbt, anesteziyoloji, anes_komplikasyonlar, anes_kp_aspirasyon]
tipik_hasta: "**Dolu mide** riski taşıyan hastada genel anestezi veya derin sedasyon: **acil cerrahi**, **gebelik**, **obezite**, **gastroparezi**, **bağırsak tıkanıklığı**, **yutma bozukluğu**. İndüksiyon ya da derlenme sırasında mide içeriğinin **hava yoluna** geri akması"
patofizyoloji: "**Anestezi ve sedasyon** larengeal koruyucu **refleksleri** baskılar; mide içeriği farenkse ulaşıp akciğere iner. **Kimyasal pnömonit** asidik-hacimli içerikte belirgindir: klasik **Roberts-Shirley** eşikleri (**pH 2,5 altı**, **0,4 mL/kg üstü**), **ASA 2022** bu sabit eşiği artık desteklemiyor. Steril asidik içerik ilk **1-2 saatte pnömonit** yaparken **partikül** içerik **hava yolu obstrüksiyonu** ekler, **48-72 saatte** çoğalan flora **bakteriyel aspirasyon pnömonisi** yapar. Profilaksi: **açlık kuralları** (berrak sıvı **2 saat**, katı **6 saat**), **preoksijenasyon**, **hızlı seri indüksiyon** ve **krikoid baskı**, **kufflu tüp**"
anahtar_bulgular:
  - "İndüksiyon veya tüp çekilmesinde hava yolunda **safra renkli sıvı** veya **partikül** görülmesi"
  - "Anestezi sonrası hızla gelişen **hipoksemi**, hırıltılı-ıslak solunum, öksürük"
  - "İlk saatlerde **kimyasal pnömonit**: ateş, takipne, grafide **infiltrat** (sağ üst lob posterior, sağ alt lob superior segment)"
  - "**48-72 saatte** yeni ateş, **purülan balgam** ve ilerleyen infiltrat ile **bakteriyel pnömoni**"
  - "Büyük **partikül** aspirasyonunda **hava yolu obstrüksiyonu** belirtileri"
patognomonik: "**Hava yolu yönetimi** sırasında görülen **safra renkli sıvı** veya partikülün hızla gelişen **hipoksemi** ve infiltratla birleşmesi"
ilk_tetkik: "Hava yolunun **bronkoskopik** değerlendirilmesi ve temizlenmesi; **arteryel kan gazı**, **akciğer grafisi** ve **SpO2** izlemi"
kesin_tani: "**Klinik** ve **görüntüleme** bulgularının birlikte değerlendirilmesi; bronkoskopide hava yolunda **içeriğin görülmesi** tanıyı kesinleştirir. **Bakteriyel pnömoni** şüphesinde **balgam** veya **bronkoalveolar lavaj** kültürü"
ilk_tedavi: "Hava yolunun **emilerek** ve gerektiğinde **bronkoskopik** temizlenmesi; **oksijen**, gerekirse **mekanik ventilatör** desteği; **sıvı** ve gerektiğinde **vazopressör**. **Bakteriyel pnömoni** gelişen hastada **antibiyotik**; steril asidik pnömonitte profilaktik **antibiyotik ve steroid önerilmez**"
klasik_komplikasyon: "**ARDS** ve ilerleyici **solunum yetmezliği**; steril pnömonit üzerine eklenen **bakteriyel pnömoni**"
tus_gecmisi: []
