id: postoperatif_bulantik_kusma
version: 1
status: draft
author: "ai-drafts/anestezi-2"
sources:
  - "Dördüncü Uluslararası PONV Uzlaşı Kılavuzu (Gan ve ark.) — referans olarak listelendi, metin projesi özgün yazımdır"
  - "SAMBA (Ambulatuvar Anestezi Derneği) PONV yönetim kılavuzu — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Postoperatif Bulantı ve Kusma
taksonomi:
  - [ktbt, anesteziyoloji, anes_komplikasyonlar, anes_kp_bulanti_kusma]
tipik_hasta: "**Kadın**, **sigara içmeyen**, geçmişte **PONV** ya da **araç tutması** öyküsü olan, **volatil anestezik** ve **postoperatif opioid** alan hasta. Her faktör riski kabaca **yüzde 20**ye yakın artırır; **Apfel** skoruna göre profilaksi planlanır"
patofizyoloji: "Volatil anestezikler, opioidler ve cerrahi stres bulantı-kusma merkezini çok kanaldan tetikler. Girdiler: **area postrema** (kemoreseptör tetik bölge), **vestibüler sistem**, **Gİ afferentler**; yollar: **dopamin**, **serotonin**, **asetilkolin**, **histamin**. **5HT3** tetik bölgede ve **vagal afferent**lerde yoğundur; cerrahi-opioid bağırsak serotoninini artırınca **5HT3 antagonisti** hedef olur"
anahtar_bulgular:
  - "Anestezi sonrası ilk **24-48 saatte** bulantı, kusma ve **öğürme (retching)**"
  - "**Apfel** skoru dört faktör: **kadın**, **sigara içmemek**, **PONV öyküsü**, **postoperatif opioid**; her biri **yüzde 20**ye yakın risk ekler (volatil anestezik skora girmez)"
  - "Tekrarlayan kusmada **dehidratasyon** ve **elektrolit kaybı**"
  - "Şiddetli kusmada **dikiş hattının** zorlanması, özofagus mukozasında yırtılma (**Mallory-Weiss**)"
patognomonik: null
ilk_tetkik: "**Klinik tanı**; preoperatifte **Apfel** skorlamasıyla risk saptanır, risk yüksekse profilaksi erken planlanır"
kesin_tani: "Anestezi ve cerrahiyle **zamansal ilişkili** bulantı-kusma klinik olarak tanınır; **opioid**, intraabdominal gerginlik veya **tümör** gibi benzer tablo yapabilecek nedenler dışlanır"
ilk_tedavi: "Risk sayısına göre profilaksi: tek faktörde **tek ajan**, iki ve üzeri faktörde farklı sınıflardan **kombinasyon** (**5HT3 antagonisti** artı **deksametazon**; gerekirse **droperidol**). Tedavide profilaksideki sınıftan **farklı sınıf** seçilir; ilk basamak **5HT3 antagonisti (ondansetron)** — tetik bölge ve **vagal afferent** serotonin reseptörlerinin bloğu"
klasik_komplikasyon: "**Dehidratasyon** ve **elektrolit bozukluğu**; **aspirasyon** riski; **dikişte açılma**; ambulatuvar hastada beklenmedik **hastaneye yatış**"
tus_gecmisi: []
