id: psedokolinesteraz_eksikligi
version: 1
status: draft
author: "ai-drafts/anestezi-2"
sources:
  - "AAGBI nöromusküler blokaj ve anestezi ilaç güvenliği rehberleri — referans olarak listelendi, metin projesi özgün yazımdır"
  - "Butirilkolinesteraz fenotipleme klasik sınıflaması (dibukain sayısı, Whittaker) — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Psödokolinesteraz Eksikliği
taksonomi:
  - [ktbt, anesteziyoloji, anes_komplikasyonlar, anes_kp_psodokolinesteraz]
tipik_hasta: "**süksinilkolin** sonrası beklenen birkaç dakika yerine saatlerce süren **felç ve apne** gelişen hasta. **Kalıtsal** tip **otozomal resesif** geçer, ilk anestezide yakalanır; **kazanılmış**: gebelik, **karaciğer hastalığı**, malnütrisyon, böbrek hastalığı, **organofosfat/antikolinesteraz** ilaçlar"
patofizyoloji: "süksinilkolin normalde plazmadaki **butirilkolinesteraz (psödokolinesteraz)** tarafından dakikalar içinde hidrolize edilir. **BCHE** genindeki **otozomal resesif** mutasyonlar enzimin miktarını ve kalitesini bozar; yavaş enzimde etki **saatlere** uzar. **Neostigmin** **asetilkolinesteraz**ı hedefler ve süksinilkolin bloğunu çözemeyeceği gibi antikolinesteraz etkisiyle durumu ağırlaştırır; tek çıkış enzimin ilacı kendi hızında işlemesini beklemektir"
anahtar_bulgular:
  - "**süksinilkolin** sonrası saatler süren **uzamış apne** ve felç (beklenen **5-10 dakika**nın çok ötesinde)"
  - "**Neostigmine** yanıt vermeyen uzamış blok; **periferik sinir stimülasyonu**nda bloğun sürekli olması"
  - "Sedasyon yapılmazsa felç halinde **uyanık hasta** (bilinç açık, kaslar bloke)"
  - "Aile öyküsünde benzer uzamış felç epizodları (**otozomal resesif** geçiş)"
  - "**Dibukain sayısı**nda düşüş: normal enzimde **80** dolayında; heterozigotlarda **60** dolayında; homozigot atipikte **20** dolayında"
patognomonik: "**süksinilkolin** sonrası **neostigmine** yanıt vermeyen **saatler süren uzamış apne**"
ilk_tetkik: "Bilinç korunarak **mekanik ventilasyon** ve sedasyon sürdürülür, **periferik sinir stimülasyonu**yla blok izlenir; plazma **butirilkolinesteraz aktivitesi** ve **dibukain sayısı** istenir"
kesin_tani: "Düşük plazma **butirilkolinesteraz aktivitesi** ve **dibukain sayısı**nın düşük olması; şüpheli ailelerde **BCHE gen analizi**. Dibukain mantığı: dibukain **normal enzimi** baskılar, **atipik enzimi** çok daha az — aktivitenin dibukain varlığında korunması enzimin **kalitesini** gösterir, aktivite sayısı **miktarı**"
ilk_tedavi: "**Destekleyici**: sedasyon altında **mekanik ventilasyon** ve **twitch** izlemiyle spontan iyileşme beklenir; nadiren ağır tabloda **taze donmuş plazma** enzim kaynağı olarak verilir. Hasta ve ailesi bilgilendirilir; akrabalara anestezi öncesi öneri ve **tıbbi uyarı kartı** için yönlendirilir"
klasik_komplikasyon: "Sedasyon ihmal edilirse felç halinde **bilinçli olma travması**; **uzamış entübasyon** ve yoğun bakım ihtiyacı; verilmiş **neostigmin** tabloyu daha da uzatır"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
