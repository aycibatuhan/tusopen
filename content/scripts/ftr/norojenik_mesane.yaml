id: norojenik_mesane
version: 1
status: draft
author: ai-drafts/ftr-2
sources:
- EAU nörojenik üriner fonksiyon bozuklukları kılavuzu; AUA-SUFU nörojenik alt idrar yolu fonksiyon bozukluğu
  kılavuzu — referans olarak listelendi, metin projesi özgün yazımdır
ad: Nörojenik Mesane ve Bağırsak
taksonomi:
- - ktbt
  - ftr
  - ftr_norolojik_rehabilitasyon
  - ftr_nr_norojenik_mesane_barsak
tipik_hasta: '**Omurilik yaralanması**, **multipl skleroz**, **spina bifida**, **diabetik otonom nöropati**
  veya **cauda equina sendromu** olan hasta. İşeme ani sıkışma ve **kaçırma**yla ya da hiç işememe ve **taşma
  kaçırması**yla başvurur. Tekrarlayan **idrar yolu enfeksiyonu** ve açıklanamayan böbrek fonksiyon bozukluğu
  da düşündürür; tablo lezyon **seviyesine** göre iki uca oturur'
patofizyoloji: '**Depolama ve boşaltma** evreleri **pons işeme merkezi**nce eşgüdümlenir; **sakral refleks arkı
  (S2-S4)** kolu taşır. **Suprasakral lezyon**da ponsa bağlantı kesilir: **detrüsör aşırı aktif** olur, işeme
  çabasında dış sfinkter kasılır (**detrüsör-sfinkter disinerji**). Depo **basıncı** yükselir, **vezikoureteral
  reflü** eşiği aşılınca **hidronefroz** ve **böbrek skarı** gelişir. **Sakral veya cauda equina** lezyonunda
  **detrüsör arefleksi (atoni)**, retansiyon ve **taşma inkontinansı**'
anahtar_bulgular:
- '**Depolama fazı** bulguları: sıkışma, sık idrara çıkma, **urge inkontinans** (**detrüsör aşırı aktivitesi**)'
- '**Boşaltma fazı** bulguları: retansiyon, kesik kesik işeme, **taşma inkontinansı**, **palpabl mesane**'
- '**Detrüsör-sfinkter disinerjisi**: işeme çabasında idrarın önce kesilmesi, sonra gelmesi (**suprasakral**
  kalıbı)'
- 'Tekrarlayan **idrar yolu enfeksiyonu**; **rezidüel idrar** artışı'
- '**T6 üstü** omurilik yaralanmasında mesane dolumu veya **fekal impaksiyon**la tetiklenen **otonomik disrefleksi**:
  ani **hipertansiyon**, baş ağrısı, terleme, **bradikardi**'
- '**Nörojenik bağırsak**: **refleks** tipte istemsiz dışkı kaçırma, **arefleks** tipte **fekal impaksiyon**
  ve dışkılama yapamama'
patognomonik: '**Ürodinamide detrüsör-sfinkter disinerji**: detrüsör kasılırken dış sfinkterin de kasılması;
  **suprasakral** nörojenik mesanenin imzasıdır'
ilk_tetkik: '**İdrar analizi** ve kültürü, serum **kreatinin**; ultrasonla **rezidüel idrar** ölçümü ve **hidronefroz**
  taraması; **işeme günlüğü**. Otonomik disrefleksi semptomu olan hastada işeme sırasında da **tansiyon**
  izlemi'
kesin_tani: '**Video-ürodinamik** çalışma: **detrüsör aşırı aktivitesi**, düşük **mesane uyumu**, **detrüsör-sfinkter
  disinerji** ve **vezikoureteral reflü** gösterilir. Hangi hazırlığın **böbrek koruyucu** olduğu da ancak
  ürodinamiyle sınıflanır'
ilk_tedavi: 'Amaç **böbrek koruması** — düşük basınçta depolama, tam ve düzenli boşaltma. Depolama fazında
  **antikolinergik** (**oksibutinin**, **tolterodin**) veya **mirabegron**, detrüsör-sfinkter disinerjide
  **alfa bloker** eklenir. Boşaltmada **temiz aralıklı kateterizasyon** (**günde 4-6 kez**) esas; **arefleksik**
  mesanede zorunlu, refraktörde detrüsöre **botulinum toksini** veya **sakral nöromodülasyon**. **Nörojenik
  bağırsakta** **saatli program** (lif-sıvı desteği): refleks tipte **dijital rektal stimülasyon** ve **supozituvar**,
  arefleks tipte **elle dışkı çıkarma**'
klasik_komplikasyon: '**Vezikoureteral reflü** ve **hidronefroz** sonrası **böbrek skarı** ve **kronik böbrek
  hastalığı**; tekrarlayan **ürosepsis**; **T6 üstü** lezyonda **otonomik disrefleksi** krizi; uzun süreli
  kateterde **taş** ve **tümör** riski'
