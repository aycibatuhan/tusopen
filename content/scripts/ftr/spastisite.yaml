id: spastisite
version: 1
status: draft
author: ai-drafts/ftr-2
sources:
- NICE spastisite yönetim kılavuzu; AAN spastisite tedavi pratik parametresi — referans olarak listelendi,
  metin projesi özgün yazımdır
ad: Spastisite Yönetimi
taksonomi:
- - ktbt
  - ftr
  - ftr_norolojik_rehabilitasyon
  - ftr_nr_spastisite
tipik_hasta: '**İnme**, **omurilik yaralanması**, **multipl skleroz** veya **serebral palsi** geçirmiş üst
  motor nöron hasarlı hasta; uzvunu **kasma, sıkışma** diye tarif eder, kolunu geremez, yürüyüşü **makas**
  gibi daralmıştır. **Ağrı** veya **idrar yolu enfeksiyonu** gibi tetikleyici sonrası spazmların aniden
  şiddetlenmesi klasik başvurudur'
patofizyoloji: 'İnen inhibitör yolların kesilmesi omurilik ve beyin sapine uygulanan **sürekli freni** kaldırır;
  **alfa-gamma motor nöron** uyarılabilirliği artar. **Kas iğcikleri** aşırı duyarlı olur; direnç **hızbağımlı**dır,
  hızlı gerdirmede ani frenleme-gevşeme (**çakı-kapanı**) görülür. Uzamış kas aktivitesi **kontraktür**e yol
  açar; kuvvet kalıbı **antigravitasyonel** kasların baskınlığına uyar (üst kolda fleksör, bacakta ekstansör)'
anahtar_bulgular:
- 'Pasif eklem hareketinde **hız arttıkça artan direnç**; yavaş harekette direncin düşük kalması'
- 'Hızlı gerdirme sonunda ani gevşeme (**çakı-kapanı** fenomeni)'
- 'Ayak bileği ve dizde **klonus**; derin tendon reflekslerinde aşırı canlılık'
- '**Ekstensör plantar yanıt (Babinski)**'
- '**Antigravitasyonel** kaslarda yoğunlaşan desen: üst kolda **fleksiyon-addüksiyon**, bacakta **ekstansiyon**;
  **makas yürüyüş**'
- '**Bası yarası**, **idrar yolu enfeksiyonu**, **paroniksi** gibi uyarıcılarla kötüleşen **tonik spazmlar**'
patognomonik: '**Hızbağımlı** direnç artışı; **rijiditeden** (hızdan bağımsız, **kurşun-boru** tarzı direnç)
  kilit ayrım budur'
ilk_tetkik: '**Modifiye Ashworth ölçeği**yle tonus, **spazm sıklığı** ve fonksiyonel etkilerin (yürüme, oturma,
  hijyen, ağrı) kaydı. Öncelikle **tetikleyicilerin** sistematik aranması: **bası yarası**, **idrar yolu
  enfeksiyonu**, **fekal impaksiyon**, dar giysi, **tırnak batması**'
kesin_tani: '**Klinik tanı**: altta yatan **üst motor nöron lezyonu**nun **MRG** ile gösterilmesi, **hızbağımlı
  tonus artışı**nın **Modifiye Ashworth** ölçeğiyle belgelenmesi. Spastisiteyi tetikleyen **sistemik nedenlerin**
  elenmesi tanının parçasıdır'
ilk_tedavi: '**Basamaklı**: önce **tetikleyici** düzeltilir, **germe-pozisyonlama** ve ağırlık taşıma programı.
  Yaygın spastisitede **baklofen** ilk seçim (**GABA-B** agonisti, ani kesimde yoksunluk krizi), ağrı-spazm
  öndeyse **tizanidin**. Fokal kas grubunda **botulinum toksini** (**asetilkolin** bloğu, etkisi **3-6 ay**,
  **EMG/USG** eşliğinde), yaygın dirençli tabloda **intratekal baklofen pompası**. **Dantrolene** kas içinden
  **kalsiyum** salınımını bloke eder (karaciğer toksikliği), serebral palside **seçici dorsal rizotomi**'
klasik_komplikasyon: 'Tedavisizde **kontraktür**, **ağrı**, hijyen ve bakım güçlüğü, **bası yarası**, oturma
  ve yürüme fonksiyonlarının kaybı; **intratekal baklofen** pompasının ani kesilmesinde ciddi yoksunluk tablosu'
