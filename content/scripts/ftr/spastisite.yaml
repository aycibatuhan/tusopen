id: spastisite
version: 1
status: draft
author: ai-drafts/ftr-2
sources:
- NICE spastisite yönetim kılavuzu; AAN spastisite tedavi pratik parametresi — referans olarak listelendi,
  metin projesi özgün yazımdır
ad: Spastisite Yönetimi
taksonomi:
- - ktbt
  - ftr
  - ftr_norolojik_rehabilitasyon
  - ftr_nr_spastisite
tipik_hasta: İnme, omurilik yaralanması, multipl skleroz veya serebral palsi geçirmiş üst motor nöron
  hasarlı hasta; uzvunu 'kasma, sıkışma, aralıklı seğirme' tarifleriyle getirir, kolunu geremez bacağını
  açamaz, yürüyüşü makas gibi daralmıştır. Ağrı, idrar yolu enfeksiyonu gibi bir tetikleyici sonrası spazmların
  aniden şiddetlenmesi de klasik başvuru şeklidir
patofizyoloji: 'İnen inhibe edici yolların kesilmesi omurilik ve beyin sapine uygulanan sürekli freni
  kaldırır; alfa ve gamma motor nöronların uyarılabilirliği artar, kas iğcikleri aşırı duyarlı hale gelir.
  Direnç pasif hareketin hızına bağlı olarak artar (hızbağımlılık); hızlı gerdirmede içeriye doğru ani
  frenleme, sonra gevşeme (çakı-kapanı; clasp-knife) görülür. Uzamış kas aktivitesi eklem kontraktürüne yol açar; kuvvet
  kalıbı antigravitasyonel kasların baskınlığına uyar: üst kolda fleksör, bacakta ekstansör desenler'
anahtar_bulgular:
- Pasif eklem hareketinde hız arttıkça artan direnç; yavaş harekette direncin düşük kalması
- Hızlı gerdirme sonunda ani gevşeme (çakı-kapanı (clasp-knife) fenomeni)
- Ayak bileği ve dizde klonus; derin tendon reflekslerinde aşırı canlılık
- Ekstensör plantar yanıt (Babinski)
- 'Antigravitasyonel kaslarda yoğunlaşan desen: üst kolda fleksiyon-addüksiyon, bacakta ekstansiyon; makas
  yürüyüş'
- Bası yarası, idrar yolu enfeksiyonu, paroniksi gibi uyarıcılarla kötüleşen tonik spazmlar
patognomonik: Hızbağımlı direnç artışı; rijiditeden (hızdan bağımsız, kurşun-boru tarzı direnç) kilit
  ayrım budur
ilk_tetkik: Modifiye Ashworth ölçeğiyle tonus, spazm sıklığı ve fonksiyonel etkilerin (yürüme, oturma,
  hijyen, ağrı) kaydı; öncelikle spastisiteyi artıran tetikleyicilerin sistematik aranması — bası yarası,
  idrar yolu enfeksiyonu, fekal impaksiyon, dar giysi, tırnak batması
kesin_tani: 'Klinik tanıdır: altta yatan üst motor nöron lezyonunun görüntülemeyle (MRG) gösterilmesi
  ve hızbağımlı tonus artışının Modifiye Ashworth ölçeğiyle belgelenmesi; spastisiteyi tetikleyen sistemik
  nedenlerin elenmesi tanının parçasıdır'
ilk_tedavi: 'Basamaklı mantık: önce tetikleyici düzeltilir, germe-pozisyonlama ve ağırlık taşıma programı
  başlanır. Yaygın spastisitede ağızdan ilaç: baklofen ilk seçimdir (GABA-B agonisti; omurilik kaynaklı
  spastisitede öne çıkar; aniden kesilirse nöbet ve halüsinasyonla yoksunluk krizi). Ağrı ve spazm birlikte
  öndeyse tizanidin düşünülür (alfa-2 agonisti; sedasyon, düşük tansiyon ve karaciğer enzim yükselmesi
  uyarısı). Dantrolene doğrudan kas içinden kalsiyum salınımını bloke eder (karaciğer toksikliği), merkezi
  uyku hali yapmaz. Fokal ve fonksiyonu bozan kas grubunda kas içi botulinum toksini: nöromüsküler kavşakta
  asetilkolin salınımını bloke eder, etkisi 3-6 aydır, elektromiyografi veya ultrason eşliğinde uygulanır
  ve tekrarlanabilir. Yaygın, ağızdan ilaca dirençli tabloda intratekal baklofen pompası; serebral palside
  seçici dorsal rizotomi ve motor nokta blokları'
klasik_komplikasyon: Tedavisizde kontraktür, ağrı, hijyen ve bakım güçlüğü, bası yarası, oturma ve yürüme
  fonksiyonlarının kaybı; intratekal baklofen pompasının ani kesilmesinde ciddi yoksunluk tablosu
