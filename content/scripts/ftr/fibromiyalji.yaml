tipik_hasta: 'Genellikle **30-50 yaş** arası **kadın**; aylardır süren **yaygın vücut ağrısı**, gece uykusuna
  rağmen geçmeyen **yorgunluk** ve **konsantrasyon** güçlüğüyle başvurur; sayısız tetkiki yapılmış ama **laboratuvarı
  bir türlü bozuk çıkmamış** hasta profili'
patofizyoloji: 'Esas sorun yapısal doku hasarı değil, **ağrı işlemenin bozulması**dır: **merkezi sensitizasyon**la
  spinal düzeyde ağrı sinyalleri aşırı yükseltilir. İnen inhibitör yolların baskısı zayıflar; enflamatuvar
  veya otoimmün hastalık değildir. **Genetik yatkınlık**, kronik stres ve **uyku bozukluğu** tabloyu tetikler;
  dinlendirici olmayan uyku hem ağrıyı hem yorgunluğu derinleştirir'
anahtar_bulgular:
- '**Yaygın ağrı**: sağ-sol, üst-alt bölgeler ve **omurga** dahil en az **üç aydır**'
- '**Dinlendirici olmayan uyku** ve sabahları açılmayan **yorgunluk**; gün boyu bitkinlik'
- '**Bilişsel zorlanma**: dikkat ve kısa süreli **hafızada** konsantrasyon bozukluğu'
- 'Eşlik eden fonksiyonel şikayetler: **baş ağrısı**, **irritabl bağırsak sendromu**, adet öncesi artış'
- '**Laboratuvar temiz**: sedimantasyon, **CRP**, **TSH**, kas enzimleri ve **romatoid faktör** normal;
  yaygın hassasiyet dışında eklem ve nörolojik bulgu beklenmez'
patognomonik: null
ilk_tetkik: 'Tanıyı taklit eden hastalıkları elemek için **hedefli laboratuvar** yeterli: **sedimantasyon**,
  **CRP**, **TSH**, gerekirse **25-OH D vitamini** ve **kas enzimleri**. Geniş tetkik paketlerine veya
  anlamsız görüntülemeye gerek yoktur'
kesin_tani: '**ACR 2010**: **Yaygın Ağrı İndeksi 7 ve üzeri** ile **Semptom Şiddeti 5 ve üzeri** (veya WPI
  3-6 ile SS 9 ve üzeri). Şikayetlerin en az **üç ay** sürmesi; **laboratuvar bozukluğu** bulunmaması şart,
  eşlik eden romatolojik hastalıkla birlikte de tanı geçerlidir. Eski **ACR 1990** ölçütü (18 hassas noktadan
  **11i**) bugün tek başına zorunlu değildir'
ilk_tedavi: '**Hasta eğitimi** ile başlanır: tablo yapısal bir hastalık değil, **ağrı modülasyon bozukluğu**dur.
  **Basamaklı aerobik egzersiz** ve **bilişsel davranışçı terapi** tedavinin temel taşıdır. İlaç: ağrı-uyku
  için **pregabalin** veya **gabapentin**, ağrı-enerji için **duloksetin**, gece için **düşük doz amitriptilin**.
  **Opioid** ve **glukokortikoid** bu tabloda yeri olmayan ilaçlardır'
klasik_komplikasyon: '**Depresyon**, **anksiyete** ve **iş gücü kaybı** en sık eşlik eden sorunlardır; kalıcı
  yapısal hasar, deformite ve organ yetmezliği gelişmez'
