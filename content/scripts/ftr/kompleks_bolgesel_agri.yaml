sources:
- IASP Kompleks Bölgesel Ağrı Sendromu Budapeşte tanı kriterleri — referans olarak listelendi, metin projesi
  özgün yazımdır
ad: Kompleks Bölgesel Ağrı Sendromu
taksonomi:
- - ktbt
  - ftr
  - ftr_kas_iskelet_rehabilitasyon
  - ftr_kr_krps
tipik_hasta: 'Kol veya bacakta **burkulma**, **kırık**, küçük cerrahi ya da **damar içi enjeksiyon** gibi hafif
  bir olaydan haftalar sonra. Yaralanmayla hiç orantısız **yanıcı ağrı**, şişlik ve **renk-sıcaklık değişikliği**
  gelişir. Belirgin **sinir lezyonu** varsa **tip 2** (eski adıyla kozalji), saptanmazsa **tip 1**'
patofizyoloji: 'Çok bileşenli: **periferik ve santral sensitizasyon** ağrıyı sürekli kılar; **otonom disfonksiyon**
  renk, sıcaklık ve terleme değişikliklerini, **nörojenik enflamasyon** ödemi besler. **Sempatik efekt lifleri**
  ile doku reseptörleri arasındaki anormal bağlantılar **sempatik bağımlı ağrı**yı açıklar. En büyük hata
  **immobilizasyon**dur: uzuv sakin tutuldukça sensitizasyon derinleşir, erken **mobilizasyon** tedavinin esası'
anahtar_bulgular:
- 'Yaralanmayla **orantısız, yanıcı** ağrı; hafif dokunuşla ağrı (**allodini**) ve aşırı duyarlılık (**hiperaljezi**)'
- '**Vazomotor**: karşı ekstremiteye göre **renkte** (kızarıklık veya solukluk) ve **sıcaklıkta** asimetri'
- '**Sudomotor** bulgu ve ödem: **terleme** artışı veya azalması, yaygın şişlik'
- '**Hareket fonksiyonunda azalma**: eklem açıklık kaybı, kas kuvveti düşüşü, **tremor** veya **distoni**'
- '**Trofik** değişiklikler: deri ve tırnakta parlama/**atrofi**; ileri dönemde radyografide bölgesel kemik
  yoğunluk kaybı (**Sudeck atrofisi**)'

patognomonik: null
ilk_tetkik: 'Tanı **klinikte** konur; tetkikler tanıyı desteklemek ve taklit eden durumları elemek içindir.
  **Radyografi** (geç dönemde **kemik erimesi**), **üç fazlı kemik sintigrafisi** ve **otonom testler** (termografi,
  terleme testleri) destekleyicidir'
kesin_tani: '**Budapeşte kriterleri**: yaralanmayla orantısız, **bölgesel ağrı** zorunludur; **duyu**, **vazomotor**,
  **sudomotor-ödem**, **motor-trofik** kategorilerinden üçünde semptom bildirilmesi ve en az ikisinde muayene
  bulgusu gerekir. Tek bir **sinir dağılımına uymaması** ve başka tanının dışlanması şarttır'
ilk_tedavi: '**Ağrı** ilaç ve bloklarla kontrol altına alınarak uzuv hemen **mobilize edilir**. **Gradüel
  eklem açıklığı** çalışmaları, **ayna terapisi** ve **desensitizasyon** erken dönemin temelidir, immobilizasyondan
  kaçınılır. **Gabapentinoidler** ve **trisiklik antidepresanlar** önde gelir, erken enflamatuvar dönemde
  kısa süreli **kortikosteroid** eklenebilir. Dirençli vakada **seri sempatik blok**, inatçı ağrıda **spinal
  kord uyarıcısı** düşünülür'
klasik_komplikasyon: 'İleri evrede **eklem kontraktürü**, **kas atrofisi** ve uzvun **fonksiyon kaybı**; tedavi
  geciktiğinde ağrı ve kısıtlılık **inatçı** hale gelir'
