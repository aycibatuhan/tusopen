id: heterotopik_ossifikasyon
version: 1
status: draft
author: "ai-drafts/ftr"
sources:
  - "Braddom Fiziksel Tıp ve Rehabilitasyon ders kitabı; omurilik yaralanması ve protez cerrahisi sonrası heterotopik ossifikasyon profilaksisi klinik rehberleri — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Heterotopik Ossifikasyon
taksonomi:
  - [ktbt, ftr, ftr_metabolik_kemik, ftr_mk_heterotopik_ossifikasyon]
tipik_hasta: "**Şiddetli veya tam omurilik yaralanması**, **travmatik beyin hasarı** ya da **kalça protez** ameliyatı geçirmiş hasta; olaydan haftalar sonra eklem çevresinde **sertlik**, **ısı artışı** ve giderek artan **hareket kısıtlılığı**. Omurilik yaralanmasında uzuvda **açıklanamayan ateşin** sık nedeni; bulgular duyu kaybı nedeniyle ekibin muayenesiyle yakalanır"
patofizyoloji: "Eklem çevresi yumuşak dokuda **mezenkimal hücreler** osteojenik yönde farklılaşır; **BMP** sinyali ve lokal enflamatuvar uyaran **ektopik lamellar kemik** oluşumunu başlatır. Oluşan doku **gerçek kemiktir**: **korteksi** ve **kemik iliği** görünümü vardır, bu özellik onu pasif **kalsifikasyondan** ayırır. Kemik eklem kapsülü çevresinde ve kaslar içinde gelişir; **eklem boşluğunu ve kıkırdağı** doğrudan tutmaz"
anahtar_bulgular:
  - "Travma veya protez cerrahisinden **haftalar sonra** eklem çevresinde **sertlik**, **ısı artışı**, ödem; **iltihap belirteçleri** yükselebilir, **enfeksiyonla** karışır"
  - "**Hareket açıklığında** giderek artan kısıtlanma; kalçada uzuv **addüksiyon ve iç rotasyon** pozisyonuna çekilir"
  - "Serum **alkalen fosfataz** yükselebilir; **sedimantasyon** ve **CRP** hafif artabilir"
  - "Erken dönemde **üç fazlı kemik sintigrafisi**nde artmış tutulum; **düz radyografi** genellikle **iki-dört haftadan** önce görüntü vermez"
  - "Radyografide eklem çevresi yumuşak doku içinde **korteksli kemikleşme**; **kemik iliği** görünümünün varlığı gerçek kemikleşmeyi gösterir"
patognomonik: null
ilk_tetkik: "Klinik şüpheyle **üç fazlı kemik sintigrafisi** (en erken verir) ve **düz radyografi**; laboratuvarda **alkalen fosfataz** takibi. **Enfeksiyon** ve **derin ven trombozu** taklitleri mutlaka elenir"
kesin_tani: "Radyografide eklem çevresi yumuşak doku içinde **gerçek kemik dokusunun** gösterilmesi. Kalçada **Brooker sınıflaması**: **1. sınıf** yumuşak dokuda kemik adacıkları, **2. sınıf** pelvis-proksimal femur çıkıntıları arasında **en az 1 cm**; **3. sınıf** mesafenin 1 cm altı, **4. sınıf** **görüntüsel ankiloz**"
ilk_tedavi: "Mantık **profilakside** yatar: oluşmuş kemiği eriten tedavi yoktur, amaç yeni oluşumu baskılamak. Yüksek riskli hastada (omurilik yaralanması, travmatik beyin hasarı, protez cerrahisi) **NSAİD (indometazin)** verilir, cerrahi sonrası **radyoterapi** de profilaktik seçenektir. **Etidronat** mineralizasyonu geciktirir ama ilk basamak değildir, gelişmiş lezyonda **ağrı kontrolü** ve **koruyucu fizik tedavi**yle ulaşılabilir hareket açıklığı korunur. Fonksiyon bozulduğunda olgunlaşan kemik **eksize edilir** — eksizyon için genellikle **12-18 ay** bekleme ve sintigrafinin **soğuması** beklenir"
klasik_komplikasyon: "**Eklem ankilozu** ve **kontraktür**; **oturma dengesinin** bozulması ve **bası yarası**; **damar veya sinir sıkışması**; kalçada eksizyon gerektiren **fonksiyonel blok**"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
