id: retina_dekolmani
version: 1
status: draft
author: "ai-drafts/goz-2"
sources:
  - "Kanski's Clinical Ophthalmology"
  - "AAO Retina/Vitreous Preferred Practice Pattern — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Retina Dekolmanı
taksonomi:
  - [ktbt, goz_hastaliklari, goz_retina_vitreus, goz_rv_retina_dekolmani]
tipik_hasta: "**İleri miyop**lu, **katarakt ameliyatı** geçirmiş ya da yakın zamanda **göz travması** yaşamış hastada; önceki günlerde **ani çoğalan uçan cisimcikler** ve **ışık çakmaları**ndan sonra. Görüş alanının bir kenarından başlayıp merkez doğru genişleyen **koyu perde ya da gölge** tarif eden hasta; **ağrının hiç olmaması** ve gözün dışarıdan **bambaşka sakin** görünmesi tanıyı geciktiren klasik durumdur"
patofizyoloji: "Dekolman çoğu kez **retinal yırtık**la başlar: yaşla gevşeyen vitreus **arka vitreus dekolmanı** sırasında periferik retinayı çeker ve **yırtık** açar. **Sıvı vitreus** bu yırtıktan retinanın **pigment epiteli**yle **duyu katmanı** arasına sızar ve retinayı yerinden kaldırır. **Yırtık üst retinadaysa** sıvı yerçekimiyle aşağıya iner ve perde **hızla genişler**; ayrılma **makulaya** ulaşınca **merkezi görme** tehdit altındadır"
anahtar_bulgular:
- "**Ağrısız, giderek genişleyen görme kaybı**: hastanın görüşüne bir **perde iniyor** ya da **gölge** kaplıyor tarifesi"
- "**Öncü belirtiler**: dekolmandan günler-haftalar önce **ani artan uçan cisimcikler** ve **ışık çakmaları**"
- "**Fundoskopide** dalgasını andıran buruşuk, gri-beyaz renkte, altındaki dokuyla birlikte oynayan **yükselmiş retina**"
- "**İleri miyopi**, periferik **retinal dejenerasyon** (lattice), **katarakt cerrahisi** öyküsü, **travma** ve aile öyküsü dekolman riskini artırır"
- "**Ağrısızlık**: **göz içi basınç** normal, göz dışarıdan sakin; tablo tamamen **fundus içinde** gelişir"
- "**Makula bağlı**yken merkezi görme korunur; makula ayrıldığında **keskinlik birden çöker**"
patognomonik: "**Ağrısız** gözde görüşe **inen perde** tarifesiyle fundoskopide **buruşuk, yükselmiş gri retina**nın görülmesi"
ilk_tetkik: "Gecikmeksizin pupil genişletilerek (**midriatik**) **indirekt oftalmoskopi**yle periferik retinanın **bütün kadranları**nın incelenmesi ve **yırtığın yeri** ile dekolmanın **sınırları**nın haritalanması; **medya bulanıksa** **B ultrason** ile **retinal yükselmenin** gösterilmesi"
kesin_tani: "**Fundoskopide retinal yırtığın** ve altında **sıvı birikimiyle yükselmiş** retinanın doğrudan görülmesi tanıyı koyar; tanı **klinik muayeneye** dayanır, görmenin sonucu açısından **makulanın bağlı** olup olmadığının ayrımı planlamayı belirler"
ilk_tedavi: "Dekolman **cerrahi bir acildir**; amaç **yırtığı kapatmak** ve vitreusun retinaya sızmasını durdurmaktır. **Sınırlı, üst yerleşimli ve makula dışı** dekolmanda **pnömatik retinopeksi** (göze gaz enjeksiyonu) ya da **dıştan serkl bandı**; **geniş, alt yerleşimli**, makulayı tehdit eden veya **vitreus çekintisi**nin sürdüğü olgularda **vitrektomi**. **Yırtık** saptanmış ama dekolman henüz gelişmemişse **lazerle bariyer çizimi** yeterli. **Makula bağlı**yken ameliyat **bekletilmez**; makula ayrılmışsa bile **saatler-günler içinde** müdahale görme sonucunu belirler"
klasik_komplikasyon: "Tedavisiz ayrılmanın **tüm retinaya yayılması** ve **körlük**; cerrahi sonrası **proliferatif vitreoretinopati**yle dekolmanın **tekrarı**; **makula** uzun süre ayrı kalırsa kalıcı **merkezi görme kaybı**"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
