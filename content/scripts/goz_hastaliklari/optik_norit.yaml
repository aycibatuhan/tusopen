tipik_hasta: "**Yirmi-otuzlu yaş**larında, **kadınlarda** daha sık; saatler-günler içinde gelişen **tek göz görme kaybı**yla başvuran genç hasta. Gözün **derininde, arkasında** yerleşen ve **bakış hareketiyle artan ağrı**dan yakınır; **renklerin soluk** görüldüğünü ve görmenin **merkezde sisli** olduğunu tarif eder. Günler-haftalar içinde **kısmen kendiliğinden düzelme** eğilimi tabloyu özgün kılar"
patofizyoloji: "Optik sinirin **iltihabi-demiyelinizan** hasarı: **miyelin kılıf** bozulunca ileti yavaşlar ve kısmen bloke olur; bu yüzden keskinlik kadar hatta ondan önce **kontrast duyarlılık** ve **renk algısı** çöker. Erişkinlerde en sık neden **multipl skleroz**la ilişkili **demiyelinizasyon**dur. Sinirin göz küresi arkasındaki bölümü tutulunca (**retrobulbar nörit**) **fundus hiçbir şey göstermez**; sinirin gözdeki başlangıcı (**papilla**) tutulunca (**papillit**) **disk şişer**. **Ağrı**, sinir kılıfının göz hareketiyle **mekanik gerilmesin**dendir"
anahtar_bulgular:
- "Gözün **arkasında/derininde**, **bakış hareketleriyle artan ağrı**; ağrı sıklıkla görme kaybından **bir-iki gün önce** başlar"
- "**Kontrast duyarlılıkta** belirgin düşüş ve kırmızı renklerin soluk, yıkanmış görünmesi (**kırmızı desatürasyon**)"
- "**Afferent pupiller defekt**: ışık **sağlam gözden hasta göze** kaydırıldığında gözbebeğinin büzülmek yerine **genişlemesi**"
- "**Retrobulbar** tipte **optik disk normal** görünümdedir; **papillit**te disk **ödemli** ve kenarları bulanıktır; retina ve medya sağlamdır"
- "Görme alanında merkezde (**santral skotom**); görsel uyarılmış potansiyelde **iletim latansının uzaması**"
- "**Isınma, egzersiz, sıcak duş**la geçici görme bozulması (**Uhthoff fenomeni**)"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **bakış hareketiyle artan ağrı**nın eşlik ettiği **tek göz görme kaybı**nda; **fundusun normal** göründüğü tabloda **afferent pupiller defekt** ve **renk solması** birlikteliği"
ilk_tetkik: "**Klinik muayene**: keskinlik, **renk görme**, **kontrast duyarlılık**, **pupil yanıtları** ve **fundus**. Tipik tabloda tanıyı laboratuvar şart kılmaz; ancak **multipl skleroz** riskini belirlemek için **kraniyal ve orbital manyetik rezonans** ilk tetkik olarak istenir. Beyaz cevherde **sessiz lezyon**ların görülmesi izleyen yıllarda **klinik MS** çıkma olasılığını öngörür"
kesin_tani: "**Tipik klinik üçlü**yle (subakut **tek göz görme kaybı**, **bakışla artan ağrı**, **afferent pupiller defekt**) konur. **Atipik** özellikler varsa tanı hemen kapanmaz: **iki gözün aynı anda** tutulumu, **ağrısızlık**, **ilerleyici seyir**, **kırk yaş üstü** başlangıç, **sistemik bulgular**; **MRG**, **beyin omurilik sıvısı** incelemesi ve ek tetkiklerle **iltihabi, iskemik ve basısal** nedenler ayrılır"
ilk_tedavi: "**Tipik** optik nörit **kendiliğinden düzelir**; tedavinin amacı **iyileşmeyi hızlandırmaktır**: damar yoluyla **yüksek doz metilprednizolon** ilk haftalarda görmenin toparlanmasını çabuklaştırır. Tek başına **oral steroid verilmez**; hem **etkisiz**dir hem **atak tekrarını artırır**, steroid **MS**nin çıkmasını **önlemez**. **MS** tanılı ya da **yüksek riskli** hastada **hastalığı düzenleyen (immünomodülatör)** tedavi nörolojiyle birlikte planlanır"
klasik_komplikasyon: "İzleyen yıllarda **multipl skleroz** tanısının belirmesi; atak sonrası kalıcı **renk solması** ve **kontrast duyarlılık** azlığı, nadiren **kalıcı görme kaybı**"
