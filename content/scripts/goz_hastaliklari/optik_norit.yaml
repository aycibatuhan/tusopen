author: ai-drafts/goz-2
sources:
- Kanski's Clinical Ophthalmology
- Optic Neuritis Treatment Trial (ONTT) sonuç raporları — referans olarak listelendi, metin projesi özgün
  yazımdır
ad: Optik Nörit
