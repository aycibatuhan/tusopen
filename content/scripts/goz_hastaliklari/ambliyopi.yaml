id: ambliyopi
version: 1
status: draft
author: "ai-drafts/goz-2"
sources:
  - "Kanski's Clinical Ophthalmology"
  - "Pediatric Eye Disease Investigator Group (PEDIG) ambliyopi çalışmaları — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Ambliyopi
taksonomi:
  - [ktbt, goz_hastaliklari, goz_sasilik_pediatrik, goz_sp_ambliyopi]
tipik_hasta: "Üç-sekiz yaş arasında saptanan çocuk; gözün kendisi yapısal sağlamdır ama beyin tek gözü kullanmayı öğrenmemiştir; çoğu kez hiçbir şikâyet yoktur ve düşük görme okul taramasında ya da tesadüfi muayenede yakalanır; öyküde şaşılık, iki göz arasındaki büyük kırma kusuru farkı ya da bebeklikte gözu örten neden (doğumsal katarakt, yoğun pitozis) aranır"
patofizyoloji: "Görme beynin öğrenilmiş bir işlevidir ve öğrenmenin penceresi kısıtlıdır: kabaca doğumdan sekiz yaşa uzanan kritik dönemde visual korteks, girdisi zayıf olan gözün sinyallerini yok saymaya ve yalnızca sağlam gözü kullanmaya başlar; tembel gözün kortikal temsili geride kalır. Üç kapı bu tabloya açılır: şaşılık — beyin çift görü (diplopi) yaşamamak için kayan gözü bastırır; anizometropi — bir gözün görüntüsü bulanık geldiğinden o göz bastırılır; ve kapama tipi — katarakt veya pitozis gibi bir örtü gözu tümüyle bulanıklaştırır, en hızlı ve en yıkıcı türdür. Pencere kapandıktan sonra nöral plastiklik biter ve tedavi kazancı dramatik biçimde düşer"
anahtar_bulgular:
  - "Yapısal olarak sağlam gözde, uygun camlarla kırma kusuru tam düzeltilmesine rağmen düşük kalan görme; iki göz arasında kural olarak iki satır ve üzeri fark"
  - "Şaşılık ya da tek gözle bakma tercihi; başı eğip çevirerek bakma davranışı"
  - "Anizometropi: iki göz arasında belirgin kırma kusuru farkı; dışarıdan hiçbir belirti vermeyebilir"
  - "Organik neden araştırmasının negatif olması: kornea, göz içi ortam, retina ve optik sinir normal bulunur"
  - "Kapama tipinde doğumsal katarakt, yoğun pitozis ya da uzun süre gözu kapatan başka nedenin öyküsü"
patognomonik: null
ilk_tetkik: "Sikloplejik damlalar altında (siklopentolat/atropin) refraksiyon ölçümü ve tam göz muayenesi; önce organik neden dışlanır — katarakt, retina ve optik sinir değerlendirilir; üç yaşın altında beğenerek bakma (preferans) testleri, üç yaşın üstünde şekil eşleştirme ve harf tabloları kullanılır"
kesin_tani: "Organik neden dışlandıktan ve kırma kusuru tam düzeltildikten sonra görmenin hâlâ düşük kalmasıyla konur; tanı dışlamayla (eksklüzyonla) ilerler — bu yüzden her ambliyopi adayı önce gözün yapısal sağlığı bakımından incelenmiş olmalı; kapama tipinde altta yatan örtü nedeninin belgelenmesi tanıyı taşır"
ilk_tedavi: "Sıra esastır: önce organik neden tedavi edilir — doğumsal katarakta müdahale bebeklikte haftalar içinde yapılmazsa kalıcı körlük gelişir. Sonra kırma kusuru camlarla tam düzeltilir; bu tek başına bile görme kazancı sağlayabilir. Asıl tedavi beyini tembel gözü kullanmaya zorlamaktır: sağlam gözün kapatılması (tıkama) ya da atropinle bulanıklaştırılması, çocukluk plastikliği penceresinden geçen güçle işler; tıkama mantığı budur — sağlam gözü alır, tembel gözün devreye girmesini sağlarsınız. Yaş büyüdükçe kazanç azalır ancak okul çağının ilerisine (7-12 yaş, önceden tedavi edilmemişlerde daha ileriye) uzanan pencerelerde de anlamlı iyileşme olur (PEDIG); bu yüzden erken saptama tarama programlarının amacıdır. İzlem görme hedefe ulaşıncaya dek sürdürülür; tıkama erken bırakılırsa görme yeniden düşebilir"
klasik_komplikasyon: "Tedavisiz ömür boyu tek gözle görme; sağlam göz ileride hastalanır ya da yaralanırsa kişinin iş göremez hale gelmesi; tedavide geç kalındığında kalıcı kortikal tembelik"
