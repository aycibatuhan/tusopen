ad: Ambliyopi
taksonomi:
  - [ktbt, goz_hastaliklari, goz_sasilik_pediatrik, goz_sp_ambliyopi]
tipik_hasta: "**Üç-sekiz yaş** arasında saptanan çocuk; gözün kendisi **yapısal sağlam**dır ama beyin tek gözü **kullanmayı öğrenmemiştir**. Çoğu kez **şikâyet yoktur**; düşük görme **okul taramasında** ya da tesadüfi muayenede yakalanır. Öyküde **şaşılık**, iki göz arasında **büyük kırma kusuru farkı** ya da bebeklikte **gözu örten neden** (**doğumsal katarakt**, **yoğun pitozis**) aranır"
patofizyoloji: "Görme **beynin öğrenilmiş** bir işlevidir; kabaca doğumdan **sekiz yaşa** uzanan **kritik dönem**de visual korteks, girdisi zayıf olan gözün sinyallerini **yok saymaya** başlar. **Şaşılık**: beyin **çift görü (diplopi)** yaşamamak için kayan gözü **bastırır**. **Anizometropi**: bir gözün görüntüsü **bulanık** geldiğinden o göz bastırılır. **Kapama tipi**: **katarakt** veya **pitozis** gibi örtü gözu tümüyle bulanıklaştırır, **en hızlı ve en yıkıcı** türdür; pencere kapanınca **nöral plastiklik** biter ve **tedavi kazancı** dramatik biçimde düşer"
anahtar_bulgular:
- "**Yapısal olarak sağlam** gözde, uygun camlarla kırma kusuru **tam düzeltilmesine** rağmen düşük kalan görme; iki göz arasında **iki satır ve üzeri** fark"
- "**Şaşılık** ya da **tek gözle bakma tercihi**; başı eğip çevirerek bakma davranışı"
- "**Anizometropi**: iki göz arasında belirgin **kırma kusuru farkı**; dışarıdan **hiçbir belirti** vermeyebilir"
- "**Organik neden araştırmasının negatif** olması: **kornea**, göz içi ortam, **retina** ve **optik sinir** normal bulunur"
- "**Kapama tipinde** **doğumsal katarakt**, **yoğun pitozis** ya da uzun süre gözu kapatan başka nedenin öyküsü"
patognomonik: null
ilk_tetkik: "**Sikloplejik** damlalar altında (**siklopentolat**/**atropin**) **refraksiyon ölçümü** ve tam göz muayenesi; önce **organik neden** dışlanır — **katarakt**, **retina** ve **optik sinir** değerlendirilir. **Üç yaşın altında** beğenerek bakma (**preferans**) testleri, üç yaşın üstünde **şekil eşleştirme** ve **harf tabloları** kullanılır"
kesin_tani: "**Organik neden** dışlandıktan ve kırma kusuru **tam düzeltildikten** sonra görmenin hâlâ **düşük** kalmasıyla konur; tanı **dışlamayla (eksklüzyonla)** ilerler. **Kapama tipinde** altta yatan **örtü nedeninin belgelenmesi** tanıyı taşır"
ilk_tedavi: "Sıra esastır: önce **organik neden** tedavi edilir — **doğumsal katarakta** müdahale bebeklikte **haftalar içinde** yapılmazsa **kalıcı körlük** gelişir. Sonra kırma kusuru **camlarla tam düzeltilir**; bu tek başına bile görme kazancı sağlayabilir. Asıl tedavi beyini tembel gözü kullanmaya zorlamaktır: **sağlam gözün kapatılması (tıkama)** ya da **atropinle bulanıklaştırılması**. Yaş büyüdükçe kazanç azalır ancak **7-12 yaş**ta ve önceden tedavi edilmemişlerde daha ileri pencerelerde de anlamlı iyileşme olur; **izlem** görme hedefe ulaşıncaya dek sürdürülür, **tıkama erken bırakılırsa** görme **yeniden düşebilir**"
klasik_komplikasyon: "Tedavisiz **ömür boyu tek gözle görme**; **sağlam göz** ileride hastalanır ya da yaralanırsa kişinin **iş göremez** hale gelmesi; tedavide geç kalındığında **kalıcı kortikal tembelik**"
