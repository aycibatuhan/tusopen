id: protez_eklem_enfeksiyonu
version: 1
status: draft
author: "ai-drafts/ortopedi-3"
sources:
  - "Campbell's Operative Orthopaedics (revizyon artroplasti ve enfeksiyon bölümü) — referans olarak listelendi, metin projesi özgün yazımdır"
  - "Protez eklem enfeksiyonu uluslararası konsensus tanı kriterleri (ICM/MSIS) — isim olarak listelendi"
ad: Protez Eklem Enfeksiyonu
taksonomi:
  - [ktbt, ortopedi, orto_eklem_dejeneratif, orto_ek_protez_enfeksiyonu]
tipik_hasta: "Total kalça ya da diz protezi takılmış hasta; erken dönemde ameliyat yarasının iyileşmemesi ve akıntıyla, geç dönemde (yıllar sonra) açıklanamayan eklem ağrısı, ısınma-şişlik veya hematogen yayılım kaynağı (idrar yolu, diş, cilt enfeksiyonu) öyküsüyle başvurur. En sık etken S aureus ve koagülaz negatif stafilokoklardır"
patofizyoloji: "Protez metal-plastik yüzeylerinde yerleşen bakteriler kendilerini polisakkarit bir biyofilm tabakasının içine hapseder; biyofilmdeki organizmalara antibiyotikler ve savunma hücreleri ulaşamaz, kültür bile negatif kalabilir. Bu yüzden tedavinin omurgası antibiyotik değil cerrahidir. Geç enfeksiyonlar ayrıca geçici bakteriyemiyle proteze hematogen yerleşir. İltihap mediatörleri protez-basınç kemik arayüzünü bozarak gevşeme yapar"
anahtar_bulgular:
  - "İstirahatte bile süren eklem ağrısı (salt yüklenme ağrısı gevşemeyi, dinlenme ağrısı enfeksiyonu düşündürür)"
  - "Serum CRP ve ESR birlikte normal ise enfeksiyon olasılığı çok düşüktür (tarama değerleri); CRP ameliyat sonrası yaklaşık 3 haftada normale döner, ESR ancak aylar içinde iner"
  - "Sinovyal sıvıda lökosit sayısı ve PMN oranının artması (protezli ekleme özgü eşik değerlerin üstünde)"
  - "Yara yerinden akıntı veya eklemle iletişimli fistül"
  - "Grafide protez çevresinde kemik rezorpsiyonu-osteolizis, bileşenlerin erken gevşemesi"
patognomonik: "Eklemle iletişim süren sinüs traktı (fistül) veya protezin görünür kısıtından süzülen akıntı"
ilk_tetkik: "Serum CRP ve ESR, eklem grafisi; değerler yüksekse veya şüphe sürüyorsa eklem aspirasyonu (sinovyal lökosit sayısı, PMN oranı, kültür)"
kesin_tani: "Sinovyal sıvı hücre sayısı-PMN oranı eşiğinin aşılması ve tekrarlı eklem sıvısı/doku kültürlerinde aynı etkenin izolasyonu; gerekirse intraoperatif doku patolojisi ve protez yüzeyi ultrasonikasyon kültürü"
ilk_tedavi: "Başlangıcı erken (belirtiler yaklaşık 3-4 haftadan kısa) ve protezi sağlam olan hastada: protez yerinde bırakılarak açık debridman ve bileşen ara yüzünün değiştirilmesi, ardından damar yolu antibiyotiği; geç/kronik enfeksiyonda iki aşamalı revizyon: protezin çıkarılıp antibiyotik yüklü siman ara boşluk konması, damar yolu antibiyotik kürü, sonra yeni protez. Biyofilm nedeniyle salt antibiyotik tedavi başarısızdır"
klasik_komplikasyon: "Biyofilm nedeniyle tedavi direnci, kalıcı fistül ve protezin kaybı; eksizyon artroplastisi veya kemik kaybıyla revizyonda zorlanmış cerrahi"
tus_gecmisi: []
