id: femur_boyun_kirigi
version: 1
status: draft
author: "ai-drafts/ortopedi"
sources:
  - "Rockwood and Green's Fractures in Adults"
  - "Campbell's Operative Orthopaedics"
ad: Femur Boyun Kırığı
taksonomi:
  - [ktbt, ortopedi, orto_alt_ekstremite_travma, orto_ae_femur_boynu]
tipik_hasta: "İki uçlu grup: yerden yükselmeden düşme gibi **düşük enerjili travmalı** yaşlı **osteoporotik**
  kadın; trafik kazası veya yüksekten düşme gibi **yüksek enerjili travmalı** genç erişkin. Yük vermeyle
  artan kasık ağrısı olan koşucu ya da yeni askerde **stres kırığı** düşünülmeli"
patofizyoloji: "Femur başını esas olarak **medial sirkumfleks femoral arter**in retinaküler dalları boyun
  boyunca retrograd besler; yuvarlak bağdaki damar erişkinde önemsizdir. Kırık **intrakapsüler**
  yerleşir; damarlar kopabilir ya da eklem içi hematom basısıyla tıkanabilir, bu yüzden yer
  değiştirmiş kırıkta baş beslenmesi risk altındadır. **Garden** yer değiştirme derecesini, **Pauwels**
  kırık çizgisinin düşeyliğini tarif eder; çizgi düşe yaklaştıkça kayma ve kaynamama riski artar"
anahtar_bulgular:
  - "Travma sonrası **kasıkta (inguen) ağrı**; hasta uzuv üzerine yük veremez, ayağa kalkamaz"
  - "Yer değiştirmiş kırıkta bacak **kısalır** ve **dışa (eksternal) döner**; her hareket denemesi
    ağrılıdır"
  - "Aksiyel basınçta ve bacağı içe-dışa döndürmede (**log roll**) kalçada ağrı"
  - "**Garden tip 1-2** (valgus impakte veya yer değiştirmemiş) kırıklarda hasta yürüyebildiğinden tanı
    atlanabilir; şüphede grafi yenilenmeli"
  - "Genç hastada güçlü travma öyküsü; stres kırığında istirahatte geçen, yük vermeyle artan **kasık
    ağrısı**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — yer değiştirmiş kırıkta **kısalık ve
  eksternal rotasyon**la gelen ağrılı, kullanılamayan uzuv tablosu"
ilk_tetkik: "Pelvis **ön-arka** ve etkilenen kalçanın **lateral** grafileri. Klinik şüphe güçlü olup grafi
  normalse **MRG** en duyarlı tetkiktir; yapılamıyorsa **BT**"
kesin_tani: "Direkt grafi; gizli (okült) kırıklarda **MRG**"
ilk_tedavi: "Erken cerrahi (ideal olarak **ilk 24-48 saat**). Yaşlı hastada yer değiştirmiş kırıkta **eklem
  protezi** (hemiartroplasti veya total kalça); yer değiştirmemiş kırıkta **kanülü vidalarla fiksasyon**.
  Genç hastada başı korumak için acil **kapalı redüksiyon ve kanülü vida osteosentezi**; düşey kırıklarda
  (**Pauwels tip 3**) **açı plak** gibi ek fiksasyon seçenekleri"
klasik_komplikasyon: "Femur başı **avasküler nekrozu** ve **kaynamama (nonunion)** — yer değiştirmiş
  kırıklarda risk belirgin yüksek. Ayrıca **derin ven trombozu** ve uzun dönemde protez sorunları"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
