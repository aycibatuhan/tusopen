id: femur_basi_epifiz_kaymasi
version: 1
status: draft
author: "ai-drafts/ortopedi-2"
sources:
  - "AAOS Femur Başı Epifiz Kayması Kılavuzu (2022)"
  - "Campbell's Operative Orthopaedics"
ad: Femur Başı Epifiz Kayması
taksonomi:
  - [ktbt, ortopedi, orto_pediatrik, orto_ped_sfke]
tipik_hasta: "**10-16 yaş** **obez** ergen, erkeklerde daha sık; haftalardır süren kalça veya diz ağrısı ve
  aksayan yürüyüşle gelir, ağrı uyluğun iç ön yüzüne ve dize vurur. **Hipotiroidi**, **büyüme hormonu
  bozuklukları** gibi endokrin hastalıklarda risk ve çift taraflı kayma olasılığı artar"
patofizyoloji: "Puberte hızlı büyüme döneminde femur başı fizi kartilajı en zayıf hâlindedir; **obezite**nin
  makaslama yükü ve endokrin hastalıkların plağı zayıflatmasıyla epifiz femur boyun üzerinde
  geriye-içe (**posterior-medial**) kayar. Kayma haftalarca süren sessiz ön dönemden sonra belirlenir
  (kronik form); ani ağrı alevlenmesi **kararsız (akut)** kaymayı gösterir ve beslenme damarı riski en
  yüksek formdur"
anahtar_bulgular:
  - "**10-16 yaş** obez ergen; kalça-diz ağrısı, aksayan yürüyüş, spor performansında düşme"
  - "Yürüme ve ayakta durmada bacak **dışa dönük (eksternal rotasyon)**; kalça fleksiyonunda bacak
    zorlanarak dışa açılır (**Drehmann işareti**)"
  - "**İç rotasyon** ve **abdüksiyon** kısıt; ağrı uyluğun iç ön yüzüne ve dize vurur (**obturatör sinir**
    yolu)"
  - "**Kurbağa lateral** radyografide kayma en iyi görünür; ön-arka grafide **Klein çizgisi (Trethowan
    işareti)** femur başını kesmez"
  - "Çift taraflı kayma oranı yüksek (**%20-40**); genç obez veya endokrin hastalığı olan hastada karşı
    taraf izlenmeli"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Trethowan işareti** (Klein çizgisinin
  femur başını kesmemesi)"
ilk_tetkik: "Her iki kalçanın **ön-arka** ve **kurbağa (frog-lateral)** radyografileri. Kararsız kaymada
  kurbağa pozisyonu kaymayı artırabileceğinden **gerçek lateral** görüntü tercih edilir. Şüphede **MRG**
  erken kaymayı gösterir"
kesin_tani: "Radyografide epifizin femur boyun üzerinde **posterior-medial** kayması; derece, epifizin
  boyun genişliğinin yüzdesiyle tarif edilir (hafif **yüzde 25 altı**, orta **yüzde 25-50**, ileri
  **yüzde 50 üsti**). Tablo stabil (yürüyebilen) veya **kararsız** (yük veremeyen) olarak sınıflanır"
ilk_tedavi: "Redüksiyon denenmeden epifize geçen **tek kanülü vida** ile **in-situ tespit**; agresif
  redüksiyon **avasküler nekroz** riskini artırır. Kararsız ve ileri kaymada nazik **kapalı redüksiyon**
  eklenebilir. Endokrin hastalık şüphesinde **tiroid** ve **büyüme hormonu** değerlendirmesi; riskli
  grupta karşı kalçanın **profilaktik fiksasyonu** tartışılır"
klasik_komplikasyon: "**Avasküler nekroz** (kararsız kaymada ve agresif redüksiyonda), kıkırdak erimesi
  (**kondroliz**), fizin erken kapanması ve kalça eklemi yıkımı. **Karşı tarafta kayma**"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
