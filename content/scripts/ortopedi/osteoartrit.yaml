- - ktbt
  - ftr
  - ftr_romatizmal
  - ftr_rm_osteoartrit
tipik_hasta: "**50 yaş üstü**, fazla kilolu kadın; **diz** ve **birinci karpometakarpal** (el kökü)
  eklemleri en sık. Ağrı gün içinde kullanımla artar, dinlenince kısa sürede rahatlar; sabah tutukluğu
  **30 dakikadan kısa**dır — uzun süreli tutukluk yapan **romatoid artrit**ten ayırır"
patofizyoloji: "Kıkırdağın onarım kapasitesi aşırı mekanik yük altında yetersiz kalır; **proteoglikan**
  içeriği azalır, yüzey çatallanır ve incelir. Eklem kenarlarında **osteofit**, altındaki kemikte
  **skleroz** ve **subkondral kist**; düşük dereceli sinovyal inflamasyon eşlik eder. Dizde daralma
  **asimetrik**tir (medial kompartman önde); bacak **varus**a düşer"
anahtar_bulgular:
- "**Kullanımla artan**, akşam belirginleşen eklem ağrısı; **dinlenince kısa sürede geçer**"
- "Dinlenme sonrası **30 dakikadan kısa** süren tutukluk (**jel fenomeni**); uzun sabah tutukluğu yok"
- "Elde **DIP** eklemlerde **Heberden**, **PIP** eklemlerde **Bouchard** nodülleri; **birinci
  karpometakarpal** tutulumla elle tutulur kök metakarpal çıkıntı"
- "Dizde **varus deformite**, **medial (iç kompartman)** ağrı, hareket sırasında **crepitasyon**"
- "Ayakta diz radyografisinde **eklem aralığı daralması**, **osteofit**, **subkondral skleroz** ve kist"
- "**Sedimantasyon** ve **CRP** normal; sistemik bulgu (halsizlik, ateş, kilo kaybı) yok"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **Heberden** ve **Bouchard** nodülleri
  (primer nodal el osteoartriti)"
ilk_tetkik: "Ayakta alınan **diz ön-arka radyografisi** (ayakta grafide eklem aralığı daralması daha iyi
  görünür); laboratuvar tetkiki tanı için gerekmez, **CRP** normaldir"
kesin_tani: "**Klinik tablo + radyografi**: kullanım tipi ağrı, kısa tutukluk, **crepitasyon**,
  **osteofit** ve eklem aralığı daralması. İnflamatuvar artrit dışlanır: sabah tutukluğu kısa, **CRP**
  normal"
ilk_tedavi: "İlk basamak ilaçsız: **kilo verme**, **kuadriseps** güçlendirme egzersizleri, **baston**. İlk
  ilaç **topikal NSAID**, yetersizse **oral NSAID** (gastroproteksiyonlu); alevlenme döneminde
  **intraartiküler kortikosteroid enjeksiyonu**. Konservatif tedaviye yanıt vermeyen ileri deformitede
  **total eklem protezi**"
klasik_komplikasyon: "Eklem hareket kaybı ve ileri deformite (**varus-valgus diz**, **çekiç başparmak**).
  Günlük yaşam aktivitelerinde kısıt ve **protez** gereksinimi"
