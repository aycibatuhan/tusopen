id: osteoartrit
version: 1
status: draft
author: ai-drafts/ortopedi-2
sources:
- ACR/Arthritis Foundation Osteoartrit Tedavi Rehberi (2019)
- Campbell's Operative Orthopaedics
ad: Osteoartrit
