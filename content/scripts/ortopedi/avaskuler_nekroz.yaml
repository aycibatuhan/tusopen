id: avaskuler_nekroz
version: 1
status: draft
author: ai-drafts/ortopedi-3
sources:
- Campbell's Operative Orthopaedics (avasküler nekroz ve femur başı bölümü) — referans olarak listelendi,
  metin projesi özgün yazımdır
- AAOS avasküler nekroz tanı-tedavi kılavuzu — isim olarak listelendi
ad: Avasküler Nekroz
taksonomi:
- - ktbt
  - ortopedi
  - orto_eklem_dejeneratif
  - orto_ek_avaskuler_nekroz
tipik_hasta: "Uzun süreli yüksek doz **kortikosteroid** kullanan (transplantasyon, otoimmün hastalık,
  lenfoma) veya **alkol** bağımlılığı olan orta yaş hasta; kasıkta derin ağrı ve topallıkla başvurur.
  Ayrıca **orak hücre anemisi**, **dekompresyon hastalığı (dalış)**, **Gaucher hastalığı** ve
  kemoterapi-radyoterapi öyküsü tanıdıktır; iki kalça birlikte de tutulabilir"
patofizyoloji: "Femur başını besleyen **medial femoral dolaşım**ın kan akışı kesilince osteosit ve
  osteoblastlar ölür, kemik iliğinde ölü alan bırakır. **Steroid** ve **alkol** karaciğer ya
  metabolizmasını bozup kemik iliğinde iç basınç yükseltir; **orak hücre**de damar tıkanıklığı,
  dalışta gaz embolisi kurar. Onarım sırasında nekroz altında **subkondral kırıklar** oluşur,
  kıkırdak altı kemik çöker ve ikincil osteoartrit gelişir; kollateral dolaşım zayıf olduğundan
  en sık yer femur başıdır"
anahtar_bulgular:
- "Kasıkta-kalça önünde derin yerleşimli, yüklemeyle artan ağrı; **ilerleyici topallık** yapar"
- "**İç rotasyon** ve **abduksiyonda** ağrılı kısıtlılık; erken dönemde tek muayene bulgusu"
- "Risk faktörü öyküsü: **kortikosteroid**, **alkol**, **orak hücre**, **dalış**"
- "MRG'de sinyal değişikliği ve **T2'de çift çizgi (double line)** bulgusu; grafisi normal hastada
  bile lezyonu gösterir"
- "İlerlemiş grafide **subkondral radyolüser ince çizgi (crescent)**, skleroz-kistik alanlar ve femur
  başı düzleşmesi-çökmesi"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — görüntülemede **crescent** (subkondral
  kemik altında ince kopukluk çizgisi) ve MRG'de **çift çizgili** nekrotik alan"
ilk_tetkik: "Kalça grafileri ve **MRG**; risk faktörü taşıyan hastada hem tanı hem erken evreleme için
  **MRG** ilk seçimdir. Grafiler erken dönemde normal kalabilir; iki taraflı riskte her iki kalça
  birlikte değerlendirilir"
kesin_tani: "**MRG** ile konur; erken evrede tanıyı koyar, nekrozun boyutunu ve çökme riskini belirler.
  İleri evrede ayakta kalça grafileri yeterlidir; evrelemede **Ficat-Arlet** kullanılır"
ilk_tedavi: "Çökme öncesi erken evrede (küçük lezyonlar dahil) yük azaltma ve koruyucu cerrahi olarak
  **çekirdek dekompresyonu**; gerekirse non-vaskülerize/vaskülerize **kemik grefti**. **Bisfosfonat**
  için kanıt yetersizdir, standart tedavi değildir. Kıkırdak yüzeyi çökmüş genç-orta yaş hastada
  **total kalça protezi**"
klasik_komplikasyon: "**Femur başı çökmesi** ve ikincil **osteoartrit**; steroid kullanıcılarında iki
  taraflı tutulum, genç hastada ömür boyu protez yıpranma sorunu"
