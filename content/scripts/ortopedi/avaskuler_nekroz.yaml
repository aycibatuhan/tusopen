id: avaskuler_nekroz
version: 1
status: draft
author: ai-drafts/ortopedi-3
sources:
- Campbell's Operative Orthopaedics (avasküler nekroz ve femur başı bölümü) — referans olarak listelendi,
  metin projesi özgün yazımdır
- AAOS avasküler nekroz tanı-tedavi kılavuzu — isim olarak listelendi
ad: Avasküler Nekroz
taksonomi:
- - ktbt
  - ortopedi
  - orto_eklem_dejeneratif
  - orto_ek_avaskuler_nekroz
tipik_hasta: Uzun süreli yüksek doz kortikosteroid kullanan (transplantasyon, otoimmün hastalık, lenfoma
  tedavisi) veya alkol bağımlılığı olan orta yaş hasta; ayrıca orak hücre anemisi, dekompresyon hastalığı
  (dalış), Gaucher hastalığı, kemoterapi-radyoterapi öyküsü tanıdıktır. Kasıkta derin yerleşimli, giderek
  artan ağrı ve topallıkla başvurur; iki kalça birlikte de tutulabilir
patofizyoloji: 'Femur başını besleyen damarların (medial femoral dolaşım sistemi) kan akışı kesilince
  osteosit ve osteoblastlar ölür; kemik iliğinde ölü alan bırakır. Risk faktörleri mekanizmayı farklı
  biçimde kurar: steroid ve alkol karaciğerde ya metabolizmasını bozarak kemik iliğinde ya hücre artışı
  ve iç basınç yükselmesiyle dolaşımı kısar; orak hücrede damar tıkanıklığı, dalışta gaz embolisi söz
  konusudur. Onarım sırasında nekrotik alanın altında subkondral kırıklar oluşur, kıkırdak altı kemik
  çöker ve ikincil osteoartrit gelişir. Femur başının kollateral dolaşımı zayıf olduğu için en sık yer
  kalçadır'
anahtar_bulgular:
- Kasıkta, kalça önünde derin yerleşimli ağrı; yüklemeyle artar, ilerleyici topallık yapar
- İç rotasyon ve abduksiyonda ağrılı kısıtlılık (erken dönemde tek muayene bulgusu)
- Steroid, alkol, orak hücre, dalış gibi risk faktörü öyküsü
- MRG'de femur başında sinyal değişikliği ve T2 görüntüde çift çizgi (double line) bulgusu; grafisi henüz
  normal olan hastada bile lezyonu gösterir
- İlerlemiş grafide subkondral radyolüser ince çizgi (crescent), skleroz-kistik alanlar ve femur başı
  düzleşmesi-çökmesi
patognomonik: Patognomonik değil; tanıya yardımcı tipik bulgu — Görüntülemede crescent bulgusu (subkondral kemik altında ince kopukluk çizgisi) ve MRG'de
  çift çizgili nekrotik alan
ilk_tetkik: Kalça grafileri ve MRG; risk faktörü taşıyan hastada hem diagnostik hem erken evreleme için
  MRG ilk seçimdir (grafiler erken dönemde normal kalabilir); bilateral riskte iki kalça birlikte değerlendirilir
kesin_tani: 'MRG: erken evrede kesin tanıyı koyar, nekrozun boyutunu ve çökme riskini belirler; ileri
  evrede ayakta kalça grafileri yeterlidir (evreleme klasiklerinde Ficat-Arlet kullanılır)'
ilk_tedavi: 'Çökme öncesi erken evrede (küçük lezyonlar dahil): yük azaltma ve koruyucu cerrahi
  olarak çekirdek dekompresyonu (bisfosfonatlar için kanıt yetersizdir, standart tedavi değildir), gerekirse non-vaskülerize/vaskülerize kemik grefti; kıkırdak yüzeyi çökmüş
  genç-orta yaş hastada total kalça protezi'
klasik_komplikasyon: Femur başı çökmesi ve ikincil osteoartrit; steroid kullanıcılarında iki taraflı tutulum,
  genç hastada ömür boyu protez yıpranma sorunu
tus_gecmisi:
