id: karpal_tunel
version: 1
status: draft
author: ai-drafts/ortopedi-2
sources:
- AAOS Karpal Tünel Sendromu Kılavuzu
- Campbell's Operative Orthopaedics
ad: Karpal Tünel Sendromu
taksonomi:
- - ktbt
  - ortopedi
  - orto_el_cerrahisi
  - orto_el_karpal_tunel
tipik_hasta: "**40-60 yaş** kadın; gece elinde uyanan uyuşma ve ağrıyla gelir, **eli sallayarak** rahatlama
  ihtiyacı duyar. **Hamilelik**, **menopoz**, **hipotiroidi**, **diyabet**, **romatoid artrit**,
  **amiloidoz** ve **hemodiyaliz** hastaları riskli; uzun süre klavye veya tekrarlayan bilek fleksiyonu
  gerektiren işler tetikleyicidir"
patofizyoloji: "Median sinir, bileğin ön yüzünde **fleksör retinakülüm** (transvers karpal bağ) altındaki
  sıkı tünelden geçerken ilk üç parmağın duyusunu ve tenar kasların motorunu taşır. Tünel içinde
  **tenosinovit**, sıvı retansiyonu (gebelik, hipotiroidi, diyaliz) veya tekrarlayan kullanıma bağlı iç
  basınç artışı siniri sıkıştırır. Basınç önce **miyelin kılıfını** bozar; uzun sürede **akson kaybı** ve
  kas atrofisi gelişir"
anahtar_bulgular:
- "Gece uyuşma ve ağrı: **başparmak, işaret ve orta parmak** (median sinir dağılımı); hasta elini
  sallayarak rahatlar (**flick işareti**)"
- "**Phalen testi**: bilek 90 derece fleksiyonda uyuşma dakikalar içinde artar; **Tinel testi**:
  retinakülüm üzerinde tıkamada parmaklarda çarpıntı hissi"
- "İlerlemiş tabloda **tenar kas atrofisi** ve başparmak **abduksiyon-opozisyon** güçsüzlüğü (motor dal)"
- "Etkilenen parmaklarda **iki nokta ayırt etme** mesafesi artar (duyusal kaybın objektif göstergesi)"
- "Boyun kökü sıkışmasından farklı olarak boyun-omuz ağrısı ve boyun hareketiyle uyuşma yok; **serçe
  parmak asla uyuşmaz**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — gece uyuşması ve hastanın elini sallayarak
  rahatlama davranışı (**flick işareti**)"
ilk_tetkik: "Fizik muayenede **Phalen** ve **Tinel** testleri; kesin tanı ve şiddeti belirlemek için **sinir
  iletim çalışması (EMG)**. Nedeni sorgulamak için **TSH**, **kan şekeri** ve **romatoid taraması**"
kesin_tani: "**Sinir iletim çalışması**nda median sinirin bilek segmentinde **distal motor latensi**
  uzamış, duyusal ileti yavaşlamış. İleri tabloda tenar motor amplitüd düşer; **iğne EMG**de tenar
  kaslarda **denervasyon** görülür"
ilk_tedavi: "Hafif tabloda gece bileği **nötr (sıfır derece) pozisyonda splint** ve mevcut nedeni düzeltmek
  (tiroid, gebelikte doğumla düzelme). Alevlenmede karpal tünel içine **kortikosteroid enjeksiyonu**.
  **Tenar atrofi**, sürekli uyuşma veya konservatif tedaviye yanıtsızlıkta **fleksör retinakülümün
  kesilmesi** (açık veya endoskopik serbestleştirme)"
klasik_komplikasyon: "Kalıcı **tenar atrofi** ve duyu kaybı; tedavi gecikirse iyileşme tam olmaz. Cerrahi
  sonrasında nadiren **nüks** ve avuç içinde hafif güç kaybı"
