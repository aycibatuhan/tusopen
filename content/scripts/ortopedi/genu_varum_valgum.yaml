id: genu_varum_valgum
version: 1
status: draft
author: "ai-drafts/ortopedi-3"
sources:
  - "Campbell's Operative Orthopaedics (pediatrik diz hizalama bozuklukları bölümü) — referans olarak listelendi, metin projesi özgün yazımdır"
  - "AAOS çocuk ortopedisi hizalama bozuklukları rehberi — isim olarak listelendi"
ad: Genu Varum ve Genu Valgum
taksonomi:
  - [ktbt, ortopedi, orto_pediatrik, orto_ped_genu_varum_valgum]
tipik_hasta: "Yeni yürümeye başlamış bebekte **fizyolojik genu varum**, 3-4 yaşını doldurmuş çocukta
  **fizyolojik genu valgum**; en sık tablo tamamen iyi huylu fizyolojik dizilimdir. Eğriliğin bu yaş
  kalıbına uymadığı, **tek taraflı** ya da **ilerleyici** olduğu için başvuran aile; klinisyenin görevi
  patolojik olanı ayırmaktır"
patofizyoloji: "Dizilim yaşla çizgi izler: bebekte hafif **varus (6-12 ay**da en belirgin), **18-24
  ay**da düz, **3-4 yaş**ta en belirgin **valgus**, sonra yetişkin düzenine iner. Fizyolojik
  eğrilik **simetrik**, ağrısızdır ve fizin kendini düzenlemesiyle düzelir; patolojik eğrilikte basınç
  artan tarafta büyüme yavaşlar (**Hueter-Volkmann ilkesi**) ve eğrilik kendi kendini büyütür. Kalıcı
  varusun klasik nedenleri **Blount**, **rikitse**, kemik displazileri ve fizye hasarıdır; kalıcı valgus
  genellikle **lateral distal femur** fizi sorunları ve romatizmal-iskelet hastalıklarıyla gider"
anahtar_bulgular:
  - "Yaş-dizilim kalıbı: en belirgin **varus 6-12 ay**da, düz dizilim **18-24 ay**da, en belirgin
    **valgus 3-4 yaş**ta, yetişkin düzeni 7 yaşa doğru"
  - "Fizyolojik eğrilik: **iki taraflı ve simetrik**, ağrı ve fonksiyon kaybı yok, yürüyüş olumsuz
    etkilenmez"
  - "Varusta **dizler arası (interkondiler)**, valgusta **ayak bilekleri arası (intermalleoler)** mesafe
    ölçülerek izlenir"
  - "Patolojik şüphe işaretleri: **tek taraflılık**, ilerleme, **ağrı**, açının yaş kalıbına uymaması, boy
    kısalığı veya iskelet sisteminde genel bozukluk"
  - "Ayakta, dizler öne bakar konumda çekilen bacak grafiğinde **tibiofemoral açı** ölçümü ve
    fizye-metafiz değerlendirmesi"
patognomonik: null
ilk_tetkik: "Özenli **muayene** (simetri, ağrı, boy oranları, yürüyüş) ve izlem; yaş kalıbına uymayan
  tabloda **ayakta bacak AP grafisi**"
kesin_tani: "**Klinik tablo** ile yaş-fizyolojik çizginin birleşimi ve grafiğe **tibiofemoral açı** ölçümü;
  fizyolojik eğriliğin kabul ölçütleri **simetri**, yaşa uygun açı ve **ilerlememe**"
ilk_tedavi: "Fizyolojik eğrilikte **tedavi yok**: aile bilgilendirilir, gözlem yapılır (ayakkabı içi
  destek, egzersiz gereksizdir). Patolojik tabloda önce neden tedavi edilir: **rikitse**de **D vitamini**,
  **Blount**ta ortezi-osteotomi. Kalıcı eğriliğe yönelik düzeltme: **geçici hemiepifizyodez** (fizin
  büyümesini engelleyen tarafa bağ/plak) veya **düzeltici osteotomi**"
klasik_komplikasyon: "Tedavi edilmeyen kalıcı varusta diz iç kompartmanda erken **osteoartrit**. Kalıcı
  belirgin valgusta **patellofemoral yük artışı**, **patella çıkma** eğilimi ve yürüyüş dengesizliği"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
