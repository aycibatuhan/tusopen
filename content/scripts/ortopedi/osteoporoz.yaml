tipik_hasta: "Menopoz sonrası 60'lı yaşlardaki **ince yapılı kadın**; uzun süreli **kortikosteroid**
  kullanan, **sigara** içen, **kalsiyum** ve **D vitamini** yetersiz kişiler. **Boy kısalması** ve
  **kamburlaşma** şikayeti; yerden yükselmeyi gerektirmeyen düşme sonrası **bilek veya kalça kırığı**;
  bir kez kırık yaşamış hastada sonraki kırık riski katlanarak artar"
patofizyoloji: "Kemik dönüşümünde **osteoklastik resorpsiyon** osteoblastik yapımı aşar; menopozda
  **östrojen eksikliği** osteoklastı frenleyen koruyucu mekanizmayı kaldırır. Hızlı yıkım önce
  **trabeküler kemik**te (vertebra, distal radius, femur boyun) olur; ileri yaşta osteoblast işlevi de
  azalır. **Mikromimari** bozuklukla dayanım düşer; düşük enerjili travmada kırık"
anahtar_bulgular:
- "**Düşük enerjili (fragilite) kırık**: vertebral kompresyon, **distal radius (Colles)**, proksimal femur"
- "Belirtisiz ilerleyen tablo: **boy kısalması** ve **kifoz artışı** (ardışık vertebral kompresyonların
  ilk bulgusu)"
- "**DEXA T skoru** **2.5 ve altı** osteoporoz; **1 ile 2.5 arası** düşük kemik kitlesi (osteopeni)"
- "Risk etkenleri: **menopoz**, ileri yaş, **sistemik steroid**, **sigara**, **alkol**, aile öyküsü,
  düşük vücut ağırlığı, uzun süreli hareketsizlik"
- "Laboratuvar genellikle normal: **kalsiyum**, **fosfor**, **ALP** normal; **sekonder neden**
  (hipertiroidi, hipogonadizm, multipl miyelom, malabsorpsiyon) taraması yapılmadan ilaç seçimi yapılmaz"
patognomonik: null
ilk_tetkik: "**Lomber omurga ve proksimal femur DEXA**. Sekonder osteoporoz taraması: **kalsiyum**,
  **fosfor**, **ALP**, **TSH**, **25-OH D vitamini**, kreatinin, karaciğer fonksiyonları ve kan sayımı;
  kırık şüphesinde **radyografi**"
kesin_tani: "**DEXA T skoru**nun **2.5 standart sapma** ve üzerinde düşük olması. Düşük enerjili travmaya
  bağlı kırık varsa T skoruna bakılmaksızın osteoporoz kabul edilir, **tedaviye başlanır**. **FRAX**
  skoru ile **10 yıllık** kırık riski hesaplanır"
ilk_tedavi: "Temel: **ağırlık taşıyan egzersiz**, **düşme önleme**, **kalsiyum (1000-1200 mg/gün)** ve
  **D vitamini (800-1000 Ü/gün)** desteği. Kırık riski yüksek hastada ilk farmakolojik seçenek **oral
  bifosfonat** (**alendronat-risedronat**). Yutma sorunu veya özofagus hastalığında yıllık **damar içi
  zoledronik asit** ya da deri altı **denosumab**; menopoz yakınındaki hastada **östrojen** seçilerek
  kullanılır"
klasik_komplikasyon: "**Kalça kırığı** (en yüksek morbidite ve mortalite) ve **vertebral kompresyon
  kırıkları**. Uzun süreli **bifosfonat** kullanımında **atipik subtrokanterik-diizeal femur kırığı** ve
  **çene kemik osteonekrozu**"
