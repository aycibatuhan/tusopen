id: amibiyazis
version: 1
status: draft
author: ai-drafts/enfeksiyon-4
sources:
- Pan American Health Organization (PAHO/WHO) Amibiyazis Tanı ve Tedavi Rehberi
ad: Amibiyazis (Entamoeba histolytica)
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_gis
  - enf_gis_paraziter_ishal
tipik_hasta: "Kontamine **su-gıda teması** ya da **endemik bölge seyahati** öyküsü olan hasta; haftalarca **kanlı-mukuslu ishalle** gelen yetişkin. Sağ üst kadran ağrısıyla gelen, çoğunlukla **genç erkek** karaciğer apsesi hastası"
patofizyoloji: "Yutulan kistler ince bağırsakta **trofozoit**e dönüşür, kolon mukozasına yapışıp dokuyu eriterek ülser açar. Ülser dar ağızlı, geniş tabanlı ve **flask** biçimlidir. Trofozoitler **portal dolaşımla** karaciğere taşınır; apse dışa genişler, nadiren periton, akciğer veya perikarda **rüptüre** olur"
anahtar_bulgular:
- "**Kanlı-mukuslu**, günde çok sayıda, az miktarda ishal; **tenesmus** (dizenterik tablo)"
- "**Dışkıda eritrosit yutan trofozoit** saptanması"
- "Sağ üst kadran ağrısı, hafif ateş, kilo kaybıyla **karaciğer apsesi**; belirtilerle apse arasında **haftalar** geçebilir"
- "Kolonoskopide dağınık, **flask** biçimli ülserler"
- "Apsenin diyafram altına, peritona, akciğere veya perikarda **rüptürü**yle ani kötüleşme"
patognomonik: "Dışkıda **eritrosit içine almış trofozoit**ün görülmesi (yalnız **Entamoeba histolytica** için geçerlidir)"
ilk_tetkik: "**Dışkı mikroskopisi**, **dışkı antijen** testi veya **PCR**; karaciğer apsesi şüphesinde **karın USG** (çoğunlukla tek, sağ lobda apse)"
kesin_tani: "**Dışkı antijeni** veya **PCR** ile **E. histolytica** doğrulaması (E. dispar zararsızdır, ayrım moleküler testle); apsenin **bulaşık kahverengi**, hamsi ezmesi görünümü klinik olarak destekler"
ilk_tedavi: "İnvaziv hastalıkta **metronidazol** veya **tinidazol**; ardından **paromomisin** gibi luminal ajanla kist temizliği. Apsede çoğunlukla ilaç yeterli, **rüptür** riski varsa **drenaj** düşünülür"
klasik_komplikasyon: "**Amebik karaciğer apsesi**; apsenin periton, akciğer veya perikarda **rüptürü**"
tus_gecmisi:
- tus-2014-sonbahar-ktbt-4
- tus-2018-ilkbahar-ktbt-2
- tus-2019-sonbahar-ttbt-113
kart_uret:
