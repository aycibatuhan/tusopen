id: aspergilloz
version: 1
status: draft
author: ai-drafts/enfeksiyon-3
sources:
- 'Klinik rehberler: IDSA invaziv aspergillozis tedavi kılavuzu, EORTC-MSG invaziv mantar enfeksiyonu
  tanı tanımları — referans olarak listelendi, metin projesi özgün yazımdır'
ad: İnvaziv Aspergilloz
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_mantar
  - enf_mn_aspergilloz
tipik_hasta: "Uzun süreli (**on günden uzun**) **nötropenik** hasta — akut lösemi kemoterapisi ya da **kök hücre nakli** alıcısı. **Yüksek doz kortikosteroid** ya da **T hücre baskılayıcı** alan hasta; **kronik granülomatöz hastalığı** olan çocuk. Geniş spektrumlu **antibiyotiğe yanıt vermeyen ateş**, **hemoptizi**, sinüslerde ağrı-şişlik ve öksürükle gelen baskılanmış konak"
patofizyoloji: "Havada dolaşan küçük **sporlar** baskılanmış konakta filizlenip **septalı hif** dokusuna girer; en sık etken **Aspergillus fumigatus**. Hifler damar duvarını deler (**damar invazyonu**); sonuç tromboz, **enfarkt** ve kanamalı **nekrozdur**. Damar yoluyla yayılım beyin (**abse**), deri, göz (**endoftalmi**), kemik ve kalp de olabilir. Bağışıklığı normal konakta **alerjik bronkopulmoner aspergilloz** ve **aspergilloma** (mantar topu) görülür; bunlar invaziv değildir"
anahtar_bulgular:
- "**Nötropenik** hastada geniş spektrumlu **antibiyotiğe yanıt vermeyen ateş**"
- "Göğüs **bilgisayarlı tomografi**sinde nodül çevresinde **halo işareti**; nötropeni toparlarken nodül içinde **air crescent** (hava yarım ay)"
- "**Hemoptizi** — damar invazyonuna bağlı, ağırlaşma işareti"
- "**Galaktomannan** antijeni serumda ve **BAL** sıvısında pozitif; **beta-D glukan** da artar"
- "Boya-kültürde **septalı, dar (akut) açıyla dallanan hifler** — klasik mikroskop resmi"
- "Yayılım bulguları: **santral sinir sistemi** abse ve odak defisit, **göz tutulumu**, deride ağrılı nodüller"
patognomonik: "Patognomonik değil; tipik bulgu — dokuda **septalı hiflerin dar (akut) açıyla dallanması** — invaziv aspergillozun ayırt edici histolojik görünümü"
ilk_tetkik: "Göğüs **bilgisayarlı tomografisi** (**halo** ve **air crescent** işaretleri); serum ve **bronkoalveolar lavaj** sıvısında **galaktomannan**; **tam kan sayımı**yla nötrofil düzeyi, burun-sinüs değerlendirmesi"
kesin_tani: "Steril dokuda **histopatolojik gösterim** artı **kültür**de üreme; doku alınamayan baskılanmış konakta **EORTC-MSG** ölçütleri (konak faktörü artı klinik görüntüleme artı mikoloji) ile olası tanı"
ilk_tedavi: "Birinci seçenek **vorikonazol** (damar içiyle başlanır, sonrasında oral devam). Alternatifler **izavukonazol**, **pozakonazol**, **lipidal amfoterisin B**; kurtarmada **ekokandin** (kaspofungin). **Nötropeninin düzeltilmesi** (koloni uyarıcı faktör) tedavinin parçası; kontrol edilemeyen kanamada **cerrahi**"
klasik_komplikasyon: "**Akciğer enfarktı** ve **masif hemoptizi**; damar yoluyla **santral sinir sistemi** yayılımı ve **beyin absesi**; invaziv rinosinüzitte göz çevresi-yüz **damar tutulumu**"
tus_gecmisi:
- tus-2014-ilkbahar-ttbt-61
- tus-2018-ilkbahar-ttbt-68
