id: riketsiyozlar
version: 1
status: draft
author: ai-drafts/enfeksiyon-5
sources:
- 'Klinik rehberler: Riketsiyal hastalıklar ve Q ateşi tanı-tedavi rehberleri (CDC) — referans olarak
  listelendi, metin projesi özgün yazımdır'
ad: Riketsiyozlar ve Q Ateşi
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_zoonoz
  - enf_zo_riketsiyoz_lyme
tipik_hasta: "Kırsal veya ormanlık alanda **kene** ya da enfekte hayvan **ekleminesine** (bit, pire) temas eden; ani **yüksek ateş**, şiddetli **baş ağrısı**, **miyalji** ve **döküntü**süyle gelen hasta. **Q ateşi**nde öykü farklıdır: **hayvancılık**, **hayvan doğum artıkları** veya **çiğ süt** teması sonrası **atipik pnömoni-karaciğer tutulumu**; ya da aylar-yıllar sonra **kronik kapak hastalığı** tablosu"
patofizyoloji: "Riketsialar **zorunlu hücre içi** bakterilerdir; kene ısırığıyla deriye giren etken **endotel hücre**lerini enfekte eder. **Damar içi vaskülit** döküntü, ödem ve **peteşi**ye yol açar (OMSK ateşi, endemik tifus, kırlangıç tifusu gibi). **Coxiella burnetii**, yani Q ateşinin etkeni, bu düzenin dışındadır: bulaş **hayvan doğum artıklarının tozla solunmasıyla** olur, **döküntü yapmaz**; küçük bir hasta grubunda yıllar sonra kalp kapaklarında **kronik endokardit** gelişir"
anahtar_bulgular:
- "**Kene ısırığı** veya vektör teması öyküsü; ani **yüksek ateş**, şiddetli **baş ağrısı**, **miyalji**, belirgin halsizlik"
- "**Makulopapüler** başlayıp **peteşi**ye dönüşen döküntü: **bilek-ayak bileğinden** başlar, gövdeye yayılır, **avuç içi ve tabanlara** iner (OMSK ateşi)"
- "**Doksisiklin ilk adımdır**: seroloji ve **PCR** sonucu beklenmeden, şüphe anında başlanır; **geç başlama mortaliteyi** belirgin artırır"
- "**Q ateşi**nde **döküntü yoktur**; **atipik pnömoni** ve **karaciğer enzim yüksekliği** önde, bulaş hayvan doğum artıklarının **aerosolü**yledir"
- "**Kronik Q ateşi**: **kültür negatif endokardit** — kapakta **vejetasyon**, uzun süren ateş ve **Coxiella faz 1 IgG** yüksekliği"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **bileklerden başlayıp avuç içi ve tabanlara inen peteşiyal döküntü** (OMSK ateşi)"
ilk_tetkik: "Klinik şüphede **doksisiklin**in hemen başlanması; destek için **immünofloresan seroloji** (akut ve **rekonvalesan çifti**) veya **PCR** — erken dönemde seroloji henüz negatif olabilir"
kesin_tani: "**Epidemiyolojik öykü** ve tipik klinikle başlangıç tanısı; **IFA** serolojisinde **antikor titre artışı** veya **PCR** pozitifliği doğrulayıcıdır. Kronik Q ateşinde **faz 1 IgG** yüksekliği (IFA'da **1:800** ve üzeri) ve **endokardit** bulguları"
ilk_tedavi: "Her şüpheli riketsiyozda ilk seçenek **doksisiklin** (kısa kür **çocuklarda** da kabul edilir). Akut **Q ateşi**nde **doksisiklin** veya **siprofloksasin**; kronik Q ateşi **endokardit**inde **doksisiklin** artı **hidroksiklorokin**, en az **18 ay**"
klasik_komplikasyon: "Geç tedavide OMSK ateşinin **vaskülit** kaynaklı **çoklu organ yetmezliği**ne ilerlemesi; Q ateşinde **kronik kültür negatif endokardit**"
