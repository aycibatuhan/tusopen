id: arbovirus_enfeksiyonlari
version: 1
status: draft
author: ai-drafts/enfeksiyon-4
sources:
- WHO Dang ve Şiddetli Dang Sınıflandırma ve Yönetim Rehberi
- CDC Batı Nil Virüsü Klinik Değerlendirme ve Bildirim Rehberi
ad: Arbovirüs Enfeksiyonları (Batı Nil, Dang)
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_zoonoz
  - enf_zo_arbovirus
tipik_hasta: "Sivrisinek mevsiminde **vektörle temas** etmiş veya **endemik bölge** seyahati olan hasta. Batı Nili **elli yaş üstünde** ve **bağışıklık baskılanması** olanlarda ağır seyreder; Dang, **tropik bölgeden** ateşle dönen hastada akla gelir"
patofizyoloji: "**Flavivirus** grubu bu virüsler **Aedes** ve **Culex** sivrisineklerinin ısırmasıyla insana geçer. Batı Nil çoğunlukla sessiz kalır; **santral sinir sistemine** ulaştığında menenjit, **ensefalit** veya akut **flakid paraliz** yapar. Dang virüsü **damar geçirgenliğini** artırır ve **trombositopeni**ye yol açar; farklı serotipte ikinci enfeksiyon **immün şiddetlenme**yle ağır tabloya kayabilir"
anahtar_bulgular:
- "Ateş, baş ağrısı, kas-eklem ağrısı, döküntü; Dangda **retro-orbital ağrı** ve bel ağrısı öne çıkar"
- "Batı Nilli olguların çoğu **asemptomatik**, bir kısmı hafif ateşli; kuluçka **iki günden iki haftaya**"
- "**Nöroinvasif Batı Nil**: ensefalit, menenjit, bilinç değişikliği, akut flakid paraliz; risk **ileri yaş** ve **bağışıklık baskılanması**"
- "Dangda **trombositopeni** ve **hematokrit yükselmesi** (plazma kaybının habercisi); **karın ağrısı, kusma, huzursuzluk** alarm bulgusudur"
- "Şiddetli dang: **plazma sızıntısı** ve **dolaşım şoku**"
- "Erken dönemde **PCR** veya **NS1 antijen**, ardından **IgM** serolojisi"
patognomonik: null
ilk_tetkik: "Serum **IgM ELISA** ve erken dönemde **PCR**; Dangda **trombosit, hematokrit ve albümin** takibi; nöroinvasif Batı Nil şüphesinde **beyin omurilik sıvısı** incelemesi (lenfositer sitoz)"
kesin_tani: "Batı Nilde **IgM** pozitifliği (gerektiğinde **plak azaltılmış nötralizasyon** testi); Dangda **NS1 antijen** veya **PCR** pozitifliği, ikinci haftada **IgM dönüşümü**"
ilk_tedavi: "**Özgül antiviral** yok; tedavi **destekleyicidir**. Dangda **aspirin** ve **steroidal olmayan antiinflamatuvar**lardan kaçınılır (kanama riski); şokta erken ve dikkatli **damar içi sıvı**, aşırı yükten sakınılır"
klasik_komplikasyon: "Şiddetli dangda **hipovolemik şok** (plazma sızıntısına bağlı); Batı Nilde uzun süren **nörolojik sekeller**"
