tipik_hasta: "**Korunmasız cinsel temas**, **damar içi madde kullanımı** ya da **kontamine kan-kesici alet** teması öyküsü. Temastan **2-4 hafta** sonra **mononükleoz benzeri** tablo (ateş, boğaz ağrısı, makülopapüler döküntü, ağız-genital ülser, **genelleşmiş lenfadenopati**) ile gelen. Tanı geçerse yıllar içinde kilo kaybı, tekrarlayan enfeksiyonlar ve **fırsatçı hastalıklar**la başvuran hasta; eşlik eden **cinsel yolla bulaşan diğer enfeksiyonlar** da uyarı işaretidir"
patofizyoloji: "HIV zarflı **retrovirüs**tür; **gp120** CD4 reseptörüne ve **CCR5** (erken evre) ya da **CXCR4** (ilerlemiş evre) koreseptörüne bağlanır. **Revers transkriptaz**la RNA genomu DNA'ya çevrilir, **integraz**la konak genomuna gömülür. Viral üretimle **CD4 T lenfosit**ler sürekli yıkılır; **lenfoid dokuda rezervuar** kurduğu için tam silinemez. CD4 düştükçe hücresel bağışıklık gözetimi çöker; **fırsatçı enfeksiyon**lar ve **AIDS tanımlı malignite**ler ortaya çıkar"
anahtar_bulgular:
- "**Akut retroviral sendrom**: temastan **2-4 hafta** sonra mononükleoz benzeri tablo (ateş, farenjit, döküntü, ülser, genelleşmiş lenfadenopati); bu evrede antikor negatif olabilir, **viral RNA** pozitiftir"
- "**Klinik latent evre** yıllarca sürebilir: **genelleşmiş lenfadenopati** dışında belirtisiz, ama **CD4** sayısı yavaş yavaş düşer"
- "**AIDS tanımı**: **CD4 sayısının 200 hücre/mm3** altına inmesi ya da AIDS tanımlayıcı **fırsatçı enfeksiyon-malignite** gelişmesi"
- "**CD4 200 altında Pneumocystis jirovecii pnömonisi** (kuru öksürük, eforla hipoksemi, difüz interstisyel infiltrasyon); **CD4 100 altında** ve toksoplazma IgG pozitifse **toksoplazmoz** primer profilaksisi; **CD4 50 altında** **CMV retiniti** (uçuşan cisimler, görme kaybı) ve **Mycobacterium avium kompleksi** (ateş, karaciğer-dalak tutulumu, bakteriyemi)"
- "AIDS tanımlayıcı maligniteler: **Kaposi sarkomu** (**HHV-8**; morumsu deri lezyonları), **invaziv servikal kanser** (**HPV**), **non-Hodgkin lenfoma** (**EBV**)"
- "Diğer klasik eşlikçiler: **oral kandidiyazis**, **gece terlemeleri**, kronik ishal ve kilo kaybı; **CD4 200** altına inenlere **trimetoprim-sülfametoksazol** profilaksisi"
patognomonik: null
ilk_tetkik: "**Dördüncü nesil kombinasyon test**iyle (p24 antijen ve antikor birlikte) tarama; pozitifse ikinci bir testle doğrulama. **HIV-1 RNA** (viral yük) ölçümü ve **CD4 hücre** sayımı. **Gebelik** durumu ve **cinsel yolla bulaşan diğer enfeksiyon**ların taranması"
kesin_tani: "Pozitif tarama testinin **doğrulama testiyle** teyidi; akut dönemde antikor negatifken **HIV RNA PCR** pozitifliği tanı koydurur"
ilk_tedavi: "**CD4 sayısından bağımsız** olarak tüm tanılı hastalarda derhal **kombinasyon antiretroviral tedavi (ART)** başlanır. Klasik şema iki **nükleozid/nükleotid revers transkriptaz inhibitörü** (**tenofovir** lamivudin ya da emtrisitabin) artı **integraz inhibitörü**. **CD4 200 altında** **trimetoprim-sülfametoksazol**le **Pneumocystis** ve **toksoplazmoz** profilaksisi; **CMV** profilaksisi rutin değildir, erken tanı için düzenli **göz dibi** muayenesi yapılır. **Temas sonrası profilaksi** **72 saat** içinde başlanır; gebelikte ART ile **dikey geçiş** büyük ölçüde önlenir"
klasik_komplikasyon: "**Fırsatçı enfeksiyonlar**: **Pneumocystis pnömonisi**, **serebral toksoplazmoz**, **CMV retiniti**, **kriptokok menenjiti**, **Mycobacterium avium kompleksi**. **Kaposi sarkomu** ve **non-Hodgkin lenfoma**; tedavi edilmeyen hastada **AIDS**'e ilerleme ve ölüm"
