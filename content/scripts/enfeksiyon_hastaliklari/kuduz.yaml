id: kuduz
version: 1
status: draft
author: ai-drafts/enfeksiyon-2
sources:
- 'Klinik rehberler: WHO kuduz eksposür sonrası profilaksi rehberi, CDC kuduz profilaksi kılavuzu — referans
  olarak listelendi, metin projesi özgün yazımdır'
ad: Kuduz
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_zoonoz
  - enf_zo_kuduz
tipik_hasta: "Kuduz şüpheli canlı (**köpek** en sık; tilki, çakal, **yarasa**, kedi) tarafından **ısırılmış** ya da **tırmalanmış**. Yarayı **yıkamadan** geçen haftalar boyunca sessiz kalmış; yara hizasında **parestezi**, **huzursuzluk** ve **yutma güçlüğü**yle başvuran hasta. **Mağarada yarasa teması** da aynı eksposür sınıfına girer"
patofizyoloji: "Etken **Rhabdoviridae** ailesinden tek iplikli RNA virüsü olan kuduz **lisavirüsü**dür; bulaş, enfekte hayvanın salyasındaki virüsün bütünlüğü bozulan **yaraya** girmesiyle olur. Kas dokusunda kısa üreme dönemi sonrası kas-sinir kavşağındaki **nikotinik asetilkolin reseptör**lerine tutunur ve **retrograd aksonoplazmik akış**la omuriliğe, ardından beyne ulaşır. Bu sessiz yolculuk **kuluçka süresini** belirler; yaradan beynin uzaklığına göre kısalır (**yüz yaralarında en kısa**). Beyin tutulumundan sonra virüs santral sinir sisteminden çevreye yayılarak **hipokamp**, **beyin sapı** ve **tükürük bezleri**ne yerleşir; bu aşamada artık **profilaksinin zamanı geçmiştir**"
anahtar_bulgular:
- "Prodomal dönemde ateş, baş ağrısı ve özellikle **yara hizasında parestezi** ya da kaşıntı (erişkinlerde en erken yerel işaret)"
- "**Eksitasyon (öfkeli) formda hidrofobi ve aerofobi**: su ya da hava akımı görmekle farenks-solunum kaslarında **spazm**lar, aşırı **salya akıtması**"
- "**Otonom dengesizlik**: **taşikardi**, **terleme**, tükürük ve gözyaşı salgısında artış, **hiperpireksi**"
- "Agitasyon, davranış bozukluğu ve **nöbet**lerle öne çıkan **deliryum**; ardından ilerleyici **felç**, **koma** ve ölüm"
- "**Sessiz (paralitik) form**da **tırmanıcı asendan paraliz** (Guillain-Barre benzeri); salgı bezlerine yerleşen virüs nedeniyle **bulaşıcılık sürer**"
patognomonik: "**Hidrofobi**: su görünce ya da içmeyi deneyince ağrılı **farenks ve solunum kası spazmları**yla panik nöbeti (eksitasyon formda); **ense saç foliküllerinden deri biyopsisinde floresan antikor testi** pozitifliği"
ilk_tetkik: "Yara hemen **sabunlu su ve bol suyla mekanik yıkama** ile temizlenir; **tetanoz profilaksisi** gözden geçirilir. Yaranın derinliği, konumu ve hayvanın özellikleri (kaçabilir mi, gözlenebilir mi) **eksposür kategorisini** saptar. Tanı araştırılması gerekiyorsa **ense deri biyopsisinde floresan antikor testi**, **salyada RT-PCR** ve beyin omurilik sıvısında **antikor**"
kesin_tani: "Yaşam boyu tanı çoğunlukla **klinik tabloyla** konur. Doğrulama: **ense deri biyopsisinde** ya da **kornea sürüntüsünde floresan antikor testi**, **salya** örneğinde **virüs RNA** saptaması. Ölüm sonrası beyin dokusunda floresan antikor testi ve sitoplazmik eozinofilik kapsüller (**Negri cisimcikleri**) **patognomoniktir**"
ilk_tedavi: "Mantık **eksposür sonrası profilaksidir** ve tablo başladıktan sonra **etkisizdir**. **Kategori 2 ve 3** eksposürlerde **hücre kültürü aşı şeması** (**0, 3, 7, 14** ve gerekirse **28. gün**ler, intramuskuler). **Kategori 3**te (derin ısırık, mukoza teması) ve bağışıklık baskılanmış hastada ayrıca **insan kuduz imunoglobulini** yaranın çevresine infiltre edilir. Aşı ve imunoglobulin **aynı enjektör ya da aynı enjeksiyon bölgesinde** uygulanmaz; imunoglobulin ilk ziyarette verilmediyse **geç verilmesi bile** beklemekten iyidir. **Veteriner**, mağara işçileri gibi yüksek riskli meslek gruplarına **pre-eksposür aşı** yapılır"
klasik_komplikasyon: "Tablo başladıktan sonra genellikle **1-2 hafta** içinde **solunum kası spazm**ları, **otonom kriz**ler, **aritmi**ler ve **koma** ile ölüm; sağ kalan hastalarda ciddi **nörolojik sekel**"
