id: bruselloz
version: 1
status: draft
author: ai-drafts/enfeksiyon
sources:
- 'Klinik rehberler: WHO bruselloz tanı ve tedavi raporu, ESCMID bruselloz tedavi kılavuzu — referans
  olarak listelendi, metin projesi özgün yazımdır'
ad: Bruselloz
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_zoonoz
  - enf_zo_bruselloz
tipik_hasta: "**Çiğ süt** ya da ev yapımı **taze peynir** (özellikle keçi-koyun sütünden) tüketen; **hayvancılık**, **veterinerlik**, hayvan doğumuna yardım ya da laboratuvarda etkenle uğraşan. Haftalarca **dalgalı ateş**, **gece terlemesi**, eklem-kas ağrıları ve bitkinlikle başvuran hasta"
patofizyoloji: "**Brucella** türleri (insanda en sık **B. melitensis**, koyun-keçi rezervuarı) gram negatif **kokobasildir**; kontamine süt-peynir ve özellikle doğum ürünleriyle bulaşır. Makrofaj içinde hayatta kalıp çoğalır (**intrasellüler** yaşam); **retiküloendotelyal** organlara (karaciğer, dalak, kemik iliği) yayılır, **granülomatöz** reaksiyon yapar. İntrasellüler yaşam tedaviyi **uzun süreli kombinasyona** zorlar; aksi halde **relaps** görülür"
anahtar_bulgular:
- "Haftalarca **dalgalı (undulan) ateş**, bitkinlik yapan **gece terlemeleri**, artralji, miyalji, kilo kaybı"
- "**Splenomegali** ve **hepatomegali**; yer yer lenfadenopati"
- "**Osteoartiküler** tutulum en sık odaktır: lomber **spondilit**, genç erişkinde klasik **sakroiliit**, periferik artrit"
- "Genitoüriner tutulum: **epididimo-orşit**; gebelikte **düşük** riski"
- "**Nörobruselloz** (menenjit, radikülopati) ve **endokardit** (en sık ölüm nedeni)"
- "Tam kan sayımında **pansitopeni** eğilimi; **Rose Bengal** tarama testi pozitifliği"
patognomonik: null
ilk_tetkik: "**Rose Bengal** testiyle serolojik tarama, ardından **standart tüp aglutinasyonu** (STA); tam kan sayımı, karaciğer fonksiyon testleri, CRP ve eritrosit sedimantasyonu; odak şüphesinde **omurga manyetik rezonans** ve **ekokardiyografi**"
kesin_tani: "**Kan ya da doku kültüründe** Brucella üremesi (altın standart; yavaş ürediği için kültür süresi uzatılır). Ya da yüksek serolojik titre: **STA 1/160** ve üzeri ya da iki hafta arayla **4 katlık** titre artışı"
ilk_tedavi: "Yetişkinde **doksisiklin altı hafta** artı **rifampisin altı hafta**. Alternatif: **doksisiklin** artı ilk **2-3 hafta** **aminoglikozid** (gentamisin ya da streptomisin) — **spondilitte** aminoglikozidli kombinasyon tercih edilir. Tek ilaç ya da kısa tedavi **relaps**a yol açar; osteoartiküler ve kardiyak tutulumda süre uzatılır. **Çocuk ve gebelikte** doksisiklin kontrendikedir: **trimetoprim-sülfametoksazol** artı **rifampisin** kullanılır"
klasik_komplikasyon: "**Spondilit** ve **sakroiliit**, epididimo-orşit, nörobruselloz, **endokardit**; tedavi yetersizliğinde **kronikleşme** ve **relaps**"
