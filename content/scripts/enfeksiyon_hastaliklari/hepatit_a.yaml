id: hepatit_a
version: 1
status: draft
author: ai-drafts/enfeksiyon-5
sources:
- 'Klinik rehberler: Viral hepatit tanı ve tedavi rehberleri (AASLD/IDSA, DSÖ viral hepatit özeti) — referans
  olarak listelendi, metin projesi özgün yazımdır'
ad: Hepatit A ve Hepatit E
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_viral_hepatit
  - enf_vh_hepatit_a_e
tipik_hasta: "**Zayıf hijyenli** bölgelere seyahat, **kontamine su** veya **çiğ deniz ürünü** tüketen, kalabalık ortamda (kreş, askeriye) yaşayan. **Koyu idrar**, açık renkli dışkı, bulantı ve halsizlik sonrası **sarılıkla** başvuran erişkin. Çocuklarda hafif seyreder, sarılık çoğu kez görülmez; **gebelik**, **hepatit E** için ayrı risk grubudur"
patofizyoloji: "İkisi de RNA virüsüdür: hepatit A **pikornavirüs**, hepatit E **hepevirus** ailesindendir; **fekal-oral** yolla alınır. Bağırsaktan kan yoluyla karaciğere ulaşır; hepatosit hasarını büyük ölçüde **bağışıklık yanıtı** yapar. Tablo **kendini sınırlar**, kronikleşme ve taşıyıcılık karakteristik değildir (immünsüprese konakta **hepatit E** istisnadır). Dışkıyla atılım **sarılık başlamadan önceki** dönemde ve erken haftalarda bulaşın ana yoludur"
anahtar_bulgular:
- "**Fekal-oral bulaş**: kirli su, az pişmiş kabuklu deniz ürünleri, kalabalık ve kötü hijyen ortamları; inkübasyon **2-6 hafta**"
- "**Anti-HAV IgM** akut hepatit A'nın kesin belirtecidir; **anti-HAV IgG** tek başına geçmiş enfeksiyonu veya aşıyı gösterir"
- "**ALT**ta bini aşan belirgin yükseklik; **ikter**, koyu idrar, sağ üst kadran hassasiyeti"
- "Gebelikte hepatit E **fulminan karaciğer yetmezliği** riskini belirgin artırır, özellikle **2-3. trimesterde**"
- "**Kronikleşme yok**; çoğu hasta destekleyici bakımla tam iyileşir, taşıyıcılık ve siroz beklentisi yoktur"
patognomonik: null
ilk_tetkik: "**Karaciğer fonksiyon testleri** ve akut viral hepatit paneli: **anti-HAV IgM**, **anti-HEV IgM**. **HBsAg** ve **anti-HCV** diğer etkenleri elemek için bakılır"
kesin_tani: "Uygun klinik tabloda **anti-HAV IgM** veya **anti-HEV IgM** pozitifliği; hepatit E'de gerekirse **PCR** ile doğrulama"
ilk_tedavi: "**Spesifik antiviral** yok; **destekleyici bakım** esastır. Temaslı koruması: temaslılara **HAV aşısı**, riskli sürede **pasif immünglobulin**. **Fulminan** gelişimde **karaciğer nakli** değerlendirmesi"
klasik_komplikasyon: "Gebelikte hepatit E'nin **fulminan karaciğer yetmezliği**ne ilerlemesi; nadiren hepatit E'de uzun seyirli **kolestatik tablo**"
