id: infeksiyoz_mononukleoz
version: 1
status: draft
author: ai-drafts/enfeksiyon-4
sources:
- American Academy of Family Physicians (AAFP) Enfeksiyöz Mononükleoz Klinik Rehberi
ad: İnfeksiyöz Mononükleoz (EBV)
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_dokuntulu_sistemik_viral
  - enf_dv_ebv_cmv
tipik_hasta: "**On beş-yirmi dört yaş** arası öğrenci; haftalardır süren **yorgunluk**, **boğaz ağrısı** ve **ateş**le gelir. **Sık yakın temas** (ortak bardak, öpüşme, spor takımı) öyküsü vardır"
patofizyoloji: "**Epstein-Barr virüsü** orofaringeal epiteli infekte eder, **B lenfosit**lerine geçer ve ömür boyu **latent** kalır. Tabloyu virüsün kendisi değil, virüse karşı genişleyip çoğalan **T lenfosit yanıtı** yaratır. Bu yanıt **lenfoid doku**ların (bademcik, dalak, lenf düğümleri) genişlemesine ve dolaşımda **atipik lenfosit**lerin görülmesine yol açar"
anahtar_bulgular:
- "Ateş, **eksudatif farenjit** ve boyun **lenfadenopati**si (özellikle **arka servikal zincir**)"
- "**Splenomegali** (ve hepatomegali); üst karın dolgunluğu"
- "**Lökositoz**, lenfosit oranının artması ve dolaşımda **atipik lenfosit**ler"
- "**Heterofil antikor (Monospot)** pozitifliği"
- "**Amoksisilin** veya **ampisilin** verilmişse yaygın **makulopapüler döküntü**nün belirmesi"
- "Haftalarca süren, işi yavaşlatan **ağır yorgunluk**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **farenjit**, **splenomegali** ve **atipik lenfositoz** üçlüsüne **heterofil antikor** pozitifliğinin eşlik etmesi"
ilk_tetkik: "**Tam kan sayımı** (lenfositoz ve **atipik lenfosit**), **karın USG** ile dalak boyutu; **heterofil antikor** testi, **karaciğer enzimleri**"
kesin_tani: "**Heterofil antikor** pozitifliği ya da EBV-özel antikorlar (**VCA IgM**); heterofilin negatif kaldığı (çocuk, geç dönem) olgularda **EBV PCR**"
ilk_tedavi: "**Destekleyici tedavi** (dinlenme, analjezi-antipiretik); **steroid** yalnız **hava yolu obstrüksiyonu**, ağır **trombositopeni** veya **hemolitik anemi** gibi komplikasyonlarda. **Temas sporu** ve ağırlık kaldırma en az **üç-dört hafta** ertelenir"
klasik_komplikasyon: "**Splenik rüptür** (temas sporlarının ertelenmesinin nedeni); **amoksisilin**/**ampisilin** sonrası döküntü; nadiren **hava yolu obstrüksiyonu**"
