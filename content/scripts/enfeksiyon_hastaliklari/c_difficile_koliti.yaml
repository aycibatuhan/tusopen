id: c_difficile_koliti
version: 1
status: draft
author: ai-drafts/enfeksiyon-2
sources:
- 'Klinik rehberler: IDSA ve SHEA C. difficile enfeksiyonu tanı ve tedavi kılavuzu — referans olarak listelendi,
  metin projesi özgün yazımdır'
ad: Clostridioides difficile Koliti
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_gis
  - enf_gis_c_difficile
tipik_hasta: "**Antibiyotik** kullanımından günler ya da haftalar sonra sulu, **kötü kokulu** diyareyle başvuran hasta; en sık **klindamisin**, **florokinolon** ve geniş spektrumlu **beta-laktam**lar sonrası. Yaşlı, **hastaneye yatmış** ve **proton pompa inhibitörü** kullanan; son **8 haftada** sağlık kuruluşu temasi olan her diyareli hastada akılda tutulur"
patofizyoloji: "Etken spor oluşturan **anaerobik gram pozitif** basildır; antibiyotikler kolon **florasını** bozunca alınan sporlar çimlenir. **Toksin A** (enterotoksin) sıvı sekresyonu ve inflamasyonu, **toksin B** (sitotoksin) aktin iskeletinin glukozilasyonla parçalanmasını yönetir; sonuç lamina propriada nötrofil inflamasyonu ve sarı-beyaz **pseudomembran**lar. Spor dışarıda yıllarca dayanıklıdır; **alkol bazlı el antiseptiği** sporu öldürmez — el yıkama **sıvı sabunla** yapılır, izolasyon zorunlu"
anahtar_bulgular:
- "**Antibiyotik sonrası** sulu, kötü kokulu, kanı az ya da hiç olmayan diyare; kramp tarzı karın ağrısı"
- "**Lökositoz** (sıkça belirgin, **15 bin**in üzerinde) ve ateş; **CRP** artışı"
- "Dehidratasyon; şiddetli tabloda **karın distansiyonu**, **hipotenzyon**, **akut böbrek yetmezliği**"
- "**Toksik megakolon** şüphesi: dirençli distansiyon, karın duvarında yerel peritonit; grafide kalın duvar ve **akordeon bulgu**"
- "Dışkıda **toksin A ve B** saptanması; endoskopide **pseudomembran kolit** görünümü"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — kolonoskopide mukozayı saçan sarımsı-beyaz, kolay düşen **pseudomembran plakları**"
ilk_tetkik: "Dışkıda **toksin A ve B** saptama testi; çoğu merkezde **glutamat dehidrojenaz** tarama ardından toksin algoritması. Tam kan sayımı; ağır ya da komplike şüphesinde **kontrastlı abdominal bilgisayarlı tomografi** (duvar kalınlaşması, akordeon)"
kesin_tani: "Diyareli ya da ileuslu hastada dışkıda **toksin A ve B** saptanması; endoskopide **pseudomembranların** görünmesi de tanıyı koyar. **Asimptomatik** taşıyıcılarda pozitif test tedavi gerektirmez; altın nokta semptomla ilişkilendirme"
ilk_tedavi: "Şiddetli olmayan ilk atakta ağızdan **vankomisin** ya da **fidaksomisin**; **metronidazol** yalnızca diğerleri erişilemediğinde. Şiddetli tabloda ağızdan **vankomisin 125 mg** dört kez günlük, fulminanda **500 mg**; **ileus** ve fulminan tabloda damardan **metronidazol** eklenir. Fulminan tabloda **subtotal kolektomi** kararı erken alınır; gereksiz **antibiyotik** ve **asit baskılayıcı** gözden çıkarılır. Nükselerde **fidaksomisin**; tekrarlayan nüksede **bezlotoxumab** ya da **fekal mikrobiyota transplantasyonu**"
klasik_komplikasyon: "**Toksik megakolon** ve fulminan kolit (perforasyon, peritonit); sepsis kaynaklı **akut böbrek yetmezliği** ve şok; tedavi sonrası haftalar içinde **tekrarlayan nükseler**"
tus_gecmisi:
