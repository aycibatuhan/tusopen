  - dah_hep_hepatit_c
tipik_hasta: 'Kan-kan teması öyküsü olan hasta: damar içi madde kullanımı, kan taramasının yapılmadığı
  dönemde transfüzyon, dövme veya hijyenik olmayan iğne maruziyeti. Virüs onlarca yıl sessiz kalabildiğinden
  hasta çoğu zaman halsizlik gibi belirsiz yakınmalarla, rutin tetkikte yüksek ALT ile ya da ileride siroz
  ve tümör bulgularıyla karşımıza çıkar'
patofizyoloji: 'Flaviviridae ailesinden tek zincirli RNA virüsü; kan ve kan ürünleriyle bulaşır, cinsel ve
  doğum yoluyla bulaş zayıftır. Yüksek mutasyon hızı iki sonucu doğurur: konak virüsü temizleyemez ve
  kronikleşme oranı yüzde 75-85''e ulaşır; ayrıca antikor ancak haftalar sonra pozitifleştiği için pencere
  döneminde tanı tek başına antikora dayanamaz. Kronik iltihap yıllar içinde fibrozise, siroza ve hepatosellüler
  karsinoma ilerler'
anahtar_bulgular:
- Tarama testi anti-HCV antikoru; pozitifse aktif enfeksiyon ancak HCV RNA ile doğrulanır, çünkü geçirilmiş
  enfeksiyonda antikor kalıcı kalırken RNA negatifleşir
- 'Pencere dönemde RNA erken pozitifleşir, antikor henüz negatiftir: erken tanı ve kan güvenliğinde RNA
  zorunludur'
- Semptomsuz seyir veya halsizlik, iştahsızlık, artralji gibi belirsiz yakınmalar; ALT dalgalı ve hafif
  yükseklikli olabilir
- 'Ekstrahepatik bulgular: karışık kriyoglobulinemi (purpura, eklem ağrısı, böbrek tutulumu), porfiriya
  kutanea tarda, liken planus'
- Yıllar süren kronik enfeksiyonda siroz ve hepatosellüler karsinom riski; aşı yoktur, korunma bulaş yollarının
  engellenmesine dayanır
patognomonik: null
ilk_tetkik: Anti-HCV antikor testi; pozitifse aynı örnekte HCV RNA nicel testi ile aktif enfeksiyon araştırması
kesin_tani: HCV RNA pozitifliği (altı aydan uzun süre pozitifse kronik enfeksiyon); pencere döneminde
  tek tanı yolu RNA testidir
ilk_tedavi: 'Doğrudan etkili antiviraller (DAA): sofosbuvir temelli 8-12 haftalık, genotipe göre düzenlenen
  oral rejimler; interferon dönemi kapanmıştır. Tedavi bitiminde ve 12. haftada RNA''nın negatif kalması
  (sürdürülebilir virolojik yanıt) şifa sayılır ve bu oran yüzde 95''in üzerindedir'
klasik_komplikasyon: Siroz ve hepatosellüler karsinom; karışık kriyoglobulinemik vaskülit ve membranoproliferatif
  glomerülonefrit
