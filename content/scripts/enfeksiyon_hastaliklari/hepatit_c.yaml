id: hepatit_c
version: 1
status: draft
author: ai-drafts/enfeksiyon-5
sources:
- 'Klinik rehberler: Hepatit C tanı ve tedavi rehberleri (AASLD/IDSA, EASL) — referans olarak listelendi,
  metin projesi özgün yazımdır'
ad: Hepatit C Enfeksiyonu
