tipik_hasta: "**Kan-kan teması** öyküsü: **damar içi madde kullanımı**, taramasız dönemde **transfüzyon**, **dövme** veya hijyenik olmayan **iğne** maruziyeti. Virüs **onlarca yıl** sessiz kalabildiğinden hasta çoğu zaman belirsiz **halsizlik** ya da rutin tetkikte **yüksek ALT** ile gelir; ileride **siroz** ve **tümör** bulgularıyla da çıkabilir"
patofizyoloji: "**Flaviviridae** ailesinden tek zincirli RNA virüsü; **kan ve kan ürünleriyle** bulaşır, cinsel ve doğum yolu bulaşı zayıftır. Yüksek **mutasyon hızı** iki sonuç doğurur: konak virüsü temizleyemez ve **kronikleşme yüzde 75-85**'e ulaşır. Antikor ancak haftalar sonra pozitifleştiğinden **pencere dönem**inde tanı tek başına **antikora** dayanamaz. Kronik iltihap yıllar içinde **fibrozis**e, **siroz**a ve **hepatosellüler karsinom**a ilerler"
anahtar_bulgular:
- "Tarama testi **anti-HCV** antikoru; aktif enfeksiyon ancak **HCV RNA** ile doğrulanır (geçirilmişte antikor kalır, RNA negatifleşir)"
- "**Pencere dönem**de **RNA** erken pozitifleşir, antikor henüz negatiftir; erken tanı ve kan güvenliğinde **RNA zorunludur**"
- "Semptomsuz seyir ya da halsizlik, iştahsızlık, artralji; **ALT** dalgalı ve hafif yükseklikli olabilir"
- "**Karışık kriyoglobulinemi** (purpura, eklem ağrısı, böbrek tutulumu), **porfiriya kutanea tarda**, **liken planus**"
- "Yıllar süren kronikte **siroz** ve **hepatosellüler karsinom** riski; **aşı yoktur**, korunma bulaş yollarının engellenmesine dayanır"
patognomonik: null
ilk_tetkik: "**Anti-HCV** antikor testi; pozitifse aynı örnekte **HCV RNA** nicel testiyle aktif enfeksiyon araştırması"
kesin_tani: "**HCV RNA** pozitifliği; **altı aydan** uzun süre pozitifse **kronik** enfeksiyon. **Pencere dönem**inde tek tanı yolu **RNA** testidir"
ilk_tedavi: "**Doğrudan etkili antiviraller (DAA)**: **sofosbuvir** temelli, genotipe göre düzenlenen **8-12 haftalık** oral rejimler; **interferon** dönemi kapanmıştır. Tedavi bitiminde ve **12. haftada** **RNA**'nın negatif kalması (sürdürülebilir virolojik yanıt) şifa sayılır; oran **yüzde 95**'in üzerindedir"
klasik_komplikasyon: "**Siroz** ve **hepatosellüler karsinom**; **karışık kriyoglobulinemik vaskülit** ve **membranoproliferatif glomerülonefrit**"
