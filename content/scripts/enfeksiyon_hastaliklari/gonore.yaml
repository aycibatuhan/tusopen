tipik_hasta: "**Cinsel temas** öyküsü olan genç erişkin. Erkekte **birkaç gün-bir hafta** kuluçka sonrası **akıntı ve dizüri**yle başvurur; kadın çoğunlukla sessizdir, doğurganlık çağında **PID** (üst çanak iltihabı) riskiyle düşünülür"
patofizyoloji: "**Neisseria gonorrhoeae** **pili** ve dış zar proteinleriyle üretra ile endoserviksin kolumnar epiteline yapışır; yerel inflamasyon **pürülan akıntı**ya yol açar. Kadında serviksten endometriyum ve adnekslere yukarı yayılır (**PID**). Kan dolaşımına geçerse **tenosinovit**, **septik artrit** ve **püstüler deri lezyonları**yla dissemine tablo yapar"
anahtar_bulgular:
- "Erkekte bol, **pürülan sarı-yeşil üretral akıntı** ve **dizüri**"
- "Kadında çoğunlukla **asemptomatik** ya da hafif servikal akıntı ve ara kanama"
- "**PID** tablosu: alt karın ağrısı, **adneksiyal hassasiyet**, ağrılı cinsel ilişki"
- "Dissemine hastalık: **püstüler lezyonlar**, **tenosinovit**, **septik artrit**"
- "Anal temasta **proktit**, oral temasta **farenjit**; doğum kanalıyla bulaşta **neonatal oftalmi**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — semptomatik erkeğin üretral sürüntüsünde **hücre içi Gram negatif diplokok**ların görülmesi"
ilk_tetkik: "**Nükleik asit amplifikasyon (NAA)** testi; sürüntü örneği veya **ilk geçen idrar** kullanılır. Eşlik eden **klamidya** ve **HIV** taraması eklenir"
kesin_tani: "**NAA** testinin pozitifliği; tedavi yetersizliği şüphesinde ve direnç izlemi için **kültür**"
ilk_tedavi: "**Seftriakson** yüksek doz **tek doz** kas içi. Eşlik eden **klamidya** saptanırsa **doksisiklin** eklenir. Partnerlerin değerlendirilmesi ve tedavisi; tedaviden sonra **üç ayda** yeniden test"
klasik_komplikasyon: "Kadında PID sonucu **tubal infertilite** ve **ektopik gebelik** riski; **dissemine gonokokal enfeksiyon**; yenidoğanda **oftalmi**"
