id: bakteriyel_menenjit
version: 1
status: draft
author: ai-drafts/enfeksiyon
sources:
- 'Klinik rehberler: IDSA bakteriyel menenjit yönetim kılavuzu, ESCMID akut menenjit kılavuzu — referans
  olarak listelendi, metin projesi özgün yazımdır'
ad: Akut Bakteriyel Menenjit
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_mss
  - enf_mss_akut_bakteriyel_menenjit
- - ktbt
  - noroloji
  - noro_enfeksiyon
  - noro_en_bakteriyel_menenjit
tipik_hasta: "Ateş, şiddetli baş ağrısı ve ense sertliğiyle saatler-günler içinde hızla gelen; fotofobi, kusma ve bilinç değişikliği eklenen hasta; kafa travması, sinüzit-otitis komplikasyonu, nöroşirürjik operasyon ya da şant, immün baskılanma veya meningokok teması öyküsü riski artırır; küçük çocukta üçlü eksik kalır, huzursuzluk, beslenememe ve **bombeli fontanel** öne çıkar"
patofizyoloji: "Etken **nazofarenks** mukozasında kolonize olup kan dolaşımıyla **subaraknoid aralığa** ulaşır; komşu odaklardan (sinüzit, otitis, **baziller kafa kırığı**, operasyon, şant) doğrudan da geçer; inflamatuvar yanıt beyin zarı hasarı ve **intrakraniyal basınç artışı** yapar; konak savunması zayıf olduğundan bakteri BOS'ta hızla çoğalır"
anahtar_bulgular:
- "Ateş, baş ağrısı, ense sertliği üçlüsü; **Kernig** ve **Brudzinski** işaretleri; bilinç değişikliği; **peteşik-purpurik döküntü** meningokoksemiyi düşündürür"
- "BOS: bulanık görünüm, yüksek açılış basıncı, **nötrofil ağırlıklı pleositoz** (çoğunlukla **1000'in üstü**), protein yüksekliği, glukoz düşük (**BOS-plazma oranı 0,4'ün altı**)"
- "Yenidoğan ve ilk aylar: **Grup B streptokok** ve **E. coli**; 1 ay-6 yaş: **H. influenzae tip b** (aşıyla azaldı); okul çağı ve genç erişkin: **N. meningitidis**"
- "Erişkinde en sık **S. pneumoniae** (kafa travması ve BOS fistülünde de); şant sonrası **S. epidermidis**; immün baskılanma ve **50 yaş üstünde Listeria monocytogenes**"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **peteşik-purpurik döküntü**yle seyreden menenjit tablosu (meningokok); kesin tanı her zaman BOS'ta etkenin gösterilmesiyle konur"
ilk_tetkik: "**Kan kültürü** alındıktan sonra hiç gecikmeden ampirik antibiyotik başlanır; **lomber ponksiyon**la BOS analizi yapılır. Fokal nörolojik bulgu, papilödem, belirgin bilinç bozukluğu, konvülsiyon ya da nötropenide ponksiyon öncesi **BT** gereklidir"
kesin_tani: "BOS'ta **nötrofil ağırlıklı püy tipi pleositoz**, yüksek protein ve düşük glukozla uyumlu klinik tablo; **Gram boyama**, kültür veya **PCR** ile etkenin saptanması"
ilk_tedavi: "Kültür sonrası gecikmeden ampirik tedavi: **seftriakson** veya **sefotaksim** ve **vankomisin**; **Listeria** olasılığı olanlarda (**50 yaş üstü**, immün baskılanma, yenidoğan) **ampisilin** eklenir; **Deksametazon** **lomber ponksiyondan hemen önce** başlanır (**10 mg**, altı saatte bir, dört gün), antibiyotikten sonra yararı kalmaz, **pnömokok sekellerini** azaltır; yenidoğanda **sefotaksim** tercih edilir (seftriakson yerine, ampisilinle birlikte)"
klasik_komplikasyon: "**İşitme kaybı** (en sık sekel, pnömokokta öne çıkar); hidrosefalus, **serebral venöz tromboz** ve infarkt, subdural efüzyon-ampiyem, epilepsi. Meningokoksemide adrenal kanamayla **Waterhouse-Friderichsen sendromu**"
