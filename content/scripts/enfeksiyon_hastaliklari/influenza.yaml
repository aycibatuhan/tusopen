  — referans olarak listelendi, metin projesi özgün yazımdır'
ad: İnfluenza
taksonomi:
- - ktbt
  - enfeksiyon_hastaliklari
  - enf_solunum
  - enf_sol_influenza
tipik_hasta: "Kış aylarında **salgın** sürerken, birkaç saat içinde aniden **yüksek ateş**, baş ağrısı, **kas ağrıları** ve kuru öksürükle yatağa düşen erişkin. **Gebe**ler, **65 yaş üstü** bireyler, **kronik akciğer-kalp** hastaları ve **bağışıklık baskılanmış** kişiler komplikasyon için en riskli grup"
patofizyoloji: "Etken **Orthomyxoviridae** ailesinden, segmentli RNA genomlu zarflı virüslerdir; **A** tipi pandemi ve ağır salgın, **B** tipi daha hafif mevsimsel salgın yapar. **Hemaglutinin** üst solunum yolu epitel reseptörlerine tutunur; epitelyal hasar **mukosilyer klirensi** bozarak **sekonder bakteriyel kolonizasyon**a zemin hazırlar. **Nöraminidaz** yeni virüslerin hücreden ayrılmasını sağlar ve **antiviral ilaç hedefi**dir. Segmentli genom gen karışımına elverişlidir; büyük değişimler **antijenik şift** pandemilerini, nokta mutasyonlar **antijenik drift** salgınlarını açıklar"
anahtar_bulgular:
- "Saatler içinde zirveye ulaşan **yüksek ateş**, üşüme ve belirgin halsizlik; soğuk algınlığından ayıran nokta **ani başlangıç** ve **sistemik bulguların** ön planda olması"
- "**Kas ve eklem ağrıları**, baş ağrısı, göğüs kemiği arkasında yanma hissi"
- "**Kuru, inatçı öksürük** ve boğaz ağrısı; burun akıntısı ve konjestiyon daha silik kalır"
- "Ateşin **3-5 günde** düzelmesi, öksürük ve halsizliğin **1-2 hafta** sürmesi; ateş düştükten sonra yeniden yükselmesi, **pürülan balgam**, göğüs ağrısı **sekonder bakteriyel pnömoni** şüphesidir"
- "Çocuklarda **otit** ve gastrointestinal bulgular daha sık; yaşlıda ateş az belirgin, **kronik hastalık** kötüleşmesi ön planda"
patognomonik: null
ilk_tetkik: "Salgın döneminde ve toplumda influenza dolaşımda iken tanı **klinik tabloyla** konur; tedavi kararı ve ayırıcı için gerektiğinde **nazofarenks sürüntüsünden hızlı antijen** ya da **moleküler test**. Ciddi tabloda **hemogram** (lökopeni eğilimi), **CRP**, **toraks grafisi** ve **arter kan gazı**"
kesin_tani: "Nazofarenks sürüntüsünde **viral RNA**nın **moleküler testle** (RT-PCR ya da izotermik amplifikasyon) gösterilmesi en duyarlı ve en özgül yöntemdir. **Hızlı antijen** testleri özgül ama duyarlılığı düşüktür, **negatifi** tabloyu dışlatmaz; mevsim ve **salgın verileri** klinik tanıyı destekler"
ilk_tedavi: "Belirtilerin başlangıcından itibaren **48 saat** içinde başlanan oral **oseltamivir** en fazla katkıyı sağlar; riskli grupta (gebeler dahil) ve ağır ilerleyen tabloda geç başlanması yine de düşünülür. Genç ve riski olmayan hastada **destekleyici tedavi** yeterlidir. Çocuklara ve gençlerde **asetilsalisilik asit** verilmez (**Reye sendromu** riski); **sekonder bakteriyel pnömoni** kanıtı olursa **antibiyotik** eklenir. Önlemede her yıl güncellenen **inaktif aşı** en etkili araçtır; **oseltamivir** riskli grupta **eksposür sonrası kemoprofilaksi**de de kullanılır"
klasik_komplikasyon: "**Primer viral pnömoni** ve **S. aureus** (MRSA dahil), **S. pneumoniae** gibi bakterilerle **sekonder pnömoni**; **miyozit** ve **miyoglobinüri**, **miyokardit**, **ensefalit**. Çocuklarda **Reye sendromu** (aspirin kullanımıyla); **KOAH** ve **astım** alevlenmesi, gebelerde **erken doğum** riski"
