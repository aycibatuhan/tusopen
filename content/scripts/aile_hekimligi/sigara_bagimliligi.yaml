tipik_hasta: 'Her yaşta görülür ama genellikle genç erişkinde başlar; kronik hastalık kontrolünde ya da rutin
  muayeneye gelen. **Günde bir paket** civarı içen, **uyanır uyanmaz ilk sigara**yı içen, defalarca kendi
  kendine bırakamamış hasta; her başvuran hastaya **sigara sorulmalı**'
patofizyoloji: '**Nikotin** **alfa 4 beta 2** nikotinik asetilkolin reseptörlerine bağlanarak ödül yollarında
  **dopamin** salınımını artırır; kısa ödüllü döngü içme davranışını güçlü biçimde pekiştirir. Sürekli maruziyet
  reseptörleri yeniden düzenler; nikotin düştüğünde **yoksunluk** belirtileri başlar ve içme isteği büyür.
  Üzerine **koşullanma** eklenir: kahve, stres, arkadaş ortamı gibi tetikleyiciler ilaç kesildiğinde bile
  davranışı sürdürür'
anahtar_bulgular:
- 'Uyandıktan sonra ilk **5 dakika** içinde ilk sigarayı içme (bağımlılığın en güçlü göstergesi)'
- 'Günde **21 veya daha fazla** sigara (**FTND** eşik değeri); en sevdiği sigarayı bırakmakta olağanüstü
  zorlanma'
- '**Yasak alanlarda içme isteğini** bastıramama ya da yasağa karşın içmeyi sürdürme'
- 'Bırakma **niyetine karşın** kullanımın sürmesi'
- 'Bırakınca saatler içinde **yoksunluk**: güçlü istek, sinirlilik, huzursuzluk, konsantrasyon bozukluğu,
  **iştah artışı**, uykusuzluk'
patognomonik: null
ilk_tetkik: 'Tetkik değil sorgulama: her başvuruda içip içmediği, günlük miktarı ve **bırakma isteği** sorulur.
  Altı maddeli **Fagerström** anketi; en ağırlıklı iki sorusu **uyanınca ilk sigaraya kadar geçen süre**
  ve **günlük sigara sayısı**; **10 üzerinden 6 ve üzeri** yüksek bağımlılık; **karbonmonoksit** ölçümü
  objektif destek'
kesin_tani: 'Klinik tanıdır: bilinen zararlarına karşın **bırakamama** ve baskın **istek**le karakterli kullanım
  bozukluğu ölçütleriyle konur; nicel bağımlılık göstergesi **Fagerström** puanı. **Karbonmonoksit** yalnız
  destekleyicidir'
ilk_tedavi: 'Birinci basamak: sorgulama, net **bırakma önerisi**, hazır olma değerlendirmesi, yardımcı olma
  ve izlem, **davranışsal danışmanlık** temel. Hafif bağımlılıkta tek forma **nikotin replasmanı** (**bant**
  veya **sakız**), ileri bağımlılıkta kısa etkili form **bantla kombine** ya da **vareniklin**. **Vareniklin**
  nikotinik reseptörün **kısmi agonistidir**, istek ve ödülü zayıflatır; **bupropion** alternatif ama **epilepsi**
  veya **yeme bozukluğu** öyküsünde uygun değildir. Gebelikte önce **davranışsal** tedavi, ilaç gerekirse
  **nikotin replasmanı** öncelikli'
klasik_komplikasyon: '**KOAH** ve **akciğer kanseri** önde olmak üzere gırtlak, yutak, mesane ve pankreas
  kanserleri; **aterosklerotik kalp hastalığı** ve periferik damar hastalığı; gebelikte **düşük doğum ağırlığı**'
