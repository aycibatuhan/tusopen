tipik_hasta: "**Kırk yaş üstü**, **sigara içen**, **kilo kaybeden** hasta; bacaklarda başlayan **merdiven çıkmakta zorlanma** ve kalkarken yorgunluk; **Ağzın kuru** olduğunu belirtmesi tipik ipucudur; **Küçük hücreli akciğer kanseri**nin **paraneoplastik ilk bulgusu** olabilir; tümör tanısından **yıllar önce** nörolojik tablo başlayabilir — her olguda **kanser taraması**"
patofizyoloji: "**Presinaptik** patoloji: **küçük hücreli akciğer kanseri** hücreleri sinir uçlarıyla aynı **P/Q tipi voltaj bağımlı kalsiyum kanallarını** taşıdığından vücut bu kanallara **antikor** üretir. Antikorlar sinir ucuna **kalsiyum girişini kısıtlar**; her uyarımda salınan **asetilkolin** azalır, kavşak sonrası zar **az uyarılır**; **Uzun süreli depolarizasyon (egzersiz, tekrarlı uyarım)** kanalların **kısmi toparlanmasına** yol açtığından **efor sonrası güç artar** — miyastenin tersi, **presinaptik** hastalığın işareti"
anahtar_bulgular:
- "**Proksimal kaslarda güçsüzlük**, özellikle **pelvik kuşak**ta; **göz ve yutak kasları** miyasteniden farklı **genellikle korunur**"
- "**Egzersiz ya da kısa süreli maksimal efor sonrasında** **güçte ölçülebilir artış** — ayırt edici bulgulardan"
- "**Derin tendon reflekslerinde azalma-yokluk**; **güçsüzlüğün derecesiyle uyumsuz refleks kaybı** (**hiporefleksili güçsüzlük**) tipiktir"
- "**Otonom tutulum**: **ağız ve gözde kuruluk**, **impotans**, **terleme azalması**, **pupillada ışık yanıtta yavaşlama**"
- "**Tekrarlı sinir uyarım testi**: **düşük amplitüdlü bileşik kas aksiyon potansiyeli**; **yüksek frekanslı (10 Hz üstü)** uyarımda amplitüdün belirgin artması (**inkrement**)"
- "**Serum P/Q tipi voltaj bağımlı kalsiyum kanal antikorları** pozitif; **toraks BT ya da PET** ile **küçük hücreli akciğer kanseri** araştırılır"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **tekrarlı sinir uyarımında düşük amplitüdlü yanıtların yüksek frekanslı uyarımla belirgin artması (inkrement)**"
ilk_tetkik: "**Tekrarlı sinir uyarım testi** ve serum **VGCC antikor** düzeyi. Antikor pozitif ya da şüpheli her hastada **toraks görüntülemesi (BT ya da PET)** ile **küçük hücreli akciğer kanseri** taraması"
kesin_tani: "**Klinik tablo** (proksimal güçsüzlük, **hiporefleksi**, **otonom bulgular**, **eforla güçlenme**) + **elektrofizyolojik inkrement** + **VGCC antikor** pozitifliği; **Kanser** bulunursa tanı **paraneoplastik** olarak kesinleşir"
ilk_tedavi: "Öncelik altta yatan **küçük hücreli akciğer kanserinin tedavisi**; **kemoterapi**yle nörolojik bulgular çoğunlukla düzelir. Belirgin bulgularda **3,4-diaminopiridin (amifampridin)**: **potasyum kanallarını bloke ederek** sinir ucundaki **depolarizasyonu uzatır**, **kalsiyum girişi ve asetilkolin salınımını artırır**. Ağır olgularda **IV immünglobulin** ya da **plazma değişimi** **köprü tedavi** olarak eklenebilir"
klasik_komplikasyon: "**Solunum kasları** tutulursa **solunum yetersizliği**. Asıl uzun dönem risk altta yatan **küçük hücreli akciğer kanserinin yayılması**; nörolojik sendrom **prognozu kötüleştirir**"
