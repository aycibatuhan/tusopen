id: diyabetik_noropati
version: 1
status: draft
author: "ai-drafts/noroloji-2"
sources:
  - "ADA Standartları: Diyabetik nöropati tanı ve bakım bölümü — referans olarak listelendi, metin projesi özgün yazımdır"
  - "AAN pozisyon bildirisi: Diyabetik nöropatinin değerlendirilmesi — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Diyabetik Nöropati
taksonomi:
  - [ktbt, noroloji, noro_noromuskuler, noro_nm_diyabetik_noropati]
tipik_hasta: "**10 yıldan uzun** ve **kötü kontrollü** diyabetli hasta. Ayakta **gece artan yanan-batan ağrı**, 'çıplak ayakla çakıl taşı üzerindeymiş gibi' his, ellerde **iğne-batması**; **yara hissetmediği** için çok geç fark eden profil"
patofizyoloji: "Kronik **hiperglisemi** aksonları **en uzunlardan** başlayarak tutar (**uzunluk-bağımlı, distal tip**); **Aldoz redüktaz** yoluyla glukozun **sorbitol**e dönüşmesi **osmotik stres** yaratır; **ileri glikasyon son ürünleri** ve **oksidatif stres** hücre yapılarını bozar; **Vasa nervorum**un **mikroanjiopatik darlığı** **endonöral iskemi**ye yol açar; sonuç **aksonal dejenerasyon**, **çorap-eldiven** dağılım"
anahtar_bulgular:
- "**Simetrik, distal, uzunluk-bağımlı (çorap-eldiven) his kaybı**: ayak parmak uçlarından yukarı tırmanır"
- "**Nöropatik ağrı**: yanan, batan, **elektrik çarpması** tarzında; **gece kötüleşir**; dokunuşun ağrı olması (**allodini**)"
- "**Koruyucu duyuda azalma**: **10 gram (Semmes-Weinstein) monofilament** ve **128 Hz** titreşim çatalıyla ayakta his kaybı; **ayak bilek refleksleri** erken azalır"
- "**Otonomik bulgular**: **ortostatik hipotansiyon**, **erektil disfonksiyon**, **gastroparezi**, **terleme bozuklukları**"
- "**İğne EMG**: distal, simetrik, **aksonal polinöropati** (**amplitüdlerde azalma**)"
patognomonik: null
ilk_tetkik: "**10 gram monofilament** ve **128 Hz titreşim çatalı**yla koruyucu duyu testi; **İğne EMG** **aksonal** polinöropatiyi doğrular; **B12**, **TSH** ve böbrek fonksiyon testleri — diyabetlide **başka nöropati nedenleri** eşlik edebilir"
kesin_tani: "**Diyabet öyküsü** + **uzunluk-bağımlı simetrik** bulgular + **EMG'de aksonal kanıt**; **Alkol**, **B12 eksikliği**, **tiroid ve böbrek hastalığı** dışlanır — 'diyabetik' demeden önce bu taklitler elenir"
ilk_tedavi: "**Glisemik kontrol** en temel tedavidir — ilerlemeyi yavaşlatan tek güvenilir müdahale. Ağrıda ilk sıra: **gabapentin** veya **pregabalin** ile **duloksetin** veya **amitriptilin**. Topikal **kapsaisin** veya **lidokain** yamaları tamamlayıcı; **opiyoidler** son sıradadır"
klasik_komplikasyon: "**Diyabetik ayak**: his kaybıyla fark edilmeyen **yara**, kötü **glisemik kontrol** ve dolaşım bozukluğuyla **ülser, infeksiyon, ampütasyon** riski; **Otonomik nöropati**yle **ortostatik hipotansiyon**, **sessiz miyokard infarktüsü** ve **kardiyak aritmi** riski"
tus_gecmisi: []
