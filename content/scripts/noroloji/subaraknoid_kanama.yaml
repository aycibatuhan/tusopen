tipik_hasta: "**40-60 yaş**; **hipertansiyon**, **sigara**, **ailede anevrizma** veya **polikistik böbrek** öyküsü olan hasta. Daha çok **efor, ıkınma, cinsel birliktelik veya uyanma** anında başlayan, **hiç yaşamadığı şiddette baş ağrısı**yla gelir. Bazen günler önce aynı ağrının hafif versiyonu (**sentinel kanama**) sinyal olur"
patofizyoloji: "En sık neden **serebral anevrizma**nın (öncelikle konjenital **berry** tipi; **Willis poligonu** dallanma noktaları, **ön ve posterior iletişim arterler**) yırtılmasıdır. Kan **subaraknoid aralığa** boşalır; **meninks iritasyonu menenjizm**, **İKB artışı bilinç bozukluğu**, kanın damar duvarına teması **vazospazm** zemin hazırlar. Az bölümde **travma** veya **vasküler malformasyon**"
anahtar_bulgular:
- "**Ani, saniyeler içinde zirveye ulaşan, hayatın en şiddetli başağrısı**; hasta 'hiç böyle bir ağrı yaşamadım' der"
- "**Bulantı-kusma**, **ense sertliği** (**Kernig** ve **Brudzinski** pozitif), **fotofobi**"
- "**Bilinç düzeyinde azalma** veya **senkop**; **huzursuzluk ve ajitasyon**"
- "**Göz dibi**: papilla üzerinde kanama (**subhialoid**); **Terson sendromu**"
- "**İzole okulomotor sinir felci**: **pitoz** ve **genişlemiş pupilla**yla gözün içe bakamaması (göz **aşağı-dışa** dönük); **posterior iletişim arter anevrizması** ipucu"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **hayatın en kötü başağrısı** — saniyeler içinde maksimuma ulaşan, hastanın hiç yaşamadığını söylediği şiddette **ani (gök gürültüsü tarzı)** ağrı"
ilk_tetkik: "**Kontrastsız kranyal BT** ilk tetkiktir: hızlı ve yatak başında yapılır, **ilk 6 saatte duyarlılığı çok yüksek**; **BT negatif** ama şüphe güçlüyse **12 saat sonra LP**: **açılış basıncı yüksek**, sarımsı **BOS (ksanatokromi)**"
kesin_tani: "**BT anjiyografi** veya altın standart **DSA** ile **anevrizmanın** gösterilmesi; **BT ve LP negatif** olsa bile şüphe sürerse **anjiyografiye alınır**; klinik şiddet **Hunt-Hess**, BT'de kan miktarı **Fisher skalası**yla derecelendirilir"
ilk_tedavi: "**Oral nimodipin** (**gecikmiş iskemiyi azaltır**), kan basıncının **dikkatli kontrolü**, **efordan kaçınma**; **Anevrizmanın kapatılması**: **endovasküler koil** (çoğu merkezde ilk seçenek) veya **cerrahi klipleme**; **Hidrosefali** gelişirse **ventriküler drenaj**"
klasik_komplikasyon: "**Serebral vazospazm** ve **gecikmiş iskemik defisitler** (**4-14. günler** arasında zirve); **yeniden kanama**; **Akut hidrosefali**; **hiponatremi** (**SIADH** veya **serebral tuz kaybı**)"
