tipik_hasta: "**60 yaş üstü**; başlangıçta **tek taraflı istirahat tremoru**, **el yazısının küçülmesi (mikrografi)**, **koku kaybı**, genel yavaşlama ve **sürünür yürüyüş**; **REM uyku davranış bozukluğu** ve **kabızlık** yıllar öncesinden var olabilir; genç başlangıçlı formlarda **ailevi-genetik öykü** öne çıkar"
patofizyoloji: "**Substantia nigra pars kompacta**daki **dopaminerjik nöronların ilerleyici kaybı** ve **alfa-sinüklein** birikimli **Lewy cisimcikleri**; **Striatumdaki dopamin azalması** **dolaylı yolu** güçlendirip **talamus**a giden motor sinyali kısar. Bu devre bozulması **bradikineziyi**, **rijiditeyi** ve **tremoru** açıklar"
anahtar_bulgular:
- "**Bradikinezi zorunlu bulgudur**: tekrarlı hareketlerde **yavaşlama ve amplitüd kaybı** (**parmak-şaka vurma testi**)"
- "**İstirahat tremoru**: **4-6 Hz**, **para sayma tarzı**, hareketle azalır, **tek tarafta** başlar"
- "**Dişli çark rijiditesi**: pasif hareket boyunca **direnç**; tremor varsa **dişli çark hissi**"
- "**Postüral instabilite** geç dönem bulgusudur; **ilk yıl düşme** tanıyı sorgulatır"
- "**Hipomimi**, **mikrografi**, **kol salınımının azalması**, **festinasyon** (öne eğilerek hızlanan küçük adımlar)"
- "**Levodopaya belirgin yanıt** klinik doğrulama sağlar"
patognomonik: "Tek başına patognomonik bulgu yok; **bradikinezi** ile birlikte **istirahat tremoru** veya **rijidite** kombinasyonu tanımlayıcı örüntüdür"
ilk_tetkik: "Tanı **klinik**; **kraniyal MR** atipik özellik (**erken düşme**, **aşağı bakış paralizisi**, **serebellar bulgular**) ve **sekonder parkinsonizm**i dışlar; **Sekonder nedenler**: **dopamin antagonist ilaçlar**, **toksinler**, **normal basınçlı hidrosefali**, **vasküler**; gerekirse **DAT-SPECT** **presinaptik dopamin iletimini** gösterir"
kesin_tani: "**MDS klinik kriterleri**: **bradikinezi** + **istirahat tremoru** veya **rijidite**; **red flag**'ler (**erken düşmeler**, **hızlı ilerleme**, **otonom yetersizlik** önde) tanıyı düşürür; **Levodopa yanıtı** ve **DAT-SPECT** uyumu destekler; **ilaç bağlı** ve **parkinson artı sendromları** dışlanmalı"
ilk_tedavi: "**Levodopa + periferik dekarboksilaz inhibitörü** en etkili tedavidir (**levodopa-karbidopa** veya **levodopa-benserazid** — ikisi birlikte kullanılmaz), **65 yaş üstünde ilk tercih**. Genç hastalarda **dopamin agonistleri** (**pramipeksol**, **ropinirol**) **motor komplikasyon riskini geciktirir** ama **dürtü kontrol bozukluğu** ve **ani uyku** riski taşır; **MAO-B inhibitörleri** (**selegilin**, **rasajilin**) erken dönemde hafif etki. Yıllar içinde **wearing-off** ve **diskinezi** yapar; doz bölme ve **uzun etkili formlar**, diskinezide **amantadin**, uygun hastada **derin beyin stimülasyonu**; **Bulantı için metoklopramid** gibi **dopamin antagonistlerinden kaçınılır**; **ortostatik hipotansiyon** ve **kabızlık** proaktif yönetilir"
klasik_komplikasyon: "**5-10 yıl** levodopa sonrası **motor dalgalanma ve diskineziler**; postüral instabiliteye bağlı **düşmeler**, **aspirasyon pnömonisi**; **Ortostatik hipotansiyon**, **REM uyku davranış bozukluğu** ve **demans**"
