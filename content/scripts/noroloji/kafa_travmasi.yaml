id: kafa_travmasi
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- Brain Trauma Foundation Kafa Travması Yönetim Kılavuzları
- Canadian CT Head Rule (CCHR)
ad: Kafa Travması
taksonomi:
- - ktbt
  - noroloji
  - noro_travma
  - noro_tr_kafa_travmasi
tipik_hasta: "**Trafik kazası, yüksekten düşme, spor sakatlığı veya saldırı** sonrası acile gelen hasta; baş ağrısı, **kusma**, **bellek boşluğu** veya bilinç bulanıklığı; **Şiddet Glasgow Koma Skalası** ile: **13-15 hafif**, **9-12 orta**, **8 ve altı ağır**; **alkol-ilaç intoksikasyonu** skoru düşürür; **Yaşlı**, **antikoagülan kullanan** ve **küçük çocuk** ayrı risk gruplarıdır"
patofizyoloji: "Hasar iki aşamadır: olay anındaki **birincil mekanik hasar** (beyin sarsıntısı, **kontüzyon**, **diffüz aksonal yaralanma**, hematomlar). Saatler-günler süren **ikincil hasar** (**ödem**, **intrakraniyal basınç artışı**, **iskemi**, **eksitotoksisite**) — **tedavinin çekirdeği ikincil hasarı önlemektir**. Beyin sert kafatası içinde **hızlanır-yavaşlar**; darbe yanı ve karşı tarafta **kontüzyonlar**; aksonların **gerilip yırtılması diffüz aksonal yaralanma**yı verir"
anahtar_bulgular:
- "**Glasgow Koma Skalası** bileşenleri (göz, konuşma, motor) ayrı ayrı kaydedilir; **8 ve altı** hava yolu korunamadığı ve **erken entübasyon** düşünülen eşiktir"
- "**Beyin sarsıntısı (concussion)**: olay anında **kısa bilinç bozukluğu**; sonrasında baş ağrısı, bulantı, **denge bozukluğu**, **ışık-ses duyarlılığı**, dikkat yavaşlaması; **görüntüleme normaldir**"
- "**Posttravmatik amnezi**: olay öncesi (**retrograd**) ve olay sonrası (**anterograd**) bellek boşlukları; süre **şiddetin dolaylı göstergesidir**"
- "**Kötüleşme işaretleri**: **tekrarlayan kusma**, **GCS düşüşü**, **pupilla asimetrisi**, **hemiparezi**, **posttravmatik nöbet**"
- "**Bazal kafatası kırığı bulguları**: **panda gözü**, kulak arkasında morluk (**Battle işareti**), kulaktan **kan veya BOS sızıntısı**"
- "**Yaşlı ve antikoagülan** hastada hafif görünüşlü travma bile **hematom riski** taşır; belirtisiz olsa da **yakın izlem** gerekir"
patognomonik: null
ilk_tetkik: "**Havayolu-solunum-dolaşım** ve tam **GCS** kaydı (**entübasyon öncesi değer** mutlaka not edilir), **pupilla muayenesi**; **Nonkontrast beyin BT**: **hematom**, **kontüzyon**, ödem, **kafatası kırığı**; **CT endikasyonları (hafif travmada)**: **GCS 13-14** veya odak defisit, **iki kez kusma**, **65 yaş üstü**, **antikoagülan kullanımı**. Şüpheli **kafatası kırığı**, **30 dakikadan uzun amnezi**, **tehlikeli mekanizma**"
kesin_tani: "**Klinik + görüntüleme**; beyin sarsıntısı **klinik tanıdır** (olay anı bilinç bozukluğu, sonraki belirtiler, **normal BT**). Orta-ağır travmada **BT bulguları** ve **MRG** (**diffüz aksonal yaralanmada** daha duyarlı) tabloyu sınıflar; şiddet **GCS**, bilinç kaybı ve **amnezi süresi**yle belirtilir"
ilk_tedavi: "**Hafif travma (GCS 15, BT negatif)**: semptom yönetimi, **24 saat gözlem**, taburculukta **kötüleşme işaretleri** eğitimi; sporcularda **belirtiler silinmeden sahaya dönüş yok**, **kademeli dönüş protokolü**; **Orta-ağır travma**: baş **30 derece** yükseltme, **normokapni** hedefi, **osmotik tedavi** (**mannitol** veya **hipertonik tuzlu su**), **hipotansiyon-hipoksi önleme**. Hızlı **cerrahi** (**hematom boşaltma**, **dekompresif kranyektomi**); ilk hafta **posttravmatik epilepsi profilaksisi** (**levetirasetam** veya **fenitoin**), **koagülopatinin düzeltilmesi**; **erken rehabilitasyon**"
klasik_komplikasyon: "**İkincil hasar**: **intrakraniyal basınç artışı** ve **herniasyon**; **postkonsüsyon sendromu** (baş ağrısı, uyku ve dikkat bozukluğu aylarca). Tekrarlayan sarsıntılarda **kronik travmatik ensefalopati**; **posttravmatik epilepsi** ve **hidrosefali**"
