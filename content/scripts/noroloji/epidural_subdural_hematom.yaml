id: epidural_subdural_hematom
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- Brain Trauma Foundation Cerrahi Yönetim Kılavuzları
- Adams and Victor's Principles of Neurology
ad: Epidural ve Subdural Hematom
taksonomi:
- - ktbt
  - noroloji
  - noro_travma
  - noro_tr_epidural_subdural
tipik_hasta: "**Epidural**: genç erişkin, trafik kazası/düşme sonrası; travma anında kısa bilinç bozukluğu, ardından uyanık **'berrak aralık'**, sonra saatler içinde **hızlı kötüleşme**; **Akut subdural**: ağır travmalı, **antikoagülanlı yaşlı** hasta; **Kronik subdural**: yaşlı ya da alkol bağımlısında unutulmuş hafif travma sonrası **haftalar içinde** artan uyuşukluk, unutkanlık ve **yürüyüş bozukluğu**"
patofizyoloji: "**Epidural**: kafatası iç yüzü ile dura arasına kanar; en sık **orta meningeal arter** yırtılması (**pterion**, eşlik eden **kafatası kırığı** sık). Arter basıncıyla hızla genişler; dura **sütürlere sıkı yapışık** olduğundan kan iki taraftan büzülür — **bikonveks (lens)** şekli; **Subdural**: **köprü venlerin** yırtılmasıyla duralın altına kanar; venöz kan serbest yayılır — **hilal (crescent)** şekli; yaşlı **beyin atrofisi** köprü venleri gerer, **hafif travma** yeter"
anahtar_bulgular:
- "**Epidural klasik üç evre**: travma anı bilinç bozukluğu, **berrak aralık**, sonra hızlı bilinç bulanması ve **pupilla asimetrisi** (tüm hastalarda tam değildir)"
- "**Epidural BT**: **bikonveks (lens)** şekilli **hiperdans** kan; sıklıkla **kafatası kırığı**; **orta hat kayması** hızla gelişir"
- "**Akut subdural**: **GCS düşüşü**, karşı taraf **hemiparezi**, **pupilla asimetrisi**; BT'de **hilal şekilli hiperdans** kan, **sütürleri aşarak** yayılır"
- "**Kronik subdural**: haftalar-aylar içinde **unutkanlık**, **yürüyüş bozukluğu**, **idrar kaçırma**, baş ağrısı; BT'de **hilal şekilli hipodens**; **normal basınçlı hidrosefali**yi taklit eder"
- "**Herniasyon işaretleri**: **anizokori**, **Cushing üçlüsü** (tansiyon yükselmesi, bradikardi, düzensiz solunum), **koma**"
- "**Antikoagülan-antiplatelet** kullanan her **kafa travmalı** yüksek risk grubu; **bilateral kronik subdural** yaşlıda sessiz ilerler"
patognomonik: "BT'de kanın şekli (kural olarak): **bikonveks (lens)** şekilli kan **epidural**, **hilal (crescent)** şekilli kan **subdural**"
ilk_tetkik: "**Nonkontrast kafa BT**: hematomun şekli, en kalın yerindeki **kalınlık**, **orta hat kayması**, **ventrikül sıkışması**; **kafatası kırığı** aranır; **GCS** ve **pupilla** durumu dakikalarla tekrar kaydedilir; **antikoagülan** hastada **koagülasyon paneli** hemen alınır"
kesin_tani: "**BT bulgusu + mekanizma öyküsü** ayrımı kesinleştirir: epiduralde **kırık** ve **arteriyel** kaynak; subduralde **köprü venler** ve **hafif travma**; **Üç haftadan uzun** ve **hipodens** toplanma **kronik subdural**ı gösterir"
ilk_tedavi: "**Epidural cerrahi endikasyonları**: **30 ml üzeri** hacim, **GCS 8 ve altı** veya **pupilla asimetrisi**; **Subdural cerrahi endikasyonları**: **kalınlık 10 mm ve üzeri**, **orta hat kayması 5 mm ve üzeri** veya **GCS kötüleşmesi** — **kranyotomiyle boşaltma**. Küçük hematom, **GCS 15** ve **orta hat kayması yoksa**: hastane gözlemi, **erken tekrar BT**, **antikoagülanın tersine çevrilmesi**; **İntrakraniyal basınç artışında** baş **30 derece** ve **osmotik tedavi** köprü olur; semptomatik **kronik subdural**da **burr hole** ile drenaj"
klasik_komplikasyon: "**Serebral herniasyon** ve ölüm (özellikle epiduralde **saatler içinde**); **posttravmatik epilepsi**; **Kronik subdural**da **nüks** (membranlar nedeniyle **yüzde 10-20**); kalıcı **hemiparezi**"
