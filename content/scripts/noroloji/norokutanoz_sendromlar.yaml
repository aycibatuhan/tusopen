tipik_hasta: "Çocukluk çağında **deri lezyonları** ya da **aile öyküsü** nedeniyle değerlendirilen hasta; **sinir sistemi bulguları** (**epilepsi**, **gelişim geriliği**, **kafa içi basınç artışı**) ile **deri ve göz bulguları** birlikte aranır. Klinikte en sık iki sendrom: **nörofibromatozis tip 1** ve **tüberoz skleroz**"
patofizyoloji: "Çoğu **otosomal dominant**; **NF1** geni ve **nörofibromin** kaybı, **tüberoz sklerozda TSC1/TSC2** kaybıyla **mTOR yolu** kontrolsüz aktivasyona geçer; **VHL** geni **hipoksik yanıt** yollarını bozar. Sonuç: sinir sisteminde **hamartom ve tümörler**, deride **pigment ve vasküler lezyonlar**, göz-iç organlarda **tümöral büyümeler** aynı hastada birleşir"
anahtar_bulgular:
- "**NF1**: ergenlik öncesi **5 mm**, sonrasında **15 mm üstü** **altı ya da daha fazla kafeyle süt renkli benek**; **deri ve pleksiform nörofibromlar**; **koltuk altı çilliği (freckling)**. İriste **hamartom (Lisch nodülü)**; **optik yol gliomu**; düz kemiklerde ince korteks (**psödoartroz riski**)"
- "**NF2**: **çift taraflı vestibüler schwannoma** (işitme kaybı, **tinnitus**) önde; **kafe benekleri az**; **menenjiom** ve **ependimom** eşlik edebilir"
- "**Tüberoz skleroz**: yüzde burun çevresi-yanaklarda **anjiyofibrom** (eski adı **sebase adenom**); gövdede **yaprak benzeri hipomelanotik benek** (**Wood lambası**yla belirgin); bel-sırtta **shagreen yama**. Beyinde **kortikal tüber**, **subependimal nodül**, **dev hücreli astrositom**; **epilepsi** (**infantil spazm** dahil), **gelişim geriliği**; böbrekte **anjiyomiyolipom**"
- "**Sturge-Weber**: **trigeminal dağılımda port-vin leke**, aynı tarafta **leptomeninks anjiyomatozis**, **glaukom**; **epilepsi** ve karşı yarımada **güçsüzlük** ilerleyici"
- "**von Hippel-Lindau**: **serebellar-spinal hemangioblastom**, **retina anjiyomları**, **böbrek hücreli kanser**, **feokromositoma**, **pankreas kistleri**"
- "**Ataksi-telenjiektazi**: **serebellar ataksi**, göz kapağı-kulak kepçesinde **telenjiektazi**, **IgA eksikliği** sonucu **tekrarlayan solunum yolu enfeksiyonları**, **alfa-fetoprotein yüksekliği**"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **kafeyle süt renkli benekler** ve **nörofibromların** birlikte görülmesi (**nörofibromatozis tip 1**)"
ilk_tetkik: "**Tam deri ve göz muayenesi**; **Wood lambası** ile **hipomelanotik beneklerin** değerlendirilmesi; **beyin ve omurilik MRG**; **Nörofibromatozis** şüphesinde **klinik tanı kriterleri**; **tüberoz skleroz** şüphesinde **TSC1/TSC2 genetik testi**"
kesin_tani: "**NF1**: klinik kriterlerden **en az ikisi** — **altı ve üstü kafe benekli lezyon**, **iki veya daha çok nörofibrom ya da bir pleksiform nörofibrom**; **koltuk altı çilliği**, **Lisch nodülü**, **optik yol gliomu**, **karakteristik kemik lezyonu**, **birinci derece akrabada hastalık**; ya da **NF1 gen mutasyonunun** gösterilmesi; **Tüberoz skleroz**: **klinik major-minor kriterler** ve **genetik doğrulama**"
ilk_tedavi: "**Epilepsi** için **antikonvulzanlar**; **tüberoz sklerozda mTOR inhibitörleri** (**sirolimus**, **everolimus**) — **subependimal dev hücreli astrositom**da ve böbrek-deri lezyonlarında; **infantil spazm**larda **vigabatrin**; **NF1**'de belirti veren **nörofibromların cerrahi çıkarılması**; inoperable **pleksiform nörofibrom**larda **MEK inhibitörleri**; **Sturge-Weber**'de **epilepsi** ve **glaukom** tedavisi, gerekirse **lobektomi**"
klasik_komplikasyon: "**NF1**'de **malign periferik sinir kılıfı tümörü**ne dönüşüm; **tüberoz skleroz**da **dev hücreli astrositom**un **Monro deliği**ni tıkamasıyla **hidrosefali**, **böbrek anjiyomiyolipom**unda kanama; **VHL**'de **böbrek hücreli kanser**; **Sturge-Weber**'de **inatçı epilepsi** ve **zihinsel gerileme**"
