tipik_hasta: "**Elli yaşları ve üzeri**, **sabah ağırlaşan baş ağrısı** ve artan **bulantı-kusma** tablosuyla başvuran hasta. Yerleşime göre **afazi**, **hemiparezi** ya da **görme alanı kaybı** gibi fokal kayıplar eklenir. Genç hastada uzun süredir kontrol edilmeyen **epilepsi** ya da **yeni başlayan nöbet** de glial tümörü düşündürür; **agresif uçta (glioblastoma)** tablo **haftalar-aylar** içinde ilerler"
patofizyoloji: "Beyin dokusunun **destekleyici hücrelerinden** köken alan primer tümörler: **astrosit**, **oligodendrosit**, **ependim**; **WHO sınıflaması 1-4. derece**; en sık ve en agresif **glioblastoma (4. derece)**: doku sınırlarını aşan büyüme, **mikrodamar proliferasyonu** ve **nekroz**; **IDH mutasyonu** **uzun yaşam süresiyle**; **MGMT promoter metilasyonu** **kemoradyoterapi yanıtıyla**; **1p/19q kodetisyonu** oligodendrogliomaya özgü **kemoterapi duyarlılığı**yla ilişkili"
anahtar_bulgular:
- "**Kafa içi basınç artışı**: sabah ağırlaşan **baş ağrısı**, **bulantı-kusma**, **papilödem**, ani pozisyon değişikliğinde **gözlerde kararma**"
- "**Fokal kayıp** yerleşimi yansıtır: dominant hemisferde **afazi**, **motor kortekste hemiparezi**, **temporal lopslarda nöbet**"
- "**Yeni başlayan epileptik nöbet**, özellikle yetişkinde, gizli glial tümörün **ilk işareti** olabilir"
- "**MRG**: düzensiz sınırlı lezyon, çevre **vazojenik ödem** ve **kitle etkisi**; kontrastla güçlenen **halka (ring) içinde nekrotik merkez** glioblastomanın klasik görüntüsü"
- "**WHO 4. derece biyopsi**: **mikrodamar proliferasyonu** ve **palisading nekroz**; **IDH mutasyonu yokluğu**, **EGFR amplifikasyonu**, **10. kromozom kaybı** destekler"
- "Ayırımda **beyin absesi**, **tek metastaz** ve **tümefaktif demiyelinizan lezyon** benzer **halka** görüntüsü verebilir; **öykü, yerleşim ve biyopsi** kesinleştirir"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **biyopside mikrodamar proliferasyonu** ve **palisading nekroz**un birlikte görülmesi (**glioblastoma**)"
ilk_tetkik: "**Kontrastlı beyin MRG** ilk ve en değerli görüntüleme; **metastatik hastalık** olasılığını dışlamak için **toraks-abdomen görüntülemesi**; **Stereotaktik biyopsi** ya da **rezeksiyon** materyali histopatolojik ve **moleküler inceleme**ye gönderilir"
kesin_tani: "**Stereotaktik biyopsi** ya da **cerrahi rezeksiyon** materyalinin **histopatolojik incelemesi**; **Moleküler sınıflama**: **IDH mutasyon durumu**, **1p/19q kodetisyonu**, **MGMT promoter metilasyonu**"
ilk_tedavi: "**Maksimal güvenli cerrahi rezeksiyon** (konuşma ve motor alanları koruyarak). Ardından fraksiyonel **dış ışın radyoterapi**yle eş zamanlı **temozolomid** ve **6 aylık adjuvan temozolomid**; **Nüks**te tekrar cerrahi, **nitrozüre** türevi kemoterapiler ya da **bevacizumab** gibi **anti-anjiyojenik ajanlar**"
klasik_komplikasyon: "**Kitle etkisiyle beyin herniyasyonu**; tedaviye rağmen **nüks ve ilerleme**; **WHO 4. derece glioblastoma**da ortalama yaşam süresi **12-18 ay**; uzun sağkalım **IDH mutasyonu** ve **MGMT metilasyonu** olanlarda"
