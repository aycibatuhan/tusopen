tipik_hasta: "Genç erişkinde **birkaç gün-birkaç hafta** içinde bacaklarda ilerleyen **kuvvet kaybı**, göğüs-bel çevresinde **bant tarzı sarıcı ağrı** ve **idrar tutulması**. Öyküde **2-4 hafta önce** **solunum veya sindirim yolu infeksiyonu**, **aşı** ya da **gebelik** olabilir; **Çok odaklı veya tekrarlayıcı** tablolarda **nöromiyelitis optika** ve **sistemik hastalıklar** akılda tutulur"
patofizyoloji: "Omuriliğin belirli bir segmentinde (en sık **torakal**) **immün aracılı inflamasyon**; **miyelin ve giderek akson kaybıyla** lokalize hasar, düzeyin **altındaki tüm yollar** işlevini yitirir; **Postinfeksiyöz moleküler benzetme** klasik açıklama; **Aquaporin-4** veya **MOG** antikor pozitiflerinde lezyon **daha uzun ve gri madde ağırlıklı** — **multipl skleroz**un **kısa periferik** lezyonlarından ayrılır"
anahtar_bulgular:
- "**Duyu düzeyi**: gövde çevresinde **kesin sınır çizgisi**; sınırın altında **dokunma, ağrı, ısı, pozisyon** tümü kayıp, üstünde normal"
- "**Bacaklarda kuvvet kaybı**: ilk saatlerde **flasid**, günler içinde **spastik üst motor nöron** görünümüne döner; **pozitif Babinski**"
- "**Sfinkter tutulumu**: **idrar retansiyonu** ve **kabızlık**; ilk şikâyet bazen **hiç idrar yapamamak**tır"
- "**Düzeye denk gelen bant tarzı ağrı** ve **sırt-bel ağrısı**yla ağrılı başlangıç"
- "**Servikal tutulum**da **dört ekstremite** kuvvet kaybı ve **diyafram** riskiyle **solunum yetmezliği**"
- "**LP**'de hafif **pleositoz** ve **protein artışı**; **oligoklonal bantlar genelde yoktur** (multipl sklerozun tersine)"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **kesin duyu düzeyi** — gövdede belirgin bir hizada altındaki tüm modalitelerin kaybı; **MRG'de aynı düzeye denk gelen iki vertebra segmentinden uzun, santral, kontrastlanan lezyon**"
ilk_tetkik: "**Kontrastlı omurilik MRG** (torakal-servikal): **T2'de iki vertebra segmentinden uzun, santral, kontrastlanan lezyon**. Aynı gün **beyin MRG** (MS lezyonları için), **LP** ve serum **Aquaporin-4** ile **MOG antikorları**; **idrar retansiyonunda rezidü üriner volüm**"
kesin_tani: "**Akut-subakut çift taraflı motor, duyusal ve sfinkter bozukluğu** + **duyu düzeyi**; MR'da **inflamatuvar omurilik lezyonu**, **BOS'ta pleositoz-protein**; **İnfeksiyöz** (**herpes virüsleri**, **nörosifiliz**, **borreliyoz**), **kompresif** (**epidural abse**, **ekstramedüller tümör**), **sistemik** (**lupus**, **sarkoidoz**, **Behçet**) dışlanır; **Aquaporin-4 pozitifse** tablo **nöromiyelitis optika spektrumuna** ait kabul edilir"
ilk_tedavi: "**Yüksek doz IV metilprednizolon (günde 1 g, 3-5 gün)** — immün ödemi ve inflamasyonu bastırıp **ikincil akson kaybını** azaltır; **Yanıt yoksa veya ağır** seyirde **plazmaferez** (özellikle **Aquaporin-4 pozitiflerde**) veya **IV immünglobulin**; **NMS tanımlıysa** uzun dönemde **rituksimab** veya **azatioprin** ile **immünosupresyon**; **İdrar retansiyonunda aralıklı kateterizasyon**, **tromboz profilaksisi**, **erken rehabilitasyon**"
klasik_komplikasyon: "**Kalıcı parapleji** ve **spastisite**, **nöropatik ağrı**, **nörojenik mesane** ve **tekrarlayan üriner infeksiyonlar**; **NMS**de **tekrarlayan optik nörit** ve **miyelit** atakları"
