id: transvers_miyelit
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- Transvers Miyelit Konsorsiyumu Çalışma Grubu tanı kriterleri (referans olarak listelendi, metin projesi
  özgün yazımdır)
- Adams and Victor's Principles of Neurology
ad: Transvers Miyelit
taksonomi:
- - ktbt
  - noroloji
  - noro_omurilik
  - noro_om_miyelit
tipik_hasta: Genç erişkinde, birkaç gün ile birkaç hafta içinde bacaklarda ilerleyen kuvvet kaybı, göğüs
  veya bel çevresinde bant tarzı sarıcı ağrı ve idrar tutulması ile başvuran hasta; öyküde 2-4 hafta önce
  solunum veya sindirim yolu infeksiyonu, aşı ya da gebelik olabilir; çok odaklı veya tekrarlayıcı tablolarda
  nöromiyelitis optika ve sistemik hastalıklar akılda tutulur
patofizyoloji: Omuriliğin belirli bir segmentinde (en sık torakal) immün aracılı inflamasyon; miyelin
  ve giderek akson kaybıyla lokalize hasar alanı oluşur ve bu düzeyin altındaki tüm yollar işlevini yitirir.
  Postinfeksiyöz moleküler benzetme klasik açıklamadır; Aquaporin-4 veya miyelin oligodendrosit glikoprotein
  antikorları pozitif hastalarda lezyon daha uzun ve gri madde ağırlıklıdır, multipl sklerozun kısa periferik
  yerleşimli lezyonlarından bu özelliklerle ayrılır
anahtar_bulgular:
- 'Duyu düzeyi: gövde çevresinde kesin bir sınır çizgisi; sınırın altında dokunma, ağrı, ısı ve pozisyon
  duyusunun tümü kayıp, üstünde normal'
- 'Bacaklarda kuvvet kaybı: ilk saatlerde flasid görünebilir, günler içinde spastik üst motor nöron görünümüne
  döner; pozitif Babinski'
- 'Sfinkter tutulumu: idrar retansiyonu ve kabızlık; hastanın ilk şikayeti bazen hiç idrar yapamamaktır'
- Düzeye denk gelen bant tarzı ağrı ve sırt-bel ağrısıyla ağrılı başlangıç
- Servikal tutulumda dört ekstremite kuvvet kaybı ve diyafram riskiyle solunum yetmezliği
- Lomber ponksiyonda hafif pleositoz ve protein artışı; oligoklonal bantlar genelde yoktur (multipl sklerozun
  tersine)
patognomonik: 'Patognomonik değil; tanıya yardımcı tipik bulgu — Kesin duyu düzeyi: gövdede belirgin bir hizada altındaki tüm duyu modalitelerinin kaybı;
  MRG''de aynı düzeye denk gelen iki vertebra segmentinden uzun, santral yerleşimli, kontrastlanan omurilik
  lezyonu'
ilk_tetkik: 'Kontrastlı omurilik MRG (torakal ve servikal): T2''de iki vertebra segmentinden uzun, santral
  yerleşimli, kontrastlanan lezyon. Aynı gün beyin MRG (multipl skleroz lezyonlarını araştırmak için),
  lomber ponksiyon ve serum Aquaporin-4 ile MOG antikorları; idrar retansiyonunda rezidü üriner volüm
  ölçümü'
kesin_tani: Akut-subakut başlangıçlı çift taraflı motor, duyusal ve sfinkter bozukluğu artı duyu düzeyi;
  MRG'de inflamatuvar omurilik lezyonu ve CSF'de pleositoz-protein artışı; infeksiyöz (herpes virüsleri,
  nörosifiliz, borreliyoz), kompresif (epidural abse, ekstramedüller tümör) ve sistemik (lupus, sarkoidoz,
  Behçet) nedenler dışlanır. Aquaporin-4 antikoru pozitifse tablo nöromiyelitis optika spektrumuna ait
  kabul edilir
ilk_tedavi: 'Yüksek doz intravenöz metilprednizolon (günde 1 g, 3-5 gün): mantığı immün aracılı ödemi
  ve inflamasyonu hızla bastırıp ikincil akson kaybını azaltmaktır; yanıt yoksa veya tablo ağır seyrediyorsa
  plazmaferez (özellikle Aquaporin-4 pozitiflerde) veya intravenöz immünglobulin. Nöromiyelitis optika
  spektrumu tanımlanmışsa uzun dönemde rituksimab veya azatioprin ile immünosupresyon; idrar retansiyonunda
  aralıklı kateterizasyon, tromboz profilaksisi ve erken rehabilitasyon'
klasik_komplikasyon: Kalıcı parapleji ve spastisite, nöropatik ağrı, nörojenik mesane ve tekrarlayan üriner
  infeksiyonlar; nöromiyelitis optika spektrumunda tekrarlayan optik nörit ve miyelit atakları
