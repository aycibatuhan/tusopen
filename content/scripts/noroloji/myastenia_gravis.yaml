tipik_hasta: "**Genç kadın** veya **50 yaş üstü erkek**; **çift görme** veya **göz kapağı düşmesi**yle, **çiğneme-yutma güçlüğü** ve gün içinde artan yorgunlukla gelen hasta; **Sabah iyi, gün ilerledikçe ve aktiviteyle kötüleşen** güçsüzlük tanıya yakın ipucudur"
patofizyoloji: "**Nöromusküler kavşağın postsinaptik** tarafına karşı **otoimmün** hastalık: **asetilkolin reseptörüne karşı IgG antikorlar** reseptörü bloke eder, **içselleştirip yıkar** ve **komplement aracılı zar hasarı** yapar. Sinir uyarısıyla açığa çıkan asetilkolin **küçülmüş kavşak plakasında yeterli reseptör bulamaz**, kas yeterince kasılamaz. Genç hastalarda **timik hiperplazi**, **50 yaş üstünde timom** sık"
anahtar_bulgular:
- "**Yorulabilen, dalgalanan (fluktuantan) kas güçsüzlüğü**: **sabah iyi, akşam kötü**"
- "**Oftalmoparezi ve pitoz**: çoğu hastada **ilk bulgu**; göz hareket kısıtlılığı **çift görme** yaratır"
- "**Bulbar tutulum**: **çiğneme, yutma, konuşma güçlüğü**; **mimik kaslarının zayıflığı**"
- "**Anti-asetilkolin reseptör (anti-AChR) antikor** pozitifliği; negatifse **anti-MuSK** araştırılır"
- "**Toraks BT**'de **timoma** veya **timik hiperplazi**"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **edrofoniyum (kısa etkili antikolinesteraz) testinde geçici belirgin düzelme** — benzer mantıkla **soğuk paket testi** pitozda geçici düzelme sağlar"
ilk_tetkik: "**Serum anti-AChR antikoru**; negatifse **anti-MuSK**; **Toraks BT** (**timoma** araştırması); **tiroid fonksiyon testleri** (eşlik eden **otoimmün hastalık** sıklığı). Muayenede **yorulma provokasyonu** (uzun süre yukarı bakış) ve **soğuk paket testi**"
kesin_tani: "**Sinire tekrarlı düşük frekanslı uyarıda bileşik kas aksiyon potansiyeli amplitüdünde azalma (dekrement)**. En duyarlı yöntem **tek lif EMG'de jitter artışı**dır; **klinik yorulabilen güçsüzlük** + **antikor veya dekrement** kanıtı tanıyı tamamlar"
ilk_tedavi: "**Piridostigmin** (asetilkolinesteraz inhibitörü) **semptomatik başlangıçtır**. Kronik kontrol: **prednizon** ve steroidten bağımsız **azatioprin**, **mikofenolat**; **timom** saptanırsa **timektomi**; **Miyastenik krizde** **solunum desteği** ve hızlı immünoterapi (**plazmaferez** veya **IVIg**)"
klasik_komplikasyon: "**Miyastenik kriz**: **solunum kaslarının tutulumuyla gelen solunum yetmezliği**, yoğun bakım gerektirir; **Kolinerjik kriz**: **aşırı antikolinesteraz** dozunun yarattığı güçsüzlük; **muskarinik bulgular** (**salivasyon, diyare, miosis**) ile ayrılır"
