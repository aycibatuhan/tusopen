id: siringomiyeli
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- Bradley's Neurology in Clinical Practice
- Adams and Victor's Principles of Neurology
ad: Siringomiyeli
taksonomi:
- - ktbt
  - noroloji
  - noro_omurilik
  - noro_om_siringomiyeli
tipik_hasta: Genç-orta yaşlı hastada yıllardır süren boyun-omuz-kol ağrıları, ellerde kuvvet kaybı ve
  incelme; ağrı duyusu kaybı nedeniyle fark etmeden elini yakmasını, kesmesini anlatır; çoğunda beyin MRG'sinde
  Arnold-Chiari tip 1 malformasyonu; travma sonrası veya omurilik tümörü çevresinde de oluşabilir; ailede
  skolyoz öyküsü sık
patofizyoloji: 'Omurilik içinde uzayan, sıvı dolu kist (siringiks). En sık mekanizma posterior fossa anomalisi:
  Chiari tip 1''de küçük arka kafatası boşluğu tonsilleri foramen magnumdan aşağı iter, santral kanal
  çevresindeki beyin-omurilik sıvısı akışı bozulur ve kist genişler. Kist önce merkezde, ağrı-ısı liflerinin
  omurilik seviyesinde çaprazlandığı yerde başlar; dorsal kolonlar (ağırlık ve pozisyon duyusu) en dışta
  ve en geç tutulur — bu tutulum sırası duyusal dissosiasyonu yaratır'
anahtar_bulgular:
- 'Duyusal dissosiasyon: omuz ve kollarda ağrı-ısı duyusu kayıp; vibrasyon, pozisyon (ağırlık) ve dokunma
  duyusu korunmuş'
- Ellerin iç kaslarında (interossei, tenar-hipotenar) atrofi ve kuvvet kaybı
- Fark edilmeyen yanık, kesik ve eklem hasarı; ileri dönemde nöroartropatik (Charcot) eklem
- Boyun ve omuz bölgesinde bant tarzı ağrı; öksürük-eforla artan arka kafa ağrısı (Chiari işareti)
- 'Kistin genişlemesiyle spastik paraparezi, Horner sendromu; yukarı uzanırsa siringobulbi: nistagmus,
  disartri, dil atrofisi'
- Genç yaşta başlayan ilerleyici skolyoz
patognomonik: 'Patognomonik değil; tanıya yardımcı tipik bulgu — Duyusal dissosiasyon: ağrı ve ısı duyusunun kaybolmasına karşın vibrasyon, pozisyon ve
  dokunma duyusunun korunması'
ilk_tetkik: 'Beyin ve omurilik MRG: kistin düzeyi ve uzunluğu, kord genişlemesi tek tetkikte gösterilir;
  posterior fossa değerlendirmesi (Chiari) aynı incelemede yapılır; muayenede duyu haritası tanıyı yöneltir'
kesin_tani: MRG'de omurilik içinde sıvı dansiteli kavitenin gösterilmesi artı tipik duyusal dissosiasyon
  tablosu; altta yatan neden (Chiari malformasyonu, omurilik tümörü, eski travma, araknoid adherans) ayrıca
  sınıflandırılır
ilk_tedavi: 'Kist sabit ve bulgular hafifse izlem ve düzenli MRG; ilerleyici veya ağır bulgularda cerrahi:
  Chiari varsa posterior fossa dekompresyonu, tümör varsa rezeksiyon, basınç boşaltımı için siringosubaraknoid
  drenaj; nöropatik ağrıda gabapentinoidler; solunum kasları etkilenirse destekleyici bakım'
klasik_komplikasyon: Kalıcı el kuvvet kaybı (iç kas atrofisi geri dönmez), tekrarlayan yanık ve yara infeksiyonları,
  ilerleyen skolyoz; cerrahiye geç kalınan hastada kalıcı miyelopati
