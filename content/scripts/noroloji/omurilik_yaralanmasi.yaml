id: omurilik_yaralanmasi
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- ISNCSCI (ASIA) Omurilik Yaralanması Nörolojik Sınıflaması
- Adams and Victor's Principles of Neurology
ad: Omurilik Yaralanması
