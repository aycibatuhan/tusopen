tipik_hasta: "**Trafik kazası, yüksekten düşme veya dalgıç kazası** (kafayla sığ suya çarpma) ile gelen **genç erişkin** klasik profil; **Yaşlı**da **spondiloz**, **osteoporoz** veya **tümör**le önceden daralmış kanalda **hafif düşme** bile ciddi yaralanmaya yeter. Başvuru: bacaklarda veya **dört uzuvda ani kuvvet kaybı**, gövdede **duyu sınırı**, **idrar retansiyonu**"
patofizyoloji: "**Birincil hasar** (kemik fragmenti, disk veya dislokasyonun doğrudan ezmesi) sonrası saatler-günler süren **ikincil kaskat**: ödem, **mikrodolaşım bozukluğu**, **iskemi**, **eksitotoksisite**, inflamasyon; **Servikal yaralanmada C4 ve üstü** tutulum **diyaframı** doğrudan etkiler; **Anterior kord** (motor ve **ağrı-ısı kaybı**, dorsal yollar korunur); **santral kord** (**hiperekstansiyon** sonrası **kollar bacaklardan daha etkilenir**); **Brown-Séquard** (yarım kesilme: **aynı tarafta motor-pozisyon**, karşı tarafta **ağrı-ısı** kaybı)"
anahtar_bulgular:
- "**Düzey belirleme**: **ASIA/ISNCSCI** formuyla **en alt sağlam segment** (C4-C5-T10 gibi); **motor kas grupları**, **28 duyu noktası**, **istemli anal sıkıştırma (S4-S5)**"
- "**Spinal şok**: ilk **24-72 saatte** altında **flasid arefleksik paralizi** ve **arefleksik mesane**; **bulbokavernoz refleksin geri dönmesi** şokun bittiğini gösterir — bu sürede **tam-yarım ayrımı güvenilir değil**"
- "**Sakral kaçış**: **perianal duyu** veya **istemli anal sıkıştırmanın korunması** yaralanmanın **tam olmadığını** ve **iyileşme potansiyeli**ni gösterir"
- "**Nörojenik şok**: **hipotansiyon ve bradikardi** birlikte (**sempatik zincirin kesilmesi**); travmada **hipovolemik şok**la ayrılması zorunlu"
- "**Otonom disrefleksi**: **T6 ve üstü** yaralanmalarda **mesane-bağırsak doluluğu** veya **bası yarası** gibi uyarılara **ani hipertansiyon**, baş ağrısı ve **terleme**"
- "**Solunum**: **C3-C5 diyafram çekirdeği**dir; yüksek servikal yaralanmada **ventilasyon ihtiyacı**, **sekresyon temizliğinde güçlük**"
patognomonik: null
ilk_tetkik: "**Spinal immobilizasyon** (taşınma dahil) sonrasında **nonkontrast servikal-torakal BT**: **kırık**, **dislokasyon**, **kanal daralması**; **MRG**: kord içindeki **ödem**, **kanama**, **süreklilik kaybı** (**prognoz için en değerli görüntü**); **ASIA/ISNCSCI formu** ilk muayenede doldurulur, **spinal şok** bitince tekrarlanır"
kesin_tani: "**ASIA/ISNCSCI sınıflaması**: **motor ve duyu düzeyleri**, **sakral korunma**, **tam (A)** ile **tam olmayan (B-D)** ayrımı. Derecelendirme **spinal şok** sonlandıktan sonra kesinleşir; **BT ve MRG** bulguları düzey ve tip ile eşleştirilir"
ilk_tedavi: "Akut faz: **immobilizasyon** ve hızlı **spinal stabilizasyon**; ilk hafta hedef **ortalama arter basıncı 85-90 mmHg** (kord perfüzyonu için); **Yüksek doz metilprednizolon tartışmalıdır, rutin önerilmez**; **C3-C5** tutulumunda **solunum desteği**; **derin ven trombozu profilaksisi**; **mesane yönetimi (aralıklı kateterizasyon)**. Gerekirse **erken dekompresyon-stabilizasyon cerrahisi**; **erken ve yoğun multidisipliner rehabilitasyon** — fonksiyonel kazanım penceresi **ilk 3-6 ay**; **Spazm** için **baklofen**, **nöropatik ağrı** için **gabapentinoidler**; **otonom disrefleksi** krizinde **tetikleyicinin (dolu mesane) boşaltılması**"
klasik_komplikasyon: "**Nörojenik mesane-bağırsak** (**retansiyon**, **vesikoureteral reflü**, böbrek hasarı); **otonom disrefleksi** krizleri; **Bası yaraları** ve infeksiyonları; **derin ven trombozu** ve **pulmoner emboli**; **heterotopik kemikleşme**. Yıllar sonra da izlenebilen **posttravmatik siringomiyeli**; yüksek servikal yaralanmada **kalıcı ventilatör bağımlılığı**"
