id: tourette
version: 1
status: draft
author: ai-drafts/noroloji-3
sources:
- DSM-5 (American Psychiatric Association)
- American Academy of Neurology Tourette Sendromu Tedavi Rehberi
ad: Tik Bozuklukları (Tourette)
taksonomi:
- - ktbt
  - noroloji
  - noro_hareket_bozukluklari
  - noro_hb_tik_tourette
tipik_hasta: "**5-10 yaş** arasında başlayan, erkeklerde **üç-dört kat** sık okul çağı çocuğu; **göz kırpmak** gibi basit motor tiklerle başlar, aylar içinde **boyun-omuz ve ses tikleri** eklenir; **Şiddet 11-12 yaş**ta zirve, **ergenlik sonunda** çoğunda belirgin azalır; ailede **tik**, **DEHB** veya **OKB** öyküsü sık"
patofizyoloji: "**Kortiko-striato-talamo-kortikal** devrelerde **inhibitör kontrol eksikliği** ve **dopaminerjik işaretlenme bozukluğu**; **genetik yatkınlık** yüksek. Tik **istemsizdir ama bastırılabilir**: **premoniter dürtü** (lokalize gerginlik-karıncalanma) tikle geçici rahatlar; **Kaygı, uyku yoksunluğu, kafein** şiddeti artırır; **yoğun odaklanma** azaltır"
anahtar_bulgular:
- "**Motor tikler**: ani, hızlı, tekrarlayıcı, amaçsız — **göz kırpma**, **yüzü buruşturma**, **baş sallama**, **omuz silkme**"
- "**Vokal tikler**: **boğaz temizleme**, **öksürme**, ses-kelime çıkarma; ileri tabloda **ekolali** ve **koprolali**"
- "**Premoniter dürtü**: tik öncesi **lokalize gerginlik hissi**, tikle **geçici rahatlama**"
- "**Bastırılabilirlik**: kısa süre **istemli baskı** mümkün, sonra patlar; **psikojenik ve obsesif** davranışlardan ayırır"
- "Eşlik eden **DEHB** ve **OKB** tiklerden **daha çok işlev bozar**; ergenlikte **sosyal dışlanma** ve **depresyon** riski"
- "**Doğal seyir**: başlangıç **ilk on yıl**, şiddet **zirve yıllarda**, çoğunda **yetişkinlikte belirgin hafifleme**"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **premoniter dürtü hissinin tikle geçici rahatlaması** ve tiklerin **kısa süre istemli bastırılabilmesi**"
ilk_tetkik: "**Klinik tanıdır**, özel tetkik gerektirmez; **DSM-5 kriterleri**yle **tik envanteri** ve eşlik eden **DEHB-OKB-depresyon** taraması; nadiren **kore** veya **miyokloni** ayırımı için **görüntüleme**"
kesin_tani: "**DSM-5**: başlangıç **18 yaşından önce**; **birden çok motor tik** + **en az bir vokal tik**. Tikler başlangıçtan itibaren **bir yıldan uzun** süredir vardır; **madde veya başka tıbbi durum** açıklamaz. Yalnız motor ya da yalnız vokal tik **bir yıl** sürerse **kronik tik bozukluğu**, kısaysa **geçici (provizyonel) tik bozukluğu**"
ilk_tedavi: "**İşlev bozmayan hafif tiklerde** **psikoeğitim ve izlem** — doğal azalma beklenir; **İşlev bozucu** tiklerde birinci basamak **davranışsal tedavi**: **alışkanlık ters çevirme eğitimi (HRT/CBIT)**; **Orta-ileri şiddette** ilaç: **alfa-2 agonistleri** (**klonidin**, **guanfasin** — **DEHB** eşlik edince) veya **düşük doz antipsikotikler** (**aripiprazol**, **risperidon** — **metabolik izlemle**); **DEHB** için **metilfenidat** tikleri **belirgin artırmaz** — **tik varlığı stimülan kullanımına kontrendikasyon değildir**"
klasik_komplikasyon: "**Akran dışlanması**, **okul başarısının düşmesi**, **öz saygı hasarı**; antipsikotik kullanımının **metabolik yan etkileri**. Şiddetli tabloda **tikle kendine yaralanma** (başını duvara çarpma)"
