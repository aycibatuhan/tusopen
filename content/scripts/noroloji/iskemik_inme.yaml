- Adams and Victor's Principles of Neurology
ad: İskemik İnme
taksonomi:
- - ktbt
  - noroloji
  - noro_serebrovaskuler
  - noro_sv_iskemik_inme
tipik_hasta: "**Orta-ileri yaşta**; **hipertansiyon**, **diyabet**, **atriyal fibrilasyon**, **dislipidemi** veya **sigara** öyküsü olan hasta; **Dakikalar içinde doruğa ulaşan**, bir damar bölgesine uyan **negatif (fonksiyon kaybı)** belirtilerle gelir: **yüz-kol ağırlıklı parezi**, **dilsizlik**, **görsel alan kaybı**, yan bakma tercihi"
patofizyoloji: "**Beyin dokusunun arteriyel perfüzyon kaybı**; etiyoloji **TOAST sınıflaması**yla düzenlenir; **Büyük damar aterosklerozu**, **kardiyak kaynaklı emboli** (özellikle **atriyal fibrilasyon**), **küçük damar hastalığı (lakan)**, diğer belirlenmiş nedenler (**disseksiyon**, **trombofili**) ve belirlenemeyen; **İskemi çekirdeği** (geri döndürülemez) ile **penumbra** (kurtarılabilir doku) ayrımı **reperfüzyon tedavilerinin** mantığını kurar"
anahtar_bulgular:
- "**Ani başlayan, damar bölgesine uyan deficit**: **hemiparezi**, **dilsizlik**, **hemianopsi**, **yüz-kol tutulumu**"
- "**NIHSS** özeti: bilinç-yönelim, **göz hareketleri-konjuge bakma deviasyonu**, görme alanları, **yüz parezisi**, **motor güç (0-4)**, ataksi, duyu, **ihmal**, dilsizlik-disartri; toplam **0-42**"
- "**Kardiyak kaynak şüphesi**: **düzensiz nabız (atriyal fibrilasyon)**, **birden fazla vasküler bölgede** infarkt izleri"
- "**Lakan sendromları**: **salt motor** (kapsüla/beyin sapı), **salt duyu** (talamus), **dilsizlik-parezi el** kombinasyonları"
- "**Hiperakut kontrastsız CT**'de hafif bulgular: **insülar ribbon** belirginliğinin kaybı, **gri-beyaz madde ayrımının bulanıklaşması**"
patognomonik: "Tek başına patognomonik bulgu yok; **ani başlangıç** ve **damar bölgesine uyan negatif belirtiler** örüntüyü tanımlar"
ilk_tetkik: "Kanamayı dışlamak için **acil kontrastsız kraniyal BT**; eş zamanlı **kan şekeri**, elektrolitler, **trombosit sayısı**, **INR** ve **12 derivasyonlu EKG**; **CT anjiyografi**yle **büyük damar tıkanıklığı** araştırılır"
kesin_tani: "**Kontrastsız CT** kanamayı dışlar; **MR'da difüzyon kısıtlanması (DWI-ADC uyumsuzluğu)** iskemiyi kesinleştirir. Etiyoloji için **boyun damar Doppler**, **ekokardiyografi** ve en az **24-72 saatlik ritim izlemi**; **TOAST** sınıflamasına göre neden"
ilk_tedavi: "**Son iyi bilinen andan 4,5 saat içinde** kanama dışlanmışsa **IV tromboliz** (**alteplaz/tenekteplaz**); **büyük damar tıkanıklığı**nda **çekirdek-penumbra uyumsuzluğu** ile **trombektomi** **24 saate kadar**; **Tromboliz öncesi tansiyon 185/110 altına**; trombolizli hastada hedef **180/105 altı**; **permissive hipertansiyon** yalnız reperfüzyonsuz hastada (**220/120 altında**); **ASA ilk 24-48 saatte** (tromboliz varsa **24 saat bekle**); **glukoz ve vücut ısısı kontrol**; **inme ünitesi**ne yatış; **Sekonder korunma**: **antiagregan**, **yüksek doz statin**, **atriyal fibrilasyonda oral antikoagülan**; **%70 üzerindeki semptomatik karotis darlığında** **endarterektomi**"
klasik_komplikasyon: "**Malign orta serebral arter** ödemi ve **herniasyon** (genç, geniş infarktlı); **kanamalı dönüşüm**; **Aspirasyon pnömonisi**, **derin ven trombozu**, **post-inme depresyon**"
