ad: Multipl Skleroz
taksonomi:
- - ktbt
  - noroloji
  - noro_demiyelinizan
  - noro_dy_ms
tipik_hasta: "**20-40 yaş arası kadın**; **ağrılı tek göz görme kaybı (optik nörit)**, uyuşma, **çift görme** veya denge bozukluğu gibi **ataklar hâlinde** şikâyetler. Şikâyetler **ayrı zamanlarda ve ayrı sinir sistemi bölgelerinde** çıkar; ataklar arası tam ya da kısmi düzelme (**relapsing-remitting**) en yaygın başlangıç tipi"
patofizyoloji: "**Merkezi sinir sistemi beyaz maddesine** yönelik **otoimmün inflamasyon ve demiyelinizasyon**; **çevresel sinirler korunur**; **Periventriküler**, **juktakortikal**, **infratentoryal** ve **omurilik** lezyonları klasiktir. Tekrarlayan ataklarda miyelin kaybına **aksonal hasar ve glioz** eklenir; ilerleyici formlarda inflamasyon azalsa da **nörodejenerasyon** sürer"
anahtar_bulgular:
- "**Optik nörit**: **ağrılı monoküler görme kaybı**, **kırmızı rengin soluk görülmesi**, **afferan pupiller defekt**"
- "**Lhermitte belirtisi**: boyun öne eğilirken omurga boyunca geçen **elektrik çarpması hissi**"
- "**İnternükleer oftalmopleji**: yan bakışta **addüksiyon yavaşlığı** ve abdükse gözde **nistagmus**; genç hastada **güçlü ipucu**"
- "**Uhthoff fenomeni**: **sıcak duş veya egzersizle** belirtilerin **geçici alevlenmesi**"
- "**Omurilik tutulumu**: belli bir **düzeyin altında duyu kaybı**, **spastisite**, **mesane bozukluğu**"
- "**MR'da Dawson parmakları**: periventriküler ve **kallozal arayüzde** oval, **ventriküllere dik** dizilen lezyonlar"
patognomonik: "Tek bir bulgu patognomonik değildir; tanının özü **ayrı zamanlarda (zaman dispersiyonu)** ve **ayrı merkezi bölgelerde (mekân dispersiyonu)** kanıtlanmış lezyonlardır"
ilk_tetkik: "**Gadolinyumlu kraniyal ve omurilik MR**; lomber ponksiyonda **oligoklonal bantlar**; **görsel uyarılmış potansiyeller**. Taklitlerden korunmak: **B12**, **NMO (AQP4 antikor)**, **sarkoidoz**, **sistemik lupus**, **vaskülit** taraması"
kesin_tani: "**McDonald kriterleri**: klinik tablo ve **MR'da zaman ve mekân dispersiyonunun** birlikte kanıtı; **tipik klinik sendromla MR bulguları** uyumluysa tanı; **BOS oligoklonal bantları** **mekân dispersiyonu** kanıtı sayılabilir"
ilk_tedavi: "**Atak tedavisi**: yüksek doz **IV metilprednizolon (günde 1 g, 3-5 gün)**; steroid dirençli ağır atakta **plazmaferez**; **Hafif-orta aktivitede** **interferon beta**, **glatiramer asetat** veya oral ajanlar (**fingolimod**, **dimetil fümarat**, **teriflunomid**); **Yüksek aktivitede** **natalizumab** (**JC virüsü ve PML riski** nedeniyle seroloji izlemi), **orelizumab** veya **rituksimab**; **Semptomatik**: spastisite için **baklofen** ve **tizanidin**, yorgunluk için **amantadin**, **nöropatik ağrı** ve **mesane yönetimi**"
klasik_komplikasyon: "Yıllar içinde **birikimli engellilik**: **spastik parapleji**, **mesane-barsak bozukluğu**, **nöropatik ağrı**, yorgunluk, **bilişsel bozulma**, depresyon; **Tekerlekli sandalye bağımlılığı** ilerleyici formlarda öne çıkar"
