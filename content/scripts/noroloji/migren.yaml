sources:
- ICHD-3 Uluslararası Baş Ağrısı Bozuklukları Sınıflaması (IHS, 3. baskı)
- AHS Migren Önleyici Tedavi Rehberi (American Headache Society)
ad: Migren
taksonomi:
- - ktbt
  - noroloji
  - noro_bas_agrisi
  - noro_ba_migren
tipik_hasta: "**Genç kadın** hasta; **adölesan çağında** başlayan, ataklar hâlinde gelen, **adet dönemiyle ilişkili** olabilen baş ağrıları; **aile öyküsü** sık. Tedavi edilmeyen atak **4-72 saat** sürer; hasta **karanlık ve sessiz odada** kalmak ister"
patofizyoloji: "**Trigeminovasküler sistemin aktivasyonu**: trigeminal sinir uçlarından **CGRP** salınımı **meninksal damarları dilate edip** ağrı sinyali üretir; **Aurayı kortikal yayılan depresyon** (kademeli ilerleyen kortikal baskılanma dalgası) açıklar. Migren, **uyarı eşiği düşük (hipereksitabl)** beyinde **tetikleyicilerle** ataklar hâlinde çıkar"
anahtar_bulgular:
- "**Atak özellikleri**: **tek taraflı**, **nabız gibi atan** veya batıcı, **orta-şiddette**, **rutin fizik aktiviteyle artan** baş ağrısı"
- "**Eşlik edenler**: **bulantı ve kusma**, ışığa-sese duyarlılık (**fotofobi ve fonofobi**)"
- "**Aura**: görsel alanda dakikalar içinde genişleyen **parıltılı nokta** ve ardından **kalan kör leke**; pozitif belirtilerin negatiflere dönüşerek yayılımı tipiktir, **5-60 dakikada tamamen geri döner**"
- "**Tetikleyiciler**: **uykusuzluk**, **adet dönemi**, **açlık**, **stres ve stresin bitmesi (hafta sonu baş ağrısı)**, belirli **yiyecekler**"
- "Ağrı kesicinin haftada çok kez kullanımı **ayda 15 günü aşan kronik baş ağrısı**na yol açabilir (**ilaç aşırı kullanım baş ağrısı**)"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: görsel alanda dakikalar içinde kademeli genişleyen **parıltılı skotom** — **pozitif bulgudan negatif kör lekeye** geçiş ve **5-60 dakikada geri dönüş**"
ilk_tetkik: "Tanı **ICHD-3 klinik kriterlerine** dayanır; **baş ağrısı günlüğü** tutturulur; **Görüntüleme yalnızca sekonder tehlike işaretlerinde**: **gök gürültüsü gibi ani başlangıç**, **ateş ve boyun sertliği**, **nörolojik deficit**, **50 yaş üstünde ilk atak**; **Pozisyonla değişen veya Valsalva ile tetiklenen** ağrı, **papil ödemi**, **gebelikte yeni başlayan ağrı** ve **örüntüdeki değişim**"
kesin_tani: "**ICHD-3**: en az **5 atak**; ağrının **4-72 saat** sürmesi; **İki ağrı özelliği** (tek taraflılık, **nabız gibi atan nitelik**, orta-şiddet, **aktiviteyle artma**) ve **eşlik edici belirtiden en az biri** (**bulantı-kusma** ya da **fotofobi-fonofobi**); **Aura**lı alt tiplerde **ayrı kriterler** uygulanır"
ilk_tedavi: "**Hafif-orta atakta parasetamol veya nonsteroid antiinflamatuar**; **orta-şiddetli veya NSAİİ dirençli** atakta **triptan (sumatriptan)** — **atak başlar başlamaz erken** alınmalı, **triptan + NSAİİ kombinasyonu** tekli ajandan üstün; **Triptan kontrendikasyonları**: **koroner ve periferik vasküler hastalık**, **kontrolsüz hipertansiyon**, **hemiplejik migren** ve **beyin sapı aura**sı; **Ayda 4 ve üzeri atak** ya da belirgin işlev kaybında **önleyici tedavi**: **propranolol**, **amitriptilin**, **topiramat**, **flunarizin**. Dirençli olgularda **CGRP'ye yönelik monoklonal antikorlar**; **analjezik aşırı kullanımından korunma**"
klasik_komplikasyon: "**İlaç aşırı kullanım baş ağrısı**yla **kronikleşme**; **status migrenozus** (**72 saati aşan** tedaviye dirençli atak). Nadiren **migrenli infarkt**"
