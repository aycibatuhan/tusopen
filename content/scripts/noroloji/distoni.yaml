id: distoni
version: 1
status: draft
author: "ai-drafts/noroloji-3"
sources:
  - "Hareket Bozuklukları Derneği (MDS) Distoni Sınıflaması ve Tedavi Konsensüsü"
  - "Bradley's Neurology in Clinical Practice"
ad: Distoniler
taksonomi:
  - [ktbt, noroloji, noro_hareket_bozukluklari, noro_hb_distoni]
tipik_hasta: "İki ana profil: **erişkinde** yalnız belli bir işi yaparken beliren **fokal form** — yazarken **elin kramp tarzı sıkışması (yazma krampı)**, çalgı çalarken parmakların kilitlenmesi; **Çocukta** bir uzuvdan başlayıp yayılan **jeneralize distoni**; **Metoklopramid** veya **antipsikotik** alan hastada saatler içinde gelen **akut distonik reaksiyon** klinikte sık"
patofizyoloji: "İstemli hareket sırasında **antagonist ve komşu kasların** istemsiz, süreğen ya da tekrarlayıcı kasılması; **Bazal ganglion-serebellum-duyusal korteks** devrelerinde **inhibitör kontrolün azalması** ve **duyusal-motor entegrasyon** bozukluğu temel kabul edilir. Genetik formlar (**DYT1/TOR1A**, dopaya duyarlı **DYT5/GCH1**) ve **dopamin reseptör blokeri**ne bağlı **tardif distoni** ayrı mekanizmalar; **Duyusal girdiye duyarlılık** — hafif dokunuşla postürü düzeltebilme — tablonun tanıyıcı özelliğidir"
anahtar_bulgular:
- "İstemli eylem sırasında beliren **döndürücü ve tekrarlayıcı anormal postürler**; fokal formlarda **istirahatte kaybolur**"
- "**Görev özgüllüğü**: yalnızca **yazı yazarken**, **çalgı çalarken** belirir; aynı elleri başka işlerde kullanmak sorunsuzdur"
- "**Sensory trick (antagonist dokunuş)**: çeneye, yüze ya da etkilenen bölgeye hafifçe dokunmak **anormal postürü geçici düzeltir**"
- "**Kaygı, stres, yorgunluk ve kafein** postürü bozar; **sabah hafif**, gün sonuna doğru kötü"
- "**Çocuk başlangıçlı**: bir bacakta yürürken **ayak içe dönmesi**yle başlar, yıllar içinde **jeneralize** yayılır; **erişkin başlangıçlı** fokal kalır"
- "**Fokal biçimler**: **servikal distoni** (baş dönmesi-öneye çekilme, ağrı), **blefarospazm** (gözler açılamaz), **laringeal** (fısıltıya dönüşen ses)"
patognomonik: "Tam patognomonik değil; tanıya yardımcı tipik bulgu: **görev özgüllüğü** ve **sensory trick** — yalnız belli eylemde beliren anormal postürün **hafif bir dokunuşla** geçici düzelmesi"
ilk_tetkik: "**Nörolojik muayene** ile fenotip tanımı: **başlangıç yaşı**, **dağılım** (fokal, segmental, jeneralize) ve **tetikleyen görev**. Genç hastada **Wilson** dışlanması: **serum seruloplazmin** ve **24 saatlik idrar bakırı**; **görüntüleme** çoğu olguda normal; **Dopaya duyarlı distoni** şüphesinde **klinik levodopa denemesi**"
kesin_tani: "**Klinik sınıflama** (yaş + dağılım + tetikleyici görev) tanıyı verir; seçilmiş olgularda **genetik test** (**TOR1A**, **GCH1**); **Wilson**, **metabolik-mitokondrial hastalıklar** gibi **ikincil nedenler** dışlanır; **dopamin reseptör blokeri** öyküsü **tardif distoni**yi gösterir"
ilk_tedavi: "**Fokal distonide** birinci basamak **botulinum toksin** enjeksiyonları (hedefli, **3 ayda bir** tekrar); **Jeneralize ve segmental** formlarda oral ajanlar: **antikolinerjik (trihexifenidil)**, **baklofen**, **benzodiazepin**; **Dopaya duyarlı distoni**de **düşük doz levodopa** **dramatik** yanıt verir — şüpheli her **genç hastada** denenmelidir. Dirençli jeneralize distonide **globus pallidus internus** hedefli **derin beyin stimülasyonu**"
klasik_komplikasyon: "Süreğen anormal postürün **ağrıya ve eklem kontraktürüne** dönüşmesi; **Blefarospazm**da işlevsel körlük; **servikal distoni**de boyun ağrısı ve **radikülopati**; **yazma krampı**nda mesleki performans kaybı"
