id: rozase
version: 1
status: draft
author: ai-drafts/dermatoloji-2
sources:
- Amerikan Dermatoloji Akademisi (AAD) Rozase Yönetim Rehberi
- Fitzpatrick'in Renkli Atlası ve Özet Klinik Dermatoloji
ad: Rozase
taksonomi:
- - ktbt
  - dermatoloji
  - derm_akne_sebase
  - derm_ak_rozase
tipik_hasta: "**30-50 yaş** üstü, açık tenli, orta yaş **kadın**; yüzün orta bölgesinde **sıcak, baharatlı yemek, alkol, güneş ve stres**le alevlenen **kızarma-yanma** atakları; **Papülopüstüloz** tipi kadınlarda baskın olan fenotiptir; **flözimatöz** ve **rinofima** neredeyse yalnız **erkeklerde** görülür"
patofizyoloji: "Yüzün merkezinde kalıcı kızarıklığa yol açan **nörovasküler düzensizlik** ve **kapiller genişleme**; **epidermal bariyer** bozukluğu ve doğal immün yanıtın aşırı aktivasyonu. Kıl folliküllerinde **Demodex** akar yükünün artması **papülopüstüloz** tabloya katkı; tetikleyiciler (sıcaklık, alkol, baharat, stres) **vazodilatasyonla** alevlenme yapar"
anahtar_bulgular:
- "Merkez yüzde (alın, burun, yanak, çene) **kalıcı eritem** ve ataklarla **kızarma**"
- "**Telanjiektaziler**"
- "**Komedonların olmadığı papül ve püstüller** (akneden ayıran ana nokta)"
- "Burunda **sebase hiperplazi**, kalınlaşma ve lobülasyon (**rinofima**; erkeklerde)"
- "**Oküler tutulum**: yanma, batma, kızarıklık, **kuru göz** hissi"
patognomonik: null
ilk_tetkik: "**Klinik inceleme** yeterli; **tetikleyici** sorgulaması yapılır, **göz semptomları** mutlaka araştırılır; tanısal test gerekmez"
kesin_tani: "**Klinik**: merkez yüzde **eritem** artı **telanjiektazi** artı **komedonsuz papül püstül**; **rinofima** görünümü klinik olarak tanınır"
ilk_tedavi: "**Papülopüstüloz** tabloda ilk seçenek **topikal metronidazol** veya **topikal ivermektin** (**Demodex** yükünü azaltır); difüz kalıcı eritemde **topikal brimonidin** (vazokonstriktör) geçici rahatlama sağlar. Orta-ağır veya **oküler tutulumda** düşük doz **anti-inflamatuar oral doksisiklin**. Telanjiektazi ve kalıcı eritemde **lazer** veya **IPL**, **rinofimada cerrahi** düzeltme, her hastada **tetikleyicilerden kaçınma** ve **güneş koruması**"
klasik_komplikasyon: "Erkeklerde **rinofima** (burun deformitesi), oküler tutulumun **kornea skarına** ilerlemesi, **psikososyal etki**"
tus_gecmisi:
