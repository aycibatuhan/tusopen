id: kalp_miksoma
version: 1
status: draft
author: "ai-drafts/kardiyoloji-4"
sources:
  - "2023 ESC Kardiyomiyopatiler Rehberi ve kapak/enfektif endokardit bağlantılı kardiyak tümör kısımları — referans olarak listelendi, metin projesi özgün yazımdır"
ad: Kalp Tümörleri (Miksoma)
taksonomi:
  - [ktbt, kardiyoloji, kard_kalp_tumorleri_travma, kard_kt_miksoma]
tipik_hasta: "Orta yaş **kadın**; **sistemik emboli** (genç hastada **inme**), açıklanamayan **ateş**, kilo kaybı
  ve yüksek **sedimentasyon** birleştiren hasta. Bazen **pozisyona bağlı nefes darlığı** ya da **senkop**
  eklenir. Aile öyküsünde benzer tümörler veya **Carney kompleksi** (cilt miksomaları, cilt
  pigmentasyonu, endokrin tümörler) sorgulanır"
patofizyoloji: "Erişkinlerde en sık birincil kalp tümörü olan **miksoma**; **sol atriyum**da, **septum
  interatrial** komşuluğunda (fossa ovalis bölgesi) saplı, gevşek, **mukoid** kütle biçiminde gelişir.
  Saplı kütle kalp devirleriyle sallanır; **mitral orifis**e yaklaştığı dönemde inflowu kısıtlar ve
  **mitral darlık** benzeri tablo yaratır, yüzeyinden kopan parçacıklar **sistemik dolaşıma embolize**
  olur. Tümör dokusu **interlökin 6** gibi sitokinler salgıladığı için yüksek **sedimentasyon-CRP**,
  anemi ve kilo kaybı gibi **konstitüsyonel** bulgular görülür. Tümör yüzeyindeki **pıhtı** oluşumu ve
  iltihabi yanıt da **ateş**e katkıda bulunur"
anahtar_bulgular:
  - "**Sistemik emboli**: genç hastada **iskemik inme**, periferik damar tıkanması veya dalak-böbrek
    infarktüsü; embolik materyalde **tümör parçası** bulunabilir"
  - "Açıklanamayan **ateş**, kilo kaybı, yorgunluk ve **sedimentasyon-CRP** yüksekliği, **anemi**"
  - "Pozisyonla değişen bulgu: yatış yönüne göre **mitral bölgesindeki diyastolik hırlama**nın duyulma
    derecesi değişir; erken diyastolik **tümör plop**u duyulabilir"
  - "**Mitral darlık taklidi**: efor dispnesi, ortopne ve **senkop**; muayenede **diyastolik hırlama**"
  - "Ekokardiyografide **sol atriyumda saplı, oynak kitle**; genellikle **septum** komşuluğunda saptanır"
patognomonik: "Tipik bulgu (patognomonik değildir) — **sistemik emboli**yle birlikte açıklanamayan
  **ateş**; **pozisyonla değişen diyastolik hırlama**"
ilk_tetkik: "**Transtorasik ekokardiyografi** (sol atriyum kitle aranır); gerekirse **transözefageal
  ekokardiyografi**yle kitle yapısı ve mitral fonksiyon detaylandırılır"
kesin_tani: "Cerrahi olarak çıkarılan kitlenin **histopatolojik incelemesi**; görüntüleme
  (**ekokardiyografi**, **MR**) kitleyi bulur, kalıcı tanı **patoloji**yle konur"
ilk_tedavi: "**Cerrahi eksizyon**: emboli ve ani tıkanma riski her hastada mevcut olduğundan tümör tam
  olarak çıkarılır. **Septum tutulumlu rezeksiyon** ve gerekirse **kapak onarımı** eklenir; izlemde
  **nüks** için **ekokardiyografik takip** yapılır"
klasik_komplikasyon: "**Sistemik embolizasyon** (iskemik inme, periferik damar tıkanması). **Mitral
  orifisin ani tıkanması**yla **senkop-ani ölüm**; nadiren tümörün mikrobik tohumlanması (**enfektif
  tümör**)"
tus_gecmisi: []
kart_uret: {bilgi: true, vaka: true, celdirici: false, ayirici: false}
