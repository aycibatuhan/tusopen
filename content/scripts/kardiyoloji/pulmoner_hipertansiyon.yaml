id: pulmoner_hipertansiyon
version: 1
status: draft
author: ai-drafts/kardiyoloji-3
sources:
- 'Klinik referans isimleri: ESC ve ERS ortak pulmoner hipertansiyon kılavuzu — yalnızca kaynak adı olarak
  listelenir, tüm metin projenin özgün yazımıdır'
ad: Pulmoner Hipertansiyon
