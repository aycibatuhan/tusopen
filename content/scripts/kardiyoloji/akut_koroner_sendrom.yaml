id: akut_koroner_sendrom
version: 1
status: draft
author: ai-drafts/kardiyoloji
sources:
- ESC Akut Koroner Sendrom Rehberleri (STEMI ve NSTE-ACS yönetimi) — referans olarak listelendi, metin
  projesi özgün yazımdır
ad: Akut Koroner Sendrom
taksonomi:
- - ktbt
  - kardiyoloji
  - kard_koroner
  - kard_ko_akut_koroner_yaklasim
- - ktbt
  - kardiyoloji
