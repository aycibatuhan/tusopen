tipik_hasta: "Orta yaş üstü, sigara içen; **hipertansiyon**, **diyabet** veya **dislipidemi** bilinen hasta; istirahatte **20 dakikadan uzun** süren sıkıştırıcı göğüs ağrısı, terleme, bulantı ve kola-çeneye yayılımla başvurur; kadın, yaşlı ve diyabetik hastada nefes darlığı, yorgunluk, senkop gibi **atipik tablolar** akılda tutulmalıdır"
patofizyoloji: "**Aterosklerotik plağın fibröz örtüsünün yırtılması** plağın trombojenik içeriğini açığa çıkarır; trombosit yapışması ve agregasyonu ile koroner arterde **trombüs** oluşur; trombüs damarı **tam tıkarsa transmural miyokard iskemisi ve ST yükselmesi** (**STEMI**); kısmen açık kalırsa ya da parietal trombüs varsa **subendokardiyal iskemi** ile ST yükselmesiz sendrom (**NSTE-AKS**)"
anahtar_bulgular:
- "İstirahatte **20 dakikadan uzun** sıkıştırıcı-baskı tarzı göğüs ağrısı; terleme, bulantı, nefes darlığı, kola ve çeneye yayılım"
- "EKG'de komşu derivasyonlarda **ST segment yükselmesi**; yeni sol dal bloğunda tek başına STEMI eşdeğeri sayılmaz, **Sgarbossa konkordansı** aranır"
- "NSTE tablosunda **ST depresyonu**, T negatifliği veya dinamik EKG değişikliği; posterior enfarktüste **V1-V3'te belirgin ST depresyonu**"
- "**Yüksek duyarlıklı troponin 0. ve 1. saatte** yükselir; zirve **24-48 saat**, normalleşme **7-14 gün**; **CK-MB 48-72 saatte** normale döner, ağrı tekrarında yeniden yükselir (**reenfarkt** ayrımı)"
patognomonik: "Patognomonik değil; tanıya yardımcı tipik bulgu — **troponin yükselmesinin** iskemik **EKG değişiklikleri**yle birlikte saptanması; akut miyokard enfarktüsünün kanıtıdır"
ilk_tetkik: "Başvurunun **ilk 10 dakikası** içinde **12 derivasyonlu EKG**; STEMI uyumlu EKG varsa biyobelirteç beklenmeden **reperfüzyon** kararı verilir. **Yüksek duyarlıklı troponin 0 ve 1. saatte** ölçülür; NSTE şüphesinde **GRACE risk skoru** invaziv stratejinin zamanını belirler"
kesin_tani: "**STEMI**: komşu derivasyonlarda **ST yükselmesi** artı troponin yükselmesi; lokalizasyon **V1-V4 ön duvar (LAD)**, **II-III-aVF inferior (genellikle sağ koroner)**, **I-aVL-V5-V6 lateral**; **NSTEMI**: iskemik semptom ve troponin yükselmesi, kalıcı ST yükselmesi olmadan; **kararsız anjina**: iskemik semptom var, **troponin normal** (AKS spektrumunda sayılır ama enfarktüs değildir)"
ilk_tedavi: "**STEMI'de erken reperfüzyon**: **birincil perkütan koroner girişim** ilk tıbbi temastan **120 dakika içinde**, değilse **12 saat içinde fibrinoliz** ve lizis sonrası nakil (**farmakoinvaziv**); tüm hastalarda **aspirin + P2Y12 inhibitörü (çift antiagregan)**, **antikoagülan**, **yüksek doz statin**; oral beta bloker **sınıf IIb** (kalp yetmezliği-şok riskinde verilmez), semptomda **nitrat** ve gerektiğinde **morfin**; son **24-48 saatte sildenafil-tadalafil** kullanımı veya inferior enfarktüste **sağ ventrikül tutulumu** varsa **nitrat verilmez** (ön yükü düşürür); **NSTE-AKS'de fibrinoliz verilmez**: yüksek riskli hastada **24 saat**, düşük risklide **24-72 saat** içinde invaziv strateji"
klasik_komplikasyon: "İlk saatlerde **ventriküler fibrilasyon** (en sık ani ölüm nedeni); **3-7. günlerde** serbest duvar ve septal **rüptür**, **papiller kas rüptürü** ile akut **mitral yetersizliği**. **Kardiyojenik şok**; **ventriküler anevrizma** (kalıcı ST yükselmesi, parietal trombüs); **Dressler sendromu** (**2-10 hafta**)"
