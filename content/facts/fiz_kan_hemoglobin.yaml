id: fiz_kan_hemoglobin
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Oksijen Disosiyasyon Eğrisi"
taksonomi:
  - [ttbt, fizyoloji, fiz_kan, fiz_kan_hemoglobin]
metin: "Her hemoglobin molekülü dört alt birim ve dört heme grubu içerir; demirin ferrous biçimi bir oksijen bağlayabildiği için bir molekül en çok dört oksijen taşır. Asidoz, artan karbondioksit, yükselen sıcaklık ve artan 2,3-DPG eğriyi sağa kaydırıp oksijenin dokuya bırakılmasını kolaylaştırır; fetal hemoglobin ve alkaloz ise eğriyi sola kaydırır."
