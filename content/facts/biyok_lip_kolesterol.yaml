sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kolesterol Sentezinin Kontrol Noktası"
taksonomi:
  - [ttbt, biyokimya, biyok_lipid, biyok_lip_kolesterol]
metin: "HMG-KoA redüktaz kolesterol sentezinin hız kısıtlayıcı enzimidir ve statin grubu ilaçlar tam bu adımı bloke eder. Karaciğer kolesterolü safra asitlerine çevirir; safra asitleri yağların emülsifiye edilerek sindirilmesini sağlar. Kolesitiramin benzeri reçineler safra asidini bağırsakta yakalayıp dışarı attığı için karaciğer yeni kolesterol sentezine itilir ve bu durum LDL kolesterolü düşürür."
