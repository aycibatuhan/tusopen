sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Statin Etki ve Yan Etkileri"
taksonomi:
  - [ttbt, farmakoloji, farm_kardiyovaskuler, farm_kv_hipolipidemik]
metin: "Statinler HMG-CoA redüktazı inhibe ederek karaciğerde kolesterol sentezini azaltır; karaciğer buna yanıt olarak LDL reseptör sayısını artırır ve kandaki LDL belirgin düşer. Kas ağrısından rabdomiyolize uzanan miyopati ve karaciğer enzim yükselmesi tanınan yan etkilerdir."
