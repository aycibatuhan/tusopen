id: fiz_bob_asit_baz
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Böbreğin Asit-Baz Görevi"
taksonomi:
  - [ttbt, fizyoloji, fiz_bobrek, fiz_bob_asit_baz]
metin: "Böbrek her gün metabolizmadan kaynaklanan sabit asitleri dışarı atarak karbondioksitle telafi edilemeyen asit yükünü temizler; bu atılım çoğunlukla titrasyon asitleri ve amonyum iyonlarıyla yapılır. Filtre edilen bikarbonatın yaklaşık yüzde 85'i proksimal tübülde karbonik anhidraz aracılığıyla geri alınır; Henderson-Hasselbalch ilişkisi pH'ı bikarbonat ile karbondioksit basıncı arasındaki oranla tanımlar."
