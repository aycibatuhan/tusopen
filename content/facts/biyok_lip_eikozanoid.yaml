id: biyok_lip_eikozanoid
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Arakidonik Asit Ürünleri ve İlaç Hedefleri"
taksonomi:
  - [ttbt, biyokimya, biyok_lipid, biyok_lip_eikozanoid]
metin: "Arakidonik asit, siklooksijenaz yoluyla prostaglandin ve tromboksanlara, 5-lipoksijenaz yoluyla lökotrienlere ayrılır. Nonsteroid antienflamatuar ilaçlar siklooksijenazı baskılayarak prostaglandin aracılı ağrı ve ateşi azaltır; aspirin tromboksan A2 sentezini kalıcı olarak engelleyerek trombosit kümeleşmesini önler. Lökotrienler güçlü bronkospazm yapar ve aspirin duyarlı astım atağını tetikleyen moleküllerdir."
