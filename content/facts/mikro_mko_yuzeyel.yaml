id: mikro_mko_yuzeyel
version: 1
status: draft
author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Dermatofitlerde direkt mikoskopi ve kültür"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_mikoloji, mikro_mko_yuzeyel]
metin: "Dermatofitler (Trichophyton, Microsporum, Epidermophyton) keratinli dokularda saç, tırnak ve deriye yerleşir. KOH preparatında dallanan hifler görülür; dermatofit agarda ortamın renk değişimi ile mikro ve makrokonidyelerin biçimi tür ayrımı sağlar."
