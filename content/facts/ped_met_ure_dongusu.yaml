id: ped_met_ure_dongusu
version: 1
status: draft
author: "ai-drafts/gaps-fizyoloji-metabolik"
sources:
  - "Pediatri ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Üre Döngüsü Bozuklukları"
taksonomi:
  - [ktbt, pediatri, ped_metabolik, ped_met_ure_dongusu]
metin: "Üre döngüsü bozukluklarında amonyak birikimi metabolik asidoz veya hipoglisemi olmaksızın ensefalopati yapar; yenidoğanda hiperventilasyona bağlı solunumsal alkaloz karakteristik ilk laboratuvar bulgusudur. Klinikte beslenme reddi, kusma, letarji, nöbetler ve ilerleyici bilinç bozukluğuyla seyreder; BUN düşük-normal kalır çünkü üre yapımı bozuktur. En sık tip OTC eksikliğidir ve X-kromozoma bağlı geçer; orotik asit üretimi artar (orotik asidüri), CPS-1 eksikliğinde ise orotik asit normaldir; orotik asidüri bu ikisinin ayırıcısıdır. Sitrülinemi (argininosüksinat sentetaz) ve argininosükinik asidüri (argininosüksinat liyaz) otosomal resesiftir; arginaz eksikliğinde ise ensefalopatiden çok ilerleyici spastisite öne çıkar. Tedavide protein alımının kesilmesi, arginin, azot atıcı ilaçlar (sodyum benzoat, sodyum fenilbutirat) ve ağır hiperamonemide dializ yer alır."
