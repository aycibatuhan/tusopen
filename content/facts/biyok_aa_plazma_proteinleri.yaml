author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Albüminin Klinik Önemi"
taksonomi:
  - [ttbt, biyokimya, biyok_aminoasit_protein, biyok_aa_plazma_proteinleri]
metin: "Albümin en bol plazma proteini olup koloid osmotik basıncın büyük bölümünü üstlenir ve karaciğerde sentez edilir. Hipoalbüminemi karaciğer yetmezliği, nefrotik sendrom ya da protein kayıplı enteropatide görülür ve ödemle kendini gösterir. Serum protein elektroforezinde albümin, alfa 1, alfa 2, beta ve gamma bantları ayrılır; poliklonal artış gamma bölgesinde genişleme yapar."
