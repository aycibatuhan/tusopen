author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Patolojik Kalsifikasyon"
taksonomi:
  - [ttbt, patoloji, pat_hucre_hasari, pat_hh_kalsifikasyon_yaslanma]
metin: "Distrofik kalsifikasyon kalsiyum düzeyi normalken ölü ya da hasarlı dokularda gelişir; aterom plakları, kronik kapak lezyonları, nekrotik alanlar ve yabancı cisimler klasik yerlerdir. Metastatik kalsifikasyon ise hiperkalsemide normal dokularda, özellikle mide, böbrek ve akciğer gibi asit salgılayan organlarda görülür; en sık nedeni primer hiperparatiroidizmdir; kronik böbrek hastalığında ikincil hiperparatiroidizm de sık görülür."
