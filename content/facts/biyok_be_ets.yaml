author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Elektron Aktarım Zincirinin Düzeni"
taksonomi:
  - [ttbt, biyokimya, biyok_biyoenerjetik, biyok_be_ets]
metin: "Elektron taşıma zinciri mitokondriyal iç zarda yer alır; NADH kompleks I'den, FADH2 ise süksinat dehidrogenaz olarak görev yapan kompleks II'den zincire girer. Proton pompalayan kompleksler I, III ve IV'tür; kompleks II pompa yapmaz. Son elektron alıcısı oksijendir ve kompleks IV tarafından suya indirgenir."
