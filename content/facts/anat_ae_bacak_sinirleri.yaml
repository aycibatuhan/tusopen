id: anat_ae_bacak_sinirleri
version: 1
status: draft
author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Alt ekstremite sinir lezyonları"
taksonomi:
  - [ttbt, anatomi, anat_alt_ekstremite, anat_ae_bacak_sinirleri]
metin: "Baldır kemiği (fibula) boynunda yüzeyel seyreden common fibular (peroneal) sinir en sık yaralanan alt ekstremite siniridir; lezyonunda ayak düşüklüğü (dorsifleksiyon kaybı), eversiyon kusuru ve ayak sırtında duyu kaybı görülür. Tibial sinir arka kompartımanı ve tabanı innerve eder; lezyonunda plantar fleksiyon ve parmak fleksiyonu güçsüzlüğü olur. Obturator sinir adduktor grubunu innerve eder ve lezyonu uyluk addüksiyon kaybı yapar."
