metin: "Prazosin alfa 1 reseptörünü seçici olarak bloke ederek damar direncini düşürür; ilk dozdan sonra ani tansiyon düşmesi görülebileceğinden küçük dozla başlanır. Fenoksibenzamin geri döndürülemez alfa blokaj yapar ve feokromositoma ameliyat öncesi hazırlıkta tercih edilir."
