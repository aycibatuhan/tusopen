id: kd_gf_antenatal_izlem
version: 1
status: draft
author: "ai-drafts/gaps-fizyoloji-metabolik"
sources:
  - "Kadın doğum ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antenatal İzlem ve Tarama Testleri"
taksonomi:
  - [ktbt, kadin_dogum, kd_gebelik_fizyolojisi, kd_gf_antenatal_izlem]
metin: "İlk antenatal ziyarette gebelik haftası belirlenir ve tam kan sayımı, kan grubu-Rh, endirekt Coombs, HBsAg, HIV, sifiliz taraması ve idrar tetkiki yapılır. 11-14. haftalarda ense kalınlığı (NT) ölçümü çift test (serbest β-hCG ve PAPP-A) ile birleştirilir; 15-20. haftalarda (ideal 16-18) üçlü test (AFP, konjuge olmayan estriol, hCG) uygulanır. Gestasyonel diyabet taraması 24-28. haftalarda 50 g glukoz yükleme testiyle yapılır. Rh negatif anne adaylarına anti-D immünglobulin profilaktik olarak 28. haftada verilir. İzlemde simfizis-fundus yüksekliği ölçümü ve fetal hareket sayımıyla büyüme izlenir; riskli gebeliklerde NST, biyofizik profil ve Doppler ultrasonografi devreye girer."
