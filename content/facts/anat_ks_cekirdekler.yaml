metin: 'Kranial sinirlerin çıkış düzeyleri lokalizasyon için temeldir: I-II prosensefalon düzeyi, III-IV
  orta beyin, V-VIII pons, IX-XII medulla kaynaklıdır. N. olfaktorius frontal lob tabanına ulaşır; optik
  sinir kiasma yapar, okulomotorius interpedinküler fossadan çıkar ve troklearis tek dorsal (tentoriumun
  arkasından) çıkış yapan sinirdir. N. trigeminus ponsun lateral yüzünden, fasiyal ile vestibulokoklear
  ponto-medüller açıdan, hipoglossus medullanın ön yüzünden (preoliv) çıkar; vagus ise retrooliv sulkustan
  çıkar.'
