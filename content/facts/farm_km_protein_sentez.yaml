sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Protein Sentez İnhibitörü Grupları"
taksonomi:
  - [ttbt, farmakoloji, farm_kemoterapotik, farm_km_protein_sentez]
metin: "Aminoglikozidler bakteriyel 30S alt ünitesine bağlanarak okuma hatasına yol açar ve bakterisid etki eder; böbrek ve iç kulak toksisitesi izlenmelidir. Tetrasiklinler 30S alt ünitesini, makrolidler ve kloramfenikol ise 50S alt ünitesini bloke ederek bakteriostatik etki gösterir. Kloramfenikol aplastik anemi riskiyle tanınır."
