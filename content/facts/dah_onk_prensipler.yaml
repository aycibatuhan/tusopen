id: dah_onk_prensipler
version: 1
status: draft
author: "ai-drafts/gaps-onkoloji-anestezi"
sources:
  - "Tıbbi onkoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kanser Epidemiyolojisi ve Tarama"
taksonomi:
  - [ktbt, dahiliye, dah_onkoloji, dah_onk_prensipler]
metin: "Tarama, belirti vermemiş bireylerde kanseri ya da prekanseröz lezyonu erken evrede yakalamayı amaçlar; etkin bir tarama programı için kanser yaygın ve önemli bir halk sağlığı sorunu olmalı, hastalığın preklinik dönemi yeterince uzun olmalı, erken evrede uygulanan tedavi mortaliteyi azaltmalı ve test yüksek sensitivite-spesifisite, kabul edilebilir yan etki ve maliyete sahip olmalıdır. Türkiye'de örgütlü taramalar meme kanseri için 40-69 yaşlarda iki yılda bir mamografi, serviks kanseri için 30-65 yaşta HPV DNA testi (5 yılda bir), kolorektal kanser için 50-70 yaşta iki yılda bir FIT (gaitada gizli kan) ya da 10 yılda bir kolonoskopi önerir; akciğer için yüksek riskli sigara içicilerinde (ör. 50 yaş üstü ve 20 paket-yıl üzerinde) düşük doz BT kullanılır. Taramaya özgü yanlılık kaynakları şunlardır: lead time bias (tanıyı öne çekmek yaşanan süreyi uzatır ama ölüm tarihini değiştirmez, sağkalım artışı yanılsaması yaratır), length time bias (yavaş seyirli lezyonlar taramada daha sık yakalanır) ve overdiagnosis (ömrü boyunca klinikleşmeyecek lezyonların gereksiz tedavi edilmesidir). PSA temelli prostat taraması rutin örgütlü program olarak önerilmez (bilgilendirilmiş bireysel karar), over, mide ve pankreas kanserlerinde ise etkin toplum taraması yoktur."
