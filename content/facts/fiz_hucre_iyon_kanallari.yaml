id: fiz_hucre_iyon_kanallari
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Voltaja Duyarlı Sodyum Kanalları"
taksonomi:
  - [ttbt, fizyoloji, fiz_hucre, fiz_hucre_iyon_kanallari]
metin: "Voltaja duyarlı sodyum kanallarının hem aktivasyon hem inaktivasyon kapısı vardır; aksiyon potansiyelinden sonra kanal kısa süreli inaktif duruma geçer ve bu durum mutlak refrakter dönemin temelini oluşturur. Tetrodotoksin aktivasyon kapısını dışarıdan bloke ederken lokal anestezikler kanalın iç tarafından inaktif duruma bağlanarak iletimi durdurur."
