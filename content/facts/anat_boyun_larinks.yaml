author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Larinks ve innervasyonu"
taksonomi:
  - [ttbt, anatomi, anat_boyun, anat_boyun_larinks]
metin: "Krikoid kıkırdak larinksin tamamını saran tek halkadır ve C6 düzeyinde bulunur; altında trakea başlar. Üst laringeal sinirin dış dalı yalnızca krikotiroid kasını innerve eder; kalan tüm iç laringeal kaslar rekurrent laringeal sinirle innerve edilir. Sol rekurrent laringeal sinir aort arkının altından, sağ sinir subklavyen arterin altından dönerek yukarı çıkar."
