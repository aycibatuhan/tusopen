sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Merokrin, Apokrin ve Holokrin Salgı"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_epitel, histo_epi_bez]
metin: "Merokrin salgıda hücre bütünlüğü korunarak salgı granülleri dışarı verilir; pankreas asiner hücreleri ve ekkrin ter bezleri bu türdendir. Apokrin salgıda hücre tepesi salgıyla birlikte kopar ve aksilla, meme ile kulak kiri bezlerinde görülür; holokrin salgıda hücre tümüyle yıkılarak salgıya dönüşür, örnek olarak sebase bez gösterilir."
