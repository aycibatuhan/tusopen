id: pat_inf_yara_iyilesmesi
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Doku Onarımı ve Yara İyileşmesi"
taksonomi:
  - [ttbt, patoloji, pat_inflamasyon, pat_inf_yara_iyilesmesi]
metin: "Birincil iyileşme kenarları birbirine yakın temiz yaralarda kısa sürede ve az skarla gerçekleşir; ikincil iyileşmede geniş doku kaybı granülasyon dokusu, yara kontraksiyonu ve yoğun skarla yavaş kapanır. Granülasyon dokusunda proliferatif fibroblastlar, yeni kılcal damarlar, ekstraselüler matriks ve iltihap hücreleri bulunur. Skar başlangıçta tip 3 kolajenden oluşur ve zamanla tip 1 kolajenle değişerek dayanım kazanır."
