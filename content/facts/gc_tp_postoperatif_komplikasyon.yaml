id: gc_tp_postoperatif_komplikasyon
version: 1
status: draft
author: "ai-drafts/cerrahi-facts"
sources:
  - "Cerrahi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Postoperatif Komplikasyonlar"
taksonomi:
  - [ktbt, genel_cerrahi, gc_temel_prensipler, gc_tp_postoperatif_komplikasyon]
metin: "Postoperatif ateşin zamanlaması tanıyı yönlendirir: ilk 48 saatte solunum komplikasyonları ve ağrıya bağlı hipoventilasyon (klasik öğreti atelektaziyi öne çıkarır; ateşle ilişkisinin kanıtı zayıftır), 3-5. günlerde idrar yolu enfeksiyonu, 5-7. günlerde yara enfeksiyonu, 5-10. günlerde derin ven trombozu ve anastomoz kaçağı akla gelir. Anastomoz kaçağı klasik olarak ameliyattan 5-7 gün sonra yeni başlayan ateş, taşikardi ve lokalize ağrıyla ortaya çıkar; fasial dehisans da 5-10. günlerde görülür ve drenajda artan seröz-pembe sıvı öncü işarettir. Paralitik ileus genellikle 3-5 günde çözülür; bu süreyi aşan ve gaz çıkışı olmayan hastada mekanik obstrüksiyon ile kaçağın dışlanması gerekir. Fasial dehisans riski enfeksiyon, malnütrisyon, obesite, kanser, steroid kullanımı, öksürük ve kusmayla artar. Yaşlı hastada ameliyat sonrası en sık nöropsikiyatrik komplikasyon deliryumdur ve derin ven trombozunu önlemek için düşük molekül ağırlıklı heparin profilaksisi erken başlanır."
