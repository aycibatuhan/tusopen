id: fiz_sol_ventilasyon_perfuzyon
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Ventilasyon-Perfüzyon Oranı"
taksonomi:
  - [ttbt, fizyoloji, fiz_solunum, fiz_sol_ventilasyon_perfuzyon]
metin: "Ayakta duran kişide perfüzyon bazal bölgelerde belirgin daha fazladır; bu nedenle ventilasyon-perfüzyon oranı apekste yüksek, bazda düşüktür ve akciğer genelinde ortalama 0,8 civarındadır. Ventilasyonu sıfırlanan bölgeler şant, perfüzyonu sıfırlanan bölgeler ölü boşluk diye adlandırılır ve şant oksijen tedavisine zayıf yanıt verir."
