metin: "Tay-Sachs hastalığında hekzosaminidaz A eksikliği GM2 gangliozidini biriktirir; retinada kiraz kırmızı nokta ve ilerleyici nörodejenerasyon görülür. Niemann-Pick hastalığında sfingomiyelinaz eksiktir ve hepatosplenomegaliyle sinir sistemi tutulumu birliktedir. Gaucher hastalığında glukoserebrozidaz eksikliği dalak ve kemik iliğinde buruşuk görünümlü makrofajlara yol açar; bu hastalık enzim replasman tedavisiyle kontrol altına alınabilen sfingolipidozdur."
