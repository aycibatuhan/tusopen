sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Bruton agamaglobulinemisi"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_immunoloji, mikro_imm_immun_yetmezlik]
metin: "Bruton agamaglobulinemisi X'e bağlı geçiş gösteren B hücre yetmezliğidir; tyrosine kinase (Btk) genindeki defekt nedeniyle olgun B lenfositler bulunmaz ve tüm immünoglobulin sınıfları azalır. Klinikte art arda tekrarlayan bakteriyel sinüsopulmoner ve bağırsak enfeksiyonları görülür; canlı aşılar önerilmez."
