id: biyok_enz_inhibisyon
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Enzim İnhibisyon Tipini Ayırt Eden İşaretler"
taksonomi:
  - [ttbt, biyokimya, biyok_enzimler, biyok_enz_inhibisyon]
metin: "Rekabetçi inhibisyonda inhibitör substratla aktif bölgeye yarışır; maksimum hız değişmezken Km artar ve yüksek substrat derişimi etkiyi yok edebilir. Rekabetçi olmayan inhibisyonda inhibitör enzimin allosterik bölgesine bağlanır; maksimum hız düşer, Km değişmeden kalır. Statinlerin HMG-KoA redüktazı, malonatın süksinat dehidrogenazı baskılaması ise klasik rekabetçi inhibisyon örneğidir."
