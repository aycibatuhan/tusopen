sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Alveol Hücreleri ve Surfaktan"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_solunum, histo_sol_alveol]
metin: "Tip I pneumositler alveol yüzeyinin büyük bölümünü döşeyen yassı hücrelerdir ve gaz değişimini kolaylaştırır. Tip II pneumositler lamellar cisimciklerindeki fosfolipid surfaktanı salgılar; surfaktan yüzey gerilimini düşürerek alveolün çökmesini önler."
