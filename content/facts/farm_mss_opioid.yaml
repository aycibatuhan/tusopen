metin: "Opioidler ağırlıkla mu reseptörü üzerinden analjezi ve solunum depresyonu yapar; kabızlığa tolerans gelişmezken solunum depresyonuna tolerans gelişir. Aşırı dozda naloksan mu reseptöründe rekabetçi antagonist olarak hızla etki eder ve etkisi kısa sürdüğü için yinelenen doz gerekebilir."
