author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Toxoplasma gondii tanı yaklaşımı"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_parazitoloji, mikro_par_toxoplasma]
metin: "Toxoplasma gondii'nin cinsel üremesi kedide olur; insanlar kistli et veya oosist bulaşmış su ve gıdalarla enfekte olur. Bağışıklığı sağlam kişilerde genelde belirtisizdir; gebelikte konjenital risk nedeniyle serum IgM ve IgG antikorları araştırılır, ileri immün yetmezlikte beyin apsesi gelişebilir."
