author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kollajenin Yapısal Kuralları"
taksonomi:
  - [ttbt, biyokimya, biyok_aminoasit_protein, biyok_aa_kollajen_elastin]
metin: "Kollajende her üçüncü amino asit glisindir ve üç sarmal bir araya gelerek üçlü helezon oluşturur; prolin ve lizin artıklarının hidroksilasyonu için C vitamini kofaktör gerekir. C vitamini eksikliğinde olgun kollajen yapılamaz ve tablo skorbutla sonuçlanır. Tip I kollajenin kusuru osteogenesis imperfecta, tip III kollajenin kusuru ise damar tipi Ehlers-Danlos sendromuyla ilişkilidir."
