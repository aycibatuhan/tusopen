id: mikro_dna_herpes
version: 1
status: draft
author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Herpesvirüslerde sinir gangliyonu latentliği"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_dna_viruslari, mikro_dna_herpes]
metin: "Herpesvirüsler çift iplikçikli DNA'lı zarflı virüslerdir; primer enfeksiyon sonrası duyusal sinir gangliyonlarında latens kurarlar. HSV-1 trigeminal, HSV-2 sakral gangliyonlarda latens yapar; VZV duyusal ganglionlarda yerleşir ve stres veya güneş maruziyetiyle reaktivasyon gösterir."
