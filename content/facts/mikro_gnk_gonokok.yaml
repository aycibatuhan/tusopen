sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Gonokok kültüründe seçici besiyeri"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_negatif_kok, mikro_gnk_gonokok]
metin: "Neisseria gonorrhoeae gram negatif diplokoktur; insan tek doğal konağıdır ve oksidaz pozitiftir. Nemliliğini hızla yitirdiği için örnek Thayer-Martin gibi seçici besiyerine ekilir ve karbondioksit oranı artırılmış ortamda inkübe edilir."
