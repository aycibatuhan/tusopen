metin: "Karpal tünelin tabanı karpal kemikler, çatısı fleksör retinakulumdur; içeride median sinirle birlikte 9 tendon (4 fleksör digitorum süperfisyalis, 4 fleksör digitorum profundus, fleksör pollicis longus) bulunur. Median sinir sıkışması ilk 3.5 parmakta parestezi ve tenar atrofi yapar; avuç içi deri korunur çünkü palmar kutanöz dal retinakulumun üstünden geçer. Ulnar sinir ve arter tünelin dışında, Guyon kanalından geçer."
