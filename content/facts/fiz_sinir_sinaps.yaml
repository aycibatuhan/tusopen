id: fiz_sinir_sinaps
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Sinaptik İletim Mekanizması"
taksonomi:
  - [ttbt, fizyoloji, fiz_sinir, fiz_sinir_sinaps]
metin: "Presinaptik terminale varan aksiyon potansiyeli voltaja duyarlı kalsiyum kanallarını açar; kalsiyum girişi sinaptik veziküllerin membranla kaynaşmasını ve nörotransmitter boşalmasını sağlar. Merkez sinir sisteminde en yaygın uyarıcı transmitter glutamat, en yaygın inhibitör transmitter GABA'dır."
