metin: Nonvalvüler atriyal fibrilasyon ve venöz tromboembolide doğrudan etkili oral antikoagülanlar (apiksaban, rivaroksaban, dabigatran, edoksaban) warfarine göre birinci sıradır; intrakraniyal kanamayı azaltır, rutin INR izlemi gerektirmez. Warfarin yalnızca mekanik kapak, orta-ileri romatizmal mitral stenoz ve antifosfolipid sendromda zorunludur; hedef INR atriyal fibrilasyon ve venöz tromboembolide 2-3, mekanik mitral kapakta 2,5-3,5 olup düşük doz aspirin eklenir. Ciddi kanamada warfarin için 4 faktörlü protrombin kompleks konsantresine K vitamini eklenir; K vitamini tek başına etkinliği düzeltmesi saatler sürdüğü için asla yeterli değildir. Dabigatranın özgül antidotu idarucizumabdır (5 g damar içi, RE-VERSE AD); Xa inhibitörlerinde andeksanet alfa kullanılır (ANNEXA-4). Özgül antidot ulaşılamazsa protrombin kompleks konsantresi veya aktive edilmiş protrombin kompleks konsantresi geri dönüş planıdır
