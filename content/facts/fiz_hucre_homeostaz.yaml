id: fiz_hucre_homeostaz
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Vücut Sıvı Bölümleri"
taksonomi:
  - [ttbt, fizyoloji, fiz_hucre, fiz_hucre_homeostaz]
metin: "Yetişkin erkekte toplam vücut suyu vücut ağırlığının yaklaşık yüzde 60'ıdır; bu suyun üçte ikisi hücre içi, üçte biri hücre dışı hacimdedir. Hücre dışı hacmin dörtte üçü dokular arası sıvı, dörtte biri plazmadır ve her iki bölümün ozmolalitesi yaklaşık 290 miliosmol kilogram başınadır."
