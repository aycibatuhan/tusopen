metin: "Mast hücreleri bağ dokusunun IgE aracılı aşırı duyarlılık reaksiyonlarında kilit hücreleridir. Granüllerinde histamin ve heparin taşır; akut alerjik ataklarda ve anafilakside degranülasyonla bu maddeleri salgılar."
