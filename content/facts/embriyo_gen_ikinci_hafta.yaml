id: embriyo_gen_ikinci_hafta
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Bilaminar Disk ve Trofoblast Özelleşmesi"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_genel, embriyo_gen_ikinci_hafta]
metin: "İkinci haftada embriyoblast iki katmana ayrılır; üst katman epiblast, alt katman hipoblast adını alır ve bu yapı bilaminar disk olarak tanımlanır. Aynı hafta amniyon boşluğu ile vitellüs kesesi belirir; trofoblast da sitotrofoblast ve sinsityotrofoblast olarak özelleşir."
