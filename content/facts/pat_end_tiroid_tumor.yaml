id: pat_end_tiroid_tumor
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tiroid Tümörleri"
taksonomi:
  - [ttbt, patoloji, pat_endokrin, pat_end_tiroid_tumor]
metin: "Papiller karsinom en sık tiroid malignitesidir; optik olarak boş görünen nükleuslar, nükleer oluklar ve psammom cisimleri karakteristik olup lenf yoluyla erken yayılır ama prognoz iyidir. Medüller karsinom parafolliküler C hücrelerinin nöroendokrin tümörüdür; kalsitonin salgısı ve amiloid stroması bulunur, RET mutasyonu ile MEN2A ve MEN2B sendromlarıyla ilişkilidir. Folliküler karsinom kan yoluyla metastaz yapma eğilimindedir; anaplastik karsinom ileri yaşta hızla büyüyen ve kötü prognozlu tümördür."
