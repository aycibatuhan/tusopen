sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antitiroid İlaç Seçimi"
taksonomi:
  - [ttbt, farmakoloji, farm_endokrin, farm_end_tiroid]
metin: "Tiyoyüre grubu tiroid peroksidazını inhibe ederek hormon sentezini durdurur; propiltiourasil ayrıca periferde T4'ün T3'e dönüşümünü azaltır ve gebeliğin ilk üç ayında tercih edilir. Metimazol daha uzun etkili olup gebeliğin ileri aylarında seçilir. Agranülositoz her iki ilacın ciddi yan etkisidir."
