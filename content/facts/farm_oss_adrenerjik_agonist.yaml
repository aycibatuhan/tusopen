version: 1
status: draft
author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Adrenalin ve Noradrenalin Farkı"
taksonomi:
  - [ttbt, farmakoloji, farm_otonom, farm_oss_adrenerjik_agonist]
metin: "Adrenalin alfa, beta 1 ve beta 2 reseptörlerini birlikte uyarır; düşük dozda beta 2 aracılı damar gevşemesi, yüksek dozda alfa aracılı damar daralması baskın hale gelir. Noradrenalin ağırlıkla alfa ve beta 1 reseptörlerini etkiler, dolayısıyla damar direncini artırır ve kalp hızı refleks olarak yavaşlayabilir."
