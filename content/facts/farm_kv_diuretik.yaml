sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Diüretik Gruplarının Farklı Yanıtları"
taksonomi:
  - [ttbt, farmakoloji, farm_kardiyovaskuler, farm_kv_diuretik]
metin: "Kıvrım diüretikleri Henle kıvrımının çıkan kalın kolundaki sodyum potasyum klorür taşıyıcısını bloke eder; güçlü etkiyle hipokalemi, metabolik alkalez ve kulak toksisitesi yapabilir. Tiyazidler distal tübülde çalışır ve kalsiyum geri emilimini artırarak hiperkalsemiye yol açar, bu yüzden kalsiyum taşı hastalarında koruyucu olabilir. Spironolakton aldosteron antagonistidir ve potasyumu tutar."
