metin: Sol koroner arter kısa sol ana (main) gövdeyle başlar ve ön inen arter (LAD, anterior interventriküler)
  ile sirkumfleks dallarına ayrılır; LAD ön interventriküler olukta apekse iner, septum ve sol ventrikül
  ön duvarını besler. Sirkumfleks koroner olukta sol tarafa dönerek sol marjinal dal verir. Sağ koroner
  arter sağ koroner olukta ilerleyerek sinüs ve AV düğüm dallarını verir; posterior inen arterin büyük
  çoğunlukla (%80) RCA'dan çıkması sağ dominant dolaşımı oluşturur.
