id: farm_km_antiretroviral
version: 1
status: draft
author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antiretroviral Kombinasyon Mantığı"
taksonomi:
  - [ttbt, farmakoloji, farm_kemoterapotik, farm_km_antiretroviral]
metin: "Antiretroviral tedavi tek ajanla yapılmaz; en az üç etken maddeyle kombinasyon tercih edilir ve direnç mutasyonları geciktirilir. Temel sınıflar ters transkriptaz inhibitörleri, proteaz inhibitörleri, integraz inhibitörleri ve giriş inhibitörleridir. Tedavi uyumu direnci önlemek için zorunludur."
