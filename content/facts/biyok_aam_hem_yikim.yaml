id: biyok_aam_hem_yikim
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Bilirubin Metabolizmasının Basamakları"
taksonomi:
  - [ttbt, biyokimya, biyok_aminoasit_metabolizma, biyok_aam_hem_yikim]
metin: "Yaşlanan eritrositlerden açığa çıkan hem, dalak makrofajlarında önce biliverdine sonra bilirubine çevrilir ve albümine bağlanarak karaciğere taşınır. Karaciğerde UDP-glukuronil transferaz bilirubini konjuge edip safraya atılabilir hale getirir; bu enzimin eksikliği Crigler-Najjar sendromunda şiddetli, Gilbert sendromunda hafif seyreden konjuge olmayan hiperbilirubinemi yapar. Bağırsaktaki bakteriyel dönüşüm ürobilinojeni oluşturur; ürobilinojenin idrarda artması hemolitik anemiye işaret eder."
