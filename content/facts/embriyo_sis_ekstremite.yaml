id: embriyo_sis_ekstremite
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Apikal Ektodermal Sırtın Görevi"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_sistem, embriyo_sis_ekstremite]
metin: "Ekstremite gelişimi, uzama yönünü belirleyen apikal ektodermal sırt adlı özel bir ektodermal yapı tarafından yönlendirilir. Bu yapı erken dönemde zarar görürse ekstremitenin distal kısmı gelişmez ve doğumsal eksiklik meydana gelir; talidomidin uzuv kısalığı mekanizması ise anti-anjiyojenik etkisiyle (kereblon-SALL4 yolu) ayrıdır."
