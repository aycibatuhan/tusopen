id: anat_art_diz
version: 1
status: draft
author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Diz eklemi yapıları"
taksonomi:
  - [ttbt, anatomi, anat_artroloji, anat_art_diz]
metin: "Ön çapraz ligament tibianın femur altında öne kaymasını, arka çapraz ligament geride kaymasını engeller. Medial menisküs C harfi biçiminde olup tibial kollateral ligamente yapışıktır; lateral menisküs daha yuvarlak ve MCLden bağımsızdır. Mutsuz üçlü (unhappy triad) aynı yaralanmada ACL, MCL ve medial menisküs hasarını birlikte tanımlar."
