sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Hücre İçi Birikimler"
taksonomi:
  - [ttbt, patoloji, pat_hucre_hasari, pat_hh_birikimler]
metin: "Lipofuskin uzun yaşamış hücrelerde perinükleer alanda biriken sarı-kahverengi, zararsız yaşlanma pigmentidir. Hemosiderin kronik kan yıkımında biriken ferritin pigmentidir, Prusya mavisi boyasıyla mavi görülür ve kalp yetmezliği hücrelerinde, akciğerde ve karaciğerde ağırlaşabilir. Alfa-1-antitripsin eksikliğinde hepatositlerde PAS pozitif granüller birikir; Wilson hastalığında bakır karaciğerde ve korneada depolanır."
