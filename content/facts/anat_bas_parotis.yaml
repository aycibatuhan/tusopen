ad: "Parotis bezi"
taksonomi:
  - [ttbt, anatomi, anat_bas, anat_bas_parotis]
metin: "Parotis kanalı (Stensen) üst 2. büyük azı dişinin karşısındaki mukozaya açılır. Bez içinde yapılar dıştan içe sırayla fasial sinir (VII), retromandibular ven ve dış karotis arterdir; bu yüzden parotis cerrahisinde fasial sinir korunmalıdır. Parotisin parasempatik sekretomotor lifleri IX. sinirle taşınır, otik ganglionda sinaps yapar ve aurikulotemporal sinirle beze ulaşır."
