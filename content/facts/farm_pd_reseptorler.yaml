metin: "İyon kanalına bağlı reseptörler milisaniyeler içinde yanıt üretir ve sinir-kas iletiminde çalışır; G-proteine bağlı reseptörler saniyeler mertebesinde ikinci haberci kaskadını başlatır. Steroid ve tiroid hormonları hücre içi reseptörlere bağlanıp gen ifadesini değiştirdiği için etkileri saatler ya da günler sonra görülür."
