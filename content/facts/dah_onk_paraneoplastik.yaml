version: 1
status: draft
author: "ai-drafts/gaps-onkoloji-anestezi"
sources:
  - "Tıbbi onkoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Paraneoplastik Sendromlar"
taksonomi:
  - [ktbt, dahiliye, dah_onkoloji, dah_onk_paraneoplastik]
metin: "Paraneoplastik sendromlar, tümörün direkt yayılımı ya da metastazıyla açıklanamayan, tümörün biyolojik aktif maddeler salgılaması veya tümör antijenlerine karşı gelişen immün çapraz reaktiviteyle oluşan sistemik belirtilerdir; kanser hastalarının yaklaşık %10'unda görülür ve bazen primer tümörden yıllar önce tanıyı düşündürür. Endokrin grupta SIADH (hiponatremi) ve ektopik ACTH (Cushing) en sık küçük hücreli akciğerde, PTHrP'ye bağlı humoral hiperkalsemi ise skuamöz hücreli akciğer, baş-boyun, idrar yolu ve over karsinomlarında öne çıkar; böbrek hücreli ve hepatosellüler karsinomda EPO'ya bağlı polisitemi, mukin salgılayan adenokarsinomlarda (pankreas, mide) ise Trousseau sendromu (migratör venöz tromboz) ve DIC tipiktir. Nörolojik grupta anti-VGCC'ye bağlı Lambert-Eaton miyastenik sendrom (proksimal güçsüzlük ve otonomik bulgular, küçük hücreli akciğer), anti-Yo ile subakut serebellar dejenerasyon (over), anti-Hu ile limbik ensefalit (küçük hücreli akciğer) klasik örneklerdir. Dermatolojik sendromlar akantozis nigrikans (mide, akciğer), 60 yaş üstünde yeni ortaya çıkan dermatomiyozit, akut miyeloid lösemide Sweet sendromu ve hızla yayılan seboreik keratozlarla seyreden Leser-Trélat işaretidir; akciğerde hipertrofik pulmoner osteoartropati (çomak parmak, periost reaksiyonu, eklem ağrısı) unutulmamalıdır. Tedavinin temeli altta yatan tümörün tedavisidir; hiperkalsemide bisfosfonat/denosumab, immün aracılı nörolojik sendromlarda kortikosteroid, IVIG ve plazmaferez gibi immünmodülatör yaklaşımlar eklenir."
