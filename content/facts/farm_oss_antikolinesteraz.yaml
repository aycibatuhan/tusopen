sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Organofosfat Zehirlenmesi Tedavisi"
taksonomi:
  - [ttbt, farmakoloji, farm_otonom, farm_oss_antikolinesteraz]
metin: "Organofosfat bileşikleri asetilkolinesterazı kalıcı biçimde fosforilleyerek enzimi işlevsiz bırakır; sonuçta sinapslarda asetilkolin birikir ve muskarinik ile nikotinik bulgular bir arada görülür. Tedavide aşırı asetilkolin etkisini tersine çevirmek için atropin, enzimi yeniden aktifleştirmek için pralidoksim gibi oksimler kullanılır."
