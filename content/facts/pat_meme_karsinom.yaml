id: pat_meme_karsinom
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Meme Karsinomu"
taksonomi:
  - [ttbt, patoloji, pat_meme, pat_meme_karsinom]
metin: "İnvaziv duktal karsinom, non-özel tip grubu, meme kanserlerinin en sık histolojik tipidir. Moleküler profilde östrojen ve progesteron reseptör pozitifliği, HER2 amplifikasyonu ve üçlü negatif (bazal benzeri) grup ayrımı tedavi ile prognozu belirler; üçlü negatif grupta en sık mutasyon TP53'tür ve BRCA1 mutasyon taşıyıcılarında bu grup sık görülür. İnvaziv lobüler karsinom E-kadherin kaybıyla hücrelerin tek sıra dizilişiyle karakterizedir ve bilateral olabilir."
