version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Portal Üçlünün Bileşenleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_sindirim, histo_sind_karaciger]
metin: "Karaciğer lobülünün köşelerinde yer alan portal üçlü: porta venülden gelen besin açısından zengin kan, hepatik arterden gelen oksijenli kan ve safra kanalcığından oluşur. Kan sinusoidlerde sentral vene doğru akarken safra ters yönde lobülden dışarıya taşınır."
