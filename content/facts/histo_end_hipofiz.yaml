id: histo_end_hipofiz
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Hipofiz Ön ve Arka Lobu Farkı"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_endokrin, histo_end_hipofiz]
metin: "Ön lob olan adenohipofiz ağız tabanı ektoderminin bir çıkıntısından gelişir; hormon salgılayan hücre kordlarından oluşur ve ACTH, TSH, GH gibi hormonları üretir. Arka lob olan nörohipofiz beyinden uzanan sinir aksonlarından oluşur; oksitosin ve antidiüretik hormon burada depolanır ve salgılanır."
