ad: "Serviks Patolojisi"
taksonomi:
  - [ttbt, patoloji, pat_kadin_genital, pat_kg_serviks]
metin: "Servikal intraepitelyal neoplazi ve invaziv skuamöz karsinomun büyük çoğunluğu insan papilloma virüsü enfeksiyonuna bağlıdır; tip 16 ve 18 en sık onkojenik tiplerdir. Virüsün E6 proteini p53'ü, E7 proteini ise RB genini inaktive ederek epitel proliferasyonunu sağlar. Skuamokolonar kavşak (transformasyon bölgesi) lezyonların en sık geliştiği alandır ve Pap taramasında bu bölge örneklenir."
