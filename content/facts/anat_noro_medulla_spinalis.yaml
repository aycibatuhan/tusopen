author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Medulla spinalis yolları"
taksonomi:
  - [ttbt, anatomi, anat_noroanatomi, anat_noro_medulla_spinalis]
metin: "Arka kord yolları ince dokunma, vibrasyon ve propriosepsiyonu taşır ve medulla düzeyinde çaprazlar; spinothalamik yol ağrı ve sıcaklığı taşır, girdiği segmentte ön beyaz komissürden karşıya geçer. Lateral kortikospinal yol istemli motoru taşır ve medulladaki piramit deküsatasyonuyla karşı tarafa geçer. Yetişkinde medulla spinalis L1-L2 düzeyinde sonlanır; altında kauda equina kökleri bulunur."
