author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Akciğer Tümörleri"
taksonomi:
  - [ttbt, patoloji, pat_akciger, pat_akc_tumorler]
metin: "Küçük hücreli akciğer karsinomu hızla büyüyen ve erken metastaz yapan nöroendokrin bir tümördür; ACTH ve ADH salgılaması ile Lambert-Eaton miyastenik sendrom gibi paraneoplastik bulgular üretir ve tedavisi cerrahi dışı kemoterapiye dayanır. Küçük hücreli olmayan grupta adenokarsinom en sık alt tip olup periferik yerleşimli, kadınlar ve sigara içmeyenlerde daha sıktır. Skuamöz hücreli karsinom merkezî yerleşimli, sigarayla güçlü ilişkili ve PTHrP salgılanmasına bağlı hiperkalsemi yapabilir."
