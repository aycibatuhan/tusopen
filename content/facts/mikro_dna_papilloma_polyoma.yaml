sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "HPV onkoproteinleri ve aşı kapsamı"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_dna_viruslari, mikro_dna_papilloma_polyoma]
metin: "Papillomavirüs çift iplikçikli dairesel DNA'lı zarfsız virüstür; E6 ve E7 onkoproteinleri p53 ile Rb proteinlerini inaktive ederek serviks kanserine zemin hazırlar. Yüksek riskli tipler 16 ve 18'dir; dörtlü aşı tip 6, 11, 16 ve 18'e karşı koruma sağlar."
