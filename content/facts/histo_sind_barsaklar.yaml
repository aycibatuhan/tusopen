author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "İnce Bağırsak Villüs ve Kripta Hücreleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_sindirim, histo_sind_barsaklar]
metin: "İnce bağırsakta emilim villüs yüzeyindeki enterositlerce yapılır; kriptalar hücre yenilenmesi bölgesidir. Kripta tabanındaki Paneth hücreleri lizozim ve defenzin salgılayarak doğal bağışıklığa katkı sağlar; goblet hücreleri mukus üretir."
