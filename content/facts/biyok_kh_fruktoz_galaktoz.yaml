id: biyok_kh_fruktoz_galaktoz
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Herediter Fruktoz İntoleransı ve Galaktozemi"
taksonomi:
  - [ttbt, biyokimya, biyok_karbonhidrat, biyok_kh_fruktoz_galaktoz]
metin: "Aldolaz B eksikliği fruktoz-1-fosfatı karaciğerde biriktirerek fruktoz alımı sonrası ciddi hipoglisemi ve karaciğer hasarı yapar; tedavi fruktoz ve sukrozdan kaçınmadır. Klasik galaktozemi, galaktoz-1-fosfat üridiltransferaz eksikliğidir; süt kesilmezse katarakt, karaciğer sirozu ve gelişme geriliğiyle ilerler. Galaktozemide biriken galaktitol lensi hasarlayarak katarakta yol açar."
