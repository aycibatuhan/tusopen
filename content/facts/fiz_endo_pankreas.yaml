id: fiz_endo_pankreas
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Pankreas Adacık Hücreleri"
taksonomi:
  - [ttbt, fizyoloji, fiz_endokrin, fiz_endo_pankreas]
metin: "Langerhans adacıklarının beta hücreleri insülin salgılar ve glukozun kas ile yağ dokusuna alımını GLUT4 taşıyıcısının hücre yüzeyine taşınmasıyla hızlandırır. Alfa hücreler hipoglisemide glukagon salgılayarak karaciğer glikojenolizi ve glukoneojenezi uyarır; delta hücrelerinin somatostatini ise her iki hormonun salgısını baskılar."
