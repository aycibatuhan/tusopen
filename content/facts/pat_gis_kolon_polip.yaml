ad: "Kolon Polipleri ve Polipozis Sendromları"
taksonomi:
  - [ttbt, patoloji, pat_gis, pat_gis_kolon_polip]
metin: "Tübüler adenom en sık adenomatöz polip tipidir; villöz bileşen arttıkça malign transformasyon riski yükselir ve villöz adenomlarda potasyum ile protein kaybı görülebilir. Ailevi adenomatöz polipozis (FAP) APC gen mutasyonuna bağlı otozomal dominant hastalıktır; yüz ve üzeri (binlerce olabilir) adenom vardır ve kolorektal karsinom neredeyse kaçınılmazdır. Gardner sendromu FAP tablosuna osteom, epidermoid kist ve desmoid tümör ekler; Turcot sendromu ise medüloblastomla birlikte görülür. Peutz-Jeghers sendromunda hamartomatöz poliplerle birlikte dudak ve ağız mukozasında melanin pigmentli lekeler bulunur."
