ad: Aorta abdominalis ve dalları
taksonomi:
- - ttbt
  - anatomi
  - anat_abdomen
  - anat_abd_aorta_dallari
metin: Aorta abdominalis L4 düzeyinde sağ ve sol common iliac arterlere bifurke olur; dalları ventral
  (sindirim kanalı), çift lateral (ürogenital ve böbrekler) ve posterior duvar dalları olarak sınıflanır.
  Ventral dallar çeliac trunk (T12), a. mesenterica superior (L1) ve a. mesenterica inferior (L3)'tür.
  Onikiparmak bağırsağın üçüncü kısmı a. mesenterica superiorun arkasından geçer; SMA sendromunda (Wilkie
  sendromu) duodenum, aorta ile SMA arasında sıkışır.
