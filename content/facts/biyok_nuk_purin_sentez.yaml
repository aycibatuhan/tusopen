id: biyok_nuk_purin_sentez
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Pürin Sentezinde Anahtar Adımlar"
taksonomi:
  - [ttbt, biyokimya, biyok_nukleotid, biyok_nuk_purin_sentez]
metin: "PRPP amidotransferaz, de novo pürin sentezinin hız kısıtlayıcı enzimidir; üretim IMP molekülünden AMP ve GMP'ye dallanır. Pürin yıkımı hipoksantin üzerinden ksantine, ksantin oksidazın etkisiyle ürik asite ulaşır. Hipoksantin-guanin fosforiboziltransferazın eksikliği geri dönüşüm yolunu çökertir ve tablo Lesch-Nyhan sendromuyla kendini gösterir."
