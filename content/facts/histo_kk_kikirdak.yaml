author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Hialin Kıkırdak Matriksi ve Beslenmesi"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_kikirdak_kemik, histo_kk_kikirdak]
metin: "Hialin kıkırdak vücutta en yaygın kıkırdak tipidir; matriksi tip II kolajen ve suyu güçlü tutan agregkan adlı proteoglikan bakımından zengindir. Kondrositler lakün adlı boşluklarda yer alır ve kıkırdak damarsız olduğundan beslenmesini perikondriyumdan difüzyonla sağlar."
