metin: Proksimal kıvrımlı tübül hücreleri uzun mikrovillüslerle örtülü fırça kenarlı, mitokondri bakımından
  zengin hücrelerdir. Süzülen plazmanın en büyük bölümü burada geri emilir; glukoz, amino asit, bikarbonat
  ve sodyum bu segmentte yeniden kana döner.
