id: biyok_kh_glikojen
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Glikojen Depo Hastalıklarında Ayırt Edici Enzimler"
taksonomi:
  - [ttbt, biyokimya, biyok_karbonhidrat, biyok_kh_glikojen]
metin: "Glikojen yıkımının hız kısıtlayıcı enzimi glikojen fosforilazdır; sentez yönünü glikojen sentaz, dallanmayı ise dallanma enzimi üstlenir. Kas fosforilaz eksikliği McArdle hastalığıdır ve eforla kramp, idrarda miyoglobin atılımı görülür. Lizozomal alfa glukozidaz eksikliği Pompe hastalığında kardiyomegalinin öne çıktığı tablo yapar; debranching enzim eksikliği Cori, branching enzim eksikliği ise Andersen hastalığıdır ve ilerleyici karaciğer sirozuyla seyreder."
