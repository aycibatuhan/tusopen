id: kd_gf_antikoag_gebelik
version: 1
status: draft
author: ai-drafts/kadin-dogum-antikoagulasyon
sources:
- CHEST 2016 Antitrombotik Tedavi ve VTE Rehberi (Bates ve ark.) ve RCOG gebelikte tromboz yönetimi rehberi — referans olarak listelendi, metin projesi özgün yazımdır
- ASH venöz tromboemboli rehberleri gebelik bölümü — referans olarak listelendi
ad: Gebelikte Antikoagülasyon
taksonomi:
