  - kd_gf_gebelikte_ilac
metin: Gebelikte venöz tromboemboli tedavisi ve profilaksisinde düşük molekül ağırlıklı heparin seçenektir; plasentayı geçmez ve fetusa zarar vermez. Warfarin plasentayı geçer ve teratojendir; 6-12. gebelik haftaları arasındaki maruziyet fetal warfarin sendromu (nazal hipoplazi, nokta kemikli epifizler, uzuv anomalileri) riskini en çok bu dönemde taşır ve gebelik boyunca artmış fetal kanama riski yaratır. Doğrudan etkili oral antikoagülanlar gebelikte önerilmez. Doğum yaklaştığında damar yoluyla fraksiyone olmamış heparine geçilir, bölgesel anestezi öncesi kesme aralıklarına uyulur; emzirme döneminde warfarin ve heparinler güvenle kullanılabilir
