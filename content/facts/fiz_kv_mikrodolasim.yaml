sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kapiller Sıvı Dengesi"
taksonomi:
  - [ttbt, fizyoloji, fiz_kardiyovaskuler, fiz_kv_mikrodolasim]
metin: "Kapiller duvarda net sıvı hareketini kapiller hidrostatik basınç dışa, plazma onkotik basınç içe doğru etkiler; sağlıklı koşullarda hafif fazla filtrelenen sıvı lenfatikler yoluyla dolaşıma döner. Kapiller hidrostatik basıncın artması, plazma proteinlerinin azalması veya lenf drenajının engellenmesi ödeme yol açar."
