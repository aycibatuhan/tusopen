ad: "Salmonella tanısında H2S üretimi"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_negatif_basil, mikro_gnb_salmonella]
metin: "Salmonella türleri laktoz fermente etmeyen enterobakterilerdir; seçici besiyerlerinde hidrojen sülfür üretimiyle siyah merkezli koloniler oluşturur. Kligler demir agarda eğimde alkali, dip kısımda asit reaksiyonu ve gaz ile birlikte H2S pozitifliği tipiktir; O ve H antijenlerine dayalı serotiplendirme tanıyı tamamlar."
