  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antitüberküloz Yan Etki İşaretleri"
taksonomi:
  - [ttbt, farmakoloji, farm_kemoterapotik, farm_km_antituberkuloz]
metin: "İzoniazid periferal nöropati yapabilir ve piridoksin verilmesiyle önlenir; rifampisin vücut sıvılarını turuncu boyar ve P450 uyarıcısıdır. Pirazinamid hiperürisemi, etambutol ise renk ayrımı bozukluğuyla seyreden optik nöropati yapar. Karaciğer toksisitesi birkaç ilaçta ortak olarak izlenmelidir."
