version: 1
status: draft
author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Anatomik düzlemler ve pozisyon"
taksonomi:
  - [ttbt, anatomi, anat_genel, anat_genel_terminoloji]
metin: "Anatomik pozisyonda kollar yanlarda ve avuçlar öne bakar; bu yüzden önkolda radius dışta, ulna içta kabul edilir. Sagital düzlem vücudu sağ ve sol yarıya, koronal düzlem ön ve arka bölüme, transvers düzlem ise üst ve alt bölümlere ayırır. Proksimal, uzvun gövdeye yakın kısmını; distal ise gövdeden uzak kısmını tanımlar."
