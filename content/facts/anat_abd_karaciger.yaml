sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Karaciğer segmentleri ve porta hepatis"
taksonomi:
  - [ttbt, anatomi, anat_abdomen, anat_abd_karaciger]
metin: "Karaciğer segmentasyonu (Couinaud) portal triad dağılımına göre 8 segment tanımlar; falciform ligament sol lobu medial ve lateral bölgeye ayırır. Porta hepatis bölgesine portal ven en arkada, onun önünde hepatic arter ve koledok girer. Safra kesesi fundusu 9. kosta kıkırdak düzeyinde, rectus abdominis dış kenarı ile kesişim noktasındadır."
