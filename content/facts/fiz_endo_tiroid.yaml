id: fiz_endo_tiroid
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tiroid Hormon Sentezi"
taksonomi:
  - [ttbt, fizyoloji, fiz_endokrin, fiz_endo_tiroid]
metin: "Foliküler hücreler tiroglobulin ve iyot kullanarak ağırlıklı olarak T4 üretir; T3 daha az salgılanır ama reseptörde yaklaşık üç dört kat daha etkili ve daha hızlı etki gösterir. Günlük iyot gereksinimi yaklaşık 150 mikrogramdır; ani yüksek iyot yüklenmesi geçici hormon sentez baskılanmasına yol açar ve buna Wolff-Chaikoff etkisi denir."
