ad: Akciğer lobları ve bronş ağacı
taksonomi:
- - ttbt
  - anatomi
  - anat_toraks
  - anat_tor_akciger
metin: Sağ akciğer üç lob (üst, orta, alt) ve iki fissuralı (oblik + yatay), sol akciğer iki lob (üst,
  alt) ve tek oblik fissuralıdır; sol üst lobun altında kardiyak notch ve lingula yer alır. Sağ ana bronş
  kısa, geniş ve daha dik seyirlidir; yabancı cisim aspirasyonu bu nedenle daha sık sağ ana bronşa düşer.
  Ana bronşlar hilusta lobar, bunlar da segmental (üçüncül) bronşlara ayrılır; her bronkopulmoner segment
  kendi bronşu ve pulmoner damar dalıyla bağımsız cerrahi birimdir.
