sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Orbita girişleri ve göz kasları"
taksonomi:
  - [ttbt, anatomi, anat_bas, anat_bas_orbita]
metin: "Optik kanaldan optik sinir ve oftalmik arter; superior orbital fissureden III, IV, VI ve V1 sinirleri orbitaya girer. Göz kaslarından yalnızca superior oblik (IV) ve lateral rektus (VI) farklı sinirlerle innerve edilir; kalan tüm ekstraoküler kaslar ve levator palpebra superioris III. sinirle innerve edilir. Superior oblik kas tendonu troklea adı verilen fibrokıkırdak halkadan geçer."
