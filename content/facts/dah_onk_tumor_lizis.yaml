id: dah_onk_tumor_lizis
version: 1
status: draft
author: "ai-drafts/gaps-onkoloji-anestezi"
sources:
  - "Tıbbi onkoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tümör Lizis Sendromu"
taksonomi:
  - [ktbt, dahiliye, dah_onkoloji, dah_onk_tumor_lizis]
metin: "Tümör lizis sendromu, büyük hücre kütleli ve kemoterapiye duyarlı tümörlerde (Burkitt lenfoma, akut lenfoblastik lösemi, yüksek hücre sayılı agresif lenfomalar) tedavi başlangıcından 12-72 saat sonra ya da kendiliğinden gelişen kitlesel hücre yıkımıyla ortaya çıkan metabolik acildir. Yıkılan hücrelerden serbest kalan potasyum, fosfat ve nükleoproteinler (pürin → hipoksantin → ksantin → ürik asit) kanda birikir: hiperkalemi (kas krampları, sivri T dalgası, ventriküler aritmiler), hiperfosfatemi ve buna bağlı kalsiyum-fosfat çökelmesiyle hipokalsemi (tetani, konvülsiyon, Chvostek-Trousseau işaretleri) ile hiperürisemi (toplayıcı kanallarda ürat kristali çökelmesi, oligürik akut böbrek hasarı) gelişir. Laboratuvar tanı eşiği: potasyum >6 mEq/L, fosfor erişkinde 6,5 mg/dL ve üzeri (Cairo-Bishop; pediatrik eşik 4,5'tür), kalsiyum <7 mg/dL ve ürik asit >8 mg/dL ya da bazal değere göre %25 oranında değişim — bu değerlerden en az ikisinin varlığı laboratuvar TLS sayılır, akut böbrek hasarı eklenirse klinik TLS söz konusudur. Yüksek riskli hastada profilaksi tedaviden 24-48 saat önce başlar: yoğun serum fizyolojik hidrasyonu (3 L/m²/gün), ksantin oksidaz inhibitörü allopurinol ya da en yüksek risk grubunda rekombinant ürat oksidaz rasburikaz ve potasyum-fosfat kısıtlı diyet; idrar alkalinizasyonu önerilmez çünkü kalsiyum-fosfat çökelmesini artırır. Tedavide rasburikaz, hidrasyon, elektrolit düzeltmeleri ve potasyum-fosfat bağlayıcıları kullanılır; dirençli hiperkalemi, hızla ilerleyen böbrek yetmezliği ya da volüm yüklenmesinde diyaliz devreye girer."
