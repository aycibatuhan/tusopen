metin: "Tokyo Guidelines 2018 (TG18) akut kolanjitte en ağır tabloyu (Grade III) en az bir organ
  disfonksiyonu olarak tanımlar: noradrenalin ya da dopamin gerektiren hipotansiyon, bilinç
  bozukluğu, PaO2/FiO2 oranının 300 altı, kreatinin 2 mg/dL üstü, PT-INR 1.5 üstü veya trombosit
  sayısının 100.000 altı. Orta şiddet (Grade II) şu beş kriterden ikisinin bulunmasıdır: lökosit
  12.000 üstü veya 4.000 altı, ateş 39 derece üstü, yaş 75 üstü, total bilirubin 5 mg/dL üstü ve
  albümin 3 g/dL altı; hiçbirini karşılamayan olgu Grade I sayılır. Drenaj zamanlaması şiddete göre
  belirlenir — Grade III olguda organ desteğiyle birlikte acil biliyer drenaj, Grade II olguda
  antibiyotikle birlikte 24-48 saat içinde erken drenaj önerilir ve büyük veri analizinde erken
  drenajın Grade II olguda 30 günlük mortaliteyi anlamlı düşürdüğü gösterilmiştir; Grade I olguda
  önce antibiyotik ve destek tedavisi yeterlidir, yanıt yoksa drenaja geçilir ve drenajın ilk
  yöntemi ERCP, yapılamadığında perkütan transhepatik drenajdır. Akut kolesistitte Grade III aynı
  organ disfonksiyonu tanımını kullanır; Grade II lökosit 18.000 üstü, palpe edilen hassas sağ üst
  kitle, semptom süresinin 72 saati aşması veya belirgin lokal inflamasyon (gangrenöz, emfüzematoz
  kolesistit, perikolesistik abse) koşullarından biriyle tanımlanır, bunları karşılamayan sağlıklı
  hasta Grade I olup cerrahiye uygunsa (Charlson indeksi 5 altı, ASA 1-2) erken laparoskopik
  kolesistektomi uygulanır. Cerrahi yüksek riskli Grade II-III kolesistitte perkütan safra kesesi
  drenajı (PTGBD) ilk alternatiftir ve genel durum düzelince ertelenmiş kolesistektomi planlanır."
