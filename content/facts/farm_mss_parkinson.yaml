sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Levodopa ve Karbidopa Kombinasyonu"
taksonomi:
  - [ttbt, farmakoloji, farm_mss, farm_mss_parkinson]
metin: "Levodopa kan-beyin bariyerini geçtikten sonra dopamin üretimine dönüşür; periferik dekarboksilaz inhibitörü karbidopa ile kombine edildiğinde beyne ulaşan miktar artar ve bulantı azalır. Uzun süreli tedavide etki dalgalanması ve istemsiz hareketler gelişir. Selejilin gibi monoamin oksidaz B inhibitörleri dopamin yıkımını yavaşlatır."
