sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tromboz"
taksonomi:
  - [ttbt, patoloji, pat_hemodinamik, pat_hem_tromboz]
metin: "Virchow üçlüsü trombozun üç temel nedenini anlatır: endotel hasarı, kan akımında staz veya türbülans ve hiperkoagülanlık. Arteriyel tromboz aterosklerotik plak rüptürü gibi endotel hasarı sonrası gelişir ve trombosit-fibrinden zengindir; venöz tromboz ise ağırlıkla staza bağlıdır ve eritrosit-fibrinden zengin klot şeklinde uzanır. Mikroskopide trombosit-fibrin ve eritrosit katmanlarının ardışık dizilimi olan Zahn çizgileri trombun karakteristik izidir."
