metin: "Eritrositler yaklaşık 7.5 mikron çapında, çift çukurlu ve çekirdeksiz hücrelerdir; sitoplazmaları hemoglobinle doludur ve organelleri bulunmaz. Zar proteinleri ABO ve Rh kan gruplarında kullanılan antijenik yapıları taşır."
