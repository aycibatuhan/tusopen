sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Önemli Antidot Eşleşmeleri"
taksonomi:
  - [ttbt, farmakoloji, farm_toksikoloji, farm_tok_antidotlar]
metin: "N-asetilsistein glutatyon depolarını yenileyerek parasetamol karaciğer toksisitesini önler; fomepizol alkol dehidrojenazını bloke ederek metanolün toksik metabolit oluşumunu durdurur. Opioid aşırı dozunda naloksan, benzodiyazepin aşırı dozunda flumazenil, demir zehirlenmesinde deferoksamin kullanılır."
