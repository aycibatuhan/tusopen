  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Benzodiyazepin ve Barbitürat Farkı"
taksonomi:
  - [ttbt, farmakoloji, farm_mss, farm_mss_sedatif_hipnotik]
metin: "Benzodiyazepinler GABA-A reseptörünün ayrı bir bölgesine bağlanarak GABA'ya bağlı klorür kanalı açılma sıklığını artırır; terapötik aralığı geniştir ve flumazenil spesifik antidottur. Barbitüratlar ise kanalın açılma süresini uzatarak doza bağlı solunum depresyonu riski taşır."
