id: fiz_kan_eritrosit
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Eritrosit Ömrü ve Eritropoez"
taksonomi:
  - [ttbt, fizyoloji, fiz_kan, fiz_kan_eritrosit]
metin: "Eritrositler dolaşımda yaklaşık 120 gün yaşar ve sonunda dalak ile karaciğer makrofajları tarafından parçalanır. Doku hipoksisine yanıt olarak böbreğin peritübüler interstisyel hücreleri eritropoietin salgılar; bu hormon kemik iliğinde kırmızı hücre üretimini uyarır."
