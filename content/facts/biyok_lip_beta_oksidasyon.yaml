id: biyok_lip_beta_oksidasyon
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Yağ Asidi Oksidasyonunun Giriş Kapısı"
taksonomi:
  - [ttbt, biyokimya, biyok_lipid, biyok_lip_beta_oksidasyon]
metin: "Uzun zincirli yağ asitleri mitokondriyal zarı karnitin taşıyıcısıyla geçer; bu adımdaki CPT-1 enzimi malonil-CoA ile baskılanarak sentez ve yıkımın aynı anda çalışması engellenir. Her oksidasyon turu bir asetil-KoA, bir NADH ve bir FADH2 çıkarır. Orta zincirli asil-KoA dehidrojenaz eksikliği açlıkta hipoketotik hipoglisemiyle kendini gösterir ve açlık sonrası ani ölüm riski taşır."
