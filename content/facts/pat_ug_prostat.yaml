metin: "Prostat adenokarsinomu ağırlıkla periferik zonda kaynaklanır ve rektal muayenede taş sertliğinde hissedilir; mikroskopide küçük ve sıkışık glandüler yapılar, belirgin nükleol ve perineural invazyon tipiktir. Derecelendirme, en sık görülen iki doku desenindeki puanların toplamı olan Gleason skoru ile yapılır. Metastazlar en sık lomber vertebralara osteoblastik lezyonlar yapar ve takipte serum PSA ile asit fosfataz kullanılır."
