metin: Brakial pleksus C5-T1 köklerinden kurulur; C5-C6 üst gövde yaralanması Erb-Duchenne palsisi yapar
  ve kolu bekçi pozisyonuna sokar (omuz iç rotasyonda ve addükte, dirsek ekstansiyonda, önkol pronasyonda,
  el bileği fleksiyonda). C8-T1 alt gövde yaralanması Klumpke palsisiyle pençe elde sonuçlanır; T1 kökü
  zarar görürse Horner sendromu eklenir. Terminal dalları muskulokutanöz, aksiller, radial, median ve
  ulnar sinirlerdir.
