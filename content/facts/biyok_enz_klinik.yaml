id: biyok_enz_klinik
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tanıda Kullanılan Serum Enzimleri"
taksonomi:
  - [ttbt, biyokimya, biyok_enzimler, biyok_enz_klinik]
metin: "Karaciğer hasarında ALT hepatosellüler ölüme en özgün enzimdir; AST değerinin ALT'tan belirgin yüksek olduğu tablo alkolik karaciğer hastalığını düşündürür. Miyokard infarktüsünde özgünlükte troponinler öndedir; CK-MB'nin daha erken normalleşmesi reinfarkt ayırımında kullanılır. Akut pankreatitte amilaz ve özellikle lipaz yükselir; makroamilazemide amilaz makromoleküllere bağlandığı için böbrekten atılamaz ve idrar amilazı düşük kalır."
