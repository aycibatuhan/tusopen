ad: Diyafram açıklıkları
taksonomi:
- - ttbt
  - anatomi
  - anat_toraks
  - anat_tor_diyafram
metin: Diyafram frenik sinir (C3, C4, C5) ile innerve edilir; C4'ün üzerindeki lezyonlarda diyafram solunumunu
  kaybeder (frenik C3-C5). Aortik açıklık T12 düzeyindedir ve aorta ile torasik duktusu geçirir; özofageal
  açıklık T10 düzeyindedir ve özofagus ile vagal gövdeleri geçirir. Vena kava açıklığı T8 düzeyinde sentral
  tendon içindedir ve alt vena kava ile sağ frenik siniri geçirir.
