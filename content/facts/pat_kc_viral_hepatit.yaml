ad: "Viral Hepatitler"
taksonomi:
  - [ttbt, patoloji, pat_karaciger_safra, pat_kc_viral_hepatit]
metin: "Hepatit B'de karaciğer hasarı ağırlıkla immünolojiktir; yüzey antijen pozitifliği taşıyıcılığı, yüzey antijenine karşı antikor pozitifliği bağışıklığı ve çekirdek antijenine karşı IgM pozitifliği yeni enfeksiyonu gösterir; e antijeni yüksek infektiviteyi işaret eder. Hepatit C yüksek oranda kronikleşir ve portal alanlarda lenfosit toplulukları ile steatoz karakteristiktir. Hepatit D hepatit B virüsünün varlığına gereksinim duyar ve fulminan seyir riskini artırır; hepatit E gebelerde fulminan seyredebilir."
