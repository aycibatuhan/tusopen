ad: "Kortikosteroid Uzun Dönem Riski"
taksonomi:
  - [ttbt, farmakoloji, farm_endokrin, farm_end_kortikosteroid]
metin: "Glukokortikoidler hücre içi reseptöre bağlanarak gen ifadesini değiştirir ve güçlü antiinflamatuvar ve immünosupresif etki sağlar. Uzun süreli kullanım hipofiz-adrenal aksını baskılar; ani kesilme adrenal yetmezlikle sonuçlanabilir. Hiperglisemi, osteoporoz, kilo artışı ve infeksiyona duyarlılık tanınan yan etkilerdir."
