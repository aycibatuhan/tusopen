sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Beta Bloker Seçiciliği"
taksonomi:
  - [ttbt, farmakoloji, farm_otonom, farm_oss_beta_bloker]
metin: "Propranolol beta 1 ve beta 2 reseptörlerini birlikte bloke ederek kalp hızını ve kuvvetini azaltır; bronşlardaki beta 2 bloğu astımı alevlendirebilir, bu yüzden solunum hastalarında seçici beta 1 blokerler tercih edilir. Karvedilol ek alfa blokajıyla damarları da gevşetir ve kalp yetmezliğinde uzun dönem yarar sağlar."
