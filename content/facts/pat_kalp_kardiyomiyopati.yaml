sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kardiyomiyopatiler"
taksonomi:
  - [ttbt, patoloji, pat_kalp, pat_kalp_kardiyomiyopati]
metin: "Hipertrofik kardiyomiyopati otozomal dominant geçişli olup asimetrik septal hipertrofi, sol ventrikül çıkış yolu obstrüksiyonu ve ani ölüm riskiyle seyreder; mikroskopide miyositlerin dağınık dizilimi tipikdir. Dilate kardiyomiyopatide dört kalp boşluğu genişler ve sistolik yetmezlik hakimdir; alkol, viral miyokardit ve antrasiklin tedavisi önemli nedenlerdir. Restriktif kardiyomiyopatide diyastolik dolum kısıtlıdır ve amiloidoz ile endomyokardiyal fibrozis klasik örneklerdir."
