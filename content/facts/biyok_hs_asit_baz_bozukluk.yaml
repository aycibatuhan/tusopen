id: biyok_hs_asit_baz_bozukluk
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Asit-Baz Bozukluklarında Laboratuvar Yaklaşımı"
taksonomi:
  - [ttbt, biyokimya, biyok_hucre_su, biyok_hs_asit_baz_bozukluk]
metin: "Arteriyel pH 7.35-7.45 aralığında tutulur; metabolik asidozda bikarbonat düşerken solunum kompanzasyonu karbondioksiti azaltır. Winter formülüne göre beklenen pCO2 değeri, ölçülen bikarbonatın 1.5 katının 8 fazlasına yakındır; ölçülen değerin sapması eşlik eden solunumsal bozukluğu gösterir. Anyon açığı serum sodyumundan klorür ve bikarbonat toplamının çıkarılmasıyla hesaplanır ve normalde yaklaşık 12'dir; yüksek anyon açığı laktat, ketoasit ya da eksojen toksin kaynaklı asidozu düşündürür."
