id: farm_pd_doz_yanit
version: 1
status: draft
author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Doz-Yanıt Eğrisinin Okunması"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakodinamik, farm_pd_doz_yanit]
metin: "Doz-yanıt eğrisinde eğri sağa kaydığında yarı etkin doz büyür, yani ilacın gücü azalır; eğrinin tavanı ise maksimum etkinliği gösterir. Gücü düşük olan bir ilaç, tavanı yüksekse klinikte daha üstün olabilir. Bu ayrım antagonist etkileşimlerinde eğri kayması biçiminde yorumlanır."
