id: anes_ga_kas_gevseticiler
version: 1
status: draft
author: "ai-drafts/gaps-onkoloji-anestezi"
sources:
  - "Anesteziyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Nöromüsküler Blokerler ve Antagonizması"
taksonomi:
  - [ktbt, anesteziyoloji, anes_genel_anestezi, anes_ga_kas_gevseticiler]
metin: "Nöromüsküler blokerler nikotinik asetilkolin reseptöründe etki eder ve iki gruptur: non-depolarize ajanlar (veküronyum, rokuronyum, atrakuryum, mivakuryum, pankuronyum, d-tubokürarin) reseptörü kompetitif olarak bloke eder ve tetanik/TOF stimülasyonda fade (uyum azalması) ile seyreder; depolarize ajan olan süksinilkolin reseptörü açarak önce kas fasikülasyonu ardından paralizi yaratır (faz I blok; fade yoktur). Süksinilkolin en hızlı (30-60 sn) ve en kısa (5-10 dk) etkilidir, ancak serum potasyumunu yükselttiği için yanık, ezilme (crush) yaralanması, uzun süreli immobilizasyon, motor nöron lezyonu, miyopati ve hiperkalemili hastada kontrendikedir; atipik plazma kolinesteraz eksikliğinde etkisi saatlerce uzar ve malign hipertermili bireylerde tetikleyicidir. Non-depolarize ajanlardan rokuronyum 60-90 saniyede entübasyon imkânı sunarak süksinilkolinin alternatifi olur; atrakuryum Hofmann eliminasyonuyla organ bağımsız metabolize edilir (böbrek-karaciğer yetmezliğinde güvenli); mivakuryum plazma kolinesterazıyla yıkılır ve karaciğer yetmezliğinde etkisi uzar, pankuronyum vagolitik etkisiyle taşikardi, d-tubokürarin histamin salınımıyla hipotansiyon yapar. Antagonizmada asetilkolinesteraz inhibitörleri (neostigmin; bradikardi riskine karşı glikopirolat ile) ya da rokuronyum-veküronyuma seçici bağlanan γ-siklodekstrin sugamadex kullanılır — sugamadex daha hızlı ve yan etkisi daha az olan seçenektir. Blokajın derecesi periferik sinir stimülatörüyle TOF (train-of-four) sayımıyla izlenir; güvenli ekstübasyon için TOF oranı ≥0,9 hedeflenir, yeterli reversiyon yapılmayan hastada rezidüel bloka bağlı postoperatif solunum depresyonu, hiperkarbi ve aspirasyon riski gelişir."
