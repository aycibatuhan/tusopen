author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Boyun üçgenleri"
taksonomi:
  - [ttbt, anatomi, anat_boyun, anat_boyun_ucgenler]
metin: "Posterior boyun üçgeni SCM arka kenarı, trapezius ön kenarı ve klavikula tabanıyla sınırlıdır; spinal aksesuar sinir (XI) bu üçgenin tabanındaki levator scapulae üzerinde ilerler ve boyun biyopsilerinde risk altındadır. Frenik sinir (C3-C5) ön skalen kasının ön yüzünde aşağı iner. Omohyoid posterior üçgeni oksipital ve supraklaviküler alt üçgenlere böler."
