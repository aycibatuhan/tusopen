author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antagonist Türlerinin Eğri İzlenimi"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakodinamik, farm_pd_agonist_antagonist]
metin: "Rekabetçi antagonist agonistle aynı bağlanma yerine oturur; agonist yoğunluğu artırıldığında maksimum yanıt geri gelir ve eğri sağa kayar. Rekabetçi olmayan antagonist maksimum yanıtın üst sınırını düşürür. Kısmi agonistler tam agonistle birlikte verildiğinde onun etkisini kısmen azaltır."
