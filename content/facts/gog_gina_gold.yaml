sources:
- GINA 2024 ve GOLD 2024 strateji raporları — referans adı olarak listelendi; metin projenin özgün
  yazımıdır
ad: GINA 2024 basamakları ve GOLD 2024 A-B-E grupları
taksonomi:
- - ktbt
  - gogus_hastaliklari
  - gog_obstruktif
  - gog_ob_astim
- - ktbt
  - gogus_hastaliklari
  - gog_obstruktif
  - gog_ob_koah
metin: GINA 2024 izleğinde astım tedavisinin tercih edilen yolu tüm basamaklarda ICS-formoterol birleşimini
  kurtarıcı olarak kullanmaktır; basamak 1 ve 2 gereksinime bağlı düşük doz ICS-formoterol, basamak 3
  düşük doz, basamak 4 orta doz MART ile yürütülür. SABA tek başına kurtarıcı olarak önerilmez, çünkü
  kısa etkili bronkodilatörün tek başına kullanımı alevlenme ve ölüm riskini artırır. Basamak 5 kontrol
  dirençli ağır hastalıkta LAMA eklenmesini, uzman değerlendirmesi ve biyolojik ajanları (anti-IgE,
  anti-IL5 ve anti-IL5R, anti-IL4R, anti-TSLP) devreye alır. KOAH hastalığında GOLD 2024 eski A, B, C, D
  gruplamasını A, B, E şemasıyla değiştirmiştir; A grubu 0 veya 1 orta alevlenmeyle az semptomlu, B grubu
  0 veya 1 alevlenmeyle fazla semptomlu (mMRC 2 ve üzerinde ya da CAT 10 ve üzerinde), E grubu ise yılda
  en az 2 orta ya da en az 1 yatış gerektiren alevlenmesi olan hastayı tanımlar. Başlangıç ilaç tedavisi
  A grubunda bronkodilatör, B ve E gruplarında LABA ve LAMA kombinasyonudur; E grubunda kan eozinofilisi
  mikrolitrede 300 ve üzerindeyse başlangıçta inhale kortikosteroid içeren üçlü tedavi düşünülür, izlemde
  ise eozinofilisi 100 üzerinde olan ve alevlenmeye devam eden hastaya inhale kortikosteroid eklenir.
  Tanıda astım değişken akım kanıtını (bronkodilatörle FEV1 artışının yüzde 12 ve 200 mililitrenin
  üzerinde olması ya da tepe akım değişkenliği) ararken KOAH bronkodilatör sonrası FEV1/FVC oranının
  yüzde yetmişin altında kalmasını ister
