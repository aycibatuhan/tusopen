id: gc_tp_cerrahi_enfeksiyon
version: 1
status: draft
author: "ai-drafts/cerrahi-facts"
sources:
  - "Cerrahi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Cerrahi Enfeksiyonlar ve Profilaksi"
taksonomi:
  - [ktbt, genel_cerrahi, gc_temel_prensipler, gc_tp_cerrahi_enfeksiyon]
metin: "Cerrahi yara sınıflamasında enfeksiyon oranı temiz yaralarda yüzde 2'ye kadar, temiz-kontamine yaralarda yaklaşık yüzde 10, kontamine yaralarda yüzde 20 civarında ve kirli yaralarda yüzde 30'un üzerindedir. Profilaktik antibiyotik kesi öncesi 60 dakika içinde (vankomisin ve florokinolonlarda infüzyonun 120 dakikada tamamlanması gerekir) uygulanır ve çoğu girişimde kesi sonrası 24 saati aşmadan kesilir; temiz girişimlerde ilk seçenek sefazolindir. Cerrahi site enfeksiyonu yüzeysel insizyonel, derin insizyonel ve organ-boşluk tiplerine ayrılır ve tipik olarak ameliyattan 5-7 gün sonra ateş, yara ağrısı ve eritemle ortaya çıkar. Nekrotizan fasiit dermonekroz ve sistemik toksisiteyle giden, geniş cerrahi debridman gerektiren acil bir enfeksiyondur; perine ve skrotum yerleşimli şekli Fournier gangreni, klostridyal kas infeksiyonu ise gazlı gangrendir. Geniş spektrumlu antibiyotik kullanımının en önemli geç komplikasyonu C. difficile'ye bağlı psödomembranöz kolittir."
