author: "ai-drafts/gaps-fizyoloji-metabolik"
sources:
  - "Kadın doğum ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Fetal Gelişim ve Fetal Fizyoloji"
taksonomi:
  - [ktbt, kadin_dogum, kd_gebelik_fizyolojisi, kd_gf_fetal_gelisim]
metin: "Organogenez 3-8. haftalardaki embriyonik dönemde tamamlanır ve teratojenlere karşı en duyarlı dönem budur; 9. haftadan itibaren embriyo fetus olarak adlandırılır. Fetal dolaşımda üç şant vardır: kordon venöz kanını vena cava'ya yönlendiren ductus venosus, sağ atriyumdan sol atriyuma geçişi sağlayan foramen ovale ve pulmoner dolaşımı atlatan ductus arteriosus. Fetal akciğerde surfaktan üretimi 24. hafta civarında başlar, 34-36. haftada yeterli düzeye ulaşır; akciğer olgunluğu amniyotik sıvıda L/S oranının 2'nin üzerinde olmasıyla gösterilir. Anne adayının fetal hareketleri hissetmesi (quickening) ilk gebelikte 18-20, sonraki gebeliklerde 16-18. haftalardadır. Fetal hemoglobin (HbF) erişkin hemoglobinden yüksek oksijen affinitesine sahiptir; hematopoez önce vitellüs kesesinde, ardından karaciğerde ve gebeliğin ilerleyen döneminde kemik iliğinde sürer."
