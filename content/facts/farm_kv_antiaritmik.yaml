author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antiaritmik Sınıflama Temeli"
taksonomi:
  - [ttbt, farmakoloji, farm_kardiyovaskuler, farm_kv_antiaritmik]
metin: "Sodyum kanal blokeleri iletiyi yavaşlatır, beta blokeleri otomatikliği azaltır, potasyum kanal blokeleri aksiyon potansiyelini ve repolarizasyonu uzatır, kalsiyum kanal blokeleri düğüm dokusunu yavaşlatır. Potasyum blokeleri QT süresini uzattığı için torsades de pointes riski taşır. Amiodaron birden çok kanalı etkilediği için geniş spektrumlu sayılır."
