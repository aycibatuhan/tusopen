  - anat_endokrin
  - anat_endo_hipofiz
metin: Hipofiz, sfenoid kemikteki sella turcica içinde yer alır ve optik kiasmanın hemen altındadır; büyüyen
  hipofiz adenomu kiasmayı aşağıdan basarak bitemporal hemianopi yapar (yukarıdan baskı kraniyofarenjiyom
  örüntüsüdür). Adenohipofiz (ön lob) Rathke kesesinden, nörohipofiz (arka lob) nöroektodermden gelişir
  ve ADH ile oksitosin arka lobta depolanır. Hipofiz, infundibulum sapı ile hipotalamusa bağlanır.
