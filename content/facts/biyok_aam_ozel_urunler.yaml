id: biyok_aam_ozel_urunler
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Amino Asit Kaynaklı Biyolojik Moleküller"
taksonomi:
  - [ttbt, biyokimya, biyok_aminoasit_metabolizma, biyok_aam_ozel_urunler]
metin: "Tirozin, katekolaminlerin, melaninin ve tiroid hormonlarının öncüsüdür; triptofan serotonine, melatonine ve niasine dönüşür. Glisin hem ve pürin iskeletine girer, glutamattan GABA sentezlenir, arginin nitrik oksidin öncüsüdür ve glisinle birlikte kreatin sentezinde kullanılır. Bu eşleştirmeler, doğumsal bozukluk ve vitamin eksikliklerinin klinik tablolarını yorumlamada yol göstericidir."
