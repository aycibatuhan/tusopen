metin: "Trombositler, kemik iliğindeki dev boyutlu poliploid megakaryositlerin sitoplazma çıkıntılarından kopan parçacıklardır. Olgunlaşmaları trombopoietin hormonuyla düzenlenir ve tek bir megakaryosit binlerce trombosit üretebilir."
