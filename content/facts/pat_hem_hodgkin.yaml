sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Hodgkin Lenfoma"
taksonomi:
  - [ttbt, patoloji, pat_hematopoetik, pat_hem_hodgkin]
metin: "Reed-Sternberg hücresi, ayna görüntüsü oluşturan simetrik iki loblu çekirdeği baykuş gözüne benzeyen büyük bir lenfoid hücredir ve klasik Hodgkin lenfomada CD15 ile CD30 pozitiftir. Nodüler skleroz tipi en sık klasik alt tip olup genç kadınlarda servikal ve supraklaviküler lenfadenopatiyle görülür; lenfosit baskın tip en iyi prognozlu alt tipdir. EBV enfeksiyonu klasik Hodgkin lenfomanın önemli bir kısmıyla ilişkilidir."
