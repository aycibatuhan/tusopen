id: mikro_rna_rhabdo
version: 1
status: draft
author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kuduzda Negri cisimcikleri"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_rna_viruslari, mikro_rna_rhabdo]
metin: "Kuduz virüsü zarflı, tek iplikçikli negatif polariteli RNA'lı rhabdovirüstür; kurşun biçimli yapıdadır ve periferal sinirler boyunca santral sinir sistemine ilerler. Beyin dokusunun histolojik incelemesinde sitoplazmik Negri cisimcikleri görülür; maruziyet öncesi ve sonrası aşılama ölümcül tabloyu önler."
