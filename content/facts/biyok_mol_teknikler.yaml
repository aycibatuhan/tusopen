sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Temel Moleküler Teknikler"
taksonomi:
  - [ttbt, biyokimya, biyok_molekuler, biyok_mol_teknikler]
metin: "PCR, hedef DNA dizisini denatürasyon, primer bağlanması ve uzama döngüleriyle üstel biçimde çoğaltır; reaksiyon ısıya dayanıklı DNA polimeraz kullanır. Southern blot DNA'yı, Northern blot RNA'yı, Western blot proteini belirler; ayrılmış moleküller membrana aktarılıp işaretli probla saptanır. RFLP analizi, restriksiyon enzimi kesim uzunluklarındaki farkı hastalık allelinin izlenmesinde kullanır."
