sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Antidepresan Yan Etki Profili"
taksonomi:
  - [ttbt, farmakoloji, farm_mss, farm_mss_antidepresan]
metin: "Selektif serotonin geri alım inhibitörleri serotonin taşıyıcısını bloke eder ve antikolinergik yan etki vermez; erken dönemde ajitasyon ve bulantı görülebilir. Trisiklikler muskarinik, histaminik ve alfa reseptörlerini de etkiler; ağız kuruluğu, sedasyon, kilo artışı ve ortostatik hipotansiyon yapar. Monoamin oksidaz inhibitörü alan hastada tiramin bakımından zengin besinler hipertansif kriz tetikleyebilir."
