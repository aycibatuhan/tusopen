id: pat_hem_akut_losemi
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Akut Lösemiler"
taksonomi:
  - [ttbt, patoloji, pat_hematopoetik, pat_hem_akut_losemi]
metin: "Akut lenfoblastik lösemi çocuklarda en sık görülen malignitedir; kemik iliğinde yüzde yirmiyi aşan blast oranı, anemi ve trombosit sayısında azalma tabloyu oluşturur. Auer cisimcikleri miyeloblastik diferansiasiyonun işaretidir ve akut lenfoblastik lösemide görülmez. Akut promiyelositik lösemide t(15;17) translokasyonu vardır ve tedavi başlamadan yaygın dissemine intravasküler koagülasyon gelişebilir."
