metin: "Pseudomonas aeruginosa oksidaz pozitif, şeker fermentasyonu yapmayan gram negatif basildir; musluk suyu ve dezenfektan gibi nemli ortamlarda canlı kalabildiğinden hastane enfeksiyonlarında sıklıkla karşımıza çıkar. Piocyanin pigmenti kolonilere yeşilimsi-mavi renk verir; egzotoksin A ve elastaz gibi virülans faktörleri kistik fibrozis ve yanık enfeksiyonlarında rol oynar."
