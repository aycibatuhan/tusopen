ad: "Sempatik sistem"
taksonomi:
  - [ttbt, anatomi, anat_periferik_otonom, anat_pss_sempatik]
metin: "Sempatik çıkışlar torakolumbal düzeydedir (T1-L2); preganglionik lifler kısadır ve ganglionlarda nikotinik reseptörlere asetilkolin salgılar, postganglionik lifler uzundur ve noradrenalin bırakır. İstisnalar şunlardır: adrenal medulla doğrudan preganglionik liflerle innerve edilir ve kan dolaşımına epinefrin-norepinefrin salgılar; ter bezlerinin postganglionik innervasyonu kolinergiktir. Sempatik zincir ganglionları omurganın iki yanında paralel sıralar oluşturur."
