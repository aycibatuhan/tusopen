id: pat_neo_derecelendirme
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Derecelendirme, Evreleme ve Belirteçler"
taksonomi:
  - [ttbt, patoloji, pat_neoplazi, pat_neo_derecelendirme]
metin: "Derecelendirme histolojik benzerlik ve mitoz sayısını değerlendirir; evreleme ise tümör boyutu, lokal invazyon, lenf düğümü ve uzak metastazı (TNM) anlatır ve prognozu belirleyen en güçlü faktördür. Serum belirteçleri arasında PSA prostat, CEA kolorektal, CA-125 over, CA-19-9 pankreas, AFP karaciğer ve germ hücre tümörleri, beta-hCG ise trofoblastik ve germ hücre tümörleri için kullanılır."
