sources:
  - "Cerrahi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Şok Tipleri ve Yönetimi"
taksonomi:
  - [ktbt, genel_cerrahi, gc_temel_prensipler, gc_tp_sok]
metin: "Şok dört grupta incelenir: kanama veya sıvı kaybına bağlı hipovolemik, pompa yetmezliğine bağlı kardiyojenik, pulmoner emboli ve tamponad gibi mekanik nedenlere bağlı obstrüktif, sepsis-anafilaksi-nörojenik nedenlere bağlı vazodilatasyonlu dağıtıcı şok. Kanamalı şokun ATLS sınıflandırmasında kan kaybı sınıf 1'de yüzde 15'ten az (750 mL'ye kadar), sınıf 2'de yüzde 15-30 (750-1500 mL), sınıf 3'te yüzde 30-40 (1500-2000 mL) ve sınıf 4'te yüzde 40'tan fazladır. Hipotansiyon ancak sınıf 3'te ortaya çıkar; sınıf 2'de tansiyon normal kalırken taşikardi ve daralmış nabız basıncı görülür, bu yüzden kan basıncı tek başına kanama miktarını yansıtmaz. Resüsitasyona izotonik kristalloidlerle başlanır ve asıl tedavi kanamanın kontrolüdür; sepsise bağlı şokta hedef ortalama arter basıncı 65 mmHg üzeridir ve ilk seçilen vazopressör noradrenalindir, kardiyojenik şokta kalp indeksi 2,2 L/dk/m2 altına iner, nörojenik şokta ise hipotansiyona bradikardi eşlik eder."
