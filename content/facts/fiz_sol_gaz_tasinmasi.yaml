id: fiz_sol_gaz_tasinmasi
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Oksijen ve Karbondioksit Taşınması"
taksonomi:
  - [ttbt, fizyoloji, fiz_solunum, fiz_sol_gaz_tasinmasi]
metin: "Arteryal kandaki oksijenin yüzde 98'inden fazlası hemoglobine bağlı taşınır; bir gram hemoglobin yaklaşık 1,34 mililitre oksijen bağlar. Karbondioksitin en büyük payı plazmada bikarbonat biçiminde taşınır; geri kalanı hemoglobine bağlı karbaminohemoglobin ve çözünmüş biçimde yol alır, bikarbonat oluşumu sırasında kırmızı hücre ile plazma arasında klor kayması gerçekleşir."
