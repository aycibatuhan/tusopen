id: mikro_gnb_vibrio
version: 1
status: draft
author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kolerajen toksinin etkisi"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_negatif_basil, mikro_gnb_vibrio]
metin: "Vibrio cholerae kavisli gram negatif basildir; oksidaz pozitiftir ve TCBS agarda sarı koloni yapar. Kolerajen toksini adenilat siklazı aşırı uyararak hücre içi cAMP düzeyini yükseltir; sonuçta günde 20 litreye ulaşabilen, beyaz pirinç suyuna benzer ishal gelişir."
