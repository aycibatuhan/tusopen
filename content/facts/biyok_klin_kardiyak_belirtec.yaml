id: biyok_klin_kardiyak_belirtec
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Miyokard İnfarktüsünde Laboratuvar Zaman Çizelgesi"
taksonomi:
  - [ttbt, biyokimya, biyok_klinik, biyok_klin_kardiyak_belirtec]
metin: "Troponin I ve T, kalp kasına en özgün belirteçlerdir; ağrı başlangıcından yaklaşık 3-4 saat sonra yükselir ve bir haftadan uzun süre yüksek kalır. CK-MB daha erken normalleştiği için reinfarkt ayırımında tercih edilir. Myoglobin erken yükselmesine karşın iskelet kasından da açığa çıktığı için özgün değildir; LDH incelemesinin yerini günümüzde troponin almıştır."
