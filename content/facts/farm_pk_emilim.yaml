id: farm_pk_emilim
version: 1
status: draft
author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Biyoyararlanım ve İlk Geçiş Etkisi"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakokinetik, farm_pk_emilim]
metin: "Biyoyararlanım, verilen ilaç miktarının hangi oranının değişmeden dolaşıma geçtiğini gösterir; damar içi yolda bu oran her zaman 1 kabul edilir. Oral verilen ilaçlarda eksik emilim ya da bağırsak duvarı ve karaciğerdeki ilk geçiş metabolizması bu oranı düşürür. Yüksek ilk geçiş etkili ilaçlarda oral etkinlik belirgin biçimde azalır."
