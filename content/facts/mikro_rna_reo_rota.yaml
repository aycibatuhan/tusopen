sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Rotavirus ishali ve tanısı"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_rna_viruslari, mikro_rna_reo_rota]
metin: "Rotavirus Reoviridae ailesinde üç katmanlı kapsidi (içten dışa VP2, VP6 ve VP7/VP4) olan, zarfsız, çift iplikçikli ve segmentli RNA taşıyan virüstür; 6-24 ay arası bebeklerde kış aylarında şiddetli ishal ve dehidratasyona yol açar. Tanı dışkıda ELISA ile virüs antijeni aranarak konur; oral canlı aşılar koruma sağlar."
