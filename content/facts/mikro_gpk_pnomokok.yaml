sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Pnömokokda optokin ve safra çözünürlüğü"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_pozitif_kok, mikro_gpk_pnomokok]
metin: "Streptococcus pneumoniae lanset biçimli gram pozitif diplokoktur; kapsülü sayesinde kanlı agarda yapışkan, düz koloniler oluşturur. Optokin duyarlılığı ve safra tuzlarında çözünmesi, viridans streptokoklardan ayrımında kullanılan klasik testlerdir; kapsül şişmesi (Quellung) ile tiplenir."
