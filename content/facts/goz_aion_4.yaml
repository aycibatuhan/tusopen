sources:
  - "Göz hastalıkları ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Arteritik AION'da steroid protokolü nedir ve gecikirse ne olur?"
taksonomi:
  - [ktbt, goz_hastaliklari, goz_norooftalmoloji, goz_no_iskemik_optik_noropati]
metin: "İlk 3 gün günde 1 g IV metilprednizolon, ardından günlük 80 mg oral prednizolon; gecikirse karşı göz ilk 6 hafta içinde tutulur."
