sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Mikrovillus ile Silianın Ayrım Yapısı"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_hucre, histo_hc_membran]
metin: "Mikrovilluslar hücre zarının aktin filamentlerine dayanan, hareket etmeyen uzantılarıdır; ince bağırsak enterositlerinde fırça kenarı adını alır ve emilim yüzeyini genişletir. Silia ise dokuz çevresel mikrotübül çifti ile ortadaki tek çiftten oluşur ve ritmik salınımıyla solunum yollarında mukusu yüzey boyunca ilerletir."
