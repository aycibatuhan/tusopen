metin: "Haemophilus influenzae gram negatif kokobasildir; üremesi için X (hematin) ve V (NAD) faktörlerine gereksinim duyar. Kanlı agarda Staphylococcus aureus kolonileri çevresinde satelit olarak büyür; gerçek üreme ancak çikolatalı agarda olur. Kapsüllü b tipi suşlar menenjit ve epiglotit yapar."
