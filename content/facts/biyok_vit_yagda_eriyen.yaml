id: biyok_vit_yagda_eriyen
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Yağda Eriyen Vitaminlerin Eksiklik Tabloları"
taksonomi:
  - [ttbt, biyokimya, biyok_vitamin_mineral, biyok_vit_yagda_eriyen]
metin: "A vitamini, rodopsinin 11-cis retinal bölümünü oluşturur; eksikliği gece körlüğüyle başlar. D vitamini kalsiyum ve fosfor emilimini artırır; eksikliği çocukta raşitizm, yetişkinde osteomalazi yapar. K vitamini protrombin dahil pıhtılaşma faktörlerinin karaciğerdeki gamma karboksilasyonu için gereklidir ve yenidoğan profilaktik enjeksiyonla korunur; E vitamini eksikliği ise hemolitik anemiye yol açar."
