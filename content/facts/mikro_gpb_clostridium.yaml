ad: "Clostridium sporu ve nörotoksinleri"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_pozitif_basil, mikro_gpb_clostridium]
metin: "Clostridium türleri gram pozitif, spor yapan zorunlu anaerop basillerdir. Clostridium tetani sporu basilin ucunda yuvarlak biçimde bulunur; tetanospazmin toksini presinaptik olarak GABA ve glisin salınımını engelleyerek spastik paralizi yapar. Botulinum toksini ise nöromüsküler plakta asetilkolin salınımını bloke ederek flasid felç yaratır."
