id: pat_hem_enfarkt
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Enfarktüs"
taksonomi:
  - [ttbt, patoloji, pat_hemodinamik, pat_hem_enfarkt]
metin: "Beyaz (anemik) enfarktüsler kalp, dalak ve böbrek gibi tek dallı arterlerle beslenen organlarda arteriyel tıkanmayla gelişir. Kırmızı (hemorajik) enfarktüsler akciğer ve bağırsak gibi çift dolaşımı olan organlarda, venöz tıkanmada ve gevşek dokularda görülür. Miyokard infarktüsünde koagülatif nekroz ilk 24 saatte belirginleşir, granülasyon dokusu 7-10. günlerde gelişir ve olgun skar 6-8 haftada tamamlanır."
