version: 1
status: draft
author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Dağılım Hacmini Belirleyen Etkenler"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakokinetik, farm_pk_dagilim]
metin: "Dağılım hacmi, ilacın vücutta yayıldığı varsayılan sanal sıvı hacmidir; dokularda yoğun biriken lipofilik ilaçlarda büyür. Kan proteinlerine güçlü bağlanan ilaçlar plazmada tutulur ve dağılım hacmi küçük kalır. Buna karşılık dokuda biriken ilaçlarda bu sayı plazma hacminden çok daha büyük çıkabilir."
