sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "HBV serolojik belirteçleri"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_dna_viruslari, mikro_dna_hepatit_b]
metin: "Hepatit B virüsü kısmen çift sarmallı dairesel DNA taşıyan hepadnavirüstür; polimeraz enzimi revers transkriptaz aktivitesi gösterir. HBsAg pozitifliği enfeksiyon varlığını, IgM tipi anti-HBc akut enfeksiyonu, anti-HBs ise aşılama veya geçirilmiş enfeksiyona bağlı bağışıklığı gösterir."
