author: "ai-drafts/farmakoloji-facts"
sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Yarı Ömür ve Düz Plazma Düzeyi"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakokinetik, farm_pk_doz_hesaplama]
metin: "İlacın plazma düzeyi yaklaşık dört-beş yarı ömür sonunda istikrarlı düzeye ulaşır; her bir yarı ömürde kalan miktarın yarısı atılır. Yarı ömrü uzun ilaçlarda bu bekleme süresini kısaltmak için başlangıçta yükleme dozu verilir, sonra idame dozuyla düzey korunur."
