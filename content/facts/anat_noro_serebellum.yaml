metin: Anterior lob ve vermis (spinoserebellum) postür ve yürüyüşü düzenler; posterior lob (neoserebellum)
  istemli hareketin planlamasını denetler ve lezyonunda dismetri ile disdiadokokinezi görülür. Flokkülonodüler
  lob (vestibüloserebellum) denge ve göz hareketlerinden sorumludur. Serebellum lezyonlarının bulguları
  ipsilateral taraftadır çünkü serebellar yollar iki kez çapraz yapar.
