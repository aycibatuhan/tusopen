id: embriyo_sis_damarlar
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Fetal Dolaşım Geçitleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_sistem, embriyo_sis_damarlar]
metin: "Fetal dolaşımda foramen ovale sağ kulakçıktan sol kulakçığa, ductus arteriosus pulmoner arterden aortaya, ductus venosus ise oksijence zengin göbek kordonu veni kanını karaciğeri aşıp inferior vena kavaya yönlendirir (portal kan karaciğer sinüzoidlerine girer). Doğumda akciğer dolaşımının devreye girmesiyle bu geçitler kapanır; kapanmaması doğumsal kalp-damar anomalilerine yol açar."
