sources:
  - "Pediatri ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Organik Asidemiler"
taksonomi:
  - [ktbt, pediatri, ped_metabolik, ped_met_organik_asidemi]
metin: "Organik asidemiler yenidoğanda beslenme red, kusma, letarji, nöbet ve koma ile seyreden metabolik krizler yapar; laboratuvarda ketotik metabolik asidoz, hiperamonemi, sekonder karnitin eksikliği ve kemik iliği baskılanmasına bağlı nötropeni-trombositopeni saptanır. Metilmalonik asidemi metilmalonil-CoA mutaz eksikliğine bağlıdır ve bazı formları B12 vitamini tedavisine yanıt verir. Propionik asidemi propionil-CoA karboksilaz eksikliğidir; holokarboksilaz sentetaz ve biotinidaz eksikliğiyle seyreden multipl karboksilaz eksikliği yüksek doz biotin ile düzelir. İzovalerik asidemide terli ayak kokusu karakteristiktir. Tanı plazma asilkarnitin profili (tandem kütle spektrometrisi) ve idrar organik asit analiziyle konur; tedavinin temeli uzun süreli açlıktan kaçınma, protein kısıtlaması ve L-karnitin replasmanıdır."
