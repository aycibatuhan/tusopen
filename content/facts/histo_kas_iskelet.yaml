sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "İskelet Kası Hücresinin Çekirdek ve Onarım Özellikleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_kas, histo_kas_iskelet]
metin: "İskelet kası hücreleri çok çekirdeklidir ve çekirdekler hücre zarının hemen altında yerleşir; çizgili görünüm sarkomerdeki ince-kalın filament diziliminden kaynaklanır. Hücreler mitoz yapamadığından onarım, dinlenme halindeki satelit hücrelerinin yeni miyoblastlar sağlamasıyla gerçekleşir."
