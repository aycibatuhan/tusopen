metin: "Metotreksat dihidrofolat redüktazını inhibe ederek folat metabolizmasını ve DNA sentezini bozar; lökovorin verilen folat kurtarması kemik iliği toksisitesini azaltır. 5-Florourasil timidilat sentetazı bloke eder ve kolorektal kanser tedavisinin temel ilaçlarından biridir."
