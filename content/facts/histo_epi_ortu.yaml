id: histo_epi_ortu
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tek Katlı Yassı Epitel Yerleşimleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_epitel, histo_epi_ortu]
metin: "Tek katlı yassı epitel madde geçişinin hızlı olduğu yerleri döşer; damar ve kalp iç yüzeyini döşeyenine endotel, seröz kavite yüzeylerini döşeyenine mezotelyum adı verilir. Alveol duvarı ve Bowman kapsülünün parietal yaprağı da bu epitel tipiyle örtülüdür."
