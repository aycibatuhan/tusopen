author: "ai-drafts/mikrobiyoloji-facts"
sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "HIV tanı akışı"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_rna_viruslari, mikro_rna_retrovirus_hiv]
metin: "HIV, revers transkriptaz taşıyan zarflı bir retrovirüstür; CD4 ve CCR5 veya CXCR4 koreseptörleri üzerinden hedef hücreye girer. Tanıda önce ELISA ile antikor taraması yapılır; pozitif sonuçlarda doğrulama Western blot veya nükleik asit testleriyle (viral yük ölçümü) sağlanır."
