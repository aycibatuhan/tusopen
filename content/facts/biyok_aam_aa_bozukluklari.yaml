id: biyok_aam_aa_bozukluklari
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Fenilketonüri ve Ayırıcı Tanısı"
taksonomi:
  - [ttbt, biyokimya, biyok_aminoasit_metabolizma, biyok_aam_aa_bozukluklari]
metin: "Klasik fenilketonüri, fenilalanini tirozine çeviren fenilalanin hidroksilazın eksikliğidir; taramada fenilalanin düzeyi yükselir, tirozin düşük kalır. Tedavi edilmeyen olgularda zeka geriliği, nöbetler, açık ten ve idrarda fare kokusu gelişir; erken başlanan düşük fenilalaninli diyet bunları önler. Kofaktör BH4 eksikliği benzer tabloyu nörotransmitter eksikliğiyle karıştırdığından, bu olgularda kofaktör desteği de gerekir."
