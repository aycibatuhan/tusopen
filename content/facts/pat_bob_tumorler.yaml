sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Böbrek Tümörleri"
taksonomi:
  - [ttbt, patoloji, pat_bobrek, pat_bob_tumorler]
metin: "Böbrek hücreli karsinomun en sık alt tipi açık hücreli türdür ve VHL tümör süpresör gen kaybı ana moleküler olaydır; hematüri, flank ağrısı ve palpe kitle klasik üçlüdür. Paraneoplastik bulgular arasında eritropoietin artışına bağlı polisitemi, PTHrP kaynaklı hiperkalsemi ve renin kaynaklı hipertansiyon bulunur. Wilms tümörü iki-beş yaş çocuklarda en sık abdominal solid tümördür; aniridi, genitoüriner anomaliler ve gelişme geriliğiyle birlikteliği WAGR sendromu olarak bilinir."
