metin: İletim sırası sinüs (SA) düğümünden Bachmann demeti aracılığıyla kulakçıklara ve internodal yollarla
  AV düğümüne, oradan His demeti ile sağ-sol dal kollarına ve Purkinje liflerine uzanır. Sinüs düğümü
  üst vena kava ile sağ kulakçık birleşiminde, AV düğüm ise Koch üçgeninde interatrial septumun altındadır.
  Purkinje ağı ventrikül endokardı altına yayılır ve kontraksiyonun apeksten bazeye doğru ilerlemesini
  sağlar.
