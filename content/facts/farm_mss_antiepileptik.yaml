sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Fenitoin Kinetiği ve Yan Etkileri"
taksonomi:
  - [ttbt, farmakoloji, farm_mss, farm_mss_antiepileptik]
metin: "Fenitoin terapötik düzeye yaklaştıkça metabolizması doygunluğa ulaşır ve doz artışının kan düzeyini beklenmedik biçimde hızlı yükseltmesi, yani sıfır mertebe kinetik göstermesi dikkat ister. Diş eti büyümesi, yüz kıllanması ve serebellar belirtiler tanınan yan etkilerdir. Hipoalbuminemi ve üremide serbest (etkin) fenitoin oranı arttığı için toplam düzey yanıltıcı olabilir."
