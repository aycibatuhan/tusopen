author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Ventriküler sistem ve BOS dolaşımı"
taksonomi:
  - [ttbt, anatomi, anat_noroanatomi, anat_noro_ventrikuller]
metin: "BOS başlıca lateral ventriküllerin koroid pleksusunda üretilir; foramen Monrodan geçerek 3. ventriküle ulaşır, sonra serebral akuaduktustan 4. ventriküle geçer. 4. ventrikülden foramen Luschka (lateral) ve foramen Magendie (median) yoluyla subaraknoid aralığa dökülür ve araknoid granülasyonlarla üst sagital sinüse emilir. Yetişkinde toplam BOS yaklaşık 150 mL olup günde yaklaşık 500 mL üretilir."
