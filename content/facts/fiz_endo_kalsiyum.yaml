id: fiz_endo_kalsiyum
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kalsiyum Homeostazı"
taksonomi:
  - [ttbt, fizyoloji, fiz_endokrin, fiz_endo_kalsiyum]
metin: "Serum kalsiyumunun normal aralığı yaklaşık 8,5-10,5 miligram desilitredir ve yaklaşık yarısı iyonize biçimdedir. Düşen iyonize kalsiyum paratiroid bezini uyarır; PTH kemikten kalsiyum açığa çıkarır, böbrekte kalsiyum geri emilimini artırıp fosfat atılımını çoğaltır ve aktif D vitamini yapımını hızlandırır; aktif D vitamini de bağırsaktan kalsiyum ve fosfat emilimini artırır."
