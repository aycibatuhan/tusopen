id: anat_miyo_omuz_kol
version: 1
status: draft
author: "ai-drafts/anatomi-facts"
sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Omuz ve kol kaslarının innervasyonu"
taksonomi:
  - [ttbt, anatomi, anat_miyoloji, anat_miyo_omuz_kol]
metin: "Deltoid ve teres minor aksiller sinirle, supraspinatus ve infraspinatus supraskapular sinirle, subskapularis ise üst ve alt subskapular sinirlerle innerve edilir. Supraspinatus abdüksiyonun ilk 15 derecesini başlatır, kalan hareketi deltoid üstlenir. Latissimus dorsi torakodorsal sinirle innerve edilir ve omuzda ekstansiyon, addüksiyon ile iç rotasyon sağlar."
