id: embriyo_sis_sinir
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Nöral Tüpün Beyin Vezikülleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_sistem, embriyo_sis_sinir]
metin: "Nöral tüpün ön bölümü telensefalon, diencefalon, mezensefalon, metensefalon ve miyelensefalon olmak üzere beş beyin vezikülüne ayrılır. Nöral tüpün kapanma kusurları anensefali ve spina bifida gibi nöral tüp defektlerine yol açar; folat eksikliği bu kusurların bilinen nedenlerinden biridir."
