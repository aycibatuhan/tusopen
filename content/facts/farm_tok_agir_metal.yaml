sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Şelatlayıcı Seçimi"
taksonomi:
  - [ttbt, farmakoloji, farm_toksikoloji, farm_tok_agir_metal]
metin: "Ağır metaller enzimlerdeki tiyol gruplarına bağlanarak hücre işlevini bozar; şelatlayıcılar metalle yüksek kararlılıkta kompleks kurup atılımını hızlandırır. Kurşun zehirlenmesinde EDTA veya dimercaprol, arsenik ve cıva zehirlenmesinde dimercaprol, demir birikiminde deferoksamin seçilir."
