id: biyok_doku_karaciger
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Karaciğerin Merkezi Metabolik Roller"
taksonomi:
  - [ttbt, biyokimya, biyok_doku_organ, biyok_doku_karaciger]
metin: "Karaciğer açlıkta glikojenoliz ve glukoneojenezle kan glukozunu korur, uzun açlıkta keton üretimini devreye alır. Üre döngüsü, albümin ve pıhtılaşma faktörlerinin çoğu burada sentezlenir; karaciğer yetmezliğinde albümin düşer ve koagülasyon bozulur. Yabancı maddeler faz 1 oksidasyon ve faz 2 konjugasyon basamaklarıyla atılabilir hale getirilir; alkol dehidrogenaz ve sitokrom P450 sistemi bu süreçte görev alır."
