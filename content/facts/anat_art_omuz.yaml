sources:
  - "Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Glenohumeral eklem"
taksonomi:
  - [ttbt, anatomi, anat_artroloji, anat_art_omuz]
metin: "Glenohumeral eklem vücudun en hareketli ancak en az stabil eklemidir; çıkıkların en sık tipi anteroinferiordur ve aksiller sinir ile posterior sirkumfleks humeral arter risk altındadır. Rotator manşet kasları (supraspinatus, infraspinatus, teres minor, subskapularis) humerus başını glenoid boşluğa bastırarak eklemi dengeler. Labrum glenoidin derinliğini artırarak stabiliteye katkı sağlar."
