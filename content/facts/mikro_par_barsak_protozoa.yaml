metin: "Entamoeba histolytica dışkı incelemesinde kist ve trofozoit formlarıyla görülür; trofozoitlerin sitoplazmasında yutulmuş eritrositler belirgindir. Bağırsak duvarında flask biçimli ülserler oluşturur; amiplik karaciğer apsesi en önemli ekstraintestinal komplikasyondur."
