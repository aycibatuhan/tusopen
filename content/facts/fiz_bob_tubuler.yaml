metin: Proksimal tübül filtratın yaklaşık yüzde 65'ini, yani sodyum, su, glukoz, aminoasit ve bikarbonatın
  büyük bölümünü izotonik biçimde geri alır; glukozun yüzde 90'ı S1-S2 segmentlerinde SGLT2, kalan bölümü
  S3'te SGLT1 taşıyıcısıyla emilir. Plazma glukozu eşik değerini aştığında taşıyıcılar doyuma uğrar ve
  idrarda glukoz görülmeye başlar.
