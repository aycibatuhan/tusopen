id: gc_meme_yardimci
version: 1
status: draft
author: ai-drafts/genel_cerrahi-meme
sources:
- NCCN Breast Cancer Screening and Diagnosis guideline (2024-2025) — referans olarak listelendi, metin
  projesi özgün yazımdır
- USPSTF Breast Cancer Screening recommendation (2024 güncellemesi) — referans olarak listelendi, metin
  projesi özgün yazımdır
- 'NCCN Genetic/Familial High-Risk Assessment: Breast, Ovarian, and Pancreatic (v2.2024) — referans
  olarak listelendi, metin projesi özgün yazımdır'
- T.C. Sağlık Bakanlığı Halk Sağlığı Genel Müdürlüğü, Kadınlarda Meme Kanseri Taramaları Ulusal
  Standartları (KETEM) — referans olarak listelendi, metin projesi özgün yazımdır
ad: Meme Kanserinde Risk Faktörleri ve Tarama
taksonomi:
- [ktbt, genel_cerrahi, gc_meme, gc_meme_tarama]
metin: Meme kanserinde başlıca risk faktörleri kadın olmak, ileri yaş, erken menarş, geç menopoz, doğum
  yapmama ya da ilk doğumu otuz yaş sonrasına bırakma, emzirmeme, postmenopozal obezite, menopoz sonrası
  hormon tedavisi ve alkol kullanımıdır; yoğun meme dokusu hem riski artırır hem de mamografi
  duyarlılığını düşürür. Olguların yaklaşık yüzde 5-10 kadarı kalıtsaldır ve en sık sorumlu genler
  BRCA1 ile BRCA2 olup, NCCN ölçütlerine göre elli yaş altında meme kanseri, altmış yaş altında üçlü
  negatif tümör, erkekte meme kanseri, iki ayrı meme primeri ve ailede meme-yumurtalık-pankreas kanseri
  birikimi genetik danışma ve test gerekçesidir. Ortalama riskli kadında NCCN yıllık tarama mamografisinin
  kırk yaşta başlamasını önerir; USPSTF 2024 güncellemesi kırk-yetmiş dört yaş arasında iki yılda bir
  mamografiyi (B önerisi) esas alır. Türkiye KETEM programının ulusal standardı kırk-altmış dokuz yaş
  arası kadınlara iki yılda bir, iki poz (MLO ve CC) mamografi çekilmesi ve taramada klinik meme
  muayenesi eklenmesidir; yirmi yaş üstü her kadına kendi kendine meme muayenesi danışmanlığı verilir.
  Artmış risk grubunda (yaşam boyu riski yüzde 20 üstü, BRCA1-2 taşıyıcısı, on-otuz yaş arası göğüs
  radyoterapisi öyküsü) mamografi otuz yaşından başlayabilir ve meme MR incelemesi yirmi beş yaşından
  itibaren yıllık eklenir
