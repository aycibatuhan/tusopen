id: gc_tp_hemostaz_transfuzyon
version: 1
status: draft
author: "ai-drafts/cerrahi-facts"
sources:
  - "Cerrahi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Cerrahide Hemostaz ve Transfüzyon"
taksonomi:
  - [ktbt, genel_cerrahi, gc_temel_prensipler, gc_tp_hemostaz_transfuzyon]
metin: "Restriktif transfüzyon stratejisinde eritrosit süspansiyonu eşiği hemoglobin 7-8 g/dL'dir; koroner arter hastalığında eşik 8 g/dL'dir (iskemi riski); aktif masif kanamada Hb eşiği beklenmez, masif transfüzyon protokolüyle (1:1:1 oranı) doğrudan verilir. Trombosit sayısı 50.000 üzerindeyken çoğu cerrahi girişim yapılabilir; nöroşirürji ve göz cerrahisinde 100.000 hedeflenir. INR 1,5 üzerindeyse taze donmuş plazma 10-15 mL/kg dozunda, fibrinojen 150 mg/dL altındaysa kriyopresipitat verilir; kriyopresipitat fibrinojen, faktör 8, faktör 13 ve von Willebrand faktörü içerir. Masif transfüzyon, 24 saat içinde dolaşan kan hacminin tamamının değişmesidir; eritrosit, taze donmuş plazma ve trombosit yaklaşık 1:1:1 oranında verilir ve sitrata bağlı hipokalsemi ile hipotermi sık gelişir. Transfüzyonun ilk 15 dakikasında ateş, bel ağrısı ve hemoglobinüri ABO uyuşmazlığına bağlı akut hemolitik reaksiyonu, ilk 6 saatte hipoksemi ve bilateral pulmoner infiltratlar TRALI'yi düşündürür."
