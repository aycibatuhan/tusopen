id: anes_ga_monitorizasyon
version: 1
status: draft
author: "ai-drafts/gaps-onkoloji-anestezi"
sources:
  - "Anesteziyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Perioperatif Monitörizasyon"
taksonomi:
  - [ktbt, anesteziyoloji, anes_genel_anestezi, anes_ga_monitorizasyon]
metin: "ASA standart monitorizasyon oksijenasyonu, havayolunu, ventilasyonu, dolaşımı ve sıcaklığı kapsar; pratikte sürekli izlenmesi gereken temel beş parametre EKG, kan basıncı, pulse oksimetri (SpO2), kapnometri (EtCO2) ve vücut sıcaklığıdır. Pulse oksimetre iki farklı dalga boyuyla fonksiyonel satürasyonu ölçer fakat karboksihemoglobin (SpO2'yi %100'e yakın normal gösterir) ve methemoglobin (SpO2 ~%85'te sabit kalır) yanıltıcı olabilir; hipotermi, vasokonstriksiyon, boyalı maddeler ve hareket artefaktı sinyal kalitesini bozar. Kapnometri (EtCO2; normal 35-45 mmHg) ventilasyonun en güvenilir non-invaziv göstergesidir: tüpün trakeal yerleşiminin doğrulanmasının altın standardıdır, pulmoner emboli/venöz hava embolisi ve kardiyak arrestte ani düşüş yapar, CO2 absorbe edici granülün bitmesi, yeniden soluma (rebreathing) ve malign hipertermide yükselir; KPR sırasında EtCO2'nun etkili göğüs kompresyonu ve ROSC'nin göstergesidir. İleri hemodinamik monitörizasyon arteriyel hat (sürekli basınç ve kan gazı), merkez venöz kateter (CVP ve ilaç-sıvı yolu), pulmoner arter kateteri, transözofageal ekokardiyografi ve kardiyak output ölçümüyle sağlanır; anestezi derinliği BIS/entropi ile, nöromüsküler blokaj TOF ile ayrıca izlenir. Perioperatif hipotermi kanama, cerrahi yara infeksiyonu ve kardiyak komplikasyon riskini artırdığından sıcaklık sürekli izlenir ve aktif ısıtma (ısıtmalı battaniye, sıvı ısıtıcı) uygulanır."
