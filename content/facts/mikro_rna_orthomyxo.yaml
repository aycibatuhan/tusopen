sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "İnfluenzada antijenik kayma ve sapma"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_rna_viruslari, mikro_rna_orthomyxo]
metin: "İnfluenza virüsleri zarflı, tek iplikçikli negatif polariteli ve segmentli RNA virüsleridir. Farklı suşların aynı hücreyi enfekte edip segmentlerini yeniden dağıtması antijenik kayma yapar ve pandemiye yol açar; küçük mutasyonlarla ortaya çıkan antijenik sapma yıllık salgınları açıklar. Oseltamivir nöraminidaz inhibitörü olarak tedavide kullanılır."
