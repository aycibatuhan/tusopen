metin: "G protein bağlantılı reseptörler etkilerini ikinci habercilerle gösterir; Gs proteini adenilat siklazı uyararak cAMP üretirken, Gq proteini fosfolipaz C aracılığıyla IP3 ve diasilgliserol üretir. IP3, endoplazmik retikulumdan kalsiyumun sitoplazmaya salınmasını tetikler."
