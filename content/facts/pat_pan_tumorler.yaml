id: pat_pan_tumorler
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Pankreas Tümörleri"
taksonomi:
  - [ttbt, patoloji, pat_pankreas, pat_pan_tumorler]
metin: "Pankreas duktal adenokarsinomları en sık pankreas başında yerleşir ve ağrısız obstrüktif sarılık ile palpe edilebilen genişlemiş, ağrısız safra kesesi (Courvoisier işareti) yapar. KRAS mutasyonu vakaların yüzde doksanından fazlasında saptanır; TP53 ve CDKN2A inaktivasyonu sık eşlik eden değişikliklerdir. Tütün tüketimi en önemli risk etkenidir."
