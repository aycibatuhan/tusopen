id: fiz_hucre_membran_potansiyeli
version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Dinlenik Membran Potansiyeli"
taksonomi:
  - [ttbt, fizyoloji, fiz_hucre, fiz_hucre_membran_potansiyeli]
metin: "Sinir ve iskelet kası hücrelerinde dinlenik membran potansiyeli yaklaşık -70 ile -90 milivolt arasındadır ve en büyük katkı, sızıntı potasyum kanallarıyla hücreden dışarı çıkan potasyum iyonlarından gelir. Sodyum-potasyum pompası her turda üç sodyumu dışarı, iki potasyumu içeri taşıyarak bu iyon gradyanlarını sürekli yeniler."
