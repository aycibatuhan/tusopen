sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Genetik Kodun Özellikleri"
taksonomi:
  - [ttbt, biyokimya, biyok_molekuler, biyok_mol_translasyon]
metin: "Genetik kod triplet, spesifik, dejenere ve evrenseldir; AUG başlama kodonu olup UAA, UAG ve UGA sonlanma kodonlarıdır. Dejenere olma, birden fazla kodonun aynı amino asiti kodlaması demektir ve bu durum çoğunlukla üçüncü bazdaki farktan kaynaklanır. Aminoasil tRNA sentetazlar amino asidi doğru tRNA'ya yükler; bu adımdaki hata protein dizisini bozup yanlış katlanmaya götürür."
