sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "İmmünoglobulin sınıflarının temel özellikleri"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_immunoloji, mikro_imm_antikor]
metin: "IgG serumda en bol antikordur, plasentadan geçer ve sekonder immün yanıtın ana ürünüdür. IgA mukozal yüzeylerde dimer olarak salgılanır; IgE alerji ve parazitlere karşı savunmada rol oynar, IgM pentamerik yapıda olup birincil yanıtın antikorudur ve klasik yolla komplementi en etkin aktive eder."
