sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "ACE İnhibitörü Yan Etkileri"
taksonomi:
  - [ttbt, farmakoloji, farm_kardiyovaskuler, farm_kv_raas_ilaclari]
metin: "Anjiyotensin dönüştürücü enzim inhibitörleri bradikininin yıkımını da yavaşlattığı için kuru öksürük ve nadiren anjioödem yapar; potasyum tutulumuna bağlı hiperkalemi izlenmelidir. Anjiyotensin reseptör blokerleri benzer organ koruması sağlar ama bradikinini etkilemediği için öksürük yapmaz. Çift taraflı böbrek atardamarı darlığında her iki grup da kullanılmamalıdır."
