sources:
  - "Cerrahi ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Travmaya ve Cerrahiye Metabolik Yanıt"
taksonomi:
  - [ktbt, genel_cerrahi, gc_temel_prensipler, gc_tp_metabolik_yanit]
metin: "Travmaya metabolik yanıt Cuthbertson'ın tanımladığı iki fazda gelişir: ilk 24 saatin ebb fazında enerji harcaması ve ısı üretimi azalırken, 24-48 saat sonra başlayan flow fazında hipermetabolizma, negatif azot dengesi ve kilo kaybı görülür. Flow fazında katekolamin, kortizol ve glukagon düzeyleri yükselir; insülin salgısı artsa da periferik insülin direnci gelişir ve hiperglisemi ortaya çıkar. Kas proteoliziyle açığa çıkan aminoasitler karaciğerde glukoneogenezde ve akut faz proteinlerinin sentezinde kullanılır; azot kaybı stresin büyüklüğüyle orantılıdır. Hipermetabolik yanıt majör cerrahide bazal enerji harcamasını yüzde 15-25, sepsiste yüzde 40, yaygın yanıkta yüzde 100'e kadar artırır. Erken enteral beslenme, yeterli analjezi, normotermi korunması ve ERAS protokolleri stres yanıtını azaltan başlıca önlemlerdir; uzun süren açlık katabolik durumu derinleştirir."
