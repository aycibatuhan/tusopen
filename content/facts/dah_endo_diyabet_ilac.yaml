id: dah_endo_diyabet_ilac
version: 1
status: draft
author: ai-drafts/dahiliye
sources:
- 'ADA Standards of Care in Diabetes 2025, Bölüm 9: Farmakolojik Yaklaşımlar (Diabetes
  Care 2025;48 Suppl 1:S181-S206) — referans olarak listelendi, metin projesi özgün
  yazımdır'
- 'FLOW çalışması: semaglutid renal sonuç denemesi (Perkovic ve ark., NEJM 2024); SELECT
  çalışması: diyabetsiz obezitede kardiyovasküler sonuçlar (Lincoff ve ark., NEJM 2023);
  SURPASS-2: tirzepatid versus semaglutid (Frias ve ark., NEJM 2021)'
ad: Tip 2 Diyabet İlaç Katmanı (ADA 2024-2025)
taksonomi:
- - ktbt
  - dahiliye
  - dah_endokrinoloji
  - dah_end_diyabet_tedavi
- - ttbt
  - farmakoloji
  - farm_endokrin
  - farm_end_oral_antidiyabetik
metin: 'Tip 2 diyabette metformin, ek comorbidite gerektirmeyen hastalarda hâlâ en sık
  başlanan ilk oral ajandır; eGFR 30 üstünde güvenlidir, mide-bağırsak yan etkileri
  yavaş doz artışı ve uzatılmış salınımlı form ile azaltılır. Ancak ADA 2024-2025
  yaklaşımında seçim artık komorbiditeye göre yapılır: atanmış veya yüksek riskli
  aterosklerotik kardiyovasküler hastalıkta kanıt kardiyovasküler yararı olan GLP-1
  agonisti ve/veya SGLT2 inhibitörü eklenir (semaglutidin SELECT çalışmasında diyabetsiz
  obezitede majör kardiyovasküler olayları yaklaşık yüzde 20 azaltması bu kaymanın
  öncülerindendir). Kalp yetmezliğinde HFrEF ve HFpEF tablolarında hastaneye yatışı azaltan SGLT2
  inhibitörü tercih edilir; kronik böbrek hastalığında eGFR 20-60 veya albuminüri varlığında
  SGLT2 inhibitörü (glisemik etkisi eGFR 45 altında zayıflar) ya da FLOW çalışmasında
  böbrek sonuçlarını iyileştiren GLP-1 agonisti kullanılır, eGFR 30 altında glisemik
  amaçla GLP-1 agonisti yeğlenir. Kilo hedefi önde olan veya MASLD eşlik eden hastada
  GLP-1 agonisti, en güçlü etki için çift GIP/GLP-1 agonisti tirzepatid seçilir (SURPASS-2
  çalışmasında tirzepatid semaglutid 1 mg dozundan daha fazla A1C ve kilo düşürmüştür). A1C
  yüzde 10 üstü, kan glukozu 300 mg/dL üstü veya katabolik belirtiler varsa altta yatan
  tedaviden bağımsız olarak insülinle başlanır; insülin eksikliği kanıtlanmayan hastada
  insülin yerine GLP-1 agonisti tercih edilir, insülin gerekiyorsa GLP-1 agonistiyle
  birlikte verilir ve DPP-4 inhibitörü GLP-1 agonistiyle birlikte kullanılmaz.'
