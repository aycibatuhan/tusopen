id: histo_dol_damarlar
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Kapiller Tipleri ve Dağılım Yerleri"
taksonomi:
  - [ttbt, histoloji_embriyoloji, histo_dolasim, histo_dol_damarlar]
metin: "Sürekli kapillerler en yaygın tiptir ve endotel hücreleri sıkı birbirine bitişiktir; beyindeki kan-beyin bariyeri bu özellikli kapillerlerle sağlanır. Fenestreli kapillerler endokrin bezler, bağırsak mukozası ve böbrek glomerülünde bulunur; karaciğer, dalak ve kemik iliğindeki sinüzoid kapillerler ise hücre geçişine izin verecek kadar geniş boşluklu yapılardır."
