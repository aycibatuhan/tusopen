  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Treponema pallidum tanı zorluğu"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_spiroket, mikro_spi_treponema]
metin: "Treponema pallidum çok ince sarmallı olduğu için ışık mikroskobunda boyalarla görünmez; koyu alan mikroskopisi ve immünofloresans teknikleriyle saptanır. Birincil sifilizde sert şankr, ikincil evrede el-ayak iç yüzeylerinde makülopapüler döküntü ve kondiloma lata görülür."
