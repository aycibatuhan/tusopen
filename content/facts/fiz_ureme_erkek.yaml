version: 1
status: draft
author: "ai-drafts/fizyoloji-facts"
sources:
  - "Fizyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Testiküler Fonksiyonlar"
taksonomi:
  - [ttbt, fizyoloji, fiz_ureme, fiz_ureme_erkek]
metin: "Leydig hücreleri LH uyarısıyla testosteron üretir; testosteronun bir bölümü 5-alfa redüktazla dihidrotestosterona, bir bölümü aromatazla östrojene dönüşür. Sertoli hücreler FSH ile uyarılır, kan-testis bariyerini oluşturur, inhibin salgılayarak FSH'yi baskılar ve fetal dönemde müller gerileme maddesi salgılayarak müllerian yapıların körelmesini sağlar."
