id: embriyo_gen_teratoloji
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Teratojenlere En Duyarlı Dönem"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_genel, embriyo_gen_teratoloji]
metin: "Organların biçimlendiği embriyonik dönem, yani fertilizasyondan sonraki 3-8. haftalar, teratojenlere karşı en duyarlı süreçtir. İlaç, radyasyon ya da enfeksiyon gibi etkenler bu dönemde büyük yapısal anomalilere yol açabilir; fetal dönemdeki maruz kalma ise daha çok büyüme ve fonksiyon bozukluğuyla kendini gösterir."
