sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Glukoneogenezin Anahtar Enzimleri"
taksonomi:
  - [ttbt, biyokimya, biyok_karbonhidrat, biyok_kh_glukoneogenez]
metin: "Glukoneogenez özellikle karaciğerde, uzun açlıkta da böbrekte glukoz üretir; pirüvat, laktat, gliserol ve glukojenik amino asitler öncüdür. İlk adım mitokondriyel pirüvat karboksilaz reaksiyonudur; biotin kofaktörlü bu enzim asetil-KoA varlığında uyarılır. Glukoz-6-fosfatazın yokluğu von Gierke hastalığıyla sonuçlanır çünkü serbest glukoz karaciğer hücresinden çıkamaz."
