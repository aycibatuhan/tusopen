sources:
  - "Mikrobiyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Streptokoklarda hemoliz ve Lancefield grupları"
taksonomi:
  - [ttbt, mikrobiyoloji, mikro_gram_pozitif_kok, mikro_gpk_streptokok]
metin: "Streptokoklar kanlı agar üzerindeki hemoliz biçimlerine göre alfa (kısmi), beta (tam) ve gama (yok) olarak sınıflanır. Streptococcus pyogenes beta hemolitik, basitrasin duyarlı ve Lancefield A grubudur; S. agalactiae CAMP testi pozitif B grubu koktur."
