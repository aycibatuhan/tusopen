sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Alkilleyici Toksisite İşaretleri"
taksonomi:
  - [ttbt, farmakoloji, farm_antineoplastik, farm_an_alkilleyici]
metin: "Alkilleyici ajanlar DNA zincirleri arasında çapraz bağ kurarak replikasyonu engeller; etki hücre döngüsünden bağımsızdır. Siklofosfamidin idrarda biriken metaboliti hemorajik sistit yapar; mesna ve bol hidrasyon bu komplikasyonu azaltır. Busulfan akciğer fibrozisi yapmasıyla tanınır."
