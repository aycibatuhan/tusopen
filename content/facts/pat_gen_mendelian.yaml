id: pat_gen_mendelian
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Tek Gen Hastalıkları ve Kalıtım"
taksonomi:
  - [ttbt, patoloji, pat_genetik, pat_gen_mendelian]
metin: "Otozomal dominant hastalıklarda her etkilenmiş bireyin en az bir ebeveyni de etkilenmiştir, iki cinsiyet eşit sıklıkta etkilenir ve defekt çoğunlukla yapısal proteinlerde aranır. Otozomal resesif hastalıklarda sağlıklı ebeveynler heterozigot taşıyıcıdır, akraba evliliği riski artırır ve defekt çoğunlukla enzim işlev kaybındandır. X'e bağlı resesif hastalıklarda erkekler daha sık etkilenir; etkilenmiş erkek mutasyonu tüm kızlarına aktarır ama oğullarına geçirmez."
