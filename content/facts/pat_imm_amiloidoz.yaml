metin: "Amiloid, yanlış katlanmış proteinlerin oluşturduğu beta yapraklı fibrillerin hücre dışında birikimidir; kongo kırmızısı boyasından sonra polarize ışıkta elma yeşili çift kırılma verir. AL tipi plazma hücre neoplazilerinde immünglobulin hafif zincirlerinden, AA tipi kronik inflamasyonlu hastalıklarda karaciğerden salgılanan serum amiloid A proteininden türetilir. Böbrekler en sık tutulan organdır ve nefrotik sendrom ile seyreder."
