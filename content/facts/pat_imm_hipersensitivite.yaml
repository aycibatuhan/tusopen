ad: "Hipersensitivite Tipleri"
taksonomi:
  - [ttbt, patoloji, pat_immun, pat_imm_hipersensitivite]
metin: "Tip I reaksiyon IgE aracılı mast hücre degranülasyonuyla gelişir ve anafilaksi, alerjik rinit ile astım örneğidir. Tip II reaksiyonda IgG ve IgM hücre yüzeyi antijenlerine bağlanır; otoimmün hemolitik anemi ve Goodpasture sendromu örneğidir. Tip III reaksiyonda immün kompleksler damar ve dokuda birikip komplemanı aktive eder; serum hastalığı, Arthus reaksiyonu ve poststreptokokal glomerulonefrit örneğidir. Tip IV gecikmeli tiptir, CD4 ve CD8 T hücreleri aracılıdır; tuberkulin testi ve kontakt dermatit örneğidir."
