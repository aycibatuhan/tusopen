id: embriyo_gen_ikizler
version: 1
status: draft
author: "ai-drafts/histoloji-facts"
sources:
  - "Histoloji ve embriyoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Monozigot İkizlerde Bölünme Zamanı ve Zar Düzeni"
taksonomi:
  - [ttbt, histoloji_embriyoloji, embriyo_genel, embriyo_gen_ikizler]
metin: "Monozigot ikizlerde bölünmenin zamanı zar düzenini belirler: üçüncü günden önceki bölünme iki ayrı koryon ve iki amniyon kesesi verir. Dördüncü-sekizinci gün arası bölünme tek koryon ve iki amniyon kesesi oluşturur; dokuz ile on ikinci günler arası bölünme tek amniyon ve tek koryonla sonuçlanır, on üçüncü günden sonra bölünme yapışık ikizlik riski taşır."
