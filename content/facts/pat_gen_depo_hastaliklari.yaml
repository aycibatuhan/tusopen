id: pat_gen_depo_hastaliklari
version: 1
status: draft
author: "ai-drafts/patoloji-facts"
sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Lizozomal Depo Hastalıkları"
taksonomi:
  - [ttbt, patoloji, pat_genetik, pat_gen_depo_hastaliklari]
metin: "Tay-Sachs hastalığında heksozaminidaz A eksikliği nöronlarda gangliozid birikimine yol açar; retinada kiraz kırmızısı leke ve aşırı irkılme yanıtı görülür. Gaucher hastalığında glukoserebrozidaz eksikliğiyle biriken Gaucher hücreleri eğrilmiş kâğıt görünümünde olup dalak, karaciğer ve kemik iliğinde yerleşir. Hurler sendromunda alfa-L-iduronidaz eksikliğiyle glikozaminoglikanlar birikir; korneal bulanıklık, kaba yüz görünümü ve zihinsel gerilik tabloya eklenir."
