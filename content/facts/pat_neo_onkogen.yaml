sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Onkogenler ve Tümör Süpresör Genler"
taksonomi:
  - [ttbt, patoloji, pat_neoplazi, pat_neo_onkogen]
metin: "Proto-onkogenler tek alelde etkinleşir ve etki dominanttır: RAS nokta mutasyonları insan tümörlerinde en sık onkogen değişikliği iken, MYC Burkitt lenfomada translokasyonla, BCR-ABL füzyon geni Philadelphia kromozomuyla kronik miyeloid lösemide aktive olur. Tümör süpresör genler (TP53, RB1, BRCA1, BRCA2) her iki alelin kaybını gerektiren resesif genlerdir; TP53 mutasyonları insan kanserlerinde en sık gen mutasyonudur. BCL2 geni apoptozu inhibe eder ve foliküler lenfomada translokasyonla aktive olur."
