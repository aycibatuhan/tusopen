sources:
  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Sık Görülen Etkileşim Örnekleri"
taksonomi:
  - [ttbt, farmakoloji, farm_farmakodinamik, farm_pd_ilac_etkilesimleri]
metin: "Etkileşimler farmakokinetik ya da farmakodinamik olabilir; en sık mekanizma metabolik enzimlerin uyarılması veya baskılanmasıdır. Varfarin kullanan hastaya NSAİ verilmesi kanama riskini büyütür; ritonavir gibi güçlü P450 baskılayıcıları eşzamanlı ilaçların düzeyini tehlikeli biçimde yükseltir."
