id: biyok_nuk_bozukluklar
version: 1
status: draft
author: "ai-drafts/biyokimya-facts"
sources:
  - "Biyokimya ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Gut ve Orotik Asidüride Enzim Hedefleri"
taksonomi:
  - [ttbt, biyokimya, biyok_nukleotid, biyok_nuk_bozukluklar]
metin: "Gut, ürik asidin eklemlerde kristalleşmesiyle ortaya çıkar; allopurinol ksantin oksidazı baskılayarak ürik asit üretimini azaltır. Orotik asidüri, UMP sentaz kompleksinin eksikliğidir ve folat ya da B12 replasmanına yanıt vermeyen megaloblastik anemiyle idrarda orotik asit artışıyla görülür. Lesch-Nyhan sendromunda hiperürisemi, koreoatetoz, zihinsel gerilik ve kendi kendine zarar verme davranışı birlikte bulunur."
