sources:
- Anatomi ders kaynakları — referans olarak listelendi, metin özgün yazımdır
ad: Beyin damarları ve Willis poligonu
taksonomi:
- - ttbt
  - anatomi
  - anat_noroanatomi
  - anat_noro_beyin_damarlari
metin: Anterior serebral arter medyan yüzeyi ve bacak alanını, orta serebral arter lateral yüzeyi ile
  kol-yüz alanını, posterior serebral arter oksipital (görme) alanı besler. Orta serebral arterin başlangıç
  segmentinden çıkan lentikulostriat dallar internal kapsül ve bazal ganglionları besler; bu dallarda
  tıkanıklık laküner infarkt yapar. Berry (sakküler) anevrizmaların en sık yeri anterior communicating
  arter birleşimleridir.
