id: kd_gf_prenatal_tani
version: 1
status: draft
author: "ai-drafts/gaps-fizyoloji-metabolik"
sources:
  - "Kadın doğum ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Prenatal Tanı ve Anöploidi Taraması"
taksonomi:
  - [ktbt, kadin_dogum, kd_gebelik_fizyolojisi, kd_gf_prenatal_tani]
metin: "Prenatal tarama testleri risk belirlerken, tanı testleri kesin tanı koyar; 11-14. haftadaki kombine testte Down sendromunda NT artar, β-hCG yükselir ve PAPP-A düşer, trizomi 18'de ise biyokimyasal belirteçlerin tamamı düşer. 16-18. haftadaki dörtlü test dörtlü testte (AFP, hCG, östriyol, inhibin-A) Down sendromunda hCG yüksek, uE3 ve AFP düşüktür; AFP yüksekliği açık nöral tüp defekti, anensefali ve karın duvarı defektlerine işaret eder. Hücreserbest fetal DNA (cfDNA/NIPT) 10. haftadan itibaren anne kanından anöploidi taraması için kullanılır. Tanı yöntemlerinden koryonik villus örneklemesi 10-13. haftada, amniyosentez 15-20. haftada (ideal 16-18) yapılır; kordosentez daha geç dönemde ve hızlı fetal karyotip gerektiğinde tercih edilir. Amniyosenteze bağlı gebelik kaybı riski yaklaşık %0,5'tir."
