sources:
  - "Patoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Emboli"
taksonomi:
  - [ttbt, patoloji, pat_hemodinamik, pat_hem_emboli]
metin: "Pulmoner tromboembolilerin büyük çoğunluğu alt ekstremite derin ven trombozundan kaynaklanır; popliteal ven ve daha yukarı segmentler en riskli kaynaklardır. Sistemik arteriyel embolilerin en sık kaynağı sol kalpteki trombüslerdir, özellikle atriyal fibrilasyonda sol atriyumda ve miyokard infarktüsünden sonra sol ventrikül duvarında gelişen trombüsler. Uzamış yatak istirahati, büyük cerrahi, kalça kırığı ve gebelik derin ven trombozunu kolaylaştırır."
