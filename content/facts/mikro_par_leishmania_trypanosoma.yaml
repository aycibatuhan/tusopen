metin: "Leishmania türleri kum sineği (Phlebotomus) ile bulaşır ve insan dokusunda makrofaj içinde amastigot formda bulunur. Trypanosoma cruzi triyatomid böceği ile bulaşır; Chagas hastalığında megaozofagus ve megakolon gelişir, tanı kan smearı ve serolojik testlerle konur."
