metin: "Escherichia coli laktoz fermente eden bir enterobakteridir; MacConkey agarda pembe koloniler görülür. ETEC suşları seyahat ishali yapar ve ısıya duyarlı ve ısıya dirençli iki toksin üretir; EHEC suşları Shiga toksini salgılayarak hemolitik üremik sendroma neden olur."
