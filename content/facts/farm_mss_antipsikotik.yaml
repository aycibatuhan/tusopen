ad: "Klasik ve Atipik Antipsikotik Farkı"
taksonomi:
  - [ttbt, farmakoloji, farm_mss, farm_mss_antipsikotik]
metin: "Klasik antipsikotikler güçlü dopamin D2 bloğu yapar; ekstrapiramidal belirtiler, akatizi, geç diskinezi ve hiperprolaktinemi görülebilir. Atipik ilaçlar serotonin 5HT2A bloğuyla birlikte dopamin bloğu sağlar ve motor yan etkileri daha seyrek olur. Klozapin agranülositoz riski nedeniyle düzenli kan sayımı gerektirir."
