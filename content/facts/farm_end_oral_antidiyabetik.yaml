  - "Farmakoloji ders kaynakları — referans olarak listelendi, metin özgün yazımdır"
ad: "Metformin Önceliği"
taksonomi:
  - [ttbt, farmakoloji, farm_endokrin, farm_end_oral_antidiyabetik]
metin: "Metformin tip 2 diyabette ilk tercih edilen ilaçtır; karaciğerde glukoneojenezi baskılar, periferik insülin duyarlılığını artırır ve tek başına hipoglisemi yapmaz. Ciddi böbrek yetmezliğinde laktik asidoz riski nedeniyle kullanılmaz. Sülfonilüreler pankreas beta hücresinden insülin salınımını artırır ve hipoglisemi riski taşır."
